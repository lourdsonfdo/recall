"why":"Patients with severe expiratory airflow obstruction typically exhibit prolonged E-times and low I:E ratios such as 1:4 or 1:5 during spontaneous breathing. If similar ratios are not provided during mechanical ventilation, air trapping or auto-PEEP occurs. If auto-PEEP is present and the I:E ratio is high (1:1 or 1:2), the first step is to adjust settings to allow enough time for complete exhalation, decreasing the I:E ratio to 1:4 or 1:5. The ratio is decreased by increasing E-time and decreasing I-time.","src":[[20186,20195]],"origin":"heuer","age":"adult"},{"id":"C13-Q33","sec":"III-E","lvl27":"integ","topic":"Mode changes","stem":"A patient on volume-control A/C develops respiratory alkalosis because the total respiratory rate is too high. You should recommend:","opts":["Normal-rate SIMV, added deadspace, or sedation if agitated","Increase the tidal volume to slow the patient's rate","Increase the set rate on A/C to take over the breathing","Switch to pressure support alone with no backup rate"],"key":0,"why":"When full ventilatory support is needed but the total respiratory rate results in hyperventilation (respiratory alkalosis) on A/C mode, switch to volume- or pressure-control normal-rate SIMV, add deadspace, or recommend sedation if the patient is agitated.","src":[[20222,20225]],"origin":"heuer","age":"adult"},{"id":"C13-Q34","sec":"III-E","lvl27":"integ","topic":"Mode changes","stem":"To reduce plateau pressure in an ARDS patient with low lung compliance on volume-control A/C, recommend:","opts":["Switch to pressure control A/C with a PIP < 30 cm H₂O","Increase the inspiratory flow rate to shorten inspiration","Add pressure support to the volume-control breaths","Switch to CPAP with pressure support of 10 cm H₂O"],"key":0,"why":"To reduce airway pressures (plateau pressure) in patients with low lung compliance such as ARDS on volume-control A/C, switch to pressure control A/C with a maximum peak inspiratory pressure of less than 30 cm H₂O.","src":[[20239,20243]],"origin":"heuer","age":"adult"},{"id":"C13-Q35","sec":"III-E","lvl27":"integ","topic":"Mode changes","stem":"An ARDS patient is failing the NHLBI protocol. You should consider:","opts":["High-frequency ventilation or APRV","Volume control at 10 mL/kg PBW","Discontinuing PEEP and recruitment","CPAP alone with a high FiO₂"],"key":0,"why":"To support ventilation and oxygenation in patients with ARDS when the NHLBI protocol fails, consider a high-frequency ventilation modality or airway pressure release ventilation (APRV).","src":[[20245,20249]],"origin":"heuer","age":"adult"},{"id":"C13-Q36","sec":"III-E","lvl27":"integ","topic":"Mode changes","stem":"To overcome the imposed work of breathing caused by artificial airways or the ventilator circuit, recommend:","opts":["Add or increase pressure support, or use tube compensation","Increase the PEEP to splint the airway open on exhalation","Increase the set tidal volume on every mandatory breath","Switch to a pure control mode with paralysis"],"key":0,"why":"To overcome the imposed work of breathing caused by artificial airways or the ventilator circuit, add or increment the pressure-support level, or implement automatic tube compensation if available.","src":[[20227,20231]],"origin":"heuer","age":"adult"},{"id":"C13-Q37","sec":"III-E","lvl27":"integ","topic":"Post-extubation support","stem":"A patient develops mild to moderate HYPERCAPNIA after extubation. To avoid reintubation, recommend:","opts":["Noninvasive positive-pressure ventilation","A high-flow nasal cannula at 20–40 L/min","A nonrebreathing mask","Immediate reintubation"],"key":0,"why":"To avoid reintubation of patients who develop mild to moderate hypercapnia after extubation, provide NPPV. For those who develop mild to moderate HYPOXEMIA after extubation, recommend a high-flow nasal cannula at 20–40 L/min, titrating FiO₂ as needed.","src":[[20256,20262]],"origin":"heuer","age":"adult"},{"id":"C13-Q38","sec":"III-E","lvl27":"integ","topic":"Recruitment","stem":"\"Open-lung\" recruitment maneuvers for patients at risk of atelectasis may involve periodic PEEP levels as high as:","opts":["20–30 cm H₂O for a short period","10–15 cm H₂O sustained indefinitely","40–50 cm H₂O for 10 minutes","5–10 cm H₂O continuously"],"key":0,"why":"Patients on a ventilator who are particularly at risk for developing atelectasis may be candidates for open-lung techniques such as recruitment maneuvers involving the periodic use of PEEP levels as high as 20–30 cm H₂O for a short period of time.","src":[[20292,20295]],"origin":"heuer","age":"adult"},{"id":"C13-Q39","sec":"III-E","lvl27":"integ","topic":"Bronchopleural fistula","stem":"A patient with a clinically significant bronchopulmonary fistula is not ventilating or oxygenating well on conventional settings. Consider:","opts":["High-frequency ventilation (HFOV, jet, or percussive)","An increase in tidal volume to 10 mL/kg PBW","Removal of all PEEP to reduce the air leak","A switch to pressure support alone at 20 cm H₂O"],"key":0,"why":"Patients with a clinically significant bronchopulmonary fistula who do not ventilate or oxygenate well on other settings may respond well to high-frequency ventilation — HFOV, jet ventilation, or percussive ventilation.","src":[[20288,20291]],"origin":"heuer","age":"adult"},{"id":"C13-Q40","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A COPD patient becomes lethargic and disoriented soon after being placed on a nasal cannula at 5 L/min. You should recommend:","opts":["Reduce the flow to 2 L/min or use a 24–28% air-entrainment mask","Increase the flow to 6 L/min to correct the hypoxemia","Switch to a nonrebreathing mask at 12 L/min for safety","Discontinue oxygen entirely until the ABG is back"],"key":0,"why":"This is oxygen-induced hypoventilation. Recommend that the input flow be reduced to 2 L/min or switch to an air-entrainment system at 24–28% O₂, continue to monitor the patient closely, and notify the nurse.","src":[[19738,19745]],"origin":"heuer","age":"adult"},{"id":"C13-Q41","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A physician orders oxygen via a simple mask at an input flow of 2 L/min for an adult. You should:","opts":["Raise the flow to at least 5 L/min, or change to a nasal cannula","Set it as ordered, since low flows reduce drying of the mucosa","Recommend a nonrebreathing mask at 2 L/min instead","Add a bubble humidifier to the mask and proceed as ordered"],"key":0,"why":"The physician may be unaware of the risk of CO₂ rebreathing at low flows with O₂ masks and enclosure devices. Recommend that the input flow be increased to a minimum of 5 L/min to ensure washout of exhaled CO₂, or change to a nasal cannula device.","src":[[19747,19752]],"origin":"heuer","age":"adult"},{"id":"C13-Q42","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A patient on a simple mask at 10 L/min has a PaO₂ of 212 torr. You should recommend:","opts":["Reduce the FiO₂, e.g. a nasal cannula at about 5 L/min","Maintain the current settings and repeat the ABG","Switch to a nonrebreathing mask at 15 L/min","Add PEEP by mask CPAP at 5 cm H₂O"],"key":0,"why":"A PaO₂ of 212 torr means too much FiO₂ is being delivered. Recommend a reduction in FiO₂ — for example, switching to a nasal cannula at about 5 L/min, which gives an FiO₂ of about 0.40.","src":[[19781,19784]],"origin":"heuer","age":"adult"},{"id":"C13-Q43","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"After switching an adult from a simple mask to a nonrebreathing mask, the SpO₂ only rises from 83% to 87%. You should consider:","opts":["HFNC at 20–40 L/min, or mask CPAP with a high FiO₂ for shunting","Return to the simple mask at a higher flow of 10 L/min","Reduce the FiO₂ to avoid absorption atelectasis in the bases","Change to a nasal cannula at 6 L/min with humidity"],"key":0,"why":"A minimal rise reflects an inability to meet high inspiratory flow demands at high FiO₂, or alveolar shunting. Recommend a high-flow nasal cannula at 20–40 L/min, titrating FiO₂ to the desired SpO₂, and consider mask CPAP with high FiO₂ for shunting.","src":[[19790,19797]],"origin":"heuer","age":"adult"},{"id":"C13-Q44","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A house-fire victim has an SpO₂ of 98% on a nasal cannula at 5 L/min. You should:","opts":["Give the highest FiO₂ (usually a nonrebreather) and obtain CO-oximetry","Leave the cannula in place, since the SpO₂ is normal","Reduce the flow to avoid oxygen toxicity","Obtain a chest x-ray before changing therapy"],"key":0,"why":"SpO₂ cannot detect carboxyhemoglobin saturations in suspected smoke inhalation victims. Place the patient in the highest possible FiO₂ — usually a nonrebreather mask — and perform a CO-oximetry test. Consider hyperbaric oxygen therapy if available.","src":[[19833,19838]],"origin":"heuer","age":"adult"},{"id":"C13-Q45","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A chest x-ray shows atelectasis in a patient receiving a high FiO₂. The likely cause and correction are:","opts":["Nitrogen-washout atelectasis — lowest FiO₂ and recruitment","Secretion plugging — more frequent tracheal suctioning","Overhydration — loop diuretic therapy and fluid restriction","Air trapping — a lower I:E ratio and rate"],"key":0,"why":"Signs of atelectasis on chest x-ray in a patient receiving a high FiO₂ suggest nitrogen-washout atelectasis. Use the lowest possible FiO₂ and implement alveolar recruitment techniques.","src":[[19840,19842]],"origin":"heuer","age":"adult"},{"id":"C13-Q46","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"An air-entrainment aerosol mask is delivering a HIGHER FiO₂ than set. Likely causes include:","opts":["Bedding over the entrainment ports, or rainout in the tubing","Insufficient input flow from the oxygen flowmeter setting","A leak in the large-bore aerosol tubing near the mask","A patient with a high or variable minute ventilation"],"key":0,"why":"An air-entrainment aerosol mask delivering a higher FiO₂ than set is caused by obstruction of the entrainment ports with bedding, clothing, or other items — remove obstructions and monitor the patient — or obstruction from condensate rainout in the tubing, for which a water trap is recommended.","src":[[19804,19814]],"origin":"heuer","age":"adult"},{"id":"C13-Q47","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A physician orders a nonrebreathing mask for a code blue patient in respiratory arrest. You should:","opts":["Recommend a bag-valve-mask — the NRB does not ventilate","Apply the nonrebreathing mask at 15 L/min as ordered","Apply a high-flow nasal cannula at 40 L/min","Apply CPAP at 10 cm H₂O with 100% oxygen"],"key":0,"why":"Nonrebreathing masks do not provide additional ventilation. Immediately recommend a bag-valve-mask that can provide 100% O₂ and can be used to ventilate the patient effectively.","src":[[19822,19825]],"origin":"heuer","age":"adult"},{"id":"C13-Q48","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A patient with a high or unstable minute ventilation on a nasal cannula at 2 L/min requires an FiO₂ of 0.28. You should recommend:","opts":["A 28% air-entrainment mask (high flow, stable FiO₂)","Increase the cannula flow to 4 L/min and reassess","Add a bubble humidifier to the cannula at 2 L/min","A partial rebreathing mask at 8 L/min with a bag"],"key":0,"why":"A standard nasal cannula is not suitable for patients with high or variable minute volume. Recommend a high-flow device such as a 28% air-entrainment mask, which can meet the patient's inspiratory flow needs and maintain a stable FiO₂.","src":[[19762,19767]],"origin":"heuer","age":"adult"},{"id":"C13-Q49","sec":"III-E","lvl27":"integ","topic":"Oxygen therapy modification","stem":"A patient on a 40% air-entrainment system has an SpO₂ of 89%. Possible causes and fixes include:","opts":["Too little FiO₂ or device flow — raise the FiO₂ or add a nebulizer","Excessive flow from the device — reduce the flowmeter setting","Too much humidity in the gas — remove the nebulizer","Obstructed entrainment ports — the FiO₂ is too high"],"key":0,"why":"An SpO₂ of 89% on a 40% air-entrainment system reflects either insufficient FiO₂ to correct the hypoxemia — increase it and monitor closely — or insufficient device flow to meet inspiratory demand and maintain a stable FiO₂, for which you add a second aerosol nebulizer in tandem or bleed in supplemental O₂ to increase total output flow.","src":[[19769,19779]],"origin":"heuer","age":"adult"},{"id":"C13-Q50","sec":"III-E","lvl27":"integ","topic":"Humidification modification","stem":"A patient develops mild stridor after extubation. The cause and recommendation are:","opts":["Subglottic edema from the cuff — cool aerosol by mask","Retained secretions — more frequent suctioning","Bronchospasm — an inhaled short-acting bronchodilator","Pulmonary edema — CPAP by full-face mask"],"key":0,"why":"Mild stridor after extubation is caused by subglottic tissue edema from the endotracheal tube cuff. Provide cool aerosol therapy via an aerosol mask.","src":[[19886,19890]],"origin":"heuer","age":"adult"},{"id":"C13-Q51","sec":"III-E","lvl27":"integ","topic":"Neonatal oxygen therapy","stem":"An infant's SpO₂ on nasal-prong CPAP drops during episodes of crying. You should:","opts":["Address the crying with the nurse; if it persists, try an oxyhood","Increase the CPAP pressure immediately to stop the desaturation","Sedate the infant so that the crying and mouth breathing stop","Switch to a nasal cannula at the same flow and FiO₂"],"key":0,"why":"The SpO₂ drop reflects a decrease in FiO₂ due to mouth breathing associated with crying. Collaborate with the nurse to address reasons for crying such as hunger. If crying and the SpO₂ decrease continue, consider an enclosure such as an oxyhood with the same FiO₂.","src":[[19858,19865]],"origin":"heuer","age":"child"},{"id":"C13-Q52","sec":"III-E","lvl27":"integ","topic":"Pharmacologic recommendations","stem":"For acute airway obstruction associated with asthma, the recommended drug therapy is:","opts":["A SABA such as albuterol, ± continuous nebulization and prednisone","A long-acting β-agonist such as salmeterol, given alone","A leukotriene inhibitor such as montelukast, given alone","A mast-cell stabilizer such as cromolyn sodium, given alone"],"key":0,"why":"For acute airway obstruction associated with asthma or a similar condition — the reliever scenario — recommend a short-acting β-agonist such as albuterol, and consider continuous nebulization and systemic steroids such as prednisone. LABAs, leukotriene inhibitors, and mast-cell stabilizers are controllers for long-term management.","src":[[20316,20330]],"origin":"heuer","age":"adult"},{"id":"C13-Q53","sec":"III-E","lvl27":"integ","topic":"Pharmacologic recommendations","stem":"A patient with cystic fibrosis has retained, thick, tenacious secretions. Appropriate recommendations include:","opts":["Acetylcysteine, dornase alfa, or 3–7% saline","A long-acting anticholinergic such as tiotropium","A leukotriene inhibitor such as montelukast","An inhaled corticosteroid such as fluticasone alone"],"key":0,"why":"For retained, thick or tenacious secretions, recommend acetylcysteine (Mucomyst), dornase alpha (Pulmozyme), or hypertonic saline 3–7% (Hypersal) if cystic fibrosis or bronchiectasis is present. An aerosolized treatment with 3–10% hypertonic saline is used to increase the volume of a sputum specimen.","src":[[20354,20361]],"origin":"heuer","age":"adult"},{"id":"C13-Q54","sec":"III-E","lvl27":"integ","topic":"Discontinuing therapy","stem":"A postoperative patient on incentive spirometry can now achieve an inspiratory capacity at or near predicted and has a clear chest x-ray. You should:","opts":["Discontinue it — the goals have been met","Continue for 48 hours as a precaution","Switch to IPPB to maintain the gains","Increase the frequency to every hour"],"key":0,"why":"The RT should terminate or recommend discontinuing therapy when the goals or objectives of the therapy have been achieved. If a post-op patient receiving incentive spirometry can achieve an inspiratory capacity at or near predicted and the chest x-ray is clear, the therapy is no longer needed and should be discontinued.","src":[[19151,19154]],"origin":"heuer","age":"adult"},{"id":"C14-Q01","sec":"III-F","lvl27":"integ","topic":"Evidence hierarchy","stem":"Which research design provides the STRONGEST evidence?","opts":["A meta-analysis","A randomized controlled trial","A cohort study","An expert panel report"],"key":0,"why":"The research hierarchy places the strongest evidence at the top. A meta-analysis thoroughly examines several valid studies on a topic and mathematically combines the results using accepted statistical methodology, reporting them as if one large study. Below it come systematic reviews, RCTs, cohort studies, case-control studies, and expert panels.","src":[[20857,20891]],"origin":"heuer","age":"adult"},{"id":"C14-Q02","sec":"III-F","lvl27":"integ","topic":"Evidence hierarchy","stem":"Which statement best describes a cohort study?","opts":["It follows people already exposed to a treatment forward, comparing them with an unexposed group","It compares people who have a condition with people who do not, looking back for exposures","It assigns patients at random to a new treatment or a control, then compares their outcomes","It mathematically pools the results of several valid studies into one larger estimate"],"key":0,"why":"Cohort studies identify a group of patients already undergoing a particular treatment or exposure, follow them forward over time, and compare their outcomes with a similar group not affected. They are observational and not as reliable as RCTs because the two groups may differ in ways other than the variable under study.","src":[[20875,20880]],"origin":"heuer","age":"adult"},{"id":"C14-Q03","sec":"III-F","lvl27":"integ","topic":"Evidence hierarchy","stem":"Why are case-control studies generally less reliable than RCTs and cohort studies?","opts":["They rely on records and recall, and an association does not prove causation","They cannot include any control group in the comparison at all","They are always too small to reach statistical significance","They are conducted only by panels of recognized experts"],"key":0,"why":"Case-control studies compare patients who already have a specific condition with people who do not, looking back to identify associated factors or exposures. They often rely on medical records and patient recall for data collection, and are less reliable than RCTs and cohort studies because showing a statistical relationship does not mean that one factor necessarily caused the other.","src":[[20881,20887]],"origin":"heuer","age":"adult"},{"id":"C14-Q04","sec":"III-F","lvl27":"integ","topic":"Evidence hierarchy","stem":"What limits the value of expert panel reports as evidence?","opts":["Subjectivity in defining who the experts are, and potential bias","They cannot address clinical topics or patient care questions","They are never published in a peer-reviewed form","They require randomization that is rarely feasible"],"key":0,"why":"Expert panels report the professional opinion of a group of recognized experts in a particular clinical area. Although potentially useful, the subjectivity associated with defining who the actual experts are, and potential biases, limit their value.","src":[[20888,20891]],"origin":"heuer","age":"adult"},{"id":"C14-Q05","sec":"III-F","lvl27":"integ","topic":"ARDSNet criteria","stem":"Which set of findings indicates that the ARDSNet protocol should be considered?","opts":["P/F < 300, bilateral infiltrates, and no evidence of LV failure","P/F < 200, unilateral infiltrates, and an elevated PAWP","Any patient who requires an FiO₂ above 0.50 for 24 hours","Bilateral infiltrates with clinical evidence of LV failure"],"key":0,"why":"Consider implementing the ARDSNet protocol for any patient with an acute onset of respiratory failure who has a P/F ratio below 300, bilateral diffuse infiltrates on x-ray consistent with pulmonary edema, and no clinical evidence of left atrial hypertension or left ventricular failure.","src":[[21218,21223]],"origin":"heuer","age":"adult"},{"id":"C14-Q06","sec":"III-F","lvl27":"integ","topic":"Asthma guidelines","stem":"Under NAEPP EPR-3 guidelines, how often should lung function be measured by spirometry in a patient with asthma?","opts":["At least every 1–2 years, more often if not well controlled","Only once, at the initial diagnostic visit for asthma","Every 5 years, if the patient has no daytime symptoms","At every office visit, without any exception"],"key":0,"why":"Obtain lung function measured by spirometry at least every 1–2 years, and more frequently for asthma that is not well controlled. At each visit assess asthma control, medication technique, the written asthma action plan, adherence, and patient concerns.","src":[[21020,21026]],"origin":"heuer","age":"adult"},{"id":"C14-Q07","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under the ARDSNet protocol, the initial tidal volume is set at what value, and how is it reduced?","opts":["8 mL/kg PBW, then down 1 mL/kg every ≤ 2 h to 6 mL/kg","6 mL/kg PBW, then up 1 mL/kg every ≤ 2 h to 8 mL/kg","10 mL/kg PBW, then down 2 mL/kg every 4 h to 6 mL/kg","4 mL/kg PBW, held constant until the plateau falls"],"key":0,"why":"Calculate PBW, select any mode while trying to ensure an I:E of 1:1 or less, set the initial VT to 8 mL/kg PBW, then reduce VT by 1 mL/kg at intervals of 2 hours or less until VT equals 6 mL/kg PBW.","src":[[21227,21233]],"origin":"heuer","age":"adult"},{"id":"C14-Q08","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"The ARDSNet oxygenation goal is to maintain:","opts":["PaO₂ 55–80 torr or SpO₂ 88–95%, with PEEP ≥ 5–8","PaO₂ 80–100 torr or SpO₂ above 95%, with PEEP ≥ 5","PaO₂ above 100 torr, with PEEP of at least 10","SpO₂ above 98%, on the lowest possible FiO₂"],"key":0,"why":"To ensure adequate oxygenation the goal is to maintain a PaO₂ between 55 and 80 torr or an SpO₂ between 88% and 95%. To achieve these targets, PEEP levels of at least 5–8 cm H₂O should be used, with incremental FiO₂/PEEP combinations applied from the protocol table.","src":[[21235,21239]],"origin":"heuer","age":"adult"},{"id":"C14-Q09","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's plateau pressure is 34 cm H₂O on a VT of 6 mL/kg PBW. You should:","opts":["Decrease VT in 1-mL/kg steps to a minimum of 4 mL/kg","Increase VT by 1 mL/kg to improve the PaCO₂ and pH","Leave the VT unchanged and increase the PEEP by 2","Increase the rate to 35/min and keep the VT"],"key":0,"why":"Keep the plateau pressure at 30 cm H₂O or less, measuring it every 4 hours and after each change in PEEP or VT. If Pplat exceeds 30 cm H₂O, decrease VT in 1-mL/kg steps to a minimum of 4 mL/kg.","src":[[21240,21244]],"origin":"heuer","age":"adult"},{"id":"C14-Q10","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's plateau pressure is 22 cm H₂O on a VT of 5 mL/kg PBW. You should:","opts":["Increase VT 1 mL/kg until Pplat > 25 or VT is 6 mL/kg","Decrease VT by 1 mL/kg to protect the lung","Leave the settings unchanged and recheck in 4 h","Decrease PEEP by 2 cm H₂O and recheck Pplat"],"key":0,"why":"If Pplat is below 25 cm H₂O and VT is below 6 mL/kg, increase VT by 1 mL/kg until Pplat exceeds 25 cm H₂O or VT reaches 6 mL/kg.","src":[[21245,21246]],"origin":"heuer","age":"adult"},{"id":"C14-Q11","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under ARDSNet, breath stacking and dyssynchrony occur while Pplat is 27 cm H₂O. You may:","opts":["Increase VT in 1-mL/kg steps to 7–8 mL/kg if Pplat stays < 30","Decrease VT to 4 mL/kg immediately to stop the stacking","Increase VT to 10 mL/kg regardless of the resulting plateau pressure","Increase the PEEP to 15 cm H₂O and leave the VT unchanged"],"key":0,"why":"If Pplat is below 30 cm H₂O and breath stacking or dyssynchrony occurs, consider increasing VT in 1-mL/kg steps to 7–8 mL/kg as long as Pplat remains below 30 cm H₂O.","src":[[21247,21248]],"origin":"heuer","age":"adult"},{"id":"C14-Q12","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under ARDSNet, the acid-base goal is to keep the pH between:","opts":["7.30 and 7.45","7.35 and 7.45","7.25 and 7.35","7.15 and 7.30"],"key":0,"why":"In terms of acid-base balance, the ARDSNet goal is to keep the pH between 7.30 and 7.45. If the pH rises above 7.45, which is rare, decrease the ventilator rate.","src":[[21250,21251]],"origin":"heuer","age":"adult"},{"id":"C14-Q13","sec":"III-F","lvl27":"integ","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's pH is 7.22. You should:","opts":["Raise the rate until pH > 7.30 or PaCO₂ < 25 (max 35/min)","Raise the rate directly to 35/min and leave it there","Increase VT in 1-mL/kg steps immediately, above 6 mL/kg","Give sodium bicarbonate before making any rate change"],"key":0,"why":"If the pH is above 7.15 but below 7.30, increase the rate until the pH exceeds 7.30 or the PaCO₂ falls below 25, with a maximum rate of 35/min. If the pH is below 7.15, increase the rate to 35/min; and if the rate is already 35/min with a pH below 7.15, increase VT in 1-mL/kg steps until pH exceeds 7.15 — the Pplat target may be exceeded — and consider sodium bicarbonate.","src":[[21254,21258]],"origin":"heuer","age":"adult"},{"id":"C14-Q14","sec":"III-F","lvl27":"integ","topic":"ARDS weaning","stem":"Which set of criteria indicates readiness for a spontaneous breathing trial under the NHLBI ARDS protocol?","opts":["FiO₂ ≤ 0.40/PEEP ≤ 8 or ≤ 0.50/≤ 5, no higher than the day before; spontaneous efforts; SBP ≥ 90 off pressors; no blockade","FiO₂ ≤ 0.60/PEEP ≤ 10 or ≤ 0.70/≤ 8, with any blood pressure","Any patient breathing spontaneously for 24 hours on the ventilator","FiO₂ 0.21 with no PEEP, plus a normal chest x-ray and normal ABG"],"key":0,"why":"Readiness criteria are FiO₂ of 0.40 or less with PEEP of 8 cm H₂O or less, or FiO₂ of 0.50 or less with PEEP of 5 cm H₂O or less; PEEP and FiO₂ no higher than the previous day's settings; acceptable spontaneous breathing efforts, detected by reducing the vent rate by 50% for 5 minutes; systolic BP of 90 mm Hg or more without vasopressors; and no neuromuscular blocking agents or blockade.","src":[[21269,21274]],"origin":"heuer","age":"adult"},{"id":"C14-Q15","sec":"III-F","lvl27":"integ","topic":"ARDS weaning","stem":"During an ARDS-protocol spontaneous breathing trial, which finding indicates the trial should be STOPPED?","opts":["Two or more of: HR > 120% of baseline, marked accessory muscle use, abdominal paradox, diaphoresis, marked dyspnea","A spontaneous VT of 5 mL/kg PBW with an SpO₂ of 92% on the trial","A respiratory rate of 30/min with no other signs of distress","A pH of 7.34 with a PaO₂ of 68 torr after 30 minutes on the trial"],"key":0,"why":"The trial is tolerated when SpO₂ is 90% or more with PaO₂ of 60 mm Hg or more, spontaneous VT is at least 4 mL/kg PBW, respiratory rate is 35/min or less, pH is 7.30 or more, and there is no respiratory distress. Distress is defined as two or more of: HR above 120% of baseline, marked accessory muscle use, abdominal paradox, diaphoresis, and marked dyspnea.","src":[[21282,21292]],"origin":"heuer","age":"adult"},{"id":"C14-Q16","sec":"III-F","lvl27":"integ","topic":"ARDS weaning","stem":"A patient tolerates the ARDS-protocol spontaneous breathing trial for 35 minutes. You should:","opts":["Consider extubation","Continue the trial for a full 4 hours","Resume pre-weaning settings and retry tomorrow","Reduce PEEP to 3 cm H₂O and continue"],"key":0,"why":"The trial is conducted on a T-piece, trach collar, or CPAP of 5 cm H₂O or less with PS below 5 cm H₂O. If tolerated for at least 30 minutes, consider extubation. If not tolerated, resume pre-weaning settings.","src":[[21279,21293]],"origin":"heuer","age":"adult"},{"id":"C14-Q17","sec":"III-F","lvl27":"integ","topic":"Asthma self-management","stem":"Under NAEPP guidelines, a patient using a short-acting β-agonist more than 2 days per week (other than for exercise-induced asthma) indicates:","opts":["Long-term control medication may need to be started or increased","The SABA dose should be doubled for faster relief","The patient's asthma is currently well controlled overall","Long-term control medication should be stopped now"],"key":0,"why":"Quick-relief medications (SABAs) relax airway muscles for fast symptom relief but do not provide long-term control. If used more than 2 days per week — except as needed for exercise-induced asthma — the patient may need to start or increase long-term control medications. Inhaled corticosteroids are the most effective long-term control therapy.","src":[[21062,21067],[21039,21039]],"origin":"heuer","age":"adult"},{"id":"C14-Q18","sec":"III-F","lvl27":"integ","topic":"Exercise-induced bronchospasm","stem":"Why is frequent or chronic use of a LABA to prevent exercise-induced bronchospasm discouraged?","opts":["It may disguise poorly controlled persistent asthma","It causes tolerance to short-acting agents within days","It has no protective effect against EIB","It is contraindicated during physical activity"],"key":0,"why":"Teach patients to take treatment before exercise; SABAs prevent EIB in most patients, and leukotriene receptor antagonists, cromolyn, or LABAs are also protective. However, frequent or chronic use of LABAs to prevent EIB is discouraged because it may disguise poorly controlled persistent asthma. EIB is often a marker of inadequate asthma control and responds well to regular anti-inflammatory therapy.","src":[[21134,21142]],"origin":"heuer","age":"adult"},{"id":"C15-Q01","sec":"III-G","lvl27":"integ","topic":"Basic life support","stem":"The key steps in basic life support now follow which sequence?","opts":["CABD — circulation, airway, breathing, defibrillation","ABCD — airway, breathing, circulation, defibrillation","DABC — defibrillation, airway, breathing, circulation","BACD — breathing, airway, circulation, defibrillation"],"key":0,"why":"The key steps in BLS now follow a CABD sequence, standing for circulation–airway–breathing–defibrillation. The NBRC exam counts on your current BLS certification to apply this knowledge to any patient scenario requiring basic life support.","src":[[21477,21480]],"origin":"heuer","age":"adult"},{"id":"C15-Q02","sec":"III-G","lvl27":"integ","topic":"Pulseless rhythms","stem":"The four cardiac dysrhythmias producing pulselessness in adults are:","opts":["VF, VT, pulseless electrical activity, and asystole","Atrial fibrillation, atrial flutter, heart block, and asystole","Sinus bradycardia, sinus tachycardia, PVCs, and PACs","VF, atrial fibrillation, asystole, and first-degree block"],"key":0,"why":"The most common adult cardiopulmonary emergencies stem from one of four cardiac dysrhythmias that produce pulselessness: ventricular fibrillation, ventricular tachycardia, pulseless electrical activity, and asystole.","src":[[21501,21504]],"origin":"heuer","age":"adult"},{"id":"C15-Q03","sec":"III-G","lvl27":"integ","topic":"ACLS drugs","stem":"The initial adult IV dose of epinephrine during cardiac arrest is:","opts":["1 mg every 3–5 minutes with flush","0.5 mg every 3–5 minutes up to 3 mg/kg","300 mg rapid infusion","1.0–1.5 mg/kg"],"key":0,"why":"Epinephrine is given as 1 mg every 3–5 minutes with flush; it is a vasoconstrictor that may improve cerebral perfusion. Atropine is 0.5 mg every 3–5 minutes up to a maximum of 3 mg/kg, amiodarone is 300 mg rapid infusion, and lidocaine is 1.0–1.5 mg/kg initially.","src":[[21534,21545]],"origin":"heuer","age":"adult"},{"id":"C15-Q04","sec":"III-G","lvl27":"integ","topic":"ACLS drugs","stem":"When an ACLS medication must be instilled via endotracheal tube because IV/IO access is unavailable, you should:","opts":["Double the dose and follow with 10 mL of normal saline","Halve the dose and follow with 5 mL of sterile water","Use the same dose with no flush","Dilute the dose in 50 mL of saline"],"key":0,"why":"Certain medications — epinephrine, atropine, and lidocaine — may be instilled via ETT if IV or IO access is not established. In such cases it is recommended that the dose be doubled and followed with the instillation of 10 mL of normal saline.","src":[[21547,21550]],"origin":"heuer","age":"adult"},{"id":"C15-Q05","sec":"III-G","lvl27":"integ","topic":"Defibrillation","stem":"The initial biphasic defibrillation dose for an ADULT is:","opts":["120–200 J, or per the manufacturer","2 J/kg, then at least 4 J/kg after that","360 J for the first and every later shock","4 J/kg, then 10 J/kg for later shocks"],"key":0,"why":"For biphasic defibrillators, the initial adult dose is 120–200 J or as recommended by the manufacturer, with subsequent doses the same (higher energy levels may be considered). For children the initial dose is 2 J/kg with subsequent doses of at least 4 J/kg. For older monophasic devices, apply 360 J to adults and 2 J/kg to children.","src":[[21556,21568]],"origin":"heuer","age":"adult"},{"id":"C15-Q06","sec":"III-G","lvl27":"integ","topic":"Neonatal resuscitation","stem":"For preterm newborns less than 35 weeks' gestation, resuscitation should begin with:","opts":["21–30% O₂, titrated to preductal SpO₂","100% O₂ until the heart rate normalizes","60% O₂ regardless of gestational age","Room air with no titration of O₂"],"key":0,"why":"Babies who are flaccid, cyanotic, or apneic in the delivery room usually require stimulation and supplemental O₂. For preterm newborns under 35 weeks of gestation, low O₂ of 21–30% should be used and titrated to achieve preductal SpO₂ ranges from the protocol table.","src":[[21635,21640]],"origin":"heuer","age":"child"},{"id":"C15-Q07","sec":"III-G","lvl27":"integ","topic":"CPR quality","stem":"During CPR the PetCO₂ is 8 mm Hg and the intra-arterial diastolic pressure is 16 mm Hg. This indicates:","opts":["The quality of CPR should be improved","Return of spontaneous circulation has occurred","Resuscitation should be terminated immediately","Ventilation is excessive and should be reduced"],"key":0,"why":"Capnography is recommended as a standard of care during resuscitation because it assesses both the adequacy of ventilation and the effectiveness of cardiac compressions. If the PetCO₂ is less than 10 mm Hg and the intra-arterial diastolic pressure is less than 20 mm Hg, the quality of CPR should be improved.","src":[[21591,21595]],"origin":"heuer","age":"adult"},{"id":"C15-Q08","sec":"III-G","lvl27":"integ","topic":"Terminating resuscitation","stem":"Which capnography finding can be used as an indicator to terminate resuscitative efforts?","opts":["PetCO₂ never > 10 mm Hg after 20 minutes of CPR","PetCO₂ above 40 mm Hg at any point in CPR","Any PetCO₂ below 35 mm Hg during CPR","A sudden rise in PetCO₂ during compressions"],"key":0,"why":"Failure to achieve a PetCO₂ greater than 10 mm Hg after 20 minutes of CPR can be used as an indicator to terminate resuscitative efforts. A sudden rise in PetCO₂ instead suggests return of spontaneous circulation.","src":[[21596,21597]],"origin":"heuer","age":"adult"},{"id":"C15-Q09","sec":"III-G","lvl27":"integ","topic":"Reversible causes","stem":"Which set represents the \"5 Hs\" of reversible causes of cardiac arrest?","opts":["Hypovolemia, hypoxia, H⁺ (acidosis), hypo/hyperkalemia, hypothermia","Hypertension, hypoxia, hyperglycemia, hypothermia, hemorrhage","Hypovolemia, hypercapnia, hyperthermia, hypoglycemia, hemothorax","Hypoxia, hypotension, hyperkalemia, hepatic failure, hypothermia"],"key":0,"why":"The 5 Hs are hypovolemia, hypoxia, hydrogen ion (acidosis), hypo- or hyperkalemia, and hypothermia. The 5 Ts are tension pneumothorax, cardiac tamponade, toxins, pulmonary thrombosis, and cardiac thrombosis.","src":[[21603,21613]],"origin":"heuer","age":"adult"},{"id":"C15-Q10","sec":"III-G","lvl27":"integ","topic":"Reversible causes","stem":"Which set represents the \"5 Ts\" of reversible causes of cardiac arrest?","opts":["Tension pneumothorax, tamponade, toxins, pulmonary and cardiac thrombosis","Tachycardia, tamponade, trauma, toxins, and pulmonary thrombosis","Tension pneumothorax, tracheal obstruction, trauma, toxins, thyrotoxicosis","Tamponade, thrombosis, tachyarrhythmia, tension pneumothorax, transfusion"],"key":0,"why":"The 5 Ts are tension pneumothorax, cardiac tamponade, toxins such as drug overdose and anaphylactic reactions, pulmonary thrombosis (pulmonary emboli), and cardiac thrombosis (myocardial infarction or ischemia).","src":[[21609,21613]],"origin":"heuer","age":"adult"},{"id":"C15-Q11","sec":"III-G","lvl27":"integ","topic":"Neonatal resuscitation","stem":"If color, heart rate, and breathing are not restored within 30 seconds after birth, you should:","opts":["PPV by face mask, with PEEP ≤ 5 cm H₂O","Begin chest compressions immediately at 3:1","Give epinephrine and intubate the newborn","Continue stimulation for another 60 seconds"],"key":0,"why":"If color, heart rate, and breathing are not restored within 30 seconds after birth, provide manual positive-pressure ventilation via face mask. PPV is the most effective intervention in the delivery room for improving outcomes, and can be delivered with a flow-inflating bag, self-inflating bag, or T-piece resuscitator. A PEEP of 5 cm H₂O or less is always recommended.","src":[[21645,21650]],"origin":"heuer","age":"child"},{"id":"C15-Q12","sec":"III-G","lvl27":"integ","topic":"Neonatal resuscitation","stem":"A neonate's heart rate is 52/min despite effective positive-pressure ventilation. You should:","opts":["Begin chest compressions — HR < 60 always requires them","Continue PPV alone and reassess the HR in 60 seconds","Give epinephrine before any chest compressions","Intubate the infant before starting compressions"],"key":0,"why":"A heart rate of less than 60 always requires chest compressions in a neonate. If the infant does not respond to these measures, epinephrine should be administered and intubation with mechanical ventilation considered.","src":[[21688,21690]],"origin":"heuer","age":"child"},{"id":"C15-Q13","sec":"III-G","lvl27":"integ","topic":"Neonatal SpO₂ targets","stem":"At 5 minutes after birth, the targeted preductal SpO₂ is:","opts":["80–85%","60–65%","70–75%","85–95%"],"key":0,"why":"Targeted preductal SpO₂ after birth rises over time: 60–65% at 1 minute, 65–70% at 2 minutes, 70–75% at 3 minutes, 75–80% at 4 minutes, 80–85% at 5 minutes, and 85–95% at 10 minutes.","src":[[21654,21666]],"origin":"heuer","age":"child"},{"id":"C15-Q14","sec":"III-G","lvl27":"integ","topic":"Airway obstruction","stem":"Which findings distinguish COMPLETE from partial airway obstruction?","opts":["No air movement or breath sounds, the choking sign, unable to speak or cough","Sonorous breathing, stridor, or wheezing with some air movement present","Choking, drooling, or gagging with accessory muscle use","Anxiety and agitation with intercostal retractions and wheeze"],"key":0,"why":"Complete airway obstruction shows absence of air movement and breath sounds, severe anxiety and agitation while conscious, the universal choking sign, inability to talk or cough, accessory muscle use, retractions or paradoxical breathing, and eventual lethargy, cyanosis, and unconsciousness. Partial obstruction still has some air movement with sonorous breathing, stridor, or wheezing, plus choking, drooling, or gagging.","src":[[21671,21685]],"origin":"heuer","age":"adult"},{"id":"C15-Q15","sec":"III-G","lvl27":"integ","topic":"Pediatric resuscitation","stem":"How does the PALS pulseless arrest algorithm differ from the adult algorithm?","opts":["Shock energy and drug doses are based on weight","Defibrillation is not used in children at all","Epinephrine is omitted from the algorithm","Compressions wait until an airway is secured"],"key":0,"why":"The PALS algorithm for pulseless arrest is similar to the adult algorithm, with the exception that the defibrillation shock and medication dosages vary by patient weight. One of the most common pediatric emergencies is airway obstruction by a foreign body.","src":[[21623,21629]],"origin":"heuer","age":"child"},{"id":"C16-Q01","sec":"III-H","lvl27":"recall","topic":"Intubation contraindications","stem":"What is the ONLY absolute contraindication to endotracheal intubation?","opts":["A documented DNR/DNI order","Severe airway trauma or obstruction","Head/neck injury requiring cervical spine immobilization","A Mallampati Class 4 airway"],"key":0,"why":"Primary indications for ET intubation include respiratory or cardiac arrest, airway compromise and protection, and invasive ventilatory support. The only absolute contraindication against intubation is a documented do-not-resuscitate/do-not-intubate order. Severe airway trauma, cervical immobilization needs, and a Mallampati Class 4 airway are relative concerns.","src":[[22736,22744]],"origin":"heuer","age":"adult"},{"id":"C16-Q02","sec":"III-H","lvl27":"recall","topic":"Difficult airway protocol","stem":"According to the textbook, after how many unsuccessful conventional intubation attempts should the difficult airway protocol be followed?","opts":["Three","One","Five","Ten"],"key":0,"why":"Difficult airway protocols vary by institution but are all meant to guide action whenever a trained professional experiences difficulty with mask ventilation or cannot quickly insert an ETT using conventional laryngoscopy in three or fewer attempts.","src":[[22749,22753]],"origin":"heuer","age":"adult"},{"id":"C16-Q03","sec":"III-H","lvl27":"recall","topic":"Difficult airway equipment","stem":"Which device is generally the FIRST option for establishing an airway if endotracheal intubation fails?","opts":["A supraglottic airway such as an LMA or Combitube","A percutaneous cricothyrotomy kit","A retrograde intubation kit with a guidewire","A lighted stylet for blind oral intubation"],"key":0,"why":"A supraglottic airway — LMA, Combitube, or cuffed oropharyngeal airway — is generally the first option in establishing an airway if ET intubation fails. It can be inserted with the head and neck in a neutral position, but is contraindicated if there is a high risk of aspiration.","src":[[22845,22851]],"origin":"heuer","age":"adult"},{"id":"C16-Q04","sec":"III-H","lvl27":"integ","topic":"Pre-procedure duties","stem":"Before assisting with any procedure, the RT should:","opts":["Verify the order, check the record and consent, gather equipment, identify the patient","Gather the equipment and begin at once, so that the procedure is not delayed","Wait for the physician to review the chart and give a verbal go-ahead first","Document the procedure in the chart in advance, then gather the equipment"],"key":0,"why":"Before each procedure: verify, interpret, and evaluate the physician's order or protocol; review the medical record for contraindications, hazards, and informed consent if appropriate; wash hands and apply standard transmission-based precautions; gather all equipment; identify the patient; and take a pre-procedure time-out if appropriate, as for bronchoscopy.","src":[[22706,22712]],"origin":"heuer","age":"adult"},{"id":"C16-Q05","sec":"III-H","lvl27":"integ","topic":"Assisting with intubation","stem":"Before intubation, the RT should prepare the ETT cuff by:","opts":["Inflating it, checking for leaks, then fully deflating it","Inflating it to 25 cm H₂O and leaving it inflated","Leaving it untouched until after the tube is inserted","Filling it with sterile water to check for leaks"],"key":0,"why":"Among the RT's pre-procedure duties is to inflate the ETT cuff, check it for leaks, then fully deflate it — confirming cuff integrity and preparing the tube for insertion.","src":[[22772,22774]],"origin":"heuer","age":"adult"},{"id":"C16-Q06","sec":"III-H","lvl27":"integ","topic":"Assisting with intubation","stem":"During intubation, why should dentures or dental appliances be removed beforehand?","opts":["To ease laryngoscopy and avoid aspiration of the appliance","To improve the mask seal during bag-mask ventilation","To allow accurate capnography readings after intubation","To prevent damage to the laryngoscope blade and light"],"key":0,"why":"Remove dentures or dental appliances such as bridges if present, in order to facilitate laryngoscopy and avoid aspiration of the appliances.","src":[[22781,22783]],"origin":"heuer","age":"adult"},{"id":"C16-Q07","sec":"III-H","lvl27":"integ","topic":"Assisting with intubation","stem":"After three unsuccessful intubation attempts, the RT should:","opts":["Recommend proceeding with the difficult airway protocol","Make a fourth intubation attempt personally","Place a nonrebreathing mask and wait for help","Increase the sedation and reattempt intubation at once"],"key":0,"why":"If three unsuccessful intubation attempts occur, recommend proceeding with the difficult airway protocol, which varies by institution — this ensures patient safety.","src":[[22813,22817]],"origin":"heuer","age":"adult"},{"id":"C16-Q08","sec":"III-H","lvl27":"integ","topic":"Post-intubation duties","stem":"After intubation, the RT's responsibilities include:","opts":["Mark and secure the tube, get a chest x-ray, reassess, and document","Leave the tube unsecured until the chest x-ray confirms its position","Wait 4 hours before reassessing the patient and the breath sounds","Document only the ventilator settings and the time of intubation"],"key":0,"why":"After the procedure: note and mark the ETT insertion depth and secure it; ensure a chest x-ray is obtained and the tube repositioned as needed; reassess the patient's clinical status; suction if necessary; ensure appropriate humidification, ventilation, and oxygenation; and verify that intubation and follow-up orders have been documented in the chart.","src":[[22821,22836]],"origin":"heuer","age":"adult"},{"id":"C16-Q09","sec":"III-H","lvl27":"integ","topic":"Airway preparation","stem":"To block the gag reflex in a conscious patient during intubation, which intervention is appropriate?","opts":["Topical anesthetic spray (2% tetracaine) or nebulized 4% lidocaine","A neuromuscular blocking agent given without any sedation","Cricoid pressure alone, held firmly until the tube is placed","Hyperventilation with 100% O₂ alone before laryngoscopy"],"key":0,"why":"Once the patient is positioned, clear secretions or vomitus from the pharynx with a Yankauer suction catheter. Spraying the pharynx with a local anesthetic such as 2% tetracaine (Cetacaine) aids intubation in conscious patients by blocking the gag reflex, and for elective intubation you can nebulize a 4% lidocaine solution via a small-volume nebulizer.","src":[[22930,22935]],"origin":"heuer","age":"adult"},{"id":"C16-Q10","sec":"III-H","lvl27":"integ","topic":"Difficult airway equipment","stem":"How is the position of a gum elastic bougie confirmed?","opts":["Visually, or by a clicking feel over the tracheal rings","By a midline glow below the thyroid cartilage in the neck","By aspirating air freely with a 10-mL syringe on the end","By auscultating over the epigastrium for sounds"],"key":0,"why":"A gum elastic bougie or ventilating tracheal tube introducer is a long, narrow, flexible plastic rod with an angled tip inserted via laryngoscopy into the trachea. Its position is confirmed visually or via a clicking feel as the tip moves over the tracheal rings. The ETT is then inserted over the introducer, which is withdrawn. A midline glow below the thyroid cartilage instead confirms a lighted stylet.","src":[[22865,22891]],"origin":"heuer","age":"adult"},{"id":"C16-Q11","sec":"III-H","lvl27":"integ","topic":"Difficult airway equipment","stem":"Percutaneous cricothyrotomy generally requires that the patient be at least what age?","opts":["5 years old","12 years old","1 year old","18 years old"],"key":0,"why":"A percutaneous cricothyrotomy kit punctures the cricothyroid membrane and dilates the opening until it is large enough to place an ETT or trach tube. Patients generally must be at least 5 years old.","src":[[22898,22901]],"origin":"heuer","age":"adult"},{"id":"C16-Q12","sec":"III-H","lvl27":"integ","topic":"Difficult airway equipment","stem":"Why is jet ventilation the surgical airway of choice for children younger than 12 years?","opts":["Their small trachea makes cricothyrotomy hazardous","It requires no separate oxygen source at all","It gives better humidification of the inspired gas","It does not require a 50-psi gas source"],"key":0,"why":"A jet ventilation setup provides manually triggered ventilation with 100% O₂ via a ventilating stylet inserted orally or a 13- to 14-gauge angiocath inserted percutaneously into the trachea. It is the surgical airway of choice for children younger than 12 years due to their small tracheal diameter and the resulting hazard of cricothyrotomy.","src":[[22903,22910]],"origin":"heuer","age":"child"},{"id":"C17-Q01","sec":"III-I","lvl27":"recall","topic":"Education sessions","stem":"Educational sessions should be limited to approximately what duration to avoid information overload?","opts":["About 1 hour or less","About 3 hours","About 15 minutes","There is no recommended limit"],"key":0,"why":"Limit educational sessions to about 1 hour or less to avoid information overload. Thoroughly demonstrate all procedures and equipment and request a return demonstration.","src":[[24042,24045]],"origin":"heuer","age":"adult"},{"id":"C17-Q02","sec":"III-I","lvl27":"recall","topic":"Infection control at home","stem":"Which water should be used in nebulizers versus humidifiers in the home?","opts":["Sterile water in nebulizers; distilled for humidifiers","Tap water is acceptable for both devices at home","Distilled water in nebulizers; tap water for humidifiers","Sterile water for both, with no exceptions at all"],"key":0,"why":"Sterile water should be used in nebulizers; distilled water is acceptable for humidifiers. Noncritical reusable items such as blood pressure cuffs can be cleaned with a detergent.","src":[[24104,24107]],"origin":"heuer","age":"adult"},{"id":"C17-Q03","sec":"III-I","lvl27":"recall","topic":"Equipment reprocessing","stem":"Before disinfection, reusable semicritical items such as nebulizers and breathing circuits should be:","opts":["Scrubbed with detergent, washed, rinsed, and air-dried","Soaked in a high-level disinfectant without cleaning","Wiped with alcohol and then reused immediately","Autoclaved after every single use at home"],"key":0,"why":"Before disinfection, all reusable semicritical objects — such as nebulizers, breathing circuits, and tracheal airway components — should be scrubbed with detergent to remove organic material, then thoroughly washed, rinsed, and allowed to air-dry.","src":[[24108,24111]],"origin":"heuer","age":"adult"},{"id":"C17-Q04","sec":"III-I","lvl27":"integ","topic":"Health literacy","stem":"When teaching a patient who may have limited literacy, you should:","opts":["Leave printed 'EZ read' material with pictures","Provide a detailed written manual only","Rely on verbal teaching with no materials","Delegate all teaching to a relative without checking understanding"],"key":0,"why":"Remember that not all patients have the same cognitive abilities or literacy — some may read only at an elementary level or be unable to read at all. Leave printed EZ read information, with pictures if possible, about the procedures and equipment.","src":[[24048,24052]],"origin":"heuer","age":"adult"},{"id":"C17-Q05","sec":"III-I","lvl27":"integ","topic":"Communication barriers","stem":"When educating a patient with a hearing impairment, you should:","opts":["Speak clearly, allow lip reading, and have hearing aids in","Speak as loudly as possible and avoid written materials","Rely solely on printed instructions handed to the patient","Use a sign-language interpreter for every such patient"],"key":0,"why":"For hearing-impaired patients, speak clearly and at an appropriate volume so they can hear you. Keep in mind that some patients might be reading your lips to some degree, and those with hearing aids should have them in during instruction. For visual difficulties, use larger print, easy-to-distinguish fonts, and contrasting colors.","src":[[24055,24060]],"origin":"heuer","age":"adult"},{"id":"C17-Q06","sec":"III-I","lvl27":"integ","topic":"Behavior change","stem":"Why does teaching alone often fail to change patient behavior?","opts":["Knowledge alone does not change behavior; motivation and barriers matter","Patients rarely retain any of the information from a teaching session","Written materials are always more effective than a demonstration","Compliance depends only on the physician's spoken instructions"],"key":0,"why":"Remember that knowledge does not always change behavior. Motivation, perceived level of benefit, and removal of barriers — physical, financial, past experiences, misconceptions — are key factors in getting patients to comply with medications, therapies, or smoking cessation.","src":[[24064,24067]],"origin":"heuer","age":"adult"},{"id":"C17-Q07","sec":"III-I","lvl27":"integ","topic":"Oxygen safety education","stem":"A homecare patient on oxygen continues to smoke. You should educate them to:","opts":["Not smoke or cook over an open flame while wearing O₂","Smoke only in a well-ventilated room while wearing O₂","Reduce the oxygen flow by half before smoking","Remove the cannula for 30 seconds before smoking"],"key":0,"why":"Use no-smoking zones and signage and remove potential ignition sources such as cigarette lighters. While cessation is preferable, for those who continue to smoke, educate them not to smoke while wearing oxygen, and not to cook over an open flame while wearing oxygen.","src":[[24170,24175]],"origin":"heuer","age":"adult"},{"id":"C17-Q08","sec":"III-I","lvl27":"integ","topic":"Electrical safety","stem":"In the hospital, life-support equipment should be connected to:","opts":["Only red (emergency) outlets with backup power","Any available outlet that is properly grounded","A portable power strip at the bedside","A grounded standard outlet without emergency backup power"],"key":0,"why":"For electrical failure risk, in the hospital use only red or emergency outlets with a backup power supply. In home care, ensure the outlet is functioning and grounded and that the circuit amperage is adequate for the equipment being used.","src":[[24160,24164]],"origin":"heuer","age":"adult"},{"id":"C17-Q09","sec":"III-I","lvl27":"integ","topic":"Patient mobility education","stem":"When instructing a patient on safe ambulation and lifting technique, you should teach them to:","opts":["Exhale on exertion, plan around obstacles, and bend at the knees","Hold the breath during exertion to stabilize the trunk","Take the shortest route, going over any obstacles on the way","Bend at the waist to conserve the leg muscles' strength"],"key":0,"why":"Teach the patient to exhale on exertion — for example when going up a step — plan the course such as going around obstacles rather than over them, choose a ramp instead of stairs, stop and rest if needed, and bend at the knees instead of the waist when picking something up. Caregivers should maintain a straight spine, lift with the legs, and use a lift assist device.","src":[[24136,24141]],"origin":"heuer","age":"adult"},{"id":"N27-01","sec":"II-B","lvl27":"recall","topic":"Ventilator-associated events","stem":"In CDC surveillance, a ventilator-associated condition (VAC) is identified by a sustained increase, after a period of stability, in the daily minimum:","opts":["PEEP of ≥ 3 cm H2O or FiO2 of ≥ 0.20","Tidal volume of ≥ 100 mL or rate of ≥ 5/min","Peak pressure of ≥ 10 cm H2O or Pplat ≥ 5","PEEP of ≥ 1 cm H2O or FiO2 of ≥ 0.10"],"key":0,"why":"A VAC is a rise in the daily minimum PEEP of at least 3 cm H2O, or in the daily minimum FiO2 of at least 0.20 (20 points), sustained for at least 2 calendar days after a baseline of at least 2 days of stable or decreasing values.","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-02","sec":"II-B","lvl27":"integ","topic":"Ventilator-associated events","stem":"A ventilated adult has daily minimum PEEP values of 5, 5, 8 and 8 cm H2O on four consecutive days, with FiO2 unchanged. By CDC surveillance criteria this is:","opts":["Not an event, because the FiO2 did not change","A ventilator-associated condition","An event only if a culture is positive","Not an event, because PEEP stayed below 10 cm H2O"],"key":1,"why":"Two stable baseline days were followed by a rise of 3 cm H2O in the daily minimum PEEP that was sustained for 2 calendar days, which meets the VAC definition. Either the PEEP or the FiO2 criterion is enough.","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-03","sec":"II-B","lvl27":"integ","topic":"Ventilator-associated events","stem":"After two stable days at FiO2 0.40, a patient's daily minimum FiO2 is 0.55 for the next two days, with PEEP unchanged. Does this meet the criterion for a ventilator-associated condition?","opts":["Yes; any sustained FiO2 increase counts","No; the increase is less than 0.20","Yes; because it lasted two calendar days","No; the FiO2 criterion needs three days"],"key":1,"why":"The FiO2 criterion requires an increase of at least 0.20 (20 points) in the daily minimum FiO2, sustained for at least 2 calendar days. An increase of 0.15 does not qualify.","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-04","sec":"II-B","lvl27":"recall","topic":"Ventilator-associated events","stem":"Which list names the three tiers of the CDC ventilator-associated event algorithm?","opts":["VAC, IVAC and PVAP","VAP, HAP and CAP","VILI, VALI and ARDS","Mild, moderate and severe"],"key":0,"why":"The VAE algorithm has three tiers: ventilator-associated condition (VAC), infection-related ventilator-associated complication (IVAC) and possible ventilator-associated pneumonia (PVAP).","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-05","sec":"II-B","lvl27":"recall","topic":"Ventilator-associated events","stem":"For ventilator-associated event surveillance, the 'daily minimum' PEEP or FiO2 is the lowest setting during a calendar day that was maintained for more than:","opts":["1 minute","1 hour","6 hours","12 hours"],"key":1,"why":"The daily minimum is the lowest value set during a calendar day that was maintained for more than 1 hour.","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-06","sec":"II-B","lvl27":"integ","topic":"Ventilator-associated events","stem":"A patient has two stable days at FiO2 0.40. The daily minimum FiO2 then rises to 0.70 for one day and returns to 0.40 the next day. How should this be classified?","opts":["A VAC, because the increase exceeded 0.20","Not a VAC, because the rise lasted only 1 calendar day","A possible VAP, because the FiO2 rose sharply","An IVAC, because the FiO2 then returned to baseline"],"key":1,"why":"The increase must be sustained for at least 2 calendar days. A one-day rise, even a large one, does not meet the VAC definition.","src":"CDC-VAE","origin":"external","cite":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","new27":true,"age":"adult"},{"id":"N27-07","sec":"I-A","lvl27":"integ","topic":"Vaccination status","stem":"While reviewing the record of a 68-year-old with COPD, you note no record of RSV vaccination. According to CDC guidance:","opts":["He is not eligible until he reaches age 75, whatever his health","A single dose is recommended (age 50–74 with a risk condition)","He needs one dose every RSV season, like the influenza vaccine","He should wait until after his next COPD exacerbation to get it"],"key":1,"why":"CDC recommends a single dose of RSV vaccine for all adults 75 and older and for adults 50-74 at increased risk of severe RSV, which includes chronic lung disease such as COPD, emphysema, asthma, interstitial lung disease and cystic fibrosis.","src":"CDC-RSV","origin":"external","cite":"CDC, RSV Vaccine Guidance for Adults (page dated Feb 24, 2026)","new27":true,"age":"adult"},{"id":"N27-08","sec":"I-A","lvl27":"recall","topic":"Vaccination status","stem":"Which statement about RSV vaccination in adults matches CDC guidance?","opts":["It is given every year, like the influenza vaccine","It is currently a single dose, not an annual vaccine","It is recommended only for adults under age 50","It must be given in the spring, before the season"],"key":1,"why":"The adult RSV vaccine is a single dose and is not currently an annual vaccine. It can be given at any time of year, with late summer or early fall the best time.","src":"CDC-RSV","origin":"external","cite":"CDC, RSV Vaccine Guidance for Adults (page dated Feb 24, 2026)","new27":true,"age":"adult"},{"id":"N27-09","sec":"I-B","lvl27":"recall","topic":"Social determinants of health","stem":"Social determinants of health are best described as:","opts":["Inherited conditions that affect lung function and long-term outcomes","Conditions where people are born, live, work, play and age that affect health","Laboratory values and vital signs that predict a hospital readmission","Side effects of prescribed drugs that affect a patient's daily function"],"key":1,"why":"Healthy People 2030 defines social determinants of health as the conditions in the environments where people are born, live, learn, work, play, worship and age that affect a wide range of health, functioning and quality-of-life outcomes and risks.","src":"HP2030","origin":"external","cite":"ODPHP, Healthy People 2030: Social Determinants of Health","new27":true,"age":"adult"},{"id":"N27-10","sec":"I-B","lvl27":"integ","topic":"Social determinants of health","stem":"During an interview, a patient with asthma says she skips her controller inhaler because she cannot afford it and has no ride to the clinic. Which social determinant domains are involved?","opts":["Economic stability and health care access","Genetic predisposition and family history","Neighborhood air quality and housing alone","None; this is a compliance problem alone"],"key":0,"why":"The five Healthy People 2030 domains are economic stability; education access and quality; health care access and quality; neighborhood and built environment; and social and community context. Cost and transportation barriers fall under economic stability and health care access.","src":"HP2030","origin":"external","cite":"ODPHP, Healthy People 2030: Social Determinants of Health","new27":true,"age":"adult"},{"id":"N27-11","sec":"I-D","lvl27":"integ","topic":"Pulse CO-oximetry","stem":"A patient rescued from a house fire has an SpO2 of 99% on a standard two-wavelength pulse oximeter and is confused. How should the reading be interpreted?","opts":["It rules out carbon monoxide poisoning in this patient","It is unreliable with COHb present; measure COHb by CO-oximetry","It shows that supplemental oxygen is not needed at this time","It means the probe is misplaced and should be moved to the ear"],"key":1,"why":"A conventional two-wavelength pulse oximeter is not accurate when carboxyhemoglobin is present. A fingertip pulse CO-oximeter can estimate it, and suspicion should be confirmed with a carboxyhemoglobin level by CO-oximeter on venous or arterial blood.","src":"CDC-CO","origin":"external","cite":"CDC, Clinical Guidance for Carbon Monoxide Poisoning (page dated Aug 21, 2026)","new27":true,"age":"adult"},{"id":"N27-12","sec":"I-D","lvl27":"recall","topic":"Carboxyhemoglobin","stem":"Which carboxyhemoglobin level strongly supports a diagnosis of carbon monoxide poisoning in a non-smoker?","opts":["Any measurable level","More than 2%","More than 9%","More than 25%"],"key":1,"why":"A carboxyhemoglobin level above 2% in non-smokers, or above 9% in smokers, strongly supports the diagnosis. Levels correlate poorly with severity, so symptoms and exposure history guide treatment.","src":"CDC-CO","origin":"external","cite":"CDC, Clinical Guidance for Carbon Monoxide Poisoning (page dated Aug 21, 2026)","new27":true,"age":"adult"},{"id":"N27-13","sec":"I-D","lvl27":"integ","topic":"SpO2/FiO2 ratio","stem":"A patient on high-flow nasal oxygen at 40 L/min and FiO2 0.40 has an SpO2 of 92%. No arterial sample is available. Under the global definition of ARDS, the oxygenation criterion is:","opts":["Met, because the SpO2/FiO2 of 230 is ≤ 315","Not met, because a PaO2 is required to judge it","Not met, because the SpO2 is below 97%","Not judged, because the patient is on high-flow O2"],"key":0,"why":"An SpO2/FiO2 ratio of 315 or less may be used in place of a PaO2/FiO2 of 300 or less when the SpO2 is 97% or less. Non-intubated ARDS can be diagnosed on high-flow nasal oxygen of at least 30 L/min.","src":"ARDS2024","origin":"external","cite":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","new27":true,"age":"adult"},{"id":"N27-14","sec":"I-D","lvl27":"recall","topic":"SpO2/FiO2 ratio","stem":"The SpO2/FiO2 ratio is not valid for judging oxygenation when the SpO2 is above:","opts":["88%","92%","97%","80%"],"key":2,"why":"The SpO2/FiO2 ratio is used only when the SpO2 is 97% or less.","src":"ARDS2024","origin":"external","cite":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","new27":true,"age":"adult"},{"id":"N27-15","sec":"III-D","lvl27":"recall","topic":"Biologics for asthma","stem":"Dupilumab (Dupixent) is best described as:","opts":["An inhaled long-acting bronchodilator taken twice daily by MDI","An IL-4 receptor alpha antagonist given by subcutaneous injection","An oral leukotriene modifier taken once daily at bedtime","An inhaled corticosteroid given twice daily by dry-powder inhaler"],"key":1,"why":"Dupilumab is an interleukin-4 receptor alpha antagonist administered by subcutaneous injection.","src":"DUPI","origin":"external","cite":"Dupixent (dupilumab) US prescribing information, revised 04/2026","new27":true,"age":"adult"},{"id":"N27-16","sec":"III-D","lvl27":"integ","topic":"Biologics for asthma","stem":"A patient who receives dupilumab injections for asthma asks whether to take an extra injection when wheezing starts. The best answer is:","opts":["Yes; it relieves wheezing within minutes","No; it is add-on maintenance, not a rescue drug","Yes; but only for wheezing that occurs at night","No; it must be stopped for good after any wheeze"],"key":1,"why":"Dupilumab is an add-on maintenance treatment and is not for the relief of acute bronchospasm or status asthmaticus.","src":"DUPI","origin":"external","cite":"Dupixent (dupilumab) US prescribing information, revised 04/2026","new27":true,"age":"adult"},{"id":"N27-17","sec":"III-D","lvl27":"recall","topic":"CFTR modulators","stem":"Elexacaftor/tezacaftor/ivacaftor (Trikafta) should be taken:","opts":["On an empty stomach","With fat-containing food","Only at bedtime","Dissolved in hypertonic saline and nebulized"],"key":1,"why":"The label directs that it be taken with fat-containing food, in the morning and evening about 12 hours apart.","src":"TRIK","origin":"external","cite":"Trikafta (elexacaftor/tezacaftor/ivacaftor) US label, DailyMed, Highlights revised 3/2026","new27":true,"age":"adult"},{"id":"N27-18","sec":"III-D","lvl27":"integ","topic":"CFTR modulators","stem":"A patient with cystic fibrosis is starting elexacaftor/tezacaftor/ivacaftor. Which monitoring does the label call for?","opts":["Liver function tests before starting and at set intervals","Daily fingerstick blood glucose for the first 6 months","Weekly arterial blood gases for the first 3 months","Serum drug levels before each dose for the first year"],"key":0,"why":"The label carries a boxed warning for liver injury: liver tests are checked before starting, monthly for the first 6 months, every 3 months for the next 12 months, and at least annually after that.","src":"TRIK","origin":"external","cite":"Trikafta (elexacaftor/tezacaftor/ivacaftor) US label, DailyMed, Highlights revised 3/2026","new27":true,"age":"adult"},{"id":"N27-19","sec":"III-D","lvl27":"recall","topic":"CFTR modulators","stem":"In the triple combination CFTR modulator, which component is the potentiator that increases channel opening?","opts":["Elexacaftor","Tezacaftor","Ivacaftor","Dornase alfa"],"key":2,"why":"Ivacaftor potentiates channel opening of CFTR at the cell surface; elexacaftor and tezacaftor increase the amount of CFTR that reaches the cell surface.","src":"TRIK","origin":"external","cite":"Trikafta (elexacaftor/tezacaftor/ivacaftor) US label, DailyMed, Highlights revised 3/2026","new27":true,"age":"adult"},{"id":"N27-20","sec":"III-D","lvl27":"recall","topic":"Antifibrinolytics","stem":"Tranexamic acid, which has been given by nebulizer to control hemoptysis, belongs to which drug class?","opts":["Anticoagulant","Antifibrinolytic","Mucolytic agent","Bronchodilator"],"key":1,"why":"Tranexamic acid is an antifibrinolytic drug. In a randomized trial it was nebulized at 500 mg three times daily for hemoptysis.","src":"TXA","origin":"external","cite":"Wand O et al. Inhaled Tranexamic Acid for Hemoptysis Treatment. Chest 2018;154(6):1379-1384","new27":true,"age":"adult"},{"id":"N27-21","sec":"III-D","lvl27":"integ","topic":"Antifibrinolytics","stem":"A physician cites a randomized trial of nebulized tranexamic acid when planning care for a patient who has coughed up about 400 mL of blood in 24 hours and is hypotensive. What should the respiratory therapist point out?","opts":["The trial showed that it works best in massive hemoptysis","The trial studied non-massive bleeding and excluded unstable patients","The trial used an intravenous dose of the drug and not a nebulized one","The trial found no benefit in any group of patients it studied"],"key":1,"why":"The trial of nebulized tranexamic acid (500 mg three times daily) enrolled patients with non-massive hemoptysis and excluded massive hemoptysis (more than 200 mL/24 h) and hemodynamic or respiratory instability. In that group hemoptysis resolved within 5 days in 96% versus 50% with saline.","src":"TXA","origin":"external","cite":"Wand O et al. Inhaled Tranexamic Acid for Hemoptysis Treatment. Chest 2018;154(6):1379-1384","new27":true,"age":"adult"},{"id":"N27-22","sec":"III-E","lvl27":"integ","topic":"Carbon monoxide poisoning","stem":"A patient with confirmed carbon monoxide poisoning is alert with a headache. What oxygen therapy should be recommended?","opts":["Nasal cannula at 2 L/min for 30 minutes, then room air","100% O2 until symptom-free, usually about 4–5 hours","Room air with neurologic checks every hour for 12 hours","28% O2 by air-entrainment mask for the next 24 hours"],"key":1,"why":"CDC guidance is to administer 100% oxygen until the patient is symptom-free, usually about 4-5 hours, with serial neurologic exams.","src":"CDC-CO","origin":"external","cite":"CDC, Clinical Guidance for Carbon Monoxide Poisoning (page dated Aug 21, 2026)","new27":true,"age":"adult"},{"id":"N27-23","sec":"III-E","lvl27":"integ","topic":"Carbon monoxide poisoning","stem":"Which patient with carbon monoxide poisoning is the strongest candidate for a hyperbaric oxygen recommendation?","opts":["A non-smoker with a carboxyhemoglobin of 4% and no symptoms","A pregnant woman with confirmed exposure and symptoms","A smoker with a carboxyhemoglobin of 6%","A patient whose headache has resolved on oxygen"],"key":1,"why":"Hyperbaric oxygen is considered for carboxyhemoglobin above 25-30%, cardiac involvement, severe acidosis, unconsciousness or neurological impairment, and is the treatment of choice for pregnant women even when less severely poisoned.","src":"CDC-CO","origin":"external","cite":"CDC, Clinical Guidance for Carbon Monoxide Poisoning (page dated Aug 21, 2026)","new27":true,"age":"adult"},{"id":"N27-24","sec":"III-E","lvl27":"integ","topic":"Biologics for asthma","stem":"A 30-year-old has moderate-to-severe asthma with an eosinophilic phenotype that remains uncontrolled on high-dose inhaled corticosteroid plus a long-acting bronchodilator, with good adherence. Which recommendation fits the labeled use of dupilumab?","opts":["Use it in place of her rescue inhaler","Add it as a maintenance treatment","Give it only during exacerbations","It cannot be used in adults"],"key":1,"why":"Dupilumab is indicated as an add-on maintenance treatment for patients aged 6 years and older with moderate-to-severe asthma that has an eosinophilic phenotype or is oral-corticosteroid-dependent.","src":"DUPI","origin":"external","cite":"Dupixent (dupilumab) US prescribing information, revised 04/2026","new27":true,"age":"adult"},{"id":"N27-25","sec":"III-F","lvl27":"recall","topic":"ARDS guidelines","stem":"Under the global definition of ARDS, a non-intubated patient can meet the definition while receiving high-flow nasal oxygen at a flow of at least:","opts":["10 L/min","20 L/min","30 L/min","60 L/min"],"key":2,"why":"The global definition adds a non-intubated category: high-flow nasal oxygen at 30 L/min or more, or noninvasive ventilation/CPAP with at least 5 cm H2O.","src":"ARDS2024","origin":"external","cite":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","new27":true,"age":"adult"},{"id":"N27-26","sec":"III-F","lvl27":"recall","topic":"ARDS guidelines","stem":"Which imaging method was added by the global definition of ARDS for identifying bilateral lung involvement?","opts":["Ultrasound","PET scan","Ventilation/perfusion scan","Bronchography"],"key":0,"why":"Bilateral opacities may be shown on chest radiograph or CT, or as bilateral B-lines and/or consolidations on ultrasound performed by a trained operator.","src":"ARDS2024","origin":"external","cite":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","new27":true,"age":"adult"},{"id":"N27-27","sec":"III-F","lvl27":"integ","topic":"ARDS guidelines","stem":"An intubated patient on PEEP 8 cm H2O has an SpO2 of 90% on FiO2 0.70. Using the SpO2/FiO2 categories of the global definition, the severity is:","opts":["Mild","Moderate","Severe","Not ARDS"],"key":2,"why":"For intubated patients the SpO2/FiO2 bands are mild 235-315, moderate 148-235 and severe 148 or less (with SpO2 97% or less and PEEP of at least 5 cm H2O). 90 / 0.70 is about 129, which is severe.","src":"ARDS2024","origin":"external","cite":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","new27":true,"age":"adult"},{"id":"N27-28","sec":"III-F","lvl27":"recall","topic":"Neonatal resuscitation guidelines","stem":"Under the 2025 AHA/AAP neonatal resuscitation guideline, chest compressions are started when the heart rate remains below:","opts":["100/min after drying, warming and stimulation","60/min despite 30 s of ventilation that moves the chest","80/min after 2 minutes of free-flow oxygen by mask","120/min at birth, before any ventilation is started"],"key":1,"why":"Chest compressions are recommended if the heart rate remains less than 60/min despite 30 seconds of ventilation that moves the chest; ventilation itself is started for gasping, apnea or a heart rate below 100/min.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","new27":true,"age":"child"},{"id":"N27-29","sec":"III-F","lvl27":"recall","topic":"Neonatal resuscitation guidelines","stem":"During neonatal chest compressions, the recommended ratio of compressions to ventilations is:","opts":["3:1","15:2","30:2","5:1"],"key":0,"why":"The guideline uses 3 compressions followed by 1 ventilation (3:1).","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","new27":true,"age":"child"},{"id":"N27-30","sec":"III-F","lvl27":"integ","topic":"Neonatal resuscitation guidelines","stem":"A team is preparing for the delivery of a 30-week infant. Which statement about the starting oxygen concentration reflects the 2025 guideline?","opts":["Start every newborn on 100% oxygen and wean","21% is for ≥ 35 weeks; < 32 weeks may need 30–100%, titrated","Preterm infants should never receive more than 21% oxygen","Oxygen is set at 40% and not titrated in the delivery room"],"key":1,"why":"Starting concentrations are 21% at 35 weeks or more, 21-30% at 32 to 34+6/7 weeks, and infants under 32 weeks may need 30-100%, always titrated to saturation targets with a pulse oximeter.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","new27":true,"age":"child"},{"id":"N27-31","sec":"III-G","lvl27":"recall","topic":"Closed-loop communication","stem":"In a check-back, the receiver of a verbal order:","opts":["Carries it out without speaking","Repeats it back; the sender confirms it","Writes it down and reads it later","Asks a coworker to confirm it first"],"key":1,"why":"A check-back is a closed-loop strategy: the sender states the message, the receiver repeats it back, and the sender confirms it was understood correctly.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-32","sec":"III-G","lvl27":"integ","topic":"Closed-loop communication","stem":"During a resuscitation the team leader says, 'Respiratory, increase the rate to 20.' Which response is the best example of closed-loop communication?","opts":["Changing the rate to 20 on the ventilator without saying anything","'Increasing the rate to 20,' and the leader says 'Correct'","'OK, got it,' and then changing the rate to 20 on the ventilator","Nodding at the leader and changing the rate to 20 on the ventilator"],"key":1,"why":"Closed-loop communication uses verbal feedback to make sure the message was understood: the receiver repeats the instruction and the sender confirms it.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-33","sec":"III-G","lvl27":"recall","topic":"Team communication","stem":"A call-out during an emergency is used to:","opts":["Page the physician overhead to the bedside","Tell the whole team critical information at once","Document the event in the chart afterward","Request more supplies from central supply"],"key":1,"why":"A call-out communicates important or critical information, informs all team members simultaneously, helps them anticipate next steps, and directs responsibility by name.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-34","sec":"III-G","lvl27":"recall","topic":"Debriefing","stem":"A debrief is best described as:","opts":["A session before the event to share the plan and assign roles","An ad hoc meeting during care to regain situational awareness","A quick structured exchange after the event to learn lessons","A written incident report filed with the risk manager"],"key":2,"why":"A brief is held beforehand to share the plan and assign roles, a huddle is an ad hoc meeting during care, and a debrief f
