atient with severe expiratory airflow obstruction has auto-PEEP and an I:E ratio of 1:2. The first step is to:","opts":["Adjust settings to allow enough time for complete exhalation, decreasing the I:E ratio toward 1:4 or 1:5","Increase the I:E ratio toward 1:1","Add extrinsic PEEP equal to the auto-PEEP","Increase the tidal volume"],"key":0,"why":"Patients with severe expiratory airflow obstruction typically exhibit prolonged E-times and low I:E ratios such as 1:4 or 1:5 during spontaneous breathing. If similar ratios are not provided during mechanical ventilation, air trapping or auto-PEEP occurs. If auto-PEEP is present and the I:E ratio is high (1:1 or 1:2), the first step is to adjust settings to allow enough time for complete exhalation, decreasing the I:E ratio to 1:4 or 1:5. The ratio is decreased by increasing E-time and decreasing I-time.","src":[20186,20195],"id":"C13-Q32"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Mode changes","stem":"A patient on volume-control A/C develops respiratory alkalosis because the total respiratory rate is too high. You should recommend:","opts":["Switching to normal-rate SIMV, adding deadspace, or sedation if the patient is agitated","Increasing the tidal volume","Increasing the set rate on A/C","Switching to pressure support alone"],"key":0,"why":"When full ventilatory support is needed but the total respiratory rate results in hyperventilation (respiratory alkalosis) on A/C mode, switch to volume- or pressure-control normal-rate SIMV, add deadspace, or recommend sedation if the patient is agitated.","src":[20222,20225],"id":"C13-Q33"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Mode changes","stem":"To reduce plateau pressure in an ARDS patient with low lung compliance on volume-control A/C, recommend:","opts":["Switching to pressure control A/C with a maximum PIP of less than 30 cm H₂O","Increasing the inspiratory flow rate","Adding pressure support","Switching to CPAP with pressure support"],"key":0,"why":"To reduce airway pressures (plateau pressure) in patients with low lung compliance such as ARDS on volume-control A/C, switch to pressure control A/C with a maximum peak inspiratory pressure of less than 30 cm H₂O.","src":[20239,20243],"id":"C13-Q34"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Mode changes","stem":"An ARDS patient is failing the NHLBI protocol. You should consider:","opts":["High-frequency ventilation or airway pressure release ventilation (APRV)","Returning to conventional volume control at 10 mL/kg","Discontinuing PEEP","Switching to CPAP alone"],"key":0,"why":"To support ventilation and oxygenation in patients with ARDS when the NHLBI protocol fails, consider a high-frequency ventilation modality or airway pressure release ventilation (APRV).","src":[20245,20249],"given":["10"],"id":"C13-Q35"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Mode changes","stem":"To overcome the imposed work of breathing caused by artificial airways or the ventilator circuit, recommend:","opts":["Adding or increasing pressure support, or implementing automatic tube compensation if available","Increasing PEEP","Increasing the set tidal volume","Switching to pure control mode"],"key":0,"why":"To overcome the imposed work of breathing caused by artificial airways or the ventilator circuit, add or increment the pressure-support level, or implement automatic tube compensation if available.","src":[20227,20231],"id":"C13-Q36"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Post-extubation support","stem":"A patient develops mild to moderate HYPERCAPNIA after extubation. To avoid reintubation, recommend:","opts":["Noninvasive positive-pressure ventilation","A high-flow nasal cannula at 20–40 L/min","A nonrebreathing mask","Immediate reintubation"],"key":0,"why":"To avoid reintubation of patients who develop mild to moderate hypercapnia after extubation, provide NPPV. For those who develop mild to moderate HYPOXEMIA after extubation, recommend a high-flow nasal cannula at 20–40 L/min, titrating FiO₂ as needed.","src":[20256,20262],"id":"C13-Q37"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Recruitment","stem":"\"Open-lung\" recruitment maneuvers for patients at risk of atelectasis may involve periodic PEEP levels as high as:","opts":["20–30 cm H₂O for a short period","10–15 cm H₂O sustained indefinitely","40–50 cm H₂O for 10 minutes","5–10 cm H₂O continuously"],"key":0,"why":"Patients on a ventilator who are particularly at risk for developing atelectasis may be candidates for open-lung techniques such as recruitment maneuvers involving the periodic use of PEEP levels as high as 20–30 cm H₂O for a short period of time.","src":[20292,20295],"given":["10","15","40","50","5"],"id":"C13-Q38"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Bronchopleural fistula","stem":"A patient with a clinically significant bronchopulmonary fistula is not ventilating or oxygenating well on conventional settings. Consider:","opts":["High-frequency ventilation such as HFOV, jet, or percussive ventilation","Increasing tidal volume to 10 mL/kg","Removing all PEEP","Switching to pressure support alone"],"key":0,"why":"Patients with a clinically significant bronchopulmonary fistula who do not ventilate or oxygenate well on other settings may respond well to high-frequency ventilation — HFOV, jet ventilation, or percussive ventilation.","src":[20288,20291],"given":["10"],"id":"C13-Q39"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A COPD patient becomes lethargic and disoriented soon after being placed on a nasal cannula at 5 L/min. You should recommend:","opts":["Reducing input flow to 2 L/min or switching to an air-entrainment system at 24–28% O₂, monitoring closely and notifying the nurse","Increasing the flow to 6 L/min to correct hypoxemia","Switching to a nonrebreathing mask","Discontinuing oxygen entirely"],"key":0,"why":"This is oxygen-induced hypoventilation. Recommend that the input flow be reduced to 2 L/min or switch to an air-entrainment system at 24–28% O₂, continue to monitor the patient closely, and notify the nurse.","src":[19738,19745],"given":["5","6"],"id":"C13-Q40"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A physician orders oxygen via a simple mask at an input flow of 2 L/min for an adult. You should:","opts":["Recommend increasing the flow to a minimum of 5 L/min to ensure CO₂ washout, or change to a nasal cannula","Set it as ordered, since low flows reduce drying","Recommend a nonrebreathing mask instead","Add a bubble humidifier and proceed"],"key":0,"why":"The physician may be unaware of the risk of CO₂ rebreathing at low flows with O₂ masks and enclosure devices. Recommend that the input flow be increased to a minimum of 5 L/min to ensure washout of exhaled CO₂, or change to a nasal cannula device.","src":[19747,19752],"given":["2"],"id":"C13-Q41"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A patient on a simple mask at 10 L/min has a PaO₂ of 212 torr. You should recommend:","opts":["Reducing the FiO₂ — for example, switching to a nasal cannula at about 5 L/min (FiO₂ about 0.40)","Maintaining the current settings","Switching to a nonrebreathing mask","Adding PEEP via mask CPAP"],"key":0,"why":"A PaO₂ of 212 torr means too much FiO₂ is being delivered. Recommend a reduction in FiO₂ — for example, switching to a nasal cannula at about 5 L/min, which gives an FiO₂ of about 0.40.","src":[19781,19784],"given":["10","212"],"id":"C13-Q42"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"After switching an adult from a simple mask to a nonrebreathing mask, the SpO₂ only rises from 83% to 87%. You should consider:","opts":["A high-flow nasal cannula at 20–40 L/min with titrated FiO₂, or mask CPAP with high FiO₂ if alveolar shunting is present","Returning to the simple mask at a higher flow","Reducing the FiO₂ to avoid absorption atelectasis","A nasal cannula at 6 L/min"],"key":0,"why":"A minimal rise reflects an inability to meet high inspiratory flow demands at high FiO₂, or alveolar shunting. Recommend a high-flow nasal cannula at 20–40 L/min, titrating FiO₂ to the desired SpO₂, and consider mask CPAP with high FiO₂ for shunting.","src":[19790,19797],"given":["83","87","6"],"id":"C13-Q43"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A house-fire victim has an SpO₂ of 98% on a nasal cannula at 5 L/min. You should:","opts":["Place the patient on the highest possible FiO₂, usually a nonrebreather, and perform CO-oximetry; consider hyperbaric oxygen","Leave the cannula in place, since the SpO₂ is normal","Reduce the flow to avoid oxygen toxicity","Obtain a chest x-ray before changing therapy"],"key":0,"why":"SpO₂ cannot detect carboxyhemoglobin saturations in suspected smoke inhalation victims. Place the patient in the highest possible FiO₂ — usually a nonrebreather mask — and perform a CO-oximetry test. Consider hyperbaric oxygen therapy if available.","src":[19833,19838],"given":["98","5"],"id":"C13-Q44"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A chest x-ray shows atelectasis in a patient receiving a high FiO₂. The likely cause and correction are:","opts":["Nitrogen-washout atelectasis — use the lowest possible FiO₂ and implement alveolar recruitment techniques","Secretion plugging — increase suctioning frequency","Overhydration — begin diuretics","Air trapping — decrease the I:E ratio"],"key":0,"why":"Signs of atelectasis on chest x-ray in a patient receiving a high FiO₂ suggest nitrogen-washout atelectasis. Use the lowest possible FiO₂ and implement alveolar recruitment techniques.","src":[19840,19842],"id":"C13-Q45"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"An air-entrainment aerosol mask is delivering a HIGHER FiO₂ than set. Likely causes include:","opts":["Obstruction of the entrainment ports by bedding or clothing, or condensate rainout in the tubing","Insufficient input flow from the flowmeter","A leak in the aerosol tubing","A patient with a high minute ventilation"],"key":0,"why":"An air-entrainment aerosol mask delivering a higher FiO₂ than set is caused by obstruction of the entrainment ports with bedding, clothing, or other items — remove obstructions and monitor the patient — or obstruction from condensate rainout in the tubing, for which a water trap is recommended.","src":[19804,19814],"id":"C13-Q46"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A physician orders a nonrebreathing mask for a code blue patient in respiratory arrest. You should:","opts":["Immediately recommend a bag-valve-mask, because nonrebreathing masks do not provide ventilation","Apply the nonrebreathing mask at 15 L/min as ordered","Apply a high-flow nasal cannula at 40 L/min","Apply CPAP at 10 cm H₂O"],"key":0,"why":"Nonrebreathing masks do not provide additional ventilation. Immediately recommend a bag-valve-mask that can provide 100% O₂ and can be used to ventilate the patient effectively.","src":[19822,19825],"given":["15","40","10"],"id":"C13-Q47"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A patient with a high or unstable minute ventilation on a nasal cannula at 2 L/min requires an FiO₂ of 0.28. You should recommend:","opts":["A high-flow device such as a 28% air-entrainment mask, which meets inspiratory flow needs and maintains a stable FiO₂","Increasing the cannula to 4 L/min","Adding a bubble humidifier to the cannula","A partial rebreathing mask at 8 L/min"],"key":0,"why":"A standard nasal cannula is not suitable for patients with high or variable minute volume. Recommend a high-flow device such as a 28% air-entrainment mask, which can meet the patient's inspiratory flow needs and maintain a stable FiO₂.","src":[19762,19767],"given":["2","0.28","4","8"],"id":"C13-Q48"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Oxygen therapy modification","stem":"A patient on a 40% air-entrainment system has an SpO₂ of 89%. Possible causes and fixes include:","opts":["Insufficient FiO₂ — raise it; or insufficient device flow — add a second nebulizer in tandem or bleed in supplemental O₂","Excessive flow — reduce the flowmeter setting","Too much humidity — remove the nebulizer","Obstructed entrainment ports — the FiO₂ is too high"],"key":0,"why":"An SpO₂ of 89% on a 40% air-entrainment system reflects either insufficient FiO₂ to correct the hypoxemia — increase it and monitor closely — or insufficient device flow to meet inspiratory demand and maintain a stable FiO₂, for which you add a second aerosol nebulizer in tandem or bleed in supplemental O₂ to increase total output flow.","src":[19769,19779],"given":["40","89"],"id":"C13-Q49"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Humidification modification","stem":"A patient develops mild stridor after extubation. The cause and recommendation are:","opts":["Subglottic tissue edema from the ETT cuff — provide cool aerosol therapy via an aerosol mask","Retained secretions — increase suctioning","Bronchospasm — give a bronchodilator","Pulmonary edema — apply CPAP"],"key":0,"why":"Mild stridor after extubation is caused by subglottic tissue edema from the endotracheal tube cuff. Provide cool aerosol therapy via an aerosol mask.","src":[19886,19890],"id":"C13-Q50"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Neonatal oxygen therapy","stem":"An infant's SpO₂ on nasal-prong CPAP drops during episodes of crying. You should:","opts":["Collaborate with the nurse to address reasons for crying; if it continues, consider an enclosure such as an oxyhood at the same FiO₂","Immediately increase the CPAP pressure","Sedate the infant","Switch to a nasal cannula at the same flow"],"key":0,"why":"The SpO₂ drop reflects a decrease in FiO₂ due to mouth breathing associated with crying. Collaborate with the nurse to address reasons for crying such as hunger. If crying and the SpO₂ decrease continue, consider an enclosure such as an oxyhood with the same FiO₂.","src":[19858,19865],"id":"C13-Q51"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Pharmacologic recommendations","stem":"For acute airway obstruction associated with asthma, the recommended drug therapy is:","opts":["A short-acting β-agonist such as albuterol, considering continuous nebulization and systemic steroids such as prednisone","A long-acting β-agonist alone","A leukotriene inhibitor such as montelukast","A mast-cell stabilizer such as cromolyn sodium"],"key":0,"why":"For acute airway obstruction associated with asthma or a similar condition — the reliever scenario — recommend a short-acting β-agonist such as albuterol, and consider continuous nebulization and systemic steroids such as prednisone. LABAs, leukotriene inhibitors, and mast-cell stabilizers are controllers for long-term management.","src":[20316,20330],"id":"C13-Q52"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Pharmacologic recommendations","stem":"A patient with cystic fibrosis has retained, thick, tenacious secretions. Appropriate recommendations include:","opts":["Acetylcysteine, dornase alpha, or hypertonic saline 3–7%","A long-acting anticholinergic","A leukotriene inhibitor","An inhaled corticosteroid alone"],"key":0,"why":"For retained, thick or tenacious secretions, recommend acetylcysteine (Mucomyst), dornase alpha (Pulmozyme), or hypertonic saline 3–7% (Hypersal) if cystic fibrosis or bronchiectasis is present. An aerosolized treatment with 3–10% hypertonic saline is used to increase the volume of a sputum specimen.","src":[20354,20361],"id":"C13-Q53"},{"ch":13,"sec":"III-E","lvl":"analysis","topic":"Discontinuing therapy","stem":"A postoperative patient on incentive spirometry can now achieve an inspiratory capacity at or near predicted and has a clear chest x-ray. You should:","opts":["Discontinue the therapy, because the goals of therapy have been achieved","Continue for another 48 hours as a precaution","Switch to IPPB to maintain the gains","Increase the frequency to consolidate the improvement"],"key":0,"why":"The RT should terminate or recommend discontinuing therapy when the goals or objectives of the therapy have been achieved. If a post-op patient receiving incentive spirometry can achieve an inspiratory capacity at or near predicted and the chest x-ray is clear, the therapy is no longer needed and should be discontinued.","src":[19151,19154],"given":["48"],"id":"C13-Q54"},{"id":"C14-Q01","ch":14,"sec":"III-F","lvl":"application","topic":"Evidence hierarchy","stem":"Which research design provides the STRONGEST evidence?","opts":["A meta-analysis","A randomized controlled trial","A cohort study","An expert panel report"],"key":0,"why":"The research hierarchy places the strongest evidence at the top. A meta-analysis thoroughly examines several valid studies on a topic and mathematically combines the results using accepted statistical methodology, reporting them as if one large study. Below it come systematic reviews, RCTs, cohort studies, case-control studies, and expert panels.","src":[[20857,20891]]},{"id":"C14-Q02","ch":14,"sec":"III-F","lvl":"application","topic":"Evidence hierarchy","stem":"Which statement best describes a cohort study?","opts":["It identifies patients already undergoing a treatment or exposure, follows them forward, and compares outcomes with a similar unaffected group","It compares patients who already have a condition with people who do not, looking back for associated factors","It introduces a treatment to study its effect on real patients","It mathematically combines several valid studies into one large result"],"key":0,"why":"Cohort studies identify a group of patients already undergoing a particular treatment or exposure, follow them forward over time, and compare their outcomes with a similar group not affected. They are observational and not as reliable as RCTs because the two groups may differ in ways other than the variable under study.","src":[[20875,20880]]},{"id":"C14-Q03","ch":14,"sec":"III-F","lvl":"application","topic":"Evidence hierarchy","stem":"Why are case-control studies generally less reliable than RCTs and cohort studies?","opts":["They rely on medical records and patient recall, and showing a statistical relationship does not mean one factor caused the other","They cannot include a control group","They are always too small to reach significance","They are conducted only by expert panels"],"key":0,"why":"Case-control studies compare patients who already have a specific condition with people who do not, looking back to identify associated factors or exposures. They often rely on medical records and patient recall for data collection, and are less reliable than RCTs and cohort studies because showing a statistical relationship does not mean that one factor necessarily caused the other.","src":[[20881,20887]]},{"id":"C14-Q04","ch":14,"sec":"III-F","lvl":"application","topic":"Evidence hierarchy","stem":"What limits the value of expert panel reports as evidence?","opts":["Subjectivity in defining who the actual experts are, and potential biases","They cannot address clinical topics","They are never published in peer-reviewed form","They require randomization that is rarely feasible"],"key":0,"why":"Expert panels report the professional opinion of a group of recognized experts in a particular clinical area. Although potentially useful, the subjectivity associated with defining who the actual experts are, and potential biases, limit their value.","src":[[20888,20891]]},{"id":"C14-Q05","ch":14,"sec":"III-F","lvl":"application","topic":"ARDSNet criteria","stem":"Which set of findings indicates that the ARDSNet protocol should be considered?","opts":["P/F ratio \u003c 300, bilateral diffuse infiltrates consistent with pulmonary edema, and no clinical evidence of left atrial hypertension or LV failure","P/F ratio \u003c 200 with unilateral infiltrates and elevated PAWP","Any patient requiring an FiO₂ above 0.50","Bilateral infiltrates with clinical evidence of left ventricular failure"],"key":0,"why":"Consider implementing the ARDSNet protocol for any patient with an acute onset of respiratory failure who has a P/F ratio below 300, bilateral diffuse infiltrates on x-ray consistent with pulmonary edema, and no clinical evidence of left atrial hypertension or left ventricular failure.","src":[[21218,21223]],"given":["200","0.50"]},{"id":"C14-Q06","ch":14,"sec":"III-F","lvl":"application","topic":"Asthma guidelines","stem":"Under NAEPP EPR-3 guidelines, how often should lung function be measured by spirometry in a patient with asthma?","opts":["At least every 1–2 years, and more frequently if asthma is not well controlled","Only at the initial diagnostic visit","Every 5 years","At every visit without exception"],"key":0,"why":"Obtain lung function measured by spirometry at least every 1–2 years, and more frequently for asthma that is not well controlled. At each visit assess asthma control, medication technique, the written asthma action plan, adherence, and patient concerns.","src":[[21020,21026]],"given":["5"]},{"id":"C14-Q07","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under the ARDSNet protocol, the initial tidal volume is set at what value, and how is it reduced?","opts":["8 mL/kg PBW initially, reduced by 1 mL/kg at intervals ≤ 2 hours until 6 mL/kg PBW","6 mL/kg PBW initially, increased to 8 mL/kg if tolerated","10 mL/kg PBW initially, reduced by 2 mL/kg every 4 hours","4 mL/kg PBW initially, held constant"],"key":0,"why":"Calculate PBW, select any mode while trying to ensure an I:E of 1:1 or less, set the initial VT to 8 mL/kg PBW, then reduce VT by 1 mL/kg at intervals of 2 hours or less until VT equals 6 mL/kg PBW.","src":[[21227,21233]],"given":["10","4"]},{"id":"C14-Q08","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"The ARDSNet oxygenation goal is to maintain:","opts":["PaO₂ between 55 and 80 torr or SpO₂ between 88% and 95%, using PEEP of at least 5–8 cm H₂O","PaO₂ between 80 and 100 torr or SpO₂ above 95%","PaO₂ above 100 torr with PEEP of at least 10 cm H₂O","SpO₂ above 98% on the lowest possible FiO₂"],"key":0,"why":"To ensure adequate oxygenation the goal is to maintain a PaO₂ between 55 and 80 torr or an SpO₂ between 88% and 95%. To achieve these targets, PEEP levels of at least 5–8 cm H₂O should be used, with incremental FiO₂/PEEP combinations applied from the protocol table.","src":[[21235,21239]],"given":["100","10","98"]},{"id":"C14-Q09","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's plateau pressure is 34 cm H₂O on a VT of 6 mL/kg PBW. You should:","opts":["Decrease VT in 1-mL/kg steps to a minimum of 4 mL/kg","Increase VT by 1 mL/kg","Leave VT unchanged and increase PEEP","Increase the rate to 35/min"],"key":0,"why":"Keep the plateau pressure at 30 cm H₂O or less, measuring it every 4 hours and after each change in PEEP or VT. If Pplat exceeds 30 cm H₂O, decrease VT in 1-mL/kg steps to a minimum of 4 mL/kg.","src":[[21240,21244]],"given":["34","6","35"]},{"id":"C14-Q10","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's plateau pressure is 22 cm H₂O on a VT of 5 mL/kg PBW. You should:","opts":["Increase VT by 1 mL/kg until Pplat exceeds 25 cm H₂O or VT reaches 6 mL/kg","Decrease VT by 1 mL/kg","Leave the settings unchanged","Decrease PEEP by 2 cm H₂O"],"key":0,"why":"If Pplat is below 25 cm H₂O and VT is below 6 mL/kg, increase VT by 1 mL/kg until Pplat exceeds 25 cm H₂O or VT reaches 6 mL/kg.","src":[[21245,21246]],"given":["22","5","2"]},{"id":"C14-Q11","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under ARDSNet, breath stacking and dyssynchrony occur while Pplat is 27 cm H₂O. You may:","opts":["Consider increasing VT in 1-mL/kg steps to 7–8 mL/kg, provided Pplat remains below 30 cm H₂O","Decrease VT to 4 mL/kg immediately","Paralyze the patient and leave VT unchanged","Increase PEEP to 15 cm H₂O"],"key":0,"why":"If Pplat is below 30 cm H₂O and breath stacking or dyssynchrony occurs, consider increasing VT in 1-mL/kg steps to 7–8 mL/kg as long as Pplat remains below 30 cm H₂O.","src":[[21247,21248]],"given":["27","4","15"]},{"id":"C14-Q12","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under ARDSNet, the acid-base goal is to keep the pH between:","opts":["7.30 and 7.45","7.35 and 7.45","7.25 and 7.35","7.15 and 7.30"],"key":0,"why":"In terms of acid-base balance, the ARDSNet goal is to keep the pH between 7.30 and 7.45. If the pH rises above 7.45, which is rare, decrease the ventilator rate.","src":[[21250,21251]]},{"id":"C14-Q13","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDSNet protocol","stem":"Under ARDSNet, a patient's pH is 7.22. You should:","opts":["Increase the rate until pH exceeds 7.30 or PaCO₂ falls below 25, to a maximum rate of 35/min","Increase the rate directly to 35/min","Increase VT in 1-mL/kg steps immediately","Administer sodium bicarbonate before any rate change"],"key":0,"why":"If the pH is above 7.15 but below 7.30, increase the rate until the pH exceeds 7.30 or the PaCO₂ falls below 25, with a maximum rate of 35/min. If the pH is below 7.15, increase the rate to 35/min; and if the rate is already 35/min with a pH below 7.15, increase VT in 1-mL/kg steps until pH exceeds 7.15 — the Pplat target may be exceeded — and consider sodium bicarbonate.","src":[[21254,21258]],"given":["7.22"]},{"id":"C14-Q14","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDS weaning","stem":"Which set of criteria indicates readiness for a spontaneous breathing trial under the NHLBI ARDS protocol?","opts":["FiO₂ ≤ 0.40 and PEEP ≤ 8, or FiO₂ ≤ 0.50 and PEEP ≤ 5; settings no higher than the previous day; acceptable spontaneous efforts; systolic BP ≥ 90 without vasopressors; no neuromuscular blockade","FiO₂ ≤ 0.60 and PEEP ≤ 10, with any blood pressure","Any patient breathing spontaneously for 24 hours","FiO₂ ≤ 0.21 with no PEEP and a normal chest x-ray"],"key":0,"why":"Readiness criteria are FiO₂ of 0.40 or less with PEEP of 8 cm H₂O or less, or FiO₂ of 0.50 or less with PEEP of 5 cm H₂O or less; PEEP and FiO₂ no higher than the previous day's settings; acceptable spontaneous breathing efforts, detected by reducing the vent rate by 50% for 5 minutes; systolic BP of 90 mm Hg or more without vasopressors; and no neuromuscular blocking agents or blockade.","src":[[21269,21274]],"given":["0.60","10","24","0.21"]},{"id":"C14-Q15","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDS weaning","stem":"During an ARDS-protocol spontaneous breathing trial, which finding indicates the trial should be STOPPED?","opts":["Two or more of: HR > 120% of baseline, marked accessory muscle use, abdominal paradox, diaphoresis, marked dyspnea","A spontaneous VT of 5 mL/kg PBW","A respiratory rate of 30/min","A pH of 7.34"],"key":0,"why":"The trial is tolerated when SpO₂ is 90% or more with PaO₂ of 60 mm Hg or more, spontaneous VT is at least 4 mL/kg PBW, respiratory rate is 35/min or less, pH is 7.30 or more, and there is no respiratory distress. Distress is defined as two or more of: HR above 120% of baseline, marked accessory muscle use, abdominal paradox, diaphoresis, and marked dyspnea.","src":[[21282,21292]],"given":["5","30","7.34"]},{"id":"C14-Q16","ch":14,"sec":"III-F","lvl":"analysis","topic":"ARDS weaning","stem":"A patient tolerates the ARDS-protocol spontaneous breathing trial for 35 minutes. You should:","opts":["Consider extubation","Continue the trial for a full 4 hours","Resume pre-weaning settings and retry tomorrow","Reduce PEEP to 3 cm H₂O and continue"],"key":0,"why":"The trial is conducted on a T-piece, trach collar, or CPAP of 5 cm H₂O or less with PS below 5 cm H₂O. If tolerated for at least 30 minutes, consider extubation. If not tolerated, resume pre-weaning settings.","src":[[21279,21293]],"given":["35","4","3"]},{"id":"C14-Q17","ch":14,"sec":"III-F","lvl":"analysis","topic":"Asthma self-management","stem":"Under NAEPP guidelines, a patient using a short-acting β-agonist more than 2 days per week (other than for exercise-induced asthma) indicates:","opts":["The patient may need to start or increase long-term control medications","The SABA dose should be doubled","The patient is well controlled","Long-term control medication should be discontinued"],"key":0,"why":"Quick-relief medications (SABAs) relax airway muscles for fast symptom relief but do not provide long-term control. If used more than 2 days per week — except as needed for exercise-induced asthma — the patient may need to start or increase long-term control medications. Inhaled corticosteroids are the most effective long-term control therapy.","src":[[21062,21067],[21039,21039]]},{"id":"C14-Q18","ch":14,"sec":"III-F","lvl":"analysis","topic":"Exercise-induced bronchospasm","stem":"Why is frequent or chronic use of a LABA to prevent exercise-induced bronchospasm discouraged?","opts":["It may disguise poorly controlled persistent asthma","It causes tolerance to short-acting agents within days","It has no protective effect against EIB","It is contraindicated during physical activity"],"key":0,"why":"Teach patients to take treatment before exercise; SABAs prevent EIB in most patients, and leukotriene receptor antagonists, cromolyn, or LABAs are also protective. However, frequent or chronic use of LABAs to prevent EIB is discouraged because it may disguise poorly controlled persistent asthma. EIB is often a marker of inadequate asthma control and responds well to regular anti-inflammatory therapy.","src":[[21134,21142]]},{"id":"C15-Q01","ch":15,"sec":"III-G","lvl":"application","topic":"Basic life support","stem":"The key steps in basic life support now follow which sequence?","opts":["CABD — circulation, airway, breathing, defibrillation","ABCD — airway, breathing, circulation, defibrillation","DABC — defibrillation, airway, breathing, circulation","BACD — breathing, airway, circulation, defibrillation"],"key":0,"why":"The key steps in BLS now follow a CABD sequence, standing for circulation–airway–breathing–defibrillation. The NBRC exam counts on your current BLS certification to apply this knowledge to any patient scenario requiring basic life support.","src":[[21477,21480]]},{"id":"C15-Q02","ch":15,"sec":"III-G","lvl":"application","topic":"Pulseless rhythms","stem":"The four cardiac dysrhythmias producing pulselessness in adults are:","opts":["Ventricular fibrillation, ventricular tachycardia, pulseless electrical activity, and asystole","Atrial fibrillation, atrial flutter, heart block, and asystole","Sinus bradycardia, sinus tachycardia, PVCs, and PACs","Ventricular fibrillation, atrial fibrillation, asystole, and first-degree block"],"key":0,"why":"The most common adult cardiopulmonary emergencies stem from one of four cardiac dysrhythmias that produce pulselessness: ventricular fibrillation, ventricular tachycardia, pulseless electrical activity, and asystole.","src":[[21501,21504]]},{"id":"C15-Q03","ch":15,"sec":"III-G","lvl":"application","topic":"ACLS drugs","stem":"The initial adult IV dose of epinephrine during cardiac arrest is:","opts":["1 mg every 3–5 minutes with flush","0.5 mg every 3–5 minutes up to 3 mg/kg","300 mg rapid infusion","1.0–1.5 mg/kg"],"key":0,"why":"Epinephrine is given as 1 mg every 3–5 minutes with flush; it is a vasoconstrictor that may improve cerebral perfusion. Atropine is 0.5 mg every 3–5 minutes up to a maximum of 3 mg/kg, amiodarone is 300 mg rapid infusion, and lidocaine is 1.0–1.5 mg/kg initially.","src":[[21534,21545]]},{"id":"C15-Q04","ch":15,"sec":"III-G","lvl":"application","topic":"ACLS drugs","stem":"When an ACLS medication must be instilled via endotracheal tube because IV/IO access is unavailable, you should:","opts":["Double the dose and follow with 10 mL of normal saline","Halve the dose and follow with 5 mL of sterile water","Use the same dose with no flush","Dilute the dose in 50 mL of saline"],"key":0,"why":"Certain medications — epinephrine, atropine, and lidocaine — may be instilled via ETT if IV or IO access is not established. In such cases it is recommended that the dose be doubled and followed with the instillation of 10 mL of normal saline.","src":[[21547,21550]],"given":["5","50"]},{"id":"C15-Q05","ch":15,"sec":"III-G","lvl":"application","topic":"Defibrillation","stem":"The initial biphasic defibrillation dose for an ADULT is:","opts":["120–200 J, or as recommended by the manufacturer","2 J/kg","360 J","4 J/kg"],"key":0,"why":"For biphasic defibrillators, the initial adult dose is 120–200 J or as recommended by the manufacturer, with subsequent doses the same (higher energy levels may be considered). For children the initial dose is 2 J/kg with subsequent doses of at least 4 J/kg. For older monophasic devices, apply 360 J to adults and 2 J/kg to children.","src":[[21556,21568]]},{"id":"C15-Q06","ch":15,"sec":"III-G","lvl":"application","topic":"Neonatal resuscitation","stem":"For preterm newborns less than 35 weeks' gestation, resuscitation should begin with:","opts":["Low O₂ of 21–30%, titrated to targeted preductal SpO₂ ranges","100% O₂ until the heart rate normalizes","60% O₂ regardless of gestational age","Room air with no titration"],"key":0,"why":"Babies who are flaccid, cyanotic, or apneic in the delivery room usually require stimulation and supplemental O₂. For preterm newborns under 35 weeks of gestation, low O₂ of 21–30% should be used and titrated to achieve preductal SpO₂ ranges from the protocol table.","src":[[21635,21640]],"given":["100","60"]},{"id":"C15-Q07","ch":15,"sec":"III-G","lvl":"analysis","topic":"CPR quality","stem":"During CPR the PetCO₂ is 8 mm Hg and the intra-arterial diastolic pressure is 16 mm Hg. This indicates:","opts":["The quality of CPR should be improved","Return of spontaneous circulation has occurred","Resuscitation should be terminated immediately","Ventilation is excessive and should be reduced"],"key":0,"why":"Capnography is recommended as a standard of care during resuscitation because it assesses both the adequacy of ventilation and the effectiveness of cardiac compressions. If the PetCO₂ is less than 10 mm Hg and the intra-arterial diastolic pressure is less than 20 mm Hg, the quality of CPR should be improved.","src":[[21591,21595]],"given":["8","16"]},{"id":"C15-Q08","ch":15,"sec":"III-G","lvl":"analysis","topic":"Terminating resuscitation","stem":"Which capnography finding can be used as an indicator to terminate resuscitative efforts?","opts":["Failure to achieve a PetCO₂ greater than 10 mm Hg after 20 minutes of CPR","A PetCO₂ above 40 mm Hg at any point","Any PetCO₂ reading below 35 mm Hg","A PetCO₂ that rises suddenly during compressions"],"key":0,"why":"Failure to achieve a PetCO₂ greater than 10 mm Hg after 20 minutes of CPR can be used as an indicator to terminate resuscitative efforts. A sudden rise in PetCO₂ instead suggests return of spontaneous circulation.","src":[[21596,21597]],"given":["40","35"]},{"id":"C15-Q09","ch":15,"sec":"III-G","lvl":"analysis","topic":"Reversible causes","stem":"Which set represents the \"5 Hs\" of reversible causes of cardiac arrest?","opts":["Hypovolemia, hypoxia, hydrogen ion (acidosis), hypo-/hyperkalemia, hypothermia","Hypertension, hypoxia, hyperglycemia, hypothermia, hemorrhage","Hypovolemia, hypercapnia, hyperthermia, hypoglycemia, hemothorax","Hypoxia, hypotension, hyperkalemia, hepatic failure, hypothermia"],"key":0,"why":"The 5 Hs are hypovolemia, hypoxia, hydrogen ion (acidosis), hypo- or hyperkalemia, and hypothermia. The 5 Ts are tension pneumothorax, cardiac tamponade, toxins, pulmonary thrombosis, and cardiac thrombosis.","src":[[21603,21613]]},{"id":"C15-Q10","ch":15,"sec":"III-G","lvl":"analysis","topic":"Reversible causes","stem":"Which set represents the \"5 Ts\" of reversible causes of cardiac arrest?","opts":["Tension pneumothorax, cardiac tamponade, toxins, pulmonary thrombosis, cardiac thrombosis","Tachycardia, tamponade, trauma, toxins, thrombosis","Tension pneumothorax, tracheal obstruction, trauma, toxins, thyrotoxicosis","Tamponade, thrombosis, tachyarrhythmia, tension pneumothorax, transfusion reaction"],"key":0,"why":"The 5 Ts are tension pneumothorax, cardiac tamponade, toxins such as drug overdose and anaphylactic reactions, pulmonary thrombosis (pulmonary emboli), and cardiac thrombosis (myocardial infarction or ischemia).","src":[[21609,21613]]},{"id":"C15-Q11","ch":15,"sec":"III-G","lvl":"analysis","topic":"Neonatal resuscitation","stem":"If color, heart rate, and breathing are not restored within 30 seconds after birth, you should:","opts":["Provide manual positive-pressure ventilation via face mask, with PEEP of 5 cm H₂O or less","Begin chest compressions immediately","Administer epinephrine and intubate","Continue stimulation for another 60 seconds"],"key":0,"why":"If color, heart rate, and breathing are not restored within 30 seconds after birth, provide manual positive-pressure ventilation via face mask. PPV is the most effective intervention in the delivery room for improving outcomes, and can be delivered with a flow-inflating bag, self-inflating bag, or T-piece resuscitator. A PEEP of 5 cm H₂O or less is always recommended.","src":[[21645,21650]],"given":["60"]},{"id":"C15-Q12","ch":15,"sec":"III-G","lvl":"analysis","topic":"Neonatal resuscitation","stem":"A neonate's heart rate is 52/min despite effective positive-pressure ventilation. You should:","opts":["Begin chest compressions, because a heart rate below 60 always requires them in a neonate","Continue PPV alone and reassess in 60 seconds","Administer epinephrine before compressions","Intubate before starting compressions"],"key":0,"why":"A heart rate of less than 60 always requires chest compressions in a neonate. If the infant does not respond to these measures, epinephrine should be administered and intubation with mechanical ventilation considered.","src":[[21688,21690]],"given":["52","60"]},{"id":"C15-Q13","ch":15,"sec":"III-G","lvl":"analysis","topic":"Neonatal SpO₂ targets","stem":"At 5 minutes after birth, the targeted preductal SpO₂ is:","opts":["80–85%","60–65%","70–75%","85–95%"],"key":0,"why":"Targeted preductal SpO₂ after birth rises over time: 60–65% at 1 minute, 65–70% at 2 minutes, 70–75% at 3 minutes, 75–80% at 4 minutes, 80–85% at 5 minutes, and 85–95% at 10 minutes.","src":[[21654,21666]],"given":["5"]},{"id":"C15-Q14","ch":15,"sec":"III-G","lvl":"analysis","topic":"Airway obstruction","stem":"Which findings distinguish COMPLETE from partial airway obstruction?","opts":["Absence of air movement and breath sounds, the universal choking sign, and inability to talk or cough while conscious","Sonorous breathing, stridor, or wheezing with some air movement","Choking, drooling, or gagging with accessory muscle use","Anxiety and agitation with retractions"],"key":0,"why":"Complete airway obstruction shows absence of air movement and breath sounds, severe anxiety and agitation while conscious, the universal choking sign, inability to talk or cough, accessory muscle use, retractions or paradoxical breathing, and eventual lethargy, cyanosis, and unconsciousness. Partial obstruction still has some air movement with sonorous breathing, stridor, or wheezing, plus choking, drooling, or gagging.","src":[[21671,21685]]},{"id":"C15-Q15","ch":15,"sec":"III-G","lvl":"analysis","topic":"Pediatric resuscitation","stem":"How does the PALS pulseless arrest algorithm differ from the adult algorithm?","opts":["The defibrillation shock and medication dosages vary by patient weight","Defibrillation is not used in children","Epinephrine is omitted entirely","Compressions are not performed until an airway is secured"],"key":0,"why":"The PALS algorithm for pulseless arrest is similar to the adult algorithm, with the exception that the defibrillation shock and medication dosages vary by patient weight. One of the most common pediatric emergencies is airway obstruction by a foreign body.","src":[[21623,21629]]},{"id":"C16-Q01","ch":16,"sec":"III-H","lvl":"recall","topic":"Intubation contraindications","stem":"What is the ONLY absolute contraindication to endotracheal intubation?","opts":["A documented DNR/DNI order","Severe airway trauma or obstruction","Head/neck injury requiring cervical spine immobilization","A Mallampati Class 4 airway"],"key":0,"why":"Primary indications for ET intubation include respiratory or cardiac arrest, airway compromise and protection, and invasive ventilatory support. The only absolute contraindication against intubation is a documented do-not-resuscitate/do-not-intubate order. Severe airway trauma, cervical immobilization needs, and a Mallampati Class 4 airway are relative concerns.","src":[[22736,22744]]},{"id":"C16-Q02","ch":16,"sec":"III-H","lvl":"recall","topic":"Difficult airway protocol","stem":"A difficult airway protocol is meant to guide action whenever a trained professional cannot insert an ETT using conventional laryngoscopy in how many attempts?","opts":["Three or fewer","One","Five","Ten"],"key":0,"why":"Difficult airway protocols vary by institution but are all meant to guide action whenever a trained professional experiences difficulty with mask ventilation or cannot quickly insert an ETT using conventional laryngoscopy in three or fewer attempts.","src":[[22749,22753]],"given":["1","5","10"]},{"id":"C16-Q03","ch":16,"sec":"III-H","lvl":"recall","topic":"Difficult airway equipment","stem":"Which device is generally the FIRST option for establishing an airway if endotracheal intubation fails?","opts":["A supraglottic airway such as an LMA, Combitube, or cuffed oropharyngeal airway","A percutaneous cricothyrotomy kit","A retrograde intubation kit","A lighted stylet"],"key":0,"why":"A supraglottic airway — LMA, Combitube, or cuffed oropharyngeal airway — is generally the first option in establishing an airway if ET intubation fails. It can be inserted with the head and neck in a neutral position, but is contraindicated if there is a high risk of aspiration.","src":[[22845,22851]]},{"id":"C16-Q04","ch":16,"sec":"III-H","lvl":"application","topic":"Pre-procedure duties","stem":"Before assisting with any procedure, the RT should:","opts":["Verify and evaluate the order or protocol, review the record for contraindications and consent, wash hands and apply precautions, gather equipment, identify the patient, and take a time-out if appropriate","Gather equipment and begin immediately to avoid delay","Wait for the physician to review the chart","Document the procedure in advance"],"key":0,"why":"Before each procedure: verify, interpret, and evaluate the physician's order or protocol; review the medical record for contraindications, hazards, and informed consent if appropriate; wash hands and apply standard transmission-based precautions; gather all equipment; identify the patient; and take a pre-procedure time-out if appropriate, as for bronchoscopy.","src":[[22706,22712]]},{"id":"C16-Q05","ch":16,"sec":"III-H","lvl":"application","topic":"Assisting with intubation","stem":"Before intubation, the RT should prepare the ETT cuff by:","opts":["Inflating it, checking for leaks, then fully deflating it","Inflating it to 25 cm H₂O and leaving it inflated","Leaving it untouched until after insertion","Filling it with sterile water"],"key":0,"why":"Among the RT's pre-procedure duties is to inflate the ETT cuff, check it for leaks, then fully deflate it — confirming cuff integrity and preparing the tube for insertion.","src":[[22772,22774]],"given":["25"]},{"id":"C16-Q06","ch":16,"sec":"III-H","lvl":"application","topic":"Assisting with intubation","stem":"During intubation, why should dentures or dental appliances be removed beforehand?","opts":["To facilitate laryngoscopy and avoid aspiration of the appliances","To improve mask seal during BVM ventilation","To allow accurate capnography readings","To prevent damage to the laryngoscope blade"],"key":0,"why":"Remove dentures or dental appliances such as bridges if present, in order to facilitate laryngoscopy and avoid aspiration of the appliances.","src":[[22781,22783]]},{"id":"C16-Q07","ch":16,"sec":"III-H","lvl":"application","topic":"Assisting with intubation","stem":"After three unsuccessful intubation attempts, the RT should:","opts":["Recommend proceeding with the institution's difficult airway protocol","Attempt intubation personally","Place the patient on a nonrebreathing mask and wait","Increase the sedation and reattempt"],"key":0,"why":"If three unsuccessful intubation attempts occur, recommend proceeding with the difficult airway protocol, which varies by institution — this ensures patient safety.","src":[[22813,22817]]},{"id":"C16-Q08","ch":16,"sec":"III-H","lvl":"application","topic":"Post-intubation duties","stem":"After intubation, the RT's responsibilities include:","opts":["Noting and marking the ETT insertion depth, securing the tube, ensuring a chest x-ray is obtained, reassessing the patient, and verifying documentation","Leaving the tube unsecured until x-ray confirmation","Waiting 4 hours before reassessing the patient","Documenting only the ventilator settings"],"key":0,"why":"After the procedure: note and mark the ETT insertion depth and secure it; ensure a chest x-ray is obtained and the tube repositioned as needed; reassess the patient's clinical status; suction if necessary; ensure appropriate humidification, ventilation, and oxygenation; and verify that intubation and follow-up orders have been documented in the chart.","src":[[22821,22836]],"given":["4"]},{"id":"C16-Q09","ch":16,"sec":"III-H","lvl":"application","topic":"Airway preparation","stem":"To block the gag reflex in a conscious patient during intubation, you may:","opts":["Spray the pharynx with a local anesthetic such as 2% tetracaine, or nebulize 4% lidocaine via SVN for elective intubation","Administer a neuromuscular blocking agent without sedation","Apply cricoid pressure alone","Hyperventilate the patient with 100% O₂ only"],"key":0,"why":"Once the patient is positioned, clear secretions or vomitus from the pharynx with a Yankauer suction catheter. Spraying the pharynx with a local anesthetic such as 2% tetracaine (Cetacaine) aids intubation in conscious patients by blocking the gag reflex, and for elective intubation you can nebulize a 4% lidocaine solution via a small-volume nebulizer.","src":[[22930,22935]],"given":["100"]},{"id":"C16-Q10","ch":16,"sec":"III-H","lvl":"application","topic":"Difficult airway equipment","stem":"How is the position of a gum elastic bougie confirmed?","opts":["Visually, or by a \"clicking\" feel as the tip moves over the tracheal rings","By a midline glow below the thyroid cartilage","By aspirating air with a syringe","By auscultating the epigastrium"],"key":0,"why":"A gum elastic bougie or ventilating tracheal tube introducer is a long, narrow, flexible plastic rod with an angled tip inserted via laryngoscopy into the trachea. Its position is confirmed visually or via a clicking feel as the tip moves over the tracheal rings. The ETT is then inserted over the introducer, which is withdrawn. A midline glow below the thyroid cartilage instead confirms a lighted stylet.","src":[[22865,22891]]},{"id":"C16-Q11","ch":16,"sec":"III-H","lvl":"application","topic":"Difficult airway equipment","stem":"Percutaneous cricothyrotomy generally requires that the patient be at least what age?","opts":["5 years old","12 years old","1 year old","18 years old"],"key":0,"why":"A percutaneous cricothyrotomy kit punctures the cricothyroid membrane and dilates the opening until it is large enough to place an ETT or trach tube. Patients generally must be at least 5 years old.","src":[[22898,22901]],"given":["12","1","18"]},{"id":"C16-Q12","ch":16,"sec":"III-H","lvl":"application","topic":"Difficult airway equipment","stem":"Why is jet ventilation the surgical airway of choice for children younger than 12 years?","opts":["Their small tracheal diameter makes cricothyrotomy hazardous","It requires no oxygen source","It provides better humidification","It does not require a 50-psi gas source"],"key":0,"why":"A jet ventilation setup provides manually triggered ventilation with 100% O₂ via a ventilating stylet inserted orally or a 13- to 14-gauge angiocath inserted percutaneously into the trachea. It is the surgical airway of choice for children younger than 12 years due to their small tracheal diameter and the resulting hazard of cricothyrotomy.","src":[[22903,22910]],"given":["50","100"]},{"id":"C17-Q01","ch":17,"sec":"III-I","lvl":"recall","topic":"Education sessions","stem":"Educational sessions should be limited to approximately what duration to avoid information overload?","opts":["About 1 hour or less","About 3 hours","About 15 minutes","There is no recommended limit"],"key":0,"why":"Limit educational sessions to about 1 hour or less to avoid information overload. Thoroughly demonstrate all procedures and equipment and request a return demonstration.","src":[[24042,24045]],"given":["3","15"]},{"id":"C17-Q02","ch":17,"sec":"III-I","lvl":"recall","topic":"Infection control at home","stem":"Which water should be used in nebulizers versus humidifiers in the home?","opts":["Sterile water in nebulizers; distilled water is acceptable for humidifiers","Tap water is acceptable for both","Distilled water in nebulizers; tap water for humidifiers","Sterile water for both, with no exceptions"],"key":0,"why":"Sterile water should be used in nebulizers; distilled water is acceptable for humidifiers. Noncritical reusable items such as blood pressure cuffs can be cleaned with a detergent.","src":[[24104,24107]]},{"id":"C17-Q03","ch":17,"sec":"III-I","lvl":"recall","topic":"Equipment reprocessing","stem":"Before disinfection, reusable semicritical items such as nebulizers and breathing circuits should be:","opts":["Scrubbed with detergent to remove organic material, thoroughly washed, rinsed, and allowed to air-dry","Soaked directly in a high-level disinfectant without cleaning","Wiped with alcohol and reused immediately","Autoclaved after every use"],"key":0,"why":"Before disinfection, all reusable semicritical objects — such as nebulizers, breathing circuits, and tracheal airway components — should be scrubbed with detergent to remove organic material, then thoroughly washed, rinsed, and allowed to air-dry.","src":[[24108,24111]]},{"id":"C17-Q04","ch":17,"sec":"III-I","lvl":"application","topic":"Health literacy","stem":"When teaching a patient who may have limited literacy, you should:","opts":["Leave printed \"EZ read\" information with pictures if possible","Provide a detailed written manual only","Rely entirely on verbal instruction with no materials","Ask a family member to read the materials aloud later"],"key":0,"why":"Remember that not all patients have the same cognitive abilities or literacy — some may read only at an elementary level or be unable to read at all. Leave printed EZ read information, with pictures if possible, about the procedures and equipment.","src":[[24048,24052]]},{"id":"C17-Q05","ch":17,"sec":"III-I","lvl":"application","topic":"Communication barriers","stem":"When educating a patient with a hearing impairment, you should:","opts":["Speak clearly at an appropriate volume, allow for lip reading, and ensure hearing aids are in place","Speak as loudly as possible and avoid written materials","Rely solely on printed instructions","Use an interpreter for all hearing-impaired patients"],"key":0,"why":"For hearing-impaired patients, speak clearly and at an appropriate volume so they can hear you. Keep in mind that some patients might be reading your lips to some degree, and those with hearing aids should have them in during instruction. For visual difficulties, use larger print, easy-to-distinguish fonts, and contrasting colors.","src":[[24055,24060]]},{"id":"C17-Q06","ch":17,"sec":"III-I","lvl":"application","topic":"Behavior change","stem":"Why does teaching alone often fail to change patient behavior?","opts":["Knowledge does not always change behavior; motivation, perceived benefit, and removal of barriers are key to compliance","Patients rarely retain any information from teaching","Written materials are always more effective than demonstration","Compliance depends only on the physician's instructions"],"key":0,"why":"Remember that knowledge does not always change behavior. Motivation, perceived level of benefit, and removal of barriers — physical, financial, past experiences, misconceptions — are key factors in getting patients to comply with medications, therapies, or smoking cessation.","src":[[24064,24067]]},{"id":"C17-Q07","ch":17,"sec":"III-I","lvl":"application","topic":"Oxygen safety education","stem":"A homecare patient on oxygen continues to smoke. You should educate them to:","opts":["Not smoke while wearing oxygen and not cook over an open flame while wearing oxygen","Smoke only in a well-ventilated room while wearing oxygen","Reduce the oxygen flow by half before smoking","Remove the cannula for 30 seconds before smoking"],"key":0,"why":"Use no-smoking zones and signage and remove potential ignition sources such as cigarette lighters. While cessation is preferable, for those who continue to smoke, educate them not to smoke while wearing oxygen, and not to cook over an open flame while wearing oxygen.","src":[[24170,24175]],"given":["30"]},{"id":"C17-Q08","ch":17,"sec":"III-I","lvl":"application","topic":"Electrical safety","stem":"In the hospital, life-support equipment should be connected to:","opts":["Only \"red\" or emergency outlets with a backup power supply","Any available grounded outlet","A portable power strip","An outlet shared with monitoring equipment"],"key":0,"why":"For electrical failure risk, in the hospital use only red or emergency outlets with a backup power supply. In home care, ensure the outlet is functioning and grounded and that the circuit amperage is adequate for the equipment being used.","src":[[24160,24164]]},{"id":"C17-Q09","ch":17,"sec":"III-I","lvl":"application","topic":"Patient mobility education","stem":"When instructing a patient on safe ambulation and lifting technique, you should teach them to:","opts":["Exhale on exertion, plan the course around obstacles, choose a ramp instead of stairs, rest as needed, and bend at the knees rather than the waist","Hold the breath during exertion to stabilize the trunk","Take the shortest route regardless of obstacles","Bend at the waist to conserve leg strength"],"key":0,"why":"Teach the patient to exhale on exertion — for example when going up a step — plan the course such as going around obstacles rather than over them, choose a ramp instead of stairs, stop and rest if needed, and bend at the knees instead of the waist when picking something up. Caregivers should maintain a straight spine, lift with the legs, and use a lift assist device.","src":[[24136,24141]]}],"sims":[{"id":"SIM-01","cat":"Adult Chronic Airway Disease","topic":"COPD: Outpatient Management","title":"Stable COPD in Clinic","stem":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He reports breathlessness walking one block and stopping to catch his breath at his own pace on level ground. He has had two exacerbations in the past year.","sections":[{"type":"IG","prompt":"Select the information you want to gather first.","pick":"multi","opts":[{"t":"Baseline respiratory status and present treatment regimen","v":3,"fb":"Essential. Establishes what has changed and what the patient is already taking."},{"t":"History of previous exacerbations","v":3,"fb":"Two or more per year drives risk classification and controller escalation."},{"t":"Limitation of activities — ability to walk, eat, or sleep due to dyspnea","v":3,"fb":"Functional limitation is a core severity measure."},{"t":"Smoking history, including current status and quit attempts","v":3,"fb":"Cessation is the single most effective intervention in COPD."},{"t":"Spirometry with post-bronchodilator FEV1","v":3,"fb":"Required to confirm and grade airflow obstruction in the stable outpatient."},{"t":"Stat arterial blood gas","v":-1,"fb":"Not indicated in a stable ambulatory patient with no distress."},{"t":"Routine echocardiography","v":-2,"fb":"Little evidence supports routine echocardiography unless the diagnosis is unclear or comorbidities must be evaluated."},{"t":"Emergent chest CT angiogram","v":-3,"fb":"No clinical suspicion of PE; unnecessary radiation and contrast."}],"reveal":"Post-bronchodilator FEV1 is 46% predicted, FEV1/FVC 0.58. SpO2 94% on room air. Two exacerbations last year, neither requiring admission."},{"type":"IG","prompt":"Using the ATS Breathlessness Scale, how would you grade this patient?","pick":"multi","opts":[{"t":"Grade 2 — Moderate: walks slower than peers on level ground or stops for breath at own pace","v":3,"fb":"Matches his description exactly."},{"t":"Grade 3 — Severe: stops after about 100 yards or a few minutes","v":1,"fb":"Close, but he describes stopping at his own pace on level ground, which is grade 2."},{"t":"Grade 1 — Slight: troubled only when hurrying or walking up a small hill","v":-1,"fb":"Understates his limitation."},{"t":"Grade 4 — Very severe: too breathless to leave the house","v":-3,"fb":"Far overstates his limitation."}],"reveal":""},{"type":"DM","prompt":"What is the single most important intervention to recommend?","pick":"one","opts":[{"t":"Smoking cessation counseling and pharmacologic support","v":3,"fb":"Nothing else alters the disease trajectory as much."},{"t":"Start a LABA plus long-acting anticholinergic combination","v":2,"fb":"Appropriate maintenance therapy, but secondary to cessation."},{"t":"Start long-term oxygen therapy","v":-2,"fb":"His SpO2 is 94%; he does not meet criteria for LTOT."},{"t":"Begin daily systemic corticosteroids","v":-3,"fb":"Chronic systemic steroids are not indicated for stable COPD and carry major harm."}],"reveal":""},{"type":"DM","prompt":"For maintenance bronchodilation, what do you recommend?","pick":"one","opts":[{"t":"A LABA plus long-acting anticholinergic combination (e.g., umeclidinium/vilanterol)","v":3,"fb":"For maintenance of bronchospasm in COPD, consider a LABA, a long-acting anticholinergic, or the combination."},{"t":"A long-acting anticholinergic alone (e.g., tiotropium)","v":2,"fb":"A reasonable single-agent maintenance choice."},{"t":"Scheduled short-acting albuterol four times daily as sole therapy","v":-1,"fb":"SABAs are relievers, not controllers."},{"t":"A LABA alone with no inhaled steroid or anticholinergic","v":0,"fb":"Acceptable but less effective than combination therapy here."}],"reveal":""},{"type":"IG","prompt":"Select the education topics to cover before discharge from clinic.","pick":"multi","opts":[{"t":"Correct inhaler technique with return demonstration","v":3,"fb":"Evaluate patient skill by return demonstration."},{"t":"How to recognize early signs of an exacerbation and when to call","v":3,"fb":"Central to self-management."},{"t":"Not smoking while wearing oxygen and not cooking over an open flame","v":2,"fb":"Essential fire-safety teaching for any patient who may go on oxygen."},{"t":"Limit the session to about an hour and leave EZ-read printed material","v":3,"fb":"Avoids information overload and accommodates health literacy."},{"t":"A detailed written pharmacology manual only, with no demonstration","v":-2,"fb":"Ignores literacy limits and omits return demonstration."}],"reveal":""}],"src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]]},{"id":"SIM-02","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"COPD Exacerbation in the Emergency Department","stem":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air.","sections":[{"type":"IG","prompt":"Select the information and tests you want now.","pick":"multi","opts":[{"t":"Vital signs including temperature, and SpO2","v":3,"fb":"Baseline physical assessment for an exacerbation."},{"t":"Duration of worsening symptoms and recent medication use","v":3,"fb":"Defines the exacerbation and what has already failed."},{"t":"Signs of airway infection — fever, change in sputum volume and color","v":3,"fb":"Guides the decision on antibiotics."},{"t":"Arterial blood gas","v":3,"fb":"Indicated with SpO2 \u003c 88%, history of hypercapnia, somnolence, or impending failure."},{"t":"Chest radiograph to exclude an alternative diagnosis","v":3,"fb":"Standard in a moderate-to-severe exacerbation."},{"t":"BNP to help rule out left ventricular failure as the cause of dyspnea","v":2,"fb":"Useful when CHF is in the differential."},{"t":"Spirometry","v":-2,"fb":"In an acute COPD exacerbation spirometry is of little value; use oximetry and ABGs."},{"t":"Routine electrocardiography and echocardiography","v":-1,"fb":"Little evidence supports routine ordering unless the diagnosis is unclear or comorbidities need evaluation."}],"reveal":"ABG on room air: pH 7.33, PaCO2 58, PaO2 48, HCO3 30, BE +4. Chest film shows hyperinflation, no infiltrate. Temp 38.1°C."},{"type":"DM","prompt":"What oxygen target and device do you choose?","pick":"one","opts":[{"t":"Titrate to a PaO2 of 60–65 torr / SpO2 88–92%, using a 28% air-entrainment mask","v":3,"fb":"Correct target for an acute COPD exacerbation, delivered by a stable low-FiO2 high-flow device."},{"t":"Nonrebreathing mask at 15 L/min to maximize oxygenation","v":-3,"fb":"Risks O2-induced hypoventilation in a CO2 retainer."},{"t":"Nasal cannula at 6 L/min","v":-1,"fb":"Variable FiO2 and likely too much for a retainer."},{"t":"Room air, because the PaCO2 is elevated","v":-3,"fb":"Withholding oxygen from a hypoxemic patient is never correct."}],"reveal":""},{"type":"IG","prompt":"Select the pharmacologic and supportive measures you recommend.","pick":"multi","opts":[{"t":"Increase the β-agonist dose and frequency","v":3,"fb":"First-line in an exacerbation."},{"t":"Add an inhaled anticholinergic if not already prescribed","v":3,"fb":"Standard addition in acute COPD."},{"t":"Systemic steroids in addition to inhaled steroids","v":3,"fb":"Recommended for acute exacerbation."},{"t":"Antibiotic therapy, given the fever and purulent sputum","v":3,"fb":"Recommended when secretions are copious and purulent."},{"t":"Nutritional support","v":2,"fb":"Part of basic management."},{"t":"A mucolytic without a preceding bronchodilator","v":-2,"fb":"All mucolytics irritate the airway; always precede with a bronchodilator."},{"t":"Chest physiotherapy with postural drainage in Trendelenburg","v":-1,"fb":"Not first-line here and head-down positioning is poorly tolerated in acute distress."}],"reveal":""},{"type":"DM","prompt":"Two hours later: RR 30, still using accessory muscles, ABG pH 7.28 / PaCO2 66 / PaO2 62 on 28%. What now?","pick":"one","opts":[{"t":"Initiate noninvasive positive-pressure ventilation","v":3,"fb":"Failure of basic management with worsening respiratory acidosis is the classic NPPV indication; NPPV is preferred because intubated COPD patients are difficult to wean."},{"t":"Intubate and begin invasive ventilation","v":0,"fb":"Premature — he is alert and protecting his airway, so NPPV should be tried first."},{"t":"Increase the FiO2 to 40% and continue observing","v":-2,"fb":"Does not address the rising PaCO2 and falling pH."},{"t":"Add heliox by nonrebreathing mask","v":-1,"fb":"Not the evidence-based next step for hypercapnic COPD failure."}],"reveal":""},{"type":"DM","prompt":"Select your initial BiPAP settings.","pick":"one","opts":[{"t":"IPAP 10 / EPAP 5 cm H2O, backup rate 10/min, I:E 1:3 or lower, FiO2 to keep SpO2 88–95%","v":3,"fb":"Exactly the recommended starting point for COPD, including enough expiratory time for complete exhalation."},{"t":"IPAP 20 / EPAP 10 cm H2O, backup rate 20/min","v":-2,"fb":"IPAP near the esophageal opening pressure risks gastric insufflation, and the high rate shortens expiratory time."},{"t":"CPAP 10 cm H2O alone","v":-2,"fb":"Provides no pressure support to unload the ventilatory muscles or lower the PaCO2."},{"t":"IPAP 10 / EPAP 5 with an I:E of 1:1","v":-2,"fb":"Insufficient expiratory time will worsen air trapping."}],"reveal":""}],"src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]]},{"id":"SIM-03","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"Auto-PEEP During Noninvasive Ventilation","stem":"The same 71-year-old is now on BiPAP 12/5 cm H2O with a backup rate of 10. He is more comfortable, but the ventilator flow waveform shows expiratory flow that does not return to zero before the next breath. pH 7.34, PaCO2 54, PaO2 70 on FiO2 0.35.","sections":[{"type":"IG","prompt":"Select the assessments that will confirm your suspicion.","pick":"multi","opts":[{"t":"Inspect the flow-versus-time waveform for expiratory flow not returning to baseline","v":3,"fb":"Auto-PEEP is not visible on the pressure-time graphic; the flow waveform or flow-volume loop is how you detect it."},{"t":"Inspect the flow–volume loop","v":3,"fb":"The other graphic that reveals air trapping."},{"t":"Perform an end-expiratory pause to measure the trapped pressure","v":3,"fb":"Measurement of auto-PEEP requires an end-expiratory pause."},{"t":"Assess for relief of tachypnea and reduction in accessory muscle use","v":3,"fb":"The bedside endpoint for NPPV adjustment."},{"t":"Read the auto-PEEP value directly off the pressure-versus-time graphic","v":-3,"fb":"Auto-PEEP is invisible there — that is why it is called occult PEEP."},{"t":"Measure plateau pressure with an end-INSPIRATORY hold","v":0,"fb":"Useful for compliance but does not measure auto-PEEP."}],"reveal":"End-expiratory pause reveals a total PEEP of 9 cm H2O against a set EPAP of 5 — auto-PEEP of about 4 cm H2O."},{"type":"DM","prompt":"His pH and PaCO2 are now adequate. How do you address the auto-PEEP?","pick":"one","opts":[{"t":"Raise EPAP and IPAP equally — for example to 14/7 cm H2O","v":3,"fb":"With adequate PCO2/pH, raise EPAP and IPAP equally: this raises the baseline to counterbalance trapping while keeping ΔP — and therefore ventilation — constant."},{"t":"Raise IPAP alone to 16 cm H2O","v":-1,"fb":"Increases ΔP and ventilation, which he does not need, and does nothing for trapping."},{"t":"Lower EPAP to 3 cm H2O","v":-2,"fb":"Reduces the counterbalancing baseline pressure and worsens the trigger burden."},{"t":"Increase the backup rate to 16/min","v":-3,"fb":"Shortens expiratory time and will worsen air trapping."}],"reveal":""},{"type":"DM","prompt":"Overall, what should your pH/PaCO2 goal be for this patient?","pick":"one","opts":[{"t":"Aim for a normal pH, not necessarily a normal PaCO2","v":3,"fb":"The explicit rule in COPD — he is a chronic retainer whose baseline PaCO2 is high."},{"t":"Aim for a PaCO2 of exactly 40 torr","v":-2,"fb":"Overventilating a chronic retainer produces a post-hypercapnic metabolic alkalosis."},{"t":"Aim for a PaCO2 below 35 torr to maximize the safety margin","v":-3,"fb":"Frank overventilation."},{"t":"Accept any pH above 7.15","v":-2,"fb":"Far too permissive outside a lung-protective ARDS strategy."}],"reveal":""},{"type":"DM","prompt":"Two days later he is comfortable on 10/5 with a normal pH. How do you wean him from NPPV?","pick":"one","opts":[{"t":"Progressively decrease the time on NPPV","v":3,"fb":"Weaning from NPPV is best accomplished by progressively decreasing the time on the device."},{"t":"Abruptly discontinue and place on a nonrebreathing mask","v":-2,"fb":"No graded reduction and the wrong oxygen device for a retainer."},{"t":"Reduce IPAP to equal EPAP and leave the mask on continuously","v":-1,"fb":"Eliminates support without reducing exposure to the interface."},{"t":"Switch to invasive ventilation to wean more reliably","v":-3,"fb":"Intubating a patient improving on NPPV reverses the whole point."}],"reveal":""}],"src":[[5155,5170],[17341,17345],[26879,26896]]},{"id":"SIM-04","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"COPD Failing NPPV — Transition to Invasive Ventilation","stem":"A 66-year-old with severe COPD has been on BiPAP for four hours. He is now somnolent and difficult to rouse, RR 34, and cannot clear copious secretions. ABG: pH 7.19, PaCO2 82, PaO2 55 on FiO2 0.50.","sections":[{"type":"IG","prompt":"Select the findings that justify moving to invasive ventilation.","pick":"multi","opts":[{"t":"Severe acidosis with pH \u003c 7.25 and hypercapnia with PaCO2 > 60 torr","v":3,"fb":"An explicit indication for intubation and invasive ventilation in COPD."},{"t":"Decreased level of consciousness","v":3,"fb":"Both an indicator of treatment failure and a contraindication to continuing NPPV."},{"t":"Inability to manage secretions","v":3,"fb":"BiPAP requires the patient control the upper airway and manage secretions."},{"t":"Severe tachypnea greater than 35 breaths/min","v":2,"fb":"Listed among the indications for intubation; he is close at 34."},{"t":"His SpO2 is 90%, which is acceptable","v":-2,"fb":"Oxygenation is not the problem here — ventilatory failure is."},{"t":"He has a documented DNR/DNI order","v":0,"fb":"If true this would be the one absolute contraindication — you must verify it before proceeding."}],"reveal":"Chart review confirms full code status. The patient is intubated with an 8.0 ETT."},{"type":"DM","prompt":"Select initial ventilator settings.","pick":"one","opts":[{"t":"VC A/C, VT 6–8 mL/kg PBW, rate 12, and enough expiratory time for an I:E of 1:4 or lower","v":3,"fb":"Full ventilatory support at a lung-protective volume, with the long expiratory time obstructive patients require."},{"t":"VC A/C, VT 12 mL/kg PBW, rate 20, I:E 1:1","v":-3,"fb":"Injurious volume plus an I:E that guarantees severe air trapping."},{"t":"Pressure support 10 cm H2O alone","v":-3,"fb":"Not full ventilatory support for a somnolent patient in ventilatory failure."},{"t":"SIMV at a rate of 4 with no pressure support","v":-2,"fb":"Imposes a large spontaneous workload on an exhausted patient."}],"reveal":""},{"type":"IG","prompt":"Select the parameters you will monitor over the first hour.","pick":"multi","opts":[{"t":"Plateau pressure, keeping it at or below 30 cm H2O","v":3,"fb":"Core lung-protective monitoring."},{"t":"Auto-PEEP via end-expiratory pause","v":3,"fb":"Essential in any ventilated obstructive patient."},{"t":"Arterial blood gas to confirm the pH is correcting","v":3,"fb":"Confirms the adequacy of the new settings."},{"t":"Cuff pressure, adjusted to no more than 25–30 cm H2O","v":3,"fb":"Standard of care and part of routine patient-ventilator checks."},{"t":"Head of bed elevated 30 degrees or more","v":3,"fb":"VAP prevention on every ventilated patient unless contraindicated."},{"t":"Rapid correction of the PaCO2 to 40 torr within the hour","v":-3,"fb":"Correcting a chronic retainer's PaCO2 abruptly causes seizures and severe alkalosis."}],"reveal":""},{"type":"DM","prompt":"Blood gas one hour later: pH 7.47, PaCO2 38. What do you recommend?","pick":"one","opts":[{"t":"Decrease the ventilator rate to let the PaCO2 rise toward his chronic baseline","v":3,"fb":"He is being overventilated relative to his compensated baseline; aim for a normal pH at his own PaCO2."},{"t":"Leave the settings unchanged because the PaCO2 is normal","v":-2,"fb":"'Normal' is wrong for a chronic retainer — the alkalemia proves it."},{"t":"Increase the rate further to maintain the improvement","v":-3,"fb":"Worsens the alkalosis."},{"t":"Add deadspace and increase the tidal volume","v":-1,"fb":"Adding deadspace is a legitimate tool, but a rate reduction is the simpler first move."}],"reveal":""}],"src":[[26923,26932],[16798,16803],[20110,20115],[5593,5599],[13934,13938],[22736,22739]]},{"id":"SIM-05","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"Liberating the COPD Patient from the Ventilator","stem":"Day 4 of invasive ventilation for a COPD exacerbation. The patient is alert and following commands. FiO2 0.35, PEEP 5, pH 7.38, PaCO2 52, PaO2 78. Secretions are minimal.","sections":[{"type":"IG","prompt":"Select the readiness criteria you want to verify before a spontaneous breathing trial.","pick":"multi","opts":[{"t":"Evidence of some reversal of the underlying cause of respiratory failure","v":3,"fb":"The first readiness criterion."},{"t":"P/F ratio 150–200 or better, PEEP ≤ 5–8 cm H2O, FiO2 ≤ 0.4–0.5","v":3,"fb":"Adequate oxygenation criteria."},{"t":"pH ≥ 7.25","v":3,"fb":"Acid-base criterion for readiness."},{"t":"Hemodynamic stability without myocardial ischemia or significant hypotension","v":3,"fb":"Required before an SBT."},{"t":"Capability to initiate an inspiratory effort","v":3,"fb":"Without it, no spontaneous trial is possible."},{"t":"A vital capacity and MIP/NIF measurement","v":2,"fb":"Useful insight into weaning potential, though a monitored SBT gives the most valid information."},{"t":"A normal PaCO2 of 40 torr","v":-2,"fb":"Never the target in a chronic retainer."}],"reveal":"All criteria met. P/F is 223. You begin a spontaneous breathing trial."},{"type":"DM","prompt":"Which spontaneous breathing mode do you select, and why?","pick":"one","opts":[{"t":"CPAP, because it can help improve breath-triggering in a patient with auto-PEEP","v":3,"fb":"No one approach is better than the others by evidence, but CPAP specifically helps triggering when auto-PEEP is present — exactly this patient."},{"t":"Straight T-tube breathing","v":2,"fb":"An accepted SBT mode, but forgoes the triggering benefit of CPAP here."},{"t":"Pressure support plus CPAP","v":2,"fb":"Also accepted; reasonable choice."},{"t":"Return to SIMV with a rate of 4","v":-2,"fb":"SIMV weaning is not a spontaneous breathing trial."}],"reveal":""},{"type":"DM","prompt":"After a 3-minute screening period he is comfortable with stable vitals and RR 26. What next?","pick":"one","opts":[{"t":"Continue the SBT for at least 30 minutes but no more than 120 minutes","v":3,"fb":"The screening phase is 2–5 minutes; if tolerated, continue 30–120 minutes before deciding."},{"t":"Extubate immediately","v":-1,"fb":"Too early — the screening phase alone does not establish tolerance."},{"t":"Continue the trial for 6 hours to be certain","v":-2,"fb":"Beyond 120 minutes only fatigues the patient without adding information."},{"t":"Return him to full support and retry tomorrow","v":-2,"fb":"He is passing; there is no reason to stop."}],"reveal":""},{"type":"DM","prompt":"At 45 minutes: RR 24, stable vitals, ABG pH 7.37 / PaCO2 54 / PaO2 82. What do you recommend?","pick":"one","opts":[{"t":"Discontinue ventilatory support and consider extubation","v":3,"fb":"Acceptable ABGs, stable vitals, and no signs of failure after a completed SBT."},{"t":"Restore prior support and determine why the trial failed","v":-3,"fb":"The trial did not fail."},{"t":"Extubate directly to a nonrebreathing mask","v":-2,"fb":"Wrong oxygen device for a CO2 retainer."},{"t":"Extubate and place on NPPV prophylactically","v":1,"fb":"Reasonable in selected high-risk COPD patients to avoid reintubation, but not required when the SBT is clearly passed."}],"reveal":""}],"src":[[5369,5399],[21269,21274],[20256,20258]]},{"id":"SIM-06","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"End-Stage COPD and Goals of Care","stem":"An 79-year-old with GOLD stage 4 COPD, on home oxygen, has been admitted four times in six months. He is alert, cachexic, and says he 'does not want the breathing tube again.' SpO2 87% on 2 L/min. pH 7.34, PaCO2 62.","sections":[{"type":"IG","prompt":"Select the information you should gather first.","pick":"multi","opts":[{"t":"Whether advance directives have been established","v":3,"fb":"You should always determine whether advance directives exist, and presume the patient wants lifesaving treatment until informed otherwise."},{"t":"Whether a written DNR/DNI order is in the record by the attending physician","v":3,"fb":"A DNR request can come from patient or surrogate, but the written order must be placed by the attending physician."},{"t":"Baseline respiratory status and recent exacerbation history","v":3,"fb":"Establishes trajectory."},{"t":"Nutritional status, given the cachexia","v":2,"fb":"Nutritional support is part of basic COPD management."},{"t":"Nothing — act on the patient's verbal statement alone","v":-3,"fb":"A verbal preference is not an order; it must be documented by the attending physician."}],"reveal":"No advance directive is on file. The patient is alert and oriented x3 and repeats his wishes clearly."},{"type":"DM","prompt":"What is your immediate action regarding his stated wishes?","pick":"one","opts":[{"t":"Notify the attending physician so the request can be documented in the record","v":3,"fb":"The physician is obliged to document the request; until then you must presume he wants lifesaving treatment."},{"t":"Write a DNI note in the respiratory therapy charting and consider it handled","v":-2,"fb":"RT documentation does not constitute a physician order."},{"t":"Ask a family member to decide instead","v":-2,"fb":"He is alert and oriented — his own wishes govern."},{"t":"Ignore the statement because no order exists","v":-3,"fb":"Failing to escalate the request is a serious omission."}],"reveal":""},{"type":"IG","prompt":"Select what you recommend for this admission.","pick":"multi","opts":[{"t":"Supplemental O2 titrated to a PaO2 of 60–65 torr / SpO2 88–92%","v":3,"fb":"Correct target for a chronic retainer."},{"t":"Increase β-agonist dose and frequency, add inhaled anticholinergic","v":3,"fb":"Basic exacerbation management."},{"t":"Systemic steroids","v":3,"fb":"Recommended in an acute exacerbation."},{"t":"Discuss palliative care and end-of-life options with the patient and family","v":3,"fb":"Explicitly recommended for those with end-stage disease."},{"t":"A trial of NPPV if he becomes more acidotic, consistent with his wishes","v":2,"fb":"NPPV can be offered as a ceiling of care and may also alleviate breathlessness in terminally ill patients."},{"t":"Elective intubation now to prevent deterioration","v":-3,"fb":"Directly contrary to his stated wishes and clinically unjustified."}],"reveal":""},{"type":"DM","prompt":"He asks what the BiPAP mask would be for. Your best explanation is:","pick":"one","opts":[{"t":"It supports his breathing without a breathing tube and can relieve breathlessness and fatigue","v":3,"fb":"An accurate, patient-level explanation; alleviating breathlessness and fatigue in terminally ill patients is a recognized indication for NPPV."},{"t":"It is the same as being on a ventilator with a tube","v":-2,"fb":"Inaccurate and may cause him to refuse a therapy aligned with his goals."},{"t":"It will cure the underlying emphysema","v":-3,"fb":"False."},{"t":"It is only used when someone is about to die","v":-2,"fb":"Inaccurate and frightening."}],"reveal":""}],"src":[[1111,1145],[26845,26853],[17216,17221]]},{"id":"SIM-07","cat":"Adult Chronic Airway Disease","topic":"COPD—In-Hospital, Critical Care Management","title":"Adult Status Asthmaticus","stem":"A 34-year-old with asthma arrives in the ED unable to speak in full sentences. RR 32, HR 128, diffuse wheezing with a prolonged expiratory phase, and a pulse that weakens on inspiration. SpO2 90% on room air.","sections":[{"type":"IG","prompt":"Select your initial assessment priorities.","pick":"multi","opts":[{"t":"Assess whether she can speak in full sentences","v":3,"fb":"Interrupted speech indicates resp
