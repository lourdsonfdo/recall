for tube reinsertion.","src":[[14641,14643]],"origin":"heuer","age":"adult"},{"id":"C09-Q21","sec":"III-A","lvl27":"integ","topic":"Laryngeal mask airway","stem":"Before inserting an LMA, the cuff should be:","opts":["Fully deflated into a smooth, wrinkle-free wedge","Partially inflated to ease passage past the tongue","Fully inflated to its maximum recommended volume","Inflated to 60 cm H₂O and checked with a manometer"],"key":0,"why":"Fully deflate the cuff by pulling back firmly on the deflating syringe until it forms a smooth wedge shape without wrinkles; insertion with a partially deflated cuff can obstruct the airway. Lubricate the posterior side of the mask with water-soluble lubricant and preoxygenate the patient.","src":[[14394,14398]],"origin":"heuer","age":"adult"},{"id":"C09-Q22","sec":"III-A","lvl27":"integ","topic":"Tube confirmation","stem":"After intubation you hear gurgling over the epigastrium and no breath sounds. You should:","opts":["Deflate the cuff, remove the tube, and reintubate","Advance the tube 2 cm and listen again","Inflate the cuff further to seal any leak","Obtain a stat chest x-ray before acting on it"],"key":0,"why":"Stomach (epigastric) gurgling sounds indicate esophageal intubation. Correct it by immediately deflating the cuff, removing the tube, and reintubating the patient. Be prepared to suction the oropharynx if vomitus occurs.","src":[[14587,14589]],"origin":"heuer","age":"adult"},{"id":"C09-Q23","sec":"III-A","lvl27":"integ","topic":"Tube confirmation","stem":"Breath sounds and chest movement are decreased on the LEFT after intubation. This most likely indicates:","opts":["Right mainstem intubation; withdraw the tube slowly","Left mainstem intubation; advance the tube further","Esophageal intubation; remove it and reintubate","A left pneumothorax; insert a left chest tube"],"key":0,"why":"Decreased breath sounds or chest movement on the left suggests intubation of the right mainstem bronchus — left-sided intubation can occur but is much less common. Correct it by slowly withdrawing the tube until you confirm bilateral breath sounds, then confirm proper position by chest x-ray.","src":[[14590,14593]],"origin":"heuer","age":"adult"},{"id":"C09-Q24","sec":"III-A","lvl27":"integ","topic":"Airway troubleshooting","stem":"A suction catheter will not pass through a recently placed ETT. This suggests:","opts":["The tube may be kinked or out of the trachea; reposition or reintubate","The catheter is too small for the tube and should be upsized","The resistance is normal for a new tube and needs more force","The cuff is underinflated and should be inflated further"],"key":0,"why":"If a suction catheter does not pass after placement, the tube may be kinked or displaced out of the trachea. Reposition it or reintubate the patient.","src":[[14594,14595]],"origin":"heuer","age":"adult"},{"id":"C09-Q25","sec":"III-A","lvl27":"integ","topic":"Airway assessment","stem":"During direct laryngoscopy you obtain a Cormack-Lehane Grade IV view. This means:","opts":["The epiglottis cannot be seen; difficulty is > 90% likely","Only the epiglottis can be seen; difficulty is moderate","The cords are fully visible; intubation should be easy","The view is obscured by secretions that need suction"],"key":0,"why":"On the Cormack-Lehane scale a Grade III view allows visualization of the epiglottis only, with Grade IV indicating that the epiglottis cannot be visualized. The likelihood of difficult intubation increases to over 90% with a Grade IV view.","src":[[14005,14008]],"origin":"heuer","age":"adult"},{"id":"C09-Q26","sec":"III-A","lvl27":"integ","topic":"Oropharyngeal airways","stem":"After inserting an oropharyngeal airway, the obstruction is not relieved. Which explanation fits an airway that is TOO SMALL?","opts":["It pushes the tongue against the back of the pharynx","It blocks the patient's airway directly with its tip","It stimulates the gag reflex and causes vomiting","It cannot be taped securely in place"],"key":0,"why":"Remove and reinsert the airway and confirm it extends past the base of the tongue. If the airway is too large or long it will block the patient's airway; if it is too small or short it can force the tongue against the posterior pharynx.","src":[[14155,14163]],"origin":"heuer","age":"adult"},{"id":"C09-Q27","sec":"III-A","lvl27":"integ","topic":"LMA troubleshooting","stem":"An LMA develops a leak with decreased tidal volumes. Which action is specifically warned against?","opts":["Adding more air to the cuff, which may push it off the larynx","Confirming that the airway is securely taped in place","Readjusting the airway position by pressing the tube downward","Resecuring the airway with tape in its new position"],"key":0,"why":"For a leak, confirm the airway is securely taped, readjust the position by pressing the tube downward, and resecure it. Do NOT simply add more air to the cuff — this may worsen leakage by pushing the cuff off the larynx.","src":[[14469,14473]],"origin":"heuer","age":"adult"},{"id":"C09-Q28","sec":"III-A","lvl27":"integ","topic":"LMA troubleshooting","stem":"Regurgitation occurs in a patient with an LMA in place. Your immediate actions are:","opts":["Head-down or side-lying, and disconnect the ventilation equipment","Increase PEEP to keep the airway pressurized and the stomach closed","Add air to the LMA cuff and continue ventilating at the same rate","Suction the airway tube first, then reposition the patient afterward"],"key":0,"why":"For regurgitation, place the patient in a head-down or side-lying rescue position and disconnect all ventilation equipment so gastric contents are not forced into the lungs. Then reposition the LMA so its distal end presses against the esophageal sphincter, suction through the airway tube, and prepare for immediate tracheal intubation.","src":[[14478,14484]],"origin":"heuer","age":"adult"},{"id":"C09-Q29","sec":"III-A","lvl27":"integ","topic":"Endotracheal tube sizing","stem":"Using the pediatric formula, what uncuffed ETT internal diameter is estimated for a 4-year-old?","opts":["5.0 mm","4.0 mm","6.0 mm","3.0 mm"],"key":0,"why":"For infants and children, uncuffed tube size ID = (age/4) + 4, so (4/4) + 4 = 5.0 mm. Cuffed tube size ID = (age/4) + 3, because cuffed tubes must be slightly smaller.","src":[[14540,14542]],"origin":"heuer","age":"child"},{"id":"C09-Q30","sec":"III-A","lvl27":"integ","topic":"Route selection","stem":"Why is the nasotracheal route discouraged for intubation?","opts":["More VAP, sinusitis and otitis; higher resistance; nasal necrosis","It cannot be performed without fiberoptic guidance in adults","Capnography cannot confirm a nasal tube's placement reliably","Nasal endotracheal tubes are not available with a cuff"],"key":0,"why":"The nasotracheal route is discouraged because the incidence of VAP, sinusitis, and otitis media is higher; smaller or longer ETTs are required, which increases airway resistance; and necrosis of the nasal septum and naris can occur.","src":[[14578,14581]],"origin":"heuer","age":"adult"},{"id":"C10-Q01","sec":"III-B","lvl27":"recall","topic":"Suctioning","stem":"The recommended starting vacuum pressure range for tracheal suctioning in ADULTS is:","opts":["−100 to −120 mm Hg","−80 to −100 mm Hg","−60 to −80 mm Hg","−150 to −200 mm Hg"],"key":0,"why":"For centrally piped vacuum systems the recommended starting range is −100 to −120 mm Hg for adults, −80 to −100 mm Hg for children, and −60 to −80 mm Hg for infants. Always select the lowest level needed to remove secretions effectively.","src":[[15729,15733]],"origin":"heuer","age":"adult"},{"id":"C10-Q02","sec":"III-B","lvl27":"recall","topic":"Suctioning","stem":"Each suctioning pass should be limited to:","opts":["Less than 15 seconds","Less than 30 seconds","Less than 60 seconds","Less than 5 seconds"],"key":0,"why":"Limit the duration of suctioning to less than 15 seconds. Preoxygenate and postoxygenate with 100% O₂ — 10% above baseline for neonates — for at least 30–60 seconds.","src":[[15754,15774]],"origin":"heuer","age":"adult"},{"id":"C10-Q03","sec":"III-B","lvl27":"recall","topic":"Suctioning","stem":"A suction catheter should occlude no more than what percentage of the ETT internal diameter?","opts":["Less than 50% in adults, less than 70% in infants","Less than 70% in adults, less than 90% in infants","Less than 25% in all patients","Less than 90% in all patients"],"key":0,"why":"To ensure adequate space for gas to flow around the catheter and prevent atelectasis, always select a suction catheter that occludes less than 50% of the ETT internal diameter, or less than 70% in infants.","src":[[15734,15736],[15762,15763]],"origin":"heuer","age":"adult"},{"id":"C10-Q04","sec":"III-B","lvl27":"recall","topic":"Postural drainage","stem":"Each postural drainage position should be maintained for:","opts":["10–15 minutes as tolerated","2–3 minutes per position","30 minutes per position","1 hour per position"],"key":0,"why":"Position the patient for drainage beginning with the most dependent zones first, and maintain the position for 10–15 minutes as tolerated while performing percussion and vibration over the identified areas.","src":[[15629,15631]],"origin":"heuer","age":"adult"},{"id":"C10-Q05","sec":"III-B","lvl27":"recall","topic":"Incentive spirometry","stem":"During incentive spirometry, the patient should perform a full inspiratory capacity breath with a breath-hold of:","opts":["5–10 seconds, 6–10 times per hour","1–2 seconds, once per hour","20 seconds, 3 times per hour","30 seconds, 20 times per hour"],"key":0,"why":"Instruct the patient in a full inspiratory capacity breath with a 5- to 10-second breath-hold, allowing adequate recovery time between breaths to avoid hyperventilation, performed 6–10 times per hour.","src":[[16224,16226]],"origin":"heuer","age":"adult"},{"id":"C10-Q06","sec":"III-B","lvl27":"recall","topic":"IPPB","stem":"What is the ONLY absolute contraindication to intermittent positive-pressure breathing?","opts":["Untreated tension pneumothorax","Intracranial pressure above 15 mm Hg","Active hemoptysis","Recent esophageal surgery"],"key":0,"why":"Untreated tension pneumothorax is the only absolute contraindication to IPPB. ICP above 15 mm Hg, hemodynamic instability, recent facial/oral/skull surgery, tracheoesophageal fistula, recent esophageal surgery, active hemoptysis, and radiographic evidence of bleb are relative contraindications.","src":[[16286,16302]],"origin":"heuer","age":"adult"},{"id":"C10-Q07","sec":"III-B","lvl27":"integ","topic":"Airway clearance selection","stem":"Which airway clearance technique is recommended for a patient with neuromuscular disease such as muscular dystrophy?","opts":["Insufflation–exsufflation, directed cough, and suction","Postural drainage, percussion, and vibration alone","High-frequency chest wall oscillation alone","No airway clearance therapy, only early ambulation"],"key":0,"why":"For neuromuscular disease — muscular dystrophy, myasthenia, poliomyelitis — the recommended techniques are insufflation–exsufflation (I-E), forced expiratory technique/directed cough, and suction. Uncomplicated pneumonia requires NO airway clearance therapy, and uncomplicated postoperative patients need early mobility and ambulation.","src":[[15572,15581]],"origin":"heuer","age":"adult"},{"id":"C10-Q08","sec":"III-B","lvl27":"integ","topic":"Postural drainage","stem":"Patients with cystic fibrosis should generally NOT be placed in a head-down position during PDPV because:","opts":["They are at higher risk for gastroesophageal reflux","Head-down positioning raises intracranial pressure","Their secretions are too viscous to drain by gravity","Head-down positioning causes bronchospasm in CF"],"key":0,"why":"Because patients with cystic fibrosis are at higher risk for gastroesophageal reflux, it is generally recommended that they no longer be placed in a head-down position during PDPV.","src":[[15650,15652]],"origin":"heuer","age":"adult"},{"id":"C10-Q09","sec":"III-B","lvl27":"integ","topic":"Postural drainage","stem":"PDPV should be discontinued when:","opts":["Sputum falls below 30 mL/day and the cough is effective","The patient reports that the treatments are uncomfortable","Two treatments have been completed without complications","The chest x-ray shows any improvement at all"],"key":0,"why":"In general, when sputum production drops below 30 mL/day and the patient can generate an effective spontaneous cough, PDPV is no longer indicated and should be discontinued. Effectiveness is monitored by chest x-ray changes, vital signs including SpO₂, sputum production, and auscultation.","src":[[15673,15678]],"origin":"heuer","age":"adult"},{"id":"C10-Q10","sec":"III-B","lvl27":"integ","topic":"Suctioning","stem":"Using the quick estimate, what French suction catheter suits a 6.0-mm ID tracheal tube?","opts":["10 Fr","12 Fr","8 Fr","14 Fr"],"key":0,"why":"Estimate the catheter size in French by doubling the internal diameter of the tracheal tube and selecting the next smallest catheter size: 6.0 × 2 = 12, so select the next smallest, 10 Fr. Table 10-3 confirms 10 Fr for a 6.0-mm tube.","src":[[15739,15741],[15798,15800]],"origin":"heuer","age":"adult"},{"id":"C10-Q11","sec":"III-B","lvl27":"integ","topic":"Incentive spirometry","stem":"A postoperative patient cannot generate an inspiratory capacity greater than 33% of predicted. You should recommend:","opts":["IPPB or intermittent CPAP therapy as alternatives","A larger incentive spirometer","Doubling the frequency of incentive spirometry","Discontinuing all lung expansion therapy"],"key":0,"why":"To perform IS the patient must be able to cooperate and ideally generate an inspiratory capacity at least one-third of predicted. If the patient cannot cooperate or cannot generate an IC greater than 33% of predicted, recommend either IPPB or intermittent CPAP therapy as alternatives.","src":[[16186,16188],[16205,16207]],"origin":"heuer","age":"adult"},{"id":"C10-Q12","sec":"III-B","lvl27":"integ","topic":"IPPB","stem":"During IPPB, the pressure and flow should be adjusted until the delivered tidal volume is:","opts":["1½ to 2 times the baseline VT, as tolerated","Equal to the patient's baseline VT","3 to 4 times the baseline VT","Exactly 500 mL, regardless of patient size"],"key":0,"why":"Have the patient maintain a tight seal, instruct them to inhale slightly until the breath triggers, adjust sensitivity to facilitate triggering, and adjust the pressure and flow until the VT is 1½ to 2 times the baseline as tolerated. Initial settings are sensitivity about −2 cm H₂O and cycle pressure 10–15 cm H₂O with moderate flow.","src":[[16313,16314],[16278,16279]],"origin":"heuer","age":"adult"},{"id":"C10-Q13","sec":"III-B","lvl27":"integ","topic":"Incentive spirometry","stem":"Why is incentive spirometry no longer recommended for routine prophylactic use after thoracic or upper abdominal surgery?","opts":["Evidence shows little benefit; early mobilization is the main prevention","It causes an unacceptable rate of barotrauma after thoracic surgery","Patients cannot be taught the technique reliably after surgery","It has been replaced by routine IPPB in all upper abdominal surgery"],"key":0,"why":"Because current evidence indicates that IS provides little to no benefit for patients undergoing thoracic or upper abdominal surgery, it is no longer recommended for routine prophylactic use postoperatively. Early mobilization and ambulation are considered the primary means of reducing postoperative complications and promoting airway clearance.","src":[[16192,16196]],"origin":"heuer","age":"adult"},{"id":"C10-Q14","sec":"III-B","lvl27":"integ","topic":"Lung expansion therapy","stem":"A hypoxemic postoperative patient (P/F ratio < 300) has atelectasis but no retained secretions. The most effective therapy is:","opts":["CPAP at 5–10 cm H₂O every 4–6 hours, up to 30 minutes","Incentive spirometry 10 breaths every hour while awake","Postural drainage with percussion and vibration q4h","Nasotracheal suctioning every 2 hours as needed"],"key":0,"why":"Among the therapies for postoperative atelectasis, CPAP has proven most effective, especially in patients who are hypoxemic with a P/F ratio below 300 but without retained secretions, where it can decrease the incidence of intubation and pneumonia. Typically 5 to 10 cm H₂O is applied every 4 to 6 hours for up to 30 minutes per session.","src":[[16333,16341]],"origin":"heuer","age":"adult"},{"id":"C10-Q15","sec":"III-B","lvl27":"integ","topic":"IPPB","stem":"To deliver a PRECISE FiO₂ with a pneumatically powered IPPB unit, you must:","opts":["Use an O₂ blender and turn the air mix OFF","Turn the air mix ON to entrain a fixed amount of air","Bleed 100% O₂ into the delivery circuit of the unit","Use the nebulizer flow to dilute the source gas"],"key":0,"why":"To provide a precise FiO₂ with a pneumatically powered IPPB unit, attach it to an O₂ blender and set the device to deliver pure source gas by turning off air mix. Without a blender, pneumatic units deliver either 100% O₂ or an air mixture varying between 0.40 and 0.60. Bleeding 100% O₂ into the circuit gives only moderate, inexact concentrations and applies to ELECTRICALLY powered units.","src":[[16319,16329]],"origin":"heuer","age":"adult"},{"id":"C11-Q01","sec":"III-C","lvl27":"recall","topic":"High-frequency ventilation","stem":"High-frequency ventilation operates at what frequency range and tidal volume?","opts":["150–900 breaths/min, VT 1–2 mL/kg","60–150 breaths/min, VT 4–6 mL/kg","900–1500 breaths/min, VT 3–5 mL/kg","30–60 breaths/min, VT 6–8 mL/kg"],"key":0,"why":"High-frequency ventilation is mechanical ventilation at frequencies between 150 and 900 breaths per minute, with tidal volumes as small as 1–2 mL/kg — significantly less than the anatomic deadspace.","src":[[17363,17365]],"origin":"heuer","age":"adult"},{"id":"C11-Q02","sec":"III-C","lvl27":"recall","topic":"Hypoxemia thresholds","stem":"Documented hypoxemia in an INFANT is generally defined as a PaO₂ less than:","opts":["50 torr","60 torr","70 torr","40 torr"],"key":0,"why":"Documented hypoxemia exists in adults when the PaO₂ is less than 60 torr or the arterial saturation is less than 90%. Due to the potential hazards of oxygen therapy, the threshold for infants is lower and generally defined as a PaO₂ less than 50 torr.","src":[[16591,16594]],"origin":"heuer","age":"child"},{"id":"C11-Q03","sec":"III-C","lvl27":"recall","topic":"CPAP for sleep apnea","stem":"Optimal control of sleep apnea on CPAP is indicated by an apnea-hypopnea index of:","opts":["Less than 5/hour","Less than 15/hour","Less than 30/hour","Less than 1/hour"],"key":0,"why":"Assess CPAP effectiveness by the apnea-hypopnea index, with optimum control indicated by an AHI below 5 per hour. CPAP level is set by prescription or auto-CPAP to a maximum of 15 cm H₂O.","src":[[16737,16739]],"origin":"heuer","age":"adult"},{"id":"C11-Q04","sec":"III-C","lvl27":"integ","topic":"Oxygen therapy goals","stem":"In an otherwise healthy patient, oxygen should be titrated to the lowest level maintaining:","opts":["PaO₂ of 80–100 torr with saturation ≥ 92%","PaO₂ of 55–60 torr with saturation ≥ 88%","PaO₂ above 150 torr","Saturation of 100% at all times"],"key":0,"why":"In otherwise healthy patients, adjust flow and FiO₂ to the lowest level needed to maintain normal oxygenation — a PaO₂ of 80–100 torr with saturation of 92% or more. If you cannot maintain normal oxygenation on less than 50% oxygen, accept a PaO₂ of 55–60 torr with SaO₂/SpO₂ of 88% or more.","src":[[16606,16610]],"origin":"heuer","age":"adult"},{"id":"C11-Q05","sec":"III-C","lvl27":"integ","topic":"Oxygen therapy goals","stem":"For a patient with chronic hypercapnia, the PaO₂ target is:","opts":["55–60 torr, to prevent O₂-induced hypoventilation","80–100 torr, the same target as for any adult","Above 100 torr, to maximize the arterial O₂ content","40–50 torr, to preserve the hypoxic drive to breathe"],"key":0,"why":"For patients with chronic hypercapnia, aim to keep the PaO₂ in the range of 55–60 torr to prevent depression of ventilation — O₂-induced hypoventilation.","src":[[16614,16615]],"origin":"heuer","age":"adult"},{"id":"C11-Q06","sec":"III-C","lvl27":"integ","topic":"Oxygen therapy goals","stem":"In a low birth weight or preterm neonate at risk for retinopathy of prematurity, the PaO₂ goal is:","opts":["50–80 torr","80–100 torr","30–50 torr","Above 100 torr"],"key":0,"why":"In low birth weight or preterm neonates at risk for retinopathy of prematurity, the goal should be a PaO₂ in the range of 50–80 torr.","src":[[16616,16617]],"origin":"heuer","age":"child"},{"id":"C11-Q07","sec":"III-C","lvl27":"integ","topic":"Prone positioning","stem":"A prone positioning trial is recommended for ARDS when oxygenation remains inadequate on:","opts":["FiO₂ ≥ 0.6 and PEEP ≥ 10 cm H₂O","FiO₂ ≥ 0.4 and PEEP ≥ 5 cm H₂O","FiO₂ ≥ 1.0 and PEEP ≥ 20 cm H₂O","Any FiO₂ if the P/F ratio is below 300"],"key":0,"why":"A prone positioning trial is recommended for patients with ARDS if oxygenation is inadequate on FiO₂ of 0.6 or more and PEEP of 10 cm H₂O or more. It should be maintained for a minimum of 12 hours at a time as tolerated.","src":[[16665,16675]],"origin":"heuer","age":"adult"},{"id":"C11-Q08","sec":"III-C","lvl27":"integ","topic":"Prone positioning","stem":"Prone positioning is NOT recommended for which patient?","opts":["One who is morbidly obese or at high risk of needing CPR","One with ARDS and refractory hypoxemia on a high FiO₂","One whose oxygenation is inadequate on high PEEP","One whose abdomen can be freely suspended when turned prone"],"key":0,"why":"Proning is not recommended for patients whose heads cannot be in a face-down position, those with circulatory problems, those with a fractured pelvis, those who are morbidly obese, or those at high risk for needing cardiopulmonary resuscitation. Major risks include extubation and dislodgement of intravascular catheters.","src":[[16675,16682]],"origin":"heuer","age":"adult"},{"id":"C11-Q09","sec":"III-C","lvl27":"integ","topic":"Procedure-associated hypoxemia","stem":"During suctioning the patient's SpO₂ falls from 96% to 86%. You should:","opts":["Stop the procedure at once and give 100% O₂","Increase the FiO₂ by 10% and continue the pass","Continue, but shorten each pass to 5 seconds","Reduce the vacuum pressure and continue"],"key":0,"why":"For mild hypoxemia — an SpO₂ drop of more than 4–5% that remains at or above 88–90% — increase the FiO₂. For moderate to severe hypoxemia, where the SpO₂ drops below 88–90%, immediately terminate the procedure and administer 100% O₂.","src":[[16696,16699]],"origin":"heuer","age":"adult"},{"id":"C11-Q10","sec":"III-C","lvl27":"integ","topic":"CPAP for pulmonary edema","stem":"CPAP for cardiogenic pulmonary edema should be avoided if:","opts":["SBP < 90 mm Hg, acute MI, GCS ≤ 8, or a need for intubation","The patient is hypoxemic on room air, with an SpO₂ of 85%","The SpO₂ remains below 95% on a nonrebreathing mask","The patient has stable COPD without hypercapnia or acidosis"],"key":0,"why":"Avoid CPAP for cardiogenic pulmonary edema if the systolic blood pressure is below 90 mm Hg, there is an acute MI, the Glasgow Coma Scale is 8 or less, or intubation is needed. Otherwise start therapy at 10 cm H₂O and 100% O₂, titrating pressure and FiO₂ to maintain SpO₂ above 90%.","src":[[16748,16753]],"origin":"heuer","age":"adult"},{"id":"C11-Q11","sec":"III-C","lvl27":"integ","topic":"Neonatal CPAP","stem":"Initial settings for neonatal CPAP are:","opts":["4–6 cm H₂O at 40–50% O₂, flow 5–10 L/min","10 cm H₂O at 100% O₂, flow 15 L/min","8–10 cm H₂O at 60% O₂, flow 2 L/min","2 cm H₂O at 21% O₂, flow 20 L/min"],"key":0,"why":"For neonates, set the flow to 5–10 L/min on continuous-flow systems such as bubble CPAP and start therapy at 4–6 cm H₂O with 40–50% O₂. Adjust to maintain SpO₂ of 87–93%, minimize chest retractions and grunting, and improve aeration on chest x-ray.","src":[[16765,16768]],"origin":"heuer","age":"child"},{"id":"C11-Q12","sec":"III-C","lvl27":"integ","topic":"Neonatal CPAP","stem":"Neonatal CPAP should be avoided in an infant with:","opts":["Congenital diaphragmatic hernia or choanal atresia","Infant respiratory distress syndrome (IRDS)","Apnea of prematurity with bradycardia","Mild chest retractions with expiratory grunting"],"key":0,"why":"Avoid CPAP in infants with a congenital diaphragmatic hernia, tracheoesophageal fistula, choanal atresia, severe cardiovascular instability, or hypercapnic respiratory failure with a PaCO₂ above 60 torr and pH below 7.25. IRDS and apnea of prematurity are indications.","src":[[16759,16761]],"origin":"heuer","age":"child"},{"id":"C11-Q13","sec":"III-C","lvl27":"integ","topic":"Ventilator initiation","stem":"The NBRC generally expects an initial tidal volume setting of:","opts":["6–8 mL/kg of predicted body weight","10–12 mL/kg of actual body weight","4–5 mL/kg of predicted body weight","8–10 mL/kg of actual body weight"],"key":0,"why":"The NBRC generally expects an initial setting of 6–8 mL/kg of predicted body weight for most patients, except those with acute hypoxemic respiratory failure who follow the NHLBI ARDS protocol. Either volume or pressure control is satisfactory as long as the setting delivers 6–8 mL/kg of PBW to minimize barotrauma.","src":[[16848,16850],[16861,16864]],"origin":"heuer","age":"adult"},{"id":"C11-Q14","sec":"III-C","lvl27":"integ","topic":"BiPAP indications","stem":"BiPAP generally should NOT be used in a patient with:","opts":["A pH below 7.20","Hypercapnic respiratory failure from COPD","Acute cardiogenic pulmonary edema","Chronic hypoventilation syndrome"],"key":0,"why":"BiPAP should generally not be used with respiratory or cardiac arrest, a pH below 7.20, an uncooperative patient, excessive airway secretions, the need for airway protection or high aspiration risk, upper airway obstruction, hemodynamic instability, uncontrolled arrhythmias, active upper GI bleeding, facial burns or trauma, or nausea and vomiting. COPD hypercapnic failure and cardiogenic pulmonary edema are indications.","src":[[17226,17236],[17216,17220]],"origin":"heuer","age":"adult"},{"id":"C11-Q15","sec":"III-C","lvl27":"integ","topic":"BiPAP settings","stem":"IPAP levels during BiPAP should be kept below what pressure, and why?","opts":["20–25 cm H₂O, to avoid gastric insufflation","30 cm H₂O, to prevent alveolar barotrauma","15 cm H₂O, to preserve patient comfort","40 cm H₂O, the pressure limit of the blower"],"key":0,"why":"Keep IPAP levels less than 20–25 cm H₂O — the esophageal opening pressure — to avoid gastric insufflation.","src":[[17287,17288]],"origin":"heuer","age":"adult"},{"id":"C11-Q16","sec":"III-C","lvl27":"integ","topic":"BiPAP settings","stem":"Typical initial BiPAP settings include an IPAP of what, and a backup rate of at least what?","opts":["IPAP 10–15 cm H₂O, backup rate ≥ 8/min","IPAP 20 cm H₂O, with no backup rate","IPAP 5 cm H₂O, backup rate of 20/min","IPAP 25–30 cm H₂O, backup rate of 4/min"],"key":0,"why":"Initial IPAP is 10–15 cm H₂O, adjusted to normalize pH and PaCO₂, with initial EPAP of 5 cm H₂O. The rate is patient determined but set a backup rate of at least 8/min.","src":[[17302,17318]],"origin":"heuer","age":"adult"},{"id":"C11-Q17","sec":"III-C","lvl27":"integ","topic":"High-frequency ventilation","stem":"Which statement correctly contrasts HFOV and HFJV?","opts":["HFOV: both phases active; HFJV: active inspiration, passive exhalation","HFOV: both phases passive; HFJV: both inspiration and exhalation active","HFOV: passive exhalation; HFJV: both inspiration and exhalation active","HFOV and HFJV: active inspiration and passive exhalation"],"key":0,"why":"HFOV gas delivery is driven by an oscillating rubber diaphragm that pushes gas forward and draws it back, so both inspiration and exhalation are active — unlike conventional ventilation. HFJV uses an interrupter valve creating intermittent jets, so inspiration is active but exhalation is passive.","src":[[17384,17391]],"origin":"heuer","age":"adult"},{"id":"C11-Q18","sec":"III-C","lvl27":"integ","topic":"High-frequency ventilation","stem":"How does the Bunnell LifePulse HFJV device differ in setup from the CareFusion 3100A HFOV?","opts":["The LifePulse runs with a conventional ventilator for PEEP, FiO₂, and IMV","The LifePulse is free-standing and needs no other ventilator alongside","The LifePulse is used in adults, while the 3100A is used in infants","The LifePulse provides active exhalation, while the 3100A does not"],"key":0,"why":"Unlike the free-standing CareFusion HFOV device, the Bunnell LifePulse is always used in conjunction with a conventional ventilator, which provides the background PEEP, FiO₂, and IMV breaths as needed. Its application is limited to infants and small children.","src":[[17392,17398]],"origin":"heuer","age":"adult"},{"id":"C11-Q19","sec":"III-C","lvl27":"integ","topic":"Shunt recognition","stem":"A patient's PaO₂ is 48 torr on an FiO₂ of 0.60. This indicates:","opts":["Significant shunting; O₂ therapy alone will be insufficient","Simple hypoxemia; the FiO₂ needs to be raised to 0.80","An expected response to oxygen therapy at this FiO₂","A simple V/Q mismatch that will respond to more oxygen"],"key":0,"why":"Hypoxemia is due to significant shunting when the P/F ratio drops below 200 or you cannot maintain adequate arterial oxygenation on 50% or more oxygen — that is, PaO₂ of 50 torr or less on an FiO₂ of 0.50 or more. When hypoxemia is caused by shunting, O₂ therapy alone is insufficient; the recommended treatment is CPAP or PEEP.","src":[[16595,16603]],"origin":"heuer","age":"adult"},{"id":"C11-Q20","sec":"III-C","lvl27":"integ","topic":"Prone positioning","stem":"Thirty minutes after proning, a patient's PaO₂ has risen by 14 torr. This indicates:","opts":["A good sign of success; continue proning ≥ 12 hours as tolerated","Failure, because a rise of at least 30 torr is required in 30 minutes","An equivocal result; repeat the ABG in 4 hours before deciding","A poor response; return the patient to supine immediately"],"key":0,"why":"Not all patients benefit from proning. An increase in PaO₂ of more than 10 torr in the first 30 minutes is a good indicator of success. Proning should be maintained for a minimum of 12 hours at a time, as tolerated.","src":[[16669,16675]],"origin":"heuer","age":"adult"},{"id":"C11-Q21","sec":"III-C","lvl27":"integ","topic":"Mode selection","stem":"A patient on volume control requires plateau pressures above 30 cm H₂O. You should recommend:","opts":["Switch to pressure control at a limit of ≤ 30 cm H₂O","Increase the inspiratory flow to lower the plateau pressure","Add PEEP to reduce the plateau pressure","Accept the pressure, because the volume is guaranteed"],"key":0,"why":"To help avoid or worsen lung injury, patients requiring plateau pressures higher than 30 cm H₂O during VC ventilation should probably be switched to pressure control at a safe pressure limit — 30 cm H₂O or less.","src":[[16852,16855]],"origin":"heuer","age":"adult"},{"id":"C11-Q22","sec":"III-C","lvl27":"integ","topic":"Mode comparison","stem":"A key DISADVANTAGE of pressure control compared with volume control is that:","opts":["VT varies with compliance and resistance, and changes are hard to detect","Airway pressures rise as compliance falls, which risks barotrauma","The fixed square-wave flow pattern causes patient–ventilator asynchrony","It cannot deliver a decelerating flow pattern during inspiration"],"key":0,"why":"With pressure control, VT varies with changes in CRS and Raw, and those changes are difficult to detect, so tidal volume and minute ventilation must be monitored closely. Rising airway pressures with falling compliance and a fixed square flow pattern causing asynchrony are disadvantages of VOLUME control.","src":[[16878,16889]],"origin":"heuer","age":"adult"},{"id":"C11-Q23","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"In a PEEP study during volume control ventilation, which measurement identifies optimal PEEP?","opts":["The PEEP with the smallest Pplat − PEEP, so the highest static compliance","The PEEP level that produces the highest peak inspiratory pressure","The PEEP level that produces the lowest plateau pressure, whatever the PEEP","The PEEP level at which the PIP and the plateau pressure converge"],"key":0,"why":"Disregard the peak pressure — it is there to confuse you. What matters is the difference between plateau pressure and PEEP. Because tidal volume is constant, the smaller this difference, the greater the compliance, since CRS = VT ÷ (Pplat − PEEP).","src":[[17119,17131]],"origin":"heuer","age":"adult"},{"id":"C11-Q24","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"During a PEEP study, static compliance peaks at 35 mL/cm H₂O when PEEP is set at 10 cm H₂O. Optimal PEEP for this patient is:","opts":["10 cm H₂O","35 cm H₂O","5 cm H₂O","20 cm H₂O"],"key":0,"why":"Based on the static compliance method, the optimal PEEP for this patient is 10 cm H₂O — the level yielding the highest static compliance of 35 mL/cm H₂O.","src":[[17130,17131]],"origin":"heuer","age":"adult"},{"id":"C11-Q25","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"Using the equal pressure method during PC ventilation, a patient's exhaled VT is 390 mL at PEEP 5, 410 mL at PEEP 10, 430 mL at PEEP 15, and 380 mL at PEEP 20. Optimal PEEP is:","opts":["15 cm H₂O","10 cm H₂O","20 cm H₂O","5 cm H₂O"],"key":0,"why":"With the equal pressure method you maintain a constant ΔP (PIP − PEEP), typically 15–25 cm H₂O, and assess the exhaled VT; the largest volume represents optimal PEEP. Here the optimal PEEP is 15 cm H₂O, corresponding to the maximum volume change for a given ΔP at 430 mL.","src":[[17132,17153]],"origin":"heuer","age":"adult"},{"id":"C11-Q26","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"Once the lower inflection point (LIP) is identified on a static pressure-volume curve, PEEP is typically set:","opts":["2–3 cm H₂O above the LIP","At the LIP exactly","5–10 cm H₂O below the LIP","At the upper inflection point"],"key":0,"why":"The minimum pressure needed to prevent alveolar collapse corresponds to the lowest pressure needed to exceed the pressure required to open collapsed alveoli — the lower inflection point. Once measured, PEEP is typically set 2–3 cm H₂O above the LIP.","src":[[17176,17179]],"origin":"heuer","age":"adult"},{"id":"C11-Q27","sec":"III-C","lvl27":"integ","topic":"Pressure-volume curve","stem":"On a static pressure-volume curve, a low slope at HIGH pressures and volumes (the \"beak sign\") indicates:","opts":["Overdistention — the limit of elastic expansion is reached","High pressures are needed to open collapsed alveoli","The safe, efficient zone for tidal volume exchange","An air leak in the circuit during the slow inflation"],"key":0,"why":"The slope of any line on the P-V graph equals compliance. A low slope at low pressures and volumes indicates that high pressures are needed to open collapsed alveoli; a steep slope at moderate volumes is the sweet spot for safe and efficient volume exchange; and a low slope at high pressures and volumes indicates the limits of elastic expansion have been reached, with overdistention occurring — the beak sign.","src":[[17166,17174]],"origin":"heuer","age":"adult"},{"id":"C11-Q28","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"Using volumetric capnography to set PEEP, optimum PEEP is reached:","opts":["Just before the %VTCO₂ begins to fall","When the %VTCO₂ reaches zero","At the highest PEEP the patient tolerates","When the %VTCO₂ first begins to rise"],"key":0,"why":"As PEEP rises and additional perfused alveoli are recruited, the %VTCO₂ increases. If PEEP becomes high enough to overdistend alveoli, deadspace increases, lung perfusion is impeded, and %VTCO₂ begins to fall. Optimum PEEP is reached just before the %VTCO₂ begins to fall.","src":[[17191,17196]],"origin":"heuer","age":"adult"},{"id":"C11-Q29","sec":"III-C","lvl27":"integ","topic":"Optimal PEEP","stem":"Using the oxygen-delivery approach with noninvasive surrogates, optimum PEEP is the level that:","opts":["Keeps SpO₂ ≥ 88–90% without lowering the blood pressure","Gives the highest possible SpO₂, whatever the blood pressure","Gives the lowest plateau pressure during the PEEP study","Maximizes the peak inspiratory pressure for recruitment"],"key":0,"why":"The NBRC may substitute arterial blood pressure as an indicator of cardiac output and SpO₂ for ABGs. Using these data, optimum PEEP is the level needed to maintain SpO₂ at 88–90% or above without lowering blood pressure — and you would back off any PEEP increase that significantly lowers blood pressure. PEEP is optimized when the desired increase in CaO₂ is not offset by decreases in cardiac output.","src":[[17096,17107]],"origin":"heuer","age":"adult"},{"id":"C11-Q30","sec":"III-C","lvl27":"integ","topic":"Respiratory mechanics","stem":"Bedside estimates of respiratory mechanics for PEEP titration require:","opts":["Relaxed respiratory muscles and ≥ 2–3 seconds of zero flow","Preserved spontaneous breathing effort during each measurement","A pulmonary artery catheter in place to measure cardiac output","An FiO₂ of 1.0 maintained throughout the whole PEEP study"],"key":0,"why":"Common to the mechanics-based methods is that bedside estimates require complete relaxation of the patient's respiratory muscles and adequate time under static conditions of zero flow for airway and alveolar pressures to equilibrate — at least 2–3 seconds. Getting accurate data can be challenging and may require sedation or paralysis.","src":[[17108,17113]],"origin":"heuer","age":"adult"},{"id":"C11-Q31","sec":"III-C","lvl27":"integ","topic":"BiPAP vs CPAP+PS","stem":"An order reads \"CPAP + PS of 5+10 cm H₂O.\" The resulting PIP and driving pressure are:","opts":["PIP 15 cm H₂O, ΔP 10 cm H₂O","PIP 10 cm H₂O, ΔP 5 cm H₂O","PIP 5 cm H₂O, ΔP 10 cm H₂O","PIP 15 cm H₂O, ΔP 15 cm H₂O"],"key":0,"why":"With CPAP+PS, the PS level is the pressure ABOVE CPAP. A CPAP+PS order of 5+10 cm H₂O means a CPAP of 5 cm H₂O plus 10 cm H₂O of pressure support, giving a PIP of 15 cm H₂O and a driving pressure of 15 − 5, or 10 cm H₂O.","src":[[17262,17267]],"origin":"heuer","age":"adult"},{"id":"C11-Q32","sec":"III-C","lvl27":"integ","topic":"BiPAP vs CPAP+PS","stem":"An order reads \"BiPAP 5/10 cm H₂O\" (EPAP/IPAP). The resulting PIP and driving pressure are:","opts":["PIP 10 cm H₂O, ΔP 5 cm H₂O","PIP 15 cm H₂O, ΔP 10 cm H₂O","PIP 10 cm H₂O, ΔP 10 cm H₂O","PIP 5 cm H₂O, ΔP 5 cm H₂O"],"key":0,"why":"With BiPAP you independently set IPAP and EPAP. An order for BiPAP 5/10 cm H₂O looks similar to a CPAP+PS order but results in a PIP equal to the IPAP of 10 cm H₂O, and a ΔP only half as large: 10 − 5 = 5 cm H₂O.","src":[[17268,17272]],"origin":"heuer","age":"adult"},{"id":"C11-Q33","sec":"III-C","lvl27":"integ","topic":"BiPAP adjustment","stem":"A patient is on BiPAP 10/5 cm H₂O IPAP/EPAP. You need to improve OXYGENATION ONLY. You should:","opts":["Raise both equally, e.g. to 12/7 cm H₂O","Raise the IPAP alone, to 15 cm H₂O","Lower the EPAP alone, to 3 cm H₂O","Lower both equally, e.g. to 8/3 cm H₂O"],"key":0,"why":"Increase both IPAP and EPAP equally — to 12/7 cm H₂O, an increase of 2 cm H₂O each. This keeps ΔP constant so ventilation is unchanged, while the increase in baseline pressure may help improve oxygenation.","src":[[17341,17345]],"origin":"heuer","age":"adult"},{"id":"C11-Q34","sec":"III-C","lvl27":"integ","topic":"BiPAP adjustment","stem":"A patient is on BiPAP 10/5 cm H₂O IPAP/EPAP. You need to increase VENTILATION ONLY. You should:","opts":["Increase only the IPAP, to 15 cm H₂O","Increase both IPAP and EPAP equally to 12/7 cm H₂O","Increase only the EPAP to 8 cm H₂O","Decrease the IPAP to 8 cm H₂O"],"key":0,"why":"Increase only the IPAP, to 15 cm H₂O. This increases ΔP and therefore ventilation, but because the baseline pressure is unchanged it will not have a major effect on oxygenation. Alternatively, if oxygenation is stable and comfort is an issue, you could decrease the EPAP by 2 cm H₂O to 3 cm H₂O, which also increases ΔP.","src":[[17346,17353]],"origin":"heuer","age":"adult"},{"id":"C11-Q35","sec":"III-C","lvl27":"integ","topic":"BiPAP adjustment","stem":"A patient on BiPAP 10/5 cm H₂O needs BOTH improved oxygenation and increased ventilation. You should:","opts":["Raise both, IPAP more — e.g. 15/7 cm H₂O","Raise both equally — e.g. 15/10 cm H₂O","Raise EPAP more than IPAP — 12/9 cm H₂O","Raise IPAP alone — to 20/5 cm H₂O"],"key":0,"why":"Increase both IPAP and EPAP, but increase IPAP more than EPAP — IPAP to 15 cm H₂O and EPAP to 7 cm H₂O. This increases ΔP, increasing ventilation, while also raising the baseline pressure, which may help improve oxygenation.","src":[[17354,17359]],"origin":"heuer","age":"adult"},{"id":"C11-Q36","sec":"III-C","lvl27":"integ","topic":"BiPAP adjustment","stem":"On BiPAP, a patient's PaCO₂ is rising and pH is falling. The correct adjustment is:","opts":["Increase IPAP or ΔP, and the backup rate if the patient's rate is low","Decrease IPAP or ΔP, and lower the backup rate to reduce the work","Increase EPAP while keeping ΔP constant, and leave the rate alone","Increase the FiO₂, and leave the IPAP and EPAP unchanged"],"key":0,"why":"To decrease PaCO₂ or raise pH, increase IPAP or increase ΔP, and also increase the mandatory rate if the patient rate is low. To increase PaCO₂ or lower pH, decrease IPAP or ΔP. Oxygenation is instead adjusted via FiO₂ and EPAP.","src":[[17320,17327]],"origin":"heuer","age":"adult"},{"id":"C11-Q37","sec":"III-C","lvl27":"integ","topic":"BiPAP adjustment","stem":"A patient on BiPAP has a PaO₂ of 48 torr on an FiO₂ of 0.55. The correct adjustment is:","opts":["Raise EPAP, keeping ΔP constant (shunting)","Raise the FiO₂ to 0.70 (V/Q mismatch)","Raise the IPAP alone (hypoventilation)","Lower the EPAP to reduce the deadspace"],"key":0,"why":"If simple V/Q imbalance is present and FiO₂ is below 0.50, raise the FiO₂. If shunting is present — PaO₂ of 50 torr or less with FiO₂ of 0.50 or more — increase EPAP, keeping ΔP constant to avoid altering the PaCO₂.","src":[[17324,17327]],"origin":"heuer","age":"adult"},{"id":"C11-Q38","sec":"III-C","lvl27":"integ","topic":"BiPAP weaning","stem":"As a patient's oxygenation improves on BiPAP, the correct order of weaning is:","opts":["FiO₂ first to ≤ 0.50, then EPAP with ΔP kept constant","EPAP first to 5 cm H₂O, then the FiO₂ to ≤ 0.50","IPAP and EPAP together first, then the FiO₂ alone","The backup rate first, then the FiO₂ and EPAP"],"key":0,"why":"When oxygenation improves, first decrease FiO₂ until it is 0.50 or less, and then lower EPAP — keeping ΔP constant to avoid altering the PaCO₂.","src":[[17328,17330]],"origin":"heuer","age":"adult"},{"id":"C11-Q39","sec":"III-C","lvl27":"integ","topic":"High-frequency ventilation","stem":"Why might HFV reduce ventilator-associated lung injury?","opts":["Less pressure reaches the distal airways and alveoli","It eliminates the need for PEEP and recruitment","Both HFOV and HFJV use active exhalation to prevent air trapping","It uses tidal volumes larger than the deadspace"],"key":0,"why":"Because less pressure is transmitted to the distal airways and alveoli, HFV may decrease the risk of ventilator-associated lung injuries such as barotrauma and bronchopulmonary dysplasia in neonates. HFV may also improve gas exchange in the presence of air leaks such as persistent pneumothoraces or PIE.","src":[[17367,17371]],"origin":"heuer","age":"adult"},{"id":"C11-Q40","sec":"III-C","lvl27":"integ","topic":"High-frequency ventilation","stem":"Based on current evidence, when should HFV NOT be applied?","opts":["When conventional ventilation is adequate, or as rescue therapy","In any neonate with meconium aspiration syndrome and PPHN","Whenever a persistent pulmonary air leak is present on the x-ray","In neonates with severe respiratory distress syndrome"],"key":0,"why":"Based on current evidence, HFV should not be applied if conventional ventilation can provide adequate patient support, and it should not be used as rescue therapy. Recent studies have shown a transient improvement in oxygenation but an increase in mortality among ARDS patients. Meconium aspiration, air leaks, and severe IRDS are among the indications.","src":[[17379,17383]],"origin":"heuer","age":"adult"},{"id":"C11-Q41","sec":"III-C","lvl27":"integ","topic":"High-frequency ventilation","stem":"Which is a relative CONTRAINDICATION to high-frequency ventilation?","opts":["Hypotension, air trapping, or neonatal intracranial hemorrhage","Severe ARDS complicated by an air-leak syndrome","Bronchopulmonary dysplasia in a premature infant","Congenital diaphragmatic hernia with hypoplastic lungs"],"key":0,"why":"Relative contraindications to HFV include hypotension or unstable cardiovascular status, the presence of air trapping or dynamic hyperinflation, and, among neonates, intracranial hemorrhage. Severe ARDS with air leak, BPD, and congenital diaphragmatic hernia are indications.","src":[[17372,17379]],"origin":"heuer","age":"adult"},{"id":"C11-Q42","sec":"III-C","lvl27":"integ","topic":"Suctioning and hypoxemia","stem":"For a patient on invasive ventilatory support for hypoxemic respiratory failure, which suctioning approach best prevents derecruitment?","opts":["A closed in-line catheter, then a recruitment maneuver if volume was lost","Open suctioning with sterile technique and a 20-second pass","Disconnecting from the ventilator and bagging with room air between passes","Instilling saline before each pass to loosen and thin the secretions"],"key":0,"why":"If the patient is receiving invasive ventilatory support for hypoxemic respiratory failure, use an in-line/closed catheter system (ideal) or a bronchoscope ventilator adapter. Use the ventilator's 100% O₂ button if available, and recommend or implement a lung recruitment maneuver after any suctioning episode likely to have reduced lung volume, such as a loss of PEEP.","src":[[16709,16716]],"origin":"heuer","age":"adult"},{"id":"C11-Q43","sec":"III-C","lvl27":"integ","topic":"Full ventilatory support","stem":"Which modes constitute FULL ventilatory support for an intubated patient in respiratory failure?","opts":["A/C or normal-rate SIMV (VC or PC), usually with PS, or PRVC","CPAP with pressure support alone, titrated to a VT of 6–8 mL/kg","Low-rate SIMV without pressure support, with a rate of 4/min","Pressure support alone at 20 cm H₂O, with no backup rate"],"key":0,"why":"In NBRC scenarios you generally start an intubated patient in respiratory failure on full ventilatory support, with the ventilator initially responsible for the full minute volume and workload. Full ventilatory support modes include A/C (VC or PC) and normal-rate SIMV (VC or PC), usually with PS, or dual-mode ventilation such as PRVC.","src":[[16798,16803]],"origin":"heuer","age":"adult"},{"id":"C11-Q44","sec":"III-C","lvl27":"integ","topic":"CPAP intolerance","stem":"A patient with sleep apnea cannot tolerate CPAP. Appropriate recommendations include:","opts":["Alternative masks, humidity, ramp, auto-titration, or BiPAP","Discontinuing the therapy permanently after 2 weeks","Increasing the CPAP above 15 cm H₂O to overcome obstruction","Switching to supplemental oxygen alone at night"],"key":0,"why":"If the patient cannot tolerate CPAP, assess and recommend equipment or interface alternatives to improve tolerance — various mask options, humidification, the ramp feature, auto-titration, and pressure relief such as C-flex, expiratory pressure relief, or bilevel positive airway pressure. CPAP is set by prescription or auto-CPAP to a maximum of 15 cm H₂O.","src":[[16737,16743]],"origin":"heuer","age":"adult"},{"id":"C11-Q45","sec":"III-C","lvl27":"integ","topic":"Neonatal CPAP escalation","stem":"An infant on CPAP of 8 cm H₂O and FiO₂ 0.65 has a PaO₂ of 45 torr. You should:","opts":["Switch to ventilatory support","Increase the CPAP to 12 cm H₂O","Increase the FiO₂ to 1.0 and continue CPAP","Decrease the CPAP to reduce overdistention"],"key":0,"why":"Switch to ventilatory support if the PaO₂ is below 50 torr on CPAP above 7 cm H₂O and FiO₂ above 0.60, or if hypercapnic respiratory failure develops.","src":[[16769,16770]],"origin":"heuer","age":"child"},{"id":"C12-Q01","sec":"III-D","lvl27":"recall","topic":"Inhaled antibiotics","stem":"Aerosolized antibiotics such as Colistin, Cayston, and TOBI are generally indicated only in patients with:","opts":["Cystic fibrosis with Pseudomonas aeruginosa infection","Community-acquired pneumonia from Streptococcus pneumoniae","Ventilator-associated pneumonia from any organism","Chronic bronchitis with a gram-positive organism"],"key":0,"why":"Aerosolized antibiotics (Colistin, Cayston, TOBI) are generally indicated only in patients with cystic fibrosis and suspected or confirmed Pseudomonas aeruginosa (gram-negative) pulmonary infections.","src":[[18320,18322]],"origin":"heuer","age":"adult"},{"id":"C12-Q02","sec":"III-D","lvl27":"recall","topic":"Inhaled steroids","stem":"Which inhaled steroid preparation is NOT intended for MDI or DPI delivery?","opts":["Budesonide suspension (Pulmicort Respules), for nebulization","Fluticasone (Flovent HFA)","Beclomethasone (QVAR RediHaler)","Mometasone (Asmanex Twisthaler)"],"key":0,"why":"Except for budesonide inhalation suspension (Pulmicort Respules), which is given by nebulizer, common inhaled steroid preparations are intended for use in an MDI or DPI, so proper patient technique is critical. (Budesonide is also available as a DPI, the Pulmicort Flexhaler.)","src":[[18377,18379]],"origin":"heuer","age":"adult"},{"id":"C12-Q03","sec":"III-D","lvl27":"recall","topic":"MDI technique","stem":"Optimal MDI technique includes actuating during a deep inhalation of what duration, followed by what breath-hold?","opts":["3–5 second inhalation, then a 10-second hold","1-second inhalation, then a 3-second hold","10-second inhalation, then a 3-second hold","Rapid, forceful inhalation with no breath-hold"],"key":0,"why":"The patient should open the mouth wide, keep the tongue down, and actuate during a 3- to 5-second deep inhalation, followed by a 10-second breath-hold. Holding the MDI 2 inches away from the open mouth may enhance lung deposition.","src":[[18544,18554]],"origin":"heuer","age":"adult"},{"id":"C12-Q04","sec":"III-D","lvl27":"integ","topic":"Medication sequencing","stem":"A cystic fibrosis patient is prescribed a bronchodilator, a mucolytic, an inhaled steroid, an aerosolized antibiotic, and airway clearance therapy. The correct order is:","opts":["Bronchodilator, mucolytic, airway clearance, steroid, antibiotic","Antibiotic, steroid, mucolytic, bronchodilator, airway clearance","Steroid, bronchodilator, antibiotic, mucolytic, airway clearance","Airway clearance, bronchodilator, steroid, mucolytic, antibiotic"],"key":0,"why":"If the patient is receiving several inhaled medications, the recommended order is bronchodilator first, followed by mucolytic, then airway clearance therapy, then steroids, and finally the aerosolized antibiotic.","src":[[18323,18325]],"origin":"heuer","age":"adult"},{"id":"C12-Q05","sec":"III-D","lvl27":"integ","topic":"Beta agonists","stem":"Which beta agonist property should you generally seek when recommending a bronchodilator?","opts":["Least β1 and most β2 effect, such as albuterol","Most β1 effect, to support the cardiac output","Equal β1 and β2 activity, such as isoproterenol","Pure alpha-adrenergic activity, such as phenylephrine"],"key":0,"why":"All β-agonists have some cardiovascular and CNS effects. In general, recommend those with the least β1 (cardiac) and most β2 (bronchodilation) effects, such as albuterol or its isomer levalbuterol.","src":[[18338,18340]],"origin":"heuer","age":"adult"},{"id":"C12-Q06","sec":"III-D","lvl27":"integ","topic":"Acute asthma","stem":"During an acute asthma exacerbation, the standard bronchodilator dose should be:","opts":["Every 20 minutes up to three times, or continuously","Once, and then reassessed after 4 hours","Every 5 minutes up to ten times in a row","Replaced by a long-acting β-agonist twice daily"],"key":0,"why":"In acute exacerbations of asthma, repeat the standard dose every 20 minutes up to three times, or provide continuous nebulization until symptoms are relieved.","src":[[18346,18348]],"origin":"heuer","age":"adult"},{"id":"C12-Q07","sec":"III-D","lvl27":"integ","topic":"Long-acting beta agonists","stem":"Which statement about long-acting β-agonists (LABAs) in asthma is correct?","opts":["They may raise the risk of death; use only with inhaled steroids, never for rescue","They are the drug of choice for treating acute exacerbations of asthma in the ED","They should be used as monotherapy for mild persistent asthma in adults and teens","They have no cardiovascular effects, unlike short-acting β-agonists"],"key":0,"why":"LABAs may increase the risk of severe exacerbations or death in some patients with asthma, should only be used in combination with inhaled steroids in these patients, and should not be recommended or used to treat acute exacerbations of asthma.","src":[[18350,18355]],"origin":"heuer","age":"adult"},{"id":"C12-Q08","sec":"III-D","lvl27":"integ","topic":"COPD maintenance","stem":"For maintenance therapy of bronchospasm in COPD, appropriate choices include:","opts":["A LABA, a LAMA such as tiotropium, or a LABA/LAMA combination","Short-acting albuterol scheduled four times daily as the only drug","An aerosolized antibiotic such as tobramycin twice daily","A mucolytic such as acetylcysteine as the only drug"],"key":0,"why":"For maintenance therapy of bronchospasm in patients with COPD, consider a LABA such as salmeterol, a long-acting anticholinergic such as tiotropium, or a LABA plus long-acting anticholinergic combination such as umeclidinium plus vilanterol.","src":[[18356,18359]],"origin":"heuer","age":"adult"},{"id":"C12-Q09","sec":"III-D","lvl27":"integ","topic":"Mucolytics","stem":"Why must a bronchodilator always precede mucolytic therapy?","opts":["All mucolytics irritate the airway and can cause bronchospasm","Mucolytics inactivate bronchodilators if they are given first","Bronchodilators thin secretions more effectively than mucolytics","Mucolytics require a higher inspiratory flow than bronchodilators"],"key":0,"why":"All mucolytics are irritating to the airway, so to prevent bronchospasm always precede treatment with a bronchodilator. Mucolytics should also be administered in combination with airway clearance therapy to facilitate removal of secretions.","src":[[18365,18368]],"origin":"heuer","age":"adult"},{"id":"C12-Q10","sec":"III-D","lvl27":"integ","topic":"Inhaled steroids","stem":"Why must patients rinse the mouth after inhaled steroid therapy?","opts":["To prevent pharyngitis and oral candidiasis","To improve the absorption of the drug","To clear the residual propellant taste","To reduce the systemic β1 effects"],"key":0,"why":"Rinsing the mouth after therapy is essential to prevent pharyngitis and oral candidiasis. Using spacers or valved holding chambers with MDI-delivered steroids minimizes pharyngeal deposition and the incidence of pharyngitis and candidiasis.","src":[[18380,18384]],"origin":"heuer","age":"adult"},{"id":"C12-Q11","sec":"III-D","lvl27":"integ","topic":"Device selection","stem":"Which aerosol device should most infants and small children receive?","opts":["An MDI with a holding chamber and mask (or an SVN)","A dry-powder inhaler with a low internal resistance","A breath-actuated MDI used with a mouthpiece","A slow-mist Respimat with a mouthpiece"],"key":0,"why":"Most infants and small children should receive aerosolized drugs via an MDI with a holding chamber and mask, with an SVN as an alternative if tolerated. SVN administration should be reserved for acutely ill adults who cannot use either a DPI or MDI, and DPIs are ideal for maintenance therapy in outpatient adults, larger children, and adolescents who can generate enough inspiratory flow.","src":[[18522,18532]],"origin":"heuer","age":"child"},{"id":"C12-Q12","sec":"III-D","lvl27":"integ","topic":"Device limitations","stem":"Which aerosol device CANNOT be used for drug delivery during mechanical ventilation?","opts":["A dry-powder inhaler","A small-volume jet nebulizer","A vibrating mesh nebulizer","An MDI with an in-line adapter"],"key":0,"why":"A DPI requires high inspiratory flow, can result in pharyngeal deposition, is difficult for high doses, and cannot be used for drug delivery during mechanical ventilation. Electronic nebulizers are in fact favored during mechanical ventilation because they add no flow or volume to the circuit.","src":[[18443,18454],[18485,18485]],"origin":"heuer","age":"adult"},{"id":"C13-Q01","sec":"III-E","lvl27":"recall","topic":"Fluid balance","stem":"Normal fluid intake and output for adults is:","opts":["2–3 liters/day","1 liter/day","4–5 liters/day","500 mL/day"],"key":0,"why":"The normal fluid intake and output for adults is 2–3 liters per day. Maintaining the balance between intake and output is essential to maintain proper metabolic functions.","src":[[19308,19310]],"origin":"heuer","age":"adult"},{"id":"C13-Q02","sec":"III-E","lvl27":"recall","topic":"Permissive hypercapnia","stem":"During permissive hypercapnia, respiratory acidosis is generally accepted until the pH falls below:","opts":["7.25–7.30","7.35–7.40","7.10–7.15","7.20 exactly"],"key":0,"why":"Permissive hypercapnia accepts a higher-than-normal PaCO₂ in exchange for a lower risk of lung injury from smaller tidal volumes or PIPs. In general, hypercapnia and respiratory acidosis can be accepted until the pH falls below 7.25–7.30, at which point recommend either an increase in rate or administration of sodium bicarbonate.","src":[[20282,20287]],"origin":"heuer","age":"adult"},{"id":"C13-Q03","sec":"III-E","lvl27":"recall","topic":"Lung-protective strategies","stem":"Lung-protective volume-control ventilation uses tidal volumes of:","opts":["4–6 mL/kg of predicted body weight","8–10 mL/kg of predicted body weight","10–12 mL/kg of actual body weight","2–3 mL/kg of predicted body weight"],"key":0,"why":"Lung-protective strategies include volume-control ventilation with low tidal volumes of 4–6 mL/kg of PBW, low plateau pressures of 30 cm H₂O or less, pressure-control ventilation with PIP of 30 cm H₂O or less, dual-mode ventilation such as PRVC, APRV, and high-frequency percussive ventilation.","src":[[20275,20280],[20112,20114]],"origin":"heuer","age":"adult"},{"id":"C13-Q04","sec":"III-E","lvl27":"integ","topic":"Adverse reactions","stem":"Signs of an allergic reaction such as hives, swelling, or redness appear after a new medication. The RT should:","opts":["Recommend stopping the drug, alert the emergency team, and monitor","Halve the dose and continue, observing for any further reactions","Document it and reassess at the next scheduled treatment","Give a bronchodilator and continue the medication as ordered"],"key":0,"why":"Anytime an adverse patient response is noted, the RT should immediately ensure therapy is stopped, notify the nurse and doctor, and carefully monitor and help stabilize the patient. With signs of allergic reaction after a new medication, immediately recommend it be stopped, alert the medical emergency team, and monitor closely.","src":[[19105,19110]],"origin":"heuer","age":"adult"},{"id":"C13-Q05","sec":"III-E","lvl27":"integ","topic":"Adverse reactions","stem":"Which finding constitutes a marked change in vital signs warranting concern during therapy?","opts":["A change 20% above or below baseline, or outside critical limits","Any change of 5% or more above or below the initial baseline","A change only when the patient also reports new symptoms","A 10% change from baseline, with all values within normal limits"],"key":0,"why":"Adverse effects to monitor include marked changes in vital signs — 20% above or below initial baseline or outside of critical limits — along with a greater than 4% drop in SpO₂ or any fall below 90%, new or worsening arrhythmia, cyanosis, severe paroxysmal coughing, changes in level of consciousness, and hemoptysis.","src":[[19124,19134]],"origin":"heuer","age":"adult"},{"id":"C13-Q06","sec":"III-E","lvl27":"integ","topic":"Adverse reactions","stem":"If a serious adverse effect is observed during therapy, the RT should always:","opts":["Stop therapy, stay with the patient, and give oxygen","Complete the treatment, then notify the nurse","Leave the room to summon the physician immediately","Reduce the dose, then observe for 15 minutes"],"key":0,"why":"If a serious adverse effect is observed during therapy, always stop therapy, stay with and monitor the patient, and stabilize the patient by providing oxygen therapy — calling for assistance if necessary. In a hospital, notify the nurse and physician immediately; if life-threatening, call a MET/rapid-response team or code blue. At an alternate care site, dial 911.","src":[[19142,19150]],"origin":"heuer","age":"adult"},{"id":"C13-Q07","sec":"III-E","lvl27":"integ","topic":"Contraindication screening","stem":"The RT identifies a major contraindication to an ordered therapy. The correct action is:","opts":["Do not start it; contact the prescriber for guidance","Start the therapy but monitor the patient more closely","Modify the therapy on your own and document the change","Withhold the therapy without notifying anyone else"],"key":0,"why":"The RT must prescreen all patients for potential contraindications and hazards before therapy. If any major contraindications exist, the RT should not initiate the therapy; instead contact the prescribing physician for guidance on whether to proceed or provide an alternative.","src":[[19111,19115]],"origin":"heuer","age":"adult"},{"id":"C13-Q08","sec":"III-E","lvl27":"integ","topic":"Treatment selection","stem":"A patient has rhonchi and tactile fremitus. The most likely problem and recommendation are:","opts":["Large-airway secretions — airway clearance","Bronchospasm — bronchodilator therapy","Laryngeal edema — racemic epinephrine","Pulmonary edema — CPAP and diuretics"],"key":0,"why":"Rhonchi and tactile fremitus indicate secretions in the large airways, and the recommendation is airway clearance therapy. Wheezing indicates bronchospasm, CHF, or airway inflammation; inspiratory stridor indicates laryngeal edema.","src":[[19206,19207],[19187,19197]],"origin":"heuer","dropped":"Tactile fremitus is not on the 2027 outline","age":"adult"},{"id":"C13-Q09","sec":"III-E","lvl27":"integ","topic":"Treatment selection","stem":"A patient develops inspiratory stridor after extubation. Appropriate recommendations include:","opts":["Cool mist and racemic epinephrine, ± bronchoscopy","Airway clearance therapy and tracheal suctioning","Diuretics and positive inotropic agents","Lung expansion therapy and supplemental oxygen"],"key":0,"why":"Inspiratory stridor suggests laryngeal edema — for example post-extubation or from infection — as well as tumor/mass, inhalation injury, or foreign-body aspiration. Recommend cool mist or racemic epinephrine, and diagnostic bronchoscopy.","src":[[19194,19204]],"origin":"heuer","age":"adult"},{"id":"C13-Q10","sec":"III-E","lvl27":"integ","topic":"Treatment selection","stem":"Frothy, pink secretions indicate what problem, and what should be recommended?","opts":["Pulmonary edema — treat the cause, CPAP/BiPAP, O₂, diuretics","Acute airway infection — sputum culture and antibiotic therapy","Excessive secretions — airway clearance and frequent suctioning","Atelectasis — lung expansion therapy and early ambulation"],"key":0,"why":"Frothy pink secretions indicate pulmonary edema. Recommendations are to treat the underlying cause such as CHF, apply positive airway pressure (CPAP/BiPAP), give oxygen therapy, and use medications including positive inotropes and diuretics. Yellow/opaque sputum instead indicates acute airway infection.","src":[[19226,19235]],"origin":"heuer","age":"adult"},{"id":"C13-Q11","sec":"III-E","lvl27":"integ","topic":"Pneumothorax","stem":"Which finding during mechanical ventilation suggests a pneumothorax?","opts":["A sudden rise in airway pressure (VC) or fall in VT (PC)","A gradual fall in peak pressure over several hours","A rise in exhaled tidal volume in volume control","An increase in static compliance during an inspiratory hold"],"key":0,"why":"Clinical signs of pneumothorax include sudden respiratory distress, decreased chest expansion and breath sounds on the affected side, tracheal deviation away from the affected side, a hyperresonant percussion note, absent lung markings on x-ray, and — during mechanical ventilation — a sudden increase in airway pressure in volume control or a decrease in VT in pressure control.","src":[[19171,19178]],"origin":"heuer","age":"adult"},{"id":"C13-Q12","sec":"III-E","lvl27":"integ","topic":"Pneumothorax","stem":"A pneumothorax is suspected in a ventilated patient. Initial recommendations include:","opts":["Stat chest x-ray, 100% O₂, and settings that lower peak pressure","Increase the PEEP to re-expand the collapsed lung tissue","Increase the tidal volume to improve the alveolar ventilation","Extubate immediately and apply a nonrebreathing mask"],"key":0,"why":"If a pneumothorax is suspected, recommend obtaining a stat chest x-ray and placing the patient on 100% O₂, which helps reabsorb the gas. If the patient is on positive-pressure ventilation, recommend changing settings to minimize peak inspiratory pressures — decrease PIP, lower PEEP, lower VT.","src":[[19295,19299]],"origin":"heuer","age":"adult"},{"id":"C13-Q13","sec":"III-E","lvl27":"integ","topic":"Fluid balance","stem":"A patient has dry mucous membranes, hypotension, decreased urine output and skin turgor, an increased hematocrit, and thick tenacious secretions. You should recommend:","opts":["More IV fluid, heated humidity, mucolytics; avoid diuretics","Diuretic therapy and fluid restriction with close monitoring","Dialysis and inotropic agents to support the circulation","Restricted oral intake with close monitoring of output"],"key":0,"why":"These are the signs of dehydration (negative fluid balance). Management is to increase IV fluid intake, minimize sensible and insensible water loss, use heated humidification during mechanical ventilation, administer mucolytics for thick secretions, insert a CVP or PA catheter in critically ill patients to monitor fluid status, and AVOID the use of diuretics.","src":[[19338,19353]],"origin":"heuer","age":"adult"},{"id":"C13-Q14","sec":"III-E","lvl27":"integ","topic":"Fluid balance","stem":"A patient has pedal edema, pulmonary edema, hepatomegaly, jugular venous distention, a decreased hematocrit, and increased CVP and PAWP. You should recommend:","opts":["Fluid restriction, diuretics, and inotropes or dialysis as needed","More IV fluid intake and heated humidification of inspired gas","Mucolytic therapy, with diuretics avoided for now","CPAP alone, deferring fluid restriction and diuretics"],"key":0,"why":"These are the signs of overhydration (positive I/O). Management is to restrict and closely monitor fluid intake, initiate diuretic therapy, administer inotropic agents if heart failure is suspected, implement dialysis if renal failure is present, and insert a CVP or PA catheter to monitor fluid status if indicated.","src":[[19359,19370]],"origin":"heuer","age":"adult"},{"id":"C13-Q15","sec":"III-E","lvl27":"integ","topic":"Artificial airway selection","stem":"Which artificial airway permits phonation and allows testing of upper airway patency and control?","opts":["A cuffed, fenestrated tracheostomy tube","A cuffed, unfenestrated tracheostomy tube","An oral endotracheal tube","A laryngeal mask airway"],"key":0,"why":"A cuffed, fenestrated tracheostomy tube has the same indications as a standard tracheostomy tube with the added benefit of permitting phonation (speaking) and testing upper airway patency and control.","src":[[19410,19412]],"origin":"heuer","age":"adult"},{"id":"C13-Q16","sec":"III-E","lvl27":"integ","topic":"Airway troubleshooting","stem":"An ETT has an excessive cuff leak despite adding air to the pilot balloon. Recommendations include:","opts":["Reintubate or exchange the tube, reposition it, or repair the pilot balloon","Add progressively more air to the cuff until the leak finally stops","Increase the ventilator tidal volume to make up for the leaked volume","Switch to pressure control and accept the leak as long as SpO₂ is normal"],"key":0,"why":"Excessive ETT cuff leak despite adding air may be caused by a blown cuff, a broken or defective pilot balloon or tube, too small an ETT, or the tube sitting too high with the cuff at vocal cord level. Recommendations are reintubation with a proper-size tube, using an ETT exchanger, deflating the cuff and repositioning the ETT, or a pilot balloon repair kit.","src":[[19448,19454]],"origin":"heuer","age":"adult"},{"id":"C13-Q17","sec":"III-E","lvl27":"integ","topic":"Patient positioning","stem":"For a thoracentesis, the patient should be positioned:","opts":["Sitting up, leaning forward over a pillow-draped bedside table","Supine, with the involved side elevated and the arm over the head","In Trendelenburg, with the affected side down on the bed","Prone, with the abdomen freely suspended and arms at the sides"],"key":0,"why":"For thoracentesis, the patient sits on the edge of the bed leaning forward over a pillow-draped bedside table, arms crossed, with an assistant in front for stability. For chest tube insertion, the involved side is slightly elevated with the arm flexed over the head.","src":[[19665,19671]],"origin":"heuer","age":"adult"},{"id":"C13-Q18","sec":"III-E","lvl27":"integ","topic":"Patient positioning","stem":"An immobile patient at risk for decubitus ulcers should have position changed:","opts":["Side to side every 2 hours, on a decubitus mattress","Every 8 hours, at each change of nursing shift","Only when the patient asks to be turned over","Every 30 minutes, both day and night"],"key":0,"why":"For an immobile patient at risk for bedsores, change position side to side every 2 hours and use a decubitus mattress.","src":[[19673,19675]],"origin":"heuer","age":"adult"},{"id":"C13-Q19","sec":"III-E","lvl27":"integ","topic":"Humidification","stem":"A patient on a 4-L/min nasal cannula complains of nasal and mouth dryness. You should:","opts":["Add a humidifier, since the flow is ≥ 4 L/min","Reduce the flow to 2 L/min and reassess","Switch to a nonrebreathing mask at 10 L/min","Add a heat and moisture exchanger in line"],"key":0,"why":"Insufficient humidity causes drying of the mucosa. Add a humidifier, particularly if the input flow of the nasal cannula is 4 L/min or more.","src":[[19872,19875]],"origin":"heuer","age":"adult"},{"id":"C13-Q20","sec":"III-E","lvl27":"integ","topic":"Humidification","stem":"A patient receiving noninvasive positive pressure support complains of dryness. You should:","opts":["Add a blow-by humidifier — never use an HME on NPPV","Add an HME at the mask to conserve the patient's moisture","Reduce the IPAP to lower the flow through the mask","Switch to a nasal cannula at the same oxygen flow"],"key":0,"why":"Cold dry gas delivered at very high flows causes this complaint. Add a blow-by humidifier — and never use heat and moisture exchangers during noninvasive positive pressure therapy.","src":[[19897,19902]],"origin":"heuer","age":"adult"},{"id":"C13-Q21","sec":"III-E","lvl27":"integ","topic":"Humidification","stem":"A ventilated patient using an HME has developed very thick secretions. You should:","opts":["Add heated humidity — HMEs are contraindicated here","Replace the HME with a new one of the same type","Increase the tidal volume to improve humidification","Instill saline before each suction pass to thin them"],"key":0,"why":"The use of an HME may be contraindicated for this patient. Add heated humidity — HMEs are contraindicated in patients with thick secretions.","src":[[19904,19908]],"origin":"heuer","age":"adult"},{"id":"C13-Q22","sec":"III-E","lvl27":"integ","topic":"Airway clearance modification","stem":"A stroke patient at risk for increased intracranial pressure should be instructed to:","opts":["Use a huff cough, or sit up until the cough subsides","Cough as forcefully as possible to clear the secretions","Use head-down postural drainage to reduce the need to cough","Use mechanical insufflation–exsufflation as the only method"],"key":0,"why":"Discourage strenuous coughing for stroke patients or those otherwise predisposed to increased intracranial pressure. Instead, instruct these patients to use a huff cough, or sit them up until the cough subsides.","src":[[19978,19980]],"origin":"heuer","age":"adult"},{"id":"C13-Q23","sec":"III-E","lvl27":"integ","topic":"Incentive spirometry","stem":"A patient using a flow-oriented incentive spirometer cannot generate enough flow to activate the indicator. You should recommend:","opts":["A volume-oriented or low-flow device; consider IPPB or Metaneb","A larger mouthpiece so that the flow resistance is lower","More frequent attempts with the same flow-oriented device","Discontinuing lung expansion therapy until the patient improves"],"key":0,"why":"An obstructive disorder or muscle weakness may prevent the patient from generating the flow needed to use a flow-oriented device. Recommend a volume-oriented device or one designed for patients with obstructive disorders, and consider another modality such as IPPB or Metaneb.","src":[[19966,19972]],"origin":"heuer","age":"adult"},{"id":"C13-Q24","sec":"III-E","lvl27":"integ","topic":"IPPB modification","stem":"During IPPB, the pressure does not rise after triggering. The likely cause and fix are:","opts":["A major leak or poor seal — fix leaks and coach a tight seal","Excessive pressure setting — lower the cycle pressure","Hyperventilation — coach slower, deeper breathing","Inadequate FiO₂ — turn the air mix off and reassess"],"key":0,"why":"If pressure does not rise after triggering, the cause is a major leak or poor airway seal. Fix any circuit leaks, coach the patient to achieve a tight mouth seal, use nose clips, and consider a flanged lip seal or mask. The same modifications apply if the machine does not cycle off at end-inspiration.","src":[[20033,20042]],"origin":"heuer","age":"adult"},{"id":"C13-Q25","sec":"III-E","lvl27":"integ","topic":"Oxygenation on the ventilator","stem":"A ventilated patient on PEEP 10 cm H₂O and FiO₂ 0.75 has a PaO₂ of 175 torr. You should:","opts":["Lower the FiO₂ — O₂ toxicity is the greater risk","Lower the PEEP — barotrauma is the greater risk","Leave both settings unchanged until the next ABG","Raise the PEEP and lower the FiO₂ at the same time"],"key":0,"why":"If hyperoxia is present (PaO₂ above 100 torr), lower the parameter — FiO₂ or PEEP — that is potentially most dangerous at that moment. With PEEP 10 and FiO₂ 0.75, the high FiO₂ is of most concern for O₂ toxicity and should be lowered.","src":[[20016,20026]],"origin":"heuer","age":"adult"},{"id":"C13-Q26","sec":"III-E","lvl27":"integ","topic":"Oxygenation on the ventilator","stem":"A ventilated patient on PEEP 18 cm H₂O and FiO₂ 0.45 has a PaO₂ of 150 torr. You should:","opts":["Lower the PEEP — barotrauma is the greater risk","Lower the FiO₂ — O₂ toxicity is the greater risk","Raise the FiO₂ so that the PEEP can be reduced","Make no change until the next ABG is drawn"],"key":0,"why":"With hyperoxia present, lower whichever parameter is most dangerous at that moment. For a patient on 18 cm H₂O PEEP and FiO₂ 0.45 with a PaO₂ of 150 torr, the high PEEP level is of most concern for barotrauma and should be lowered.","src":[[20022,20026]],"origin":"heuer","age":"adult"},{"id":"C13-Q27","sec":"III-E","lvl27":"integ","topic":"60-60 rule","stem":"A ventilated patient has a PaO₂ of 52 torr on an FiO₂ of 0.70. Using the 60-60 rule, you should:","opts":["Add or increase PEEP/CPAP, because the problem is shunting","Simply increase the FiO₂, because the problem is V/Q imbalance","Decrease PEEP to improve cardiac output","Increase the tidal volume"],"key":0,"why":"By the 60-60 rule: if PaO₂ is above 60 torr on an FiO₂ below 0.6, the problem is mainly V/Q imbalance and will respond to a simple FiO₂ increase. If PaO₂ is below 60 torr on an FiO₂ above 0.6, the problem is shunting and PEEP/CPAP must be added or increased.","src":[[20075,20083]],"origin":"heuer","age":"adult"},{"id":"C13-Q28","sec":"III-E","lvl27":"integ","topic":"Oxygenation on the ventilator","stem":"A ventilated patient has a PaO₂ of 55 torr on an FiO₂ of 0.40. The correct adjustment is:","opts":["Increase the FiO₂, because it is less than 0.60","Increase PEEP, because hypoxemia is present","Lower the FiO₂ and add PEEP","Make no change; this is acceptable"],"key":0,"why":"If the PaO₂ or SaO₂ is low — below 60 torr or 90% — hypoxemia is present. Increase the FiO₂ if it is less than 0.60; increase PEEP if the FiO₂ is 0.60 or greater.","src":[[20018,20020]],"origin":"heuer","age":"adult"},{"id":"C13-Q29","sec":"III-E","lvl27":"integ","topic":"Alveolar ventilation","stem":"When setting a desired PaCO₂ target in a COPD patient with acute-on-chronic ventilatory failure, the goal should be:","opts":["The PaCO₂ that normalizes the pH, which may be well above 40 torr","Exactly 40 torr in every patient, whatever the baseline values","Below 35 torr, to offset the chronic metabolic compensation","The lowest PaCO₂ that the ventilator settings can achieve"],"key":0,"why":"Be careful specifying the desired PaCO₂ — the goal should be the PaCO₂ that normalizes the pH. Although in most situations this means a normal PaCO₂ of 40 torr, in a COPD patient who develops ventilatory failure on top of a compensated respiratory acidosis (acute-on-chronic), the desired PaCO₂ could be substantially higher than normal.","src":[[20104,20109]],"origin":"heuer","age":"adult"},{"id":"C13-Q30","sec":"III-E","lvl27":"integ","topic":"Alveolar ventilation","stem":"If a ventilated patient's tidal volume is already properly set, the preferred method to alter minute ventilation is:","opts":["Rate changes","Tidal volume changes","Changing the inspiratory flow","Changing the FiO₂"],"key":0,"why":"Minute ventilation can be changed by changing either the respiratory rate or the delivered VT. If the patient's VT is properly set — 6–8 mL/kg PBW with a plateau pressure below 30 cm H₂O — rate changes are the preferred method to alter minute ventilation.","src":[[20110,20115]],"origin":"heuer","age":"adult"},{"id":"C13-Q31","sec":"III-E","lvl27":"integ","topic":"I:E ratio","stem":"During volume-control A/C ventilation, inspiratory time is determined by:","opts":["Set flow and volume: I-time = volume ÷ flow","The clinician, who sets it directly in seconds","The respiratory rate alone, as 60 ÷ rate","The patient's inspiratory effort on each breath"],"key":0,"why":"During volume-control A/C, I-time is a function of the set flow and volume — I-time = volume in liters divided by flow in L/sec. During pressure-control A/C, the I-time is usually set by the clinician. In both modes E-time is the time remaining between breath cycles, determined by the I-time and frequency.","src":[[20123,20128]],"origin":"heuer","age":"adult"},{"id":"C13-Q32","sec":"III-E","lvl27":"integ","topic":"Auto-PEEP management","stem":"A patient with severe expiratory airflow obstruction has auto-PEEP and an I:E ratio of 1:2. The first step is to:","opts":["Allow time for full exhalation, lowering the I:E toward 1:4 or 1:5","Increase the I:E ratio toward 1:1 by lengthening the inspiratory time","Add extrinsic PEEP equal to the measured auto-PEEP, with no other change","Increase the tidal volume to improve the emptying of the lungs"],"key":0,
