auma: lower rib fractures","scenario":"A patient who fell from a ladder has fractures of ribs 11 and 12 on the left.","stem":"Which additional studies should be recommended?","opts":["Pulmonary function testing","Abdominal ultrasound and CT","An overnight sleep study","Fiberoptic bronchoscopy"],"key":1,"why":"Fractures of the lower floating ribs (11-12) may be associated with diaphragmatic tears and trauma to the liver or spleen; recommend an abdominal ultrasound (for hemoperitoneum) and a CT scan (to assess organ damage).","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T07","cell":"TRAUMA","type":"DM","setting":"in","topic":"Head trauma: airway","scenario":"A patient with a closed head injury has a Glasgow Coma Scale score of 7 and gurgling respirations.","stem":"What should be recommended?","opts":["A nasal cannula at 2 L/min and observation","Rapid-sequence intubation","Removal of the cervical collar to improve comfort","High-dose steroids"],"key":1,"why":"If the Glasgow Coma Scale score is 8 or less, or the patient is unable to protect the airway, recommend rapid-sequence intubation. High-dose steroids are not recommended.","src":[[27046,27125]],"origin":"heuer","age":"adult"},{"id":"CJ-T08","cell":"TRAUMA","type":"DM","setting":"in","topic":"Head trauma: ventilator targets","scenario":"A patient with a severe traumatic brain injury is intubated and ventilated. There is no sign of herniation.","stem":"Which ventilation strategy is most appropriate?","opts":["Routine hyperventilation to a PaCO2 of 25 torr","Permissive hypercapnia with a PaCO2 of 55 torr","A PaCO2 of 35–40 torr, avoiding high PEEP","High PEEP to keep the SpO2 at 100%"],"key":2,"why":"Aim for a PaCO2 of 35-40 torr, PIP of 30 cm H2O or less, and SpO2 above 95%. Hypercapnia raises ICP; high PEEP can lower MAP, raise ICP and lower CPP; and routine hyperventilation lowers ICP but can cause cerebral ischemia.","src":[[27046,27125]],"origin":"heuer","age":"adult"},{"id":"CJ-T09","cell":"TRAUMA","type":"IG","setting":"in","topic":"Head trauma: cerebral perfusion pressure","scenario":"A ventilated patient with a head injury has a mean arterial pressure of 80 mm Hg and an intracranial pressure of 25 mm Hg.","stem":"How should these values be interpreted?","opts":["Both the ICP and the CPP are at their goals","ICP is above goal; CPP of 55 is below goal","ICP is low and the CPP is above its goal","CPP cannot be estimated from these values"],"key":1,"why":"CPP = MAP - ICP. The goal is an ICP less than 20 mm Hg and a CPP of 60 mm Hg or higher to avoid cerebral hypoxia; vasopressors may be needed to maintain MAP and CPP.","src":[[27046,27125]],"origin":"heuer","age":"adult"},{"id":"CJ-T10","cell":"TRAUMA","type":"DM","setting":"in","topic":"Head trauma: lowering ICP","scenario":"A patient with a traumatic brain injury has a rising intracranial pressure.","stem":"Which measure should be recommended to help lower it?","opts":["Placing the patient flat in bed","Raising the head of the bed 30–40°","Frequent, vigorous tracheal suctioning","High-dose intravenous corticosteroids"],"key":1,"why":"To help lower ICP, elevate the head of the bed 30-40 degrees, sedate the patient, and use osmotherapy or ventricular drainage. Suctioning should be judicious because stimulation raises ICP, and high-dose steroids do not improve survival.","src":[[27046,27125]],"origin":"heuer","age":"adult"},{"id":"CJ-T11","cell":"TRAUMA","type":"DM","setting":"out","topic":"Head trauma: initial emergency care","scenario":"A transport team reaches an unhelmeted cyclist who struck his head. He is breathing spontaneously with an SpO2 of 90% on room air.","stem":"Which initial management is most appropriate?","opts":["Room air, with the head turned to the side to drain secretions","100% O2 by nonrebreather; head neutral, cervical collar kept on","Hyperextend the neck to open the airway, then give oxygen","Withhold oxygen until an arterial blood gas is available"],"key":1,"why":"Keep a cervical collar in place until the patient is evaluated for spinal cord damage, and initially provide 100% O2 by nonrebreathing mask, BVM or advanced airway to keep the SpO2 above 95%, with the head and neck in a neutral position.","src":[[27046,27125]],"origin":"heuer","age":"adult"},{"id":"CJ-U01","cell":"NEURO","type":"DM","setting":"in","topic":"Spinal cord injury: apnea","scenario":"A diver is pulled from a pool after striking his head on the bottom. In the emergency department he is immobilized, conscious, and not breathing.","stem":"What should be done first?","opts":["Obtain cervical spine films before any intervention","Assume a high cervical injury; begin manual ventilation","Measure his vital capacity and maximum inspiratory pressure","Turn his head to the side to clear the airway of water"],"key":1,"why":"If apnea is present after a spinal cord injury, assume a complete high cervical injury and start manual ventilation at once, keeping the head, neck and spine neutral.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U02","cell":"NEURO","type":"IG","setting":"in","topic":"Spinal cord injury: type of shock","scenario":"A patient with a spinal cord injury at T4 has a blood pressure of 78/40 mm Hg, a heart rate of 48/min, a core temperature of 35.2 C, and warm, flushed, dry skin.","stem":"Which type of shock is most likely?","opts":["Hemorrhagic","Neurogenic","Septic","Cardiogenic"],"key":1,"why":"Shock is likely neurogenic when the injury is above T6 with bradycardia and hypothermia; the skin may be flushed, warm and dry from vasodilation. Hemorrhagic shock goes with an injury at or below T6, tachycardia and a normal core temperature.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U03","cell":"NEURO","type":"DM","setting":"in","topic":"Spinal cord injury: vasopressor choice","scenario":"A patient in neurogenic shock after a cervical cord injury remains hypotensive and bradycardic after fluid resuscitation.","stem":"Which vasopressor should be recommended?","opts":["Phenylephrine","Dopamine or norepinephrine","No vasopressor; give a diuretic","Nitroprusside"],"key":1,"why":"For neurogenic shock, recommend vasopressors with beta-stimulation such as dopamine or norepinephrine; a pure alpha-adrenergic agent such as phenylephrine can worsen the bradycardia. The goal is a systolic pressure above 85-90 mm Hg with a normal heart rate.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U04","cell":"NEURO","type":"DM","setting":"in","topic":"Spinal cord injury: intubation","scenario":"A patient with a suspected cervical spine injury is tiring and needs to be intubated.","stem":"Which approach should be recommended?","opts":["Blind nasotracheal intubation with the neck flexed forward","Fiberoptic or RSI oral intubation with in-line stabilization","Orotracheal intubation with the head fully hyperextended","Delay intubation until an MRI of the spine has been done"],"key":1,"why":"The cervical spine must stay in neutral alignment. If intubation is indicated, recommend fiberoptic intubation or rapid sequence orotracheal intubation with manual in-line neck stabilization, and be ready for bradycardia from vagal stimulation.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U05","cell":"NEURO","type":"IG","setting":"in","topic":"Spinal cord injury: respiratory muscle function","scenario":"A conscious, spontaneously breathing patient with a C6 injury has been stabilized in the ICU.","stem":"Which measurements should be recommended to assess respiratory muscle function?","opts":["Vital capacity and maximum inspiratory pressure","Diffusing capacity","Functional residual capacity by nitrogen washout","Peak expiratory flow only"],"key":0,"why":"After stabilization, a conscious patient with spontaneous respirations should have respiratory muscle function assessed by vital capacity and maximum inspiratory pressure (negative inspiratory force).","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U06","cell":"NEURO","type":"DM","setting":"out","topic":"Spinal cord injury: speech at home","scenario":"A ventilator-dependent patient with tetraplegia lives at home with a cuffed tracheostomy tube. He controls his secretions well and wants to be able to speak.","stem":"What should be recommended?","opts":["Deflate the cuff and attach a one-way speaking valve","Inflate the cuff to a higher pressure","Change to a smaller tidal volume with the cuff inflated","Tell him speech is not possible on a ventilator"],"key":0,"why":"To help a ventilator-dependent patient with a tracheostomy and good secretion control speak, deflate the cuff and either attach a one-way speaking valve or increase the tidal volume.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U07","cell":"NEURO","type":"DM","setting":"out","topic":"Spinal cord injury: cough assistance","scenario":"During a home visit, the caregiver of a man with a chronic cervical cord injury reports that he cannot cough up secretions.","stem":"Which technique should be taught?","opts":["Incentive spirometry every hour while awake","Quad cough, or mechanical insufflation–exsufflation","Pursed-lip breathing with each exhalation","Glossopharyngeal breathing as the only measure"],"key":1,"why":"To help coughing and secretion removal in chronic spinal cord injury, apply or teach caregivers the quad cough technique, or use a mechanical insufflation-exsufflation device.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U08","cell":"NEURO","type":"DM","setting":"out","topic":"Spinal cord injury: dyspnea on the ventilator","scenario":"A ventilator-dependent patient with a high cervical injury at a long-term care facility constantly complains of feeling short of breath, although his blood gases are normal.","stem":"Which ventilator change should be recommended?","opts":["Smaller tidal volumes with a faster rate","Large tidal volumes, up to 1.0 L","Adding 15 cm H2O of PEEP","Decreasing the inspiratory flow"],"key":1,"why":"For ventilator-dependent spinal cord injury patients, large tidal volumes (up to 1.0 L) are recommended to relieve the sensation of dyspnea that these patients commonly have.","src":[[27128,27280]],"origin":"heuer","age":"adult"},{"id":"CJ-U09","cell":"NEURO","type":"IG","setting":"out","topic":"Muscular dystrophy: cough assessment","scenario":"At a clinic visit, a 16-year-old with Duchenne muscular dystrophy has a peak cough flow of 240 L/min. His daytime ventilation is adequate.","stem":"What does this finding indicate?","opts":["A normal cough; no change in his care is needed","An ineffective cough; begin assisted cough or MI-E","An immediate need for an elective tracheostomy","An immediate need for continuous home oxygen"],"key":1,"why":"An airway clearance regimen such as manually assisted coughing or mechanical insufflation-exsufflation is started once the peak cough flow is less than 270 L/min or the MEP is less than 60 cm H2O.","src":[[28514,28612]],"origin":"heuer","age":"adult"},{"id":"CJ-U10","cell":"NEURO","type":"DM","setting":"out","topic":"Muscular dystrophy: nighttime ventilation","scenario":"A young man with Duchenne muscular dystrophy reports morning headaches and daytime sleepiness. Awake PetCO2 is 48 torr and a sleep study shows an apnea-hypopnea index of 14/h.","stem":"What should be recommended?","opts":["Nocturnal CPAP by nasal mask","Nocturnal noninvasive positive-pressure ventilation","A negative-pressure ventilator at night","Nocturnal oxygen by nasal cannula alone"],"key":1,"why":"Nocturnal NPPV is indicated for signs of hypoventilation, an awake PetCO2 above 45 torr, or an apnea-hypopnea index above 10/h. Simple CPAP does not overcome hypoventilation, and negative-pressure ventilation can cause upper airway obstruction in these patients.","src":[[28514,28612]],"origin":"heuer","age":"adult"},{"id":"CJ-U11","cell":"NEURO","type":"DM","setting":"out","topic":"Muscular dystrophy: hypoxemia","scenario":"A patient with advanced Duchenne muscular dystrophy who uses nocturnal NPPV is seen at home. Awake on room air his SpO2 is 90% and his PetCO2 is 55 torr. His chest is clear.","stem":"What is the most appropriate recommendation?","opts":["Oxygen by nasal cannula at 2 L/min while awake","Daytime noninvasive ventilation by mouthpiece","Incentive spirometry ten times every hour","No change from his current nocturnal regimen"],"key":1,"why":"Daytime NPPV is started when the PetCO2 is more than 50 torr or the awake SpO2 stays below 92%, using an oral or mouthpiece interface. Hypoxemia caused by hypoventilation is treated by assisted ventilation, not by giving oxygen.","src":[[28514,28612]],"origin":"heuer","age":"adult"},{"id":"CJ-U12","cell":"NEURO","type":"DM","setting":"out","topic":"Muscular dystrophy: lung volume recruitment","scenario":"An adult with a chronic neuromuscular disease has an FVC of 35% of predicted. The family asks whether he should use an incentive spirometer.","stem":"What should be recommended?","opts":["Incentive spirometry ten times each hour while awake","Add volume recruitment (deep lung inflation); IS is not effective","No lung expansion therapy until he needs hospital admission","Continuous CPAP by mask during the day and at night"],"key":1,"why":"Volume recruitment or deep lung inflation is added when the FVC is less than 40% predicted or less than 1.25 L in adults. Incentive spirometry is avoided because it is generally not effective in patients with respiratory muscle weakness.","src":[[28514,28612]],"origin":"heuer","age":"adult"},{"id":"CJ-I01","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: admission testing","scenario":"A 70-year-old is admitted to a medical unit with community-acquired pneumonia. Antibiotics have been ordered but not yet given.","stem":"Which microbiology studies should be obtained?","opts":["Blood cultures and a sputum Gram stain, sputum taken before antibiotics","A sputum sample collected after the first two antibiotic doses","A routine chest CT scan in place of any cultures","No studies; treat empirically with the ordered antibiotics"],"key":0,"why":"Hospitalized patients with community-acquired pneumonia should have blood cultures and a sputum Gram stain if possible, with the sputum taken from a deep cough before antibiotics are given.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I02","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: sputum quality","scenario":"The laboratory reports a Gram stain of an expectorated sputum sample.","stem":"Which report indicates a good-quality specimen?","opts":["Many squamous epithelial cells and few leukocytes","PMN leukocytes with few or no squamous cells","No cells of any kind on the stained slide","Many squamous epithelial cells and many leukocytes"],"key":1,"why":"A good sputum sample has polymorphonuclear leukocytes but few or no squamous epithelial cells on Gram stain; many squamous cells mean contamination with saliva.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I03","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: ICU testing","scenario":"A patient with severe community-acquired pneumonia is transferred to the intensive care unit. Blood cultures have been drawn.","stem":"Which additional tests should be recommended?","opts":["Legionella and pneumococcal urine antigens, sputum culture","A sweat chloride test and serum alpha1-antitrypsin level","A tuberculin skin test alone, read at 48–72 hours","Serum IgE and a skin-prick allergy panel"],"key":0,"why":"Patients with community-acquired pneumonia admitted to intensive care should have, in addition to blood cultures, Legionella and Pneumococcus urinary antigen tests and a sputum culture (expectorated or endotracheal aspirate).","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I04","cell":"MED-INF","type":"DM","setting":"in","topic":"Pneumonia: imaging","scenario":"A previously healthy adult admitted with uncomplicated community-acquired pneumonia has a lobar infiltrate on the chest radiograph. A team member suggests a routine chest CT.","stem":"What is the best recommendation?","opts":["Obtain the CT; it is required to diagnose pneumonia","Routine CT is not recommended; the radiograph plus findings suffices","Obtain a ventilation/perfusion scan instead of the CT","Repeat the chest radiograph every 4 hours to track the infiltrate"],"key":1,"why":"Infiltrates on a chest radiograph, with supportive clinical and microbiologic findings, are the gold standard for diagnosing pneumonia. CT scanning is not generally recommended for routine use because of cost and no evidence of better outcomes.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I05","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: aspiration","scenario":"A man found unresponsive after heavy drinking is admitted with fever and cough. The chest radiograph shows a right middle lobe infiltrate with consolidation.","stem":"This radiographic pattern is commonly associated with:","opts":["Aspiration pneumonia","Pneumocystis pneumonia","Tuberculosis","Cardiogenic pulmonary edema"],"key":0,"why":"Right middle lobe infiltrates and consolidation are commonly associated with aspiration pneumonia.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I06","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: definition of VAP","scenario":"A patient with severe hospital-acquired pneumonia is intubated for respiratory failure. On the first day of ventilation a colleague documents ventilator-associated pneumonia.","stem":"Is that classification correct?","opts":["Yes; any pneumonia in a ventilated patient is a VAP","No; VAP develops after > 48 hours of ventilation","Yes, as long as the patient has a fever over 38 °C","No; VAP only occurs after 14 days of ventilation"],"key":1,"why":"Ventilator-associated pneumonia develops after more than 48 hours of mechanical ventilation. A patient with severe nosocomial pneumonia who needs ventilation after the infection began does not meet the definition.","src":[[29053,29059]],"origin":"heuer","age":"adult"},{"id":"CJ-I07","cell":"MED-INF","type":"IG","setting":"out","topic":"Pneumonia: sputum character","scenario":"A 24-year-old seen in an urgent care clinic has a week of dry cough, low-grade fever and malaise. Sputum is scant and watery.","stem":"This sputum character is more suggestive of:","opts":["A typical bacterial pneumonia","An atypical pathogen","Lung abscess","Bronchiectasis"],"key":1,"why":"Mucopurulent sputum is most often associated with bacterial pneumonia, while scant or watery sputum is more suggestive of an atypical pathogen.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-I08","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia: white cell count","scenario":"An elderly patient admitted with pneumonia and confusion has a white blood cell count below the normal range.","stem":"What does leukopenia suggest in this setting?","opts":["A viral cause that needs no treatment","A poor prognosis","That pneumonia is ruled out","A laboratory error that can be ignored"],"key":1,"why":"Leukocytosis with a leftward shift is the common finding in community-acquired pneumonia; leukopenia can also occur and generally predicts a poor prognosis.","src":[[28904,28994]],"origin":"heuer","age":"adult"},{"id":"CJ-A01","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: permissive hypercapnia","scenario":"A patient with ARDS and no intracranial problem is ventilated at 5 mL/kg to keep the plateau pressure at 30 cm H2O. The rate is 32/min. ABG: pH 7.24, PaCO2 62 torr.","stem":"What should be recommended?","opts":["Increase the tidal volume to 10 mL/kg to normalize the PaCO2","Accept the PaCO2 as long as the pH stays at or above 7.20","Remove PEEP","Give sodium bicarbonate until the PaCO2 is 40 torr"],"key":1,"why":"Unless contraindicated (for example by high ICP), and as long as the pH can be kept at or above 7.20, the PaCO2 is allowed to rise (permissive hypercapnia) so that the plateau pressure can be kept at or below 30 cm H2O.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A02","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: oxygenation targets","scenario":"A patient with ARDS is on FiO2 0.80 and PEEP 10 cm H2O. PaO2 is 112 torr and SaO2 is 99%.","stem":"What should be recommended?","opts":["Increase the FiO2 to 1.0 to protect against a sudden fall","Reduce the FiO2, targeting SaO2 88–95% or PaO2 55–80 torr","Remove the PEEP and keep the FiO2 at 0.80 for now","No change, since a higher PaO2 gives a safety margin"],"key":1,"why":"PEEP and FiO2 are titrated to an SaO2 of 88-95% or a PaO2 of 55-80 torr, aiming to get the FiO2 below 60% as soon as possible and using higher PEEP to keep the FiO2 in a safe range.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A03","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: fluid management","scenario":"A patient with ARDS has a positive fluid balance. Blood pressure and perfusion are normal and there are no signs of shock.","stem":"Which adjunctive therapy should be recommended?","opts":["Aggressive fluid loading to raise the cardiac output","Fluid-conservative therapy with diuretics (neutral balance)","Routine pulmonary artery catheter placement for wedge pressures","Albumin infusion every 4 hours to raise the oncotic pressure"],"key":1,"why":"Fluid-conservative therapy with diuretics to maintain a neutral fluid balance is a proven adjunct, but it is contraindicated in patients with tissue hypoperfusion or shock. A PA catheter is not recommended for routine management.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A04","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: rescue therapy","scenario":"A patient with ARDS has life-threatening hypoxemia despite the lung-protective protocol, high PEEP and prone positioning.","stem":"Which rescue therapy should be considered?","opts":["Inhaled nitric oxide or ECMO","Raising the VT to 12 mL/kg PBW","Aerosolized N-acetylcysteine","Stopping PEEP to lower Pplat"],"key":0,"why":"Rescue therapies for life-threatening hypoxemia that does not respond to the protocol and adjunctive therapies are inhaled nitric oxide (5 to 20 ppm) and ECMO. They may improve oxygenation short term but on average do not change mortality.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A05","cell":"MED-ARDS","type":"IG","setting":"in","topic":"ARDS: predisposing conditions","scenario":"A patient admitted three days ago develops rapidly progressive hypoxemia with bilateral infiltrates and no evidence of heart failure. Her chart lists several recent problems.","stem":"Which of her problems is an extrapulmonary condition associated with the onset of ARDS?","opts":["Pancreatitis","Seasonal allergies","Osteoarthritis","Hypothyroidism"],"key":0,"why":"Conditions associated with ARDS include pulmonary causes (pneumonia, pulmonary contusion, aspiration of gastric contents) and extrapulmonary causes such as sepsis, shock or trauma, burns and pancreatitis.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A06","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: dyssynchrony","scenario":"A patient with severe ARDS remains markedly dyssynchronous with the ventilator despite optimized settings and deep sedation, and the plateau pressure cannot be controlled.","stem":"As a last resort, what should be considered?","opts":["A neuromuscular blocker such as cisatracurium","Removing all sedation and analgesia for 24 hours","Switching to a high-flow nasal cannula at 60 L/min","A continuous beta-agonist infusion"],"key":0,"why":"As a last resort, patient effort, dyssynchrony and muscle tone can be eliminated with a neuromuscular blocking agent such as cisatracurium.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A07","cell":"MED-ARDS","type":"DM","setting":"in","topic":"ARDS: positioning to prevent pneumonia","scenario":"A ventilated patient with ARDS is being cared for supine between prone sessions.","stem":"How should the bed be positioned to help prevent ventilator-associated pneumonia?","opts":["Flat","Head of the bed elevated 30-45 degrees","Trendelenburg","Head of the bed elevated 5-10 degrees"],"key":1,"why":"Elevating the head of the bed 30-45 degrees is recommended to prevent ventilator-associated pneumonia.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-A08","cell":"MED-ARDS","type":"IG","setting":"in","topic":"ARDS: monitoring fluid status","scenario":"The team is deciding how to monitor volume status in a patient with ARDS.","stem":"Which approach is recommended for routine management?","opts":["A pulmonary artery catheter in every patient","CVP and other volume indicators","Daily weights alone, with no CVP","No hemodynamic monitoring at all"],"key":1,"why":"A PA catheter is not recommended for routine management of ARDS; fluid balance usually can be adjusted by monitoring the CVP and other volume indicators.","src":[[29133,29276]],"origin":"heuer","age":"adult"},{"id":"CJ-S01","cell":"MED-OTHER","type":"IG","setting":"out","topic":"Sleep disorders: screening score","scenario":"An obese 52-year-old with loud snoring and morning headaches completes an Epworth Sleepiness Scale in a sleep clinic and scores 13.","stem":"What should be recommended?","opts":["Reassurance; the score is normal","A polysomnography exam","A sedative at bedtime","Home oxygen at night"],"key":1,"why":"An Epworth Sleepiness Scale score of 10 or more is the threshold for recommending a polysomnography exam.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S02","cell":"MED-OTHER","type":"IG","setting":"out","topic":"Sleep disorders: STOP-BANG","scenario":"A 56-year-old man seen in a primary care office snores loudly, takes medication for high blood pressure, and has a BMI of 38 kg/m2.","stem":"How should his risk of obstructive sleep apnea be interpreted using the STOP-BANG questionnaire?","opts":["Low risk; all eight items must be positive","High risk; at least three items are positive","Unable to assess without a blood gas","Low risk because he is not sleepy"],"key":1,"why":"STOP-BANG covers snoring, tiredness, observed apnea, blood pressure, BMI, age, neck circumference and male gender; any three positive findings indicate a high risk of obstructive sleep apnea.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S03","cell":"MED-OTHER","type":"IG","setting":"out","topic":"Sleep disorders: choice of test","scenario":"A patient with congestive heart failure is suspected of having sleep apnea. Both a sleep laboratory and portable limited-channel monitors are available.","stem":"Which test should be recommended?","opts":["Portable limited-channel monitoring at home","A laboratory-based attended polysomnography exam","Overnight oximetry only","No testing; begin CPAP empirically"],"key":1,"why":"Laboratory-based attended polysomnography is the gold standard and is recommended if available. Portable limited-channel monitoring is not recommended for patients with significant comorbidities such as CHF.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S04","cell":"MED-OTHER","type":"IG","setting":"out","topic":"Sleep disorders: interpreting the study","scenario":"A polysomnography report shows 22 abnormal respiratory events per hour, most of them with continued effort to breathe.","stem":"How should this be interpreted?","opts":["Mild central sleep apnea","Moderate obstructive sleep apnea","Severe obstructive sleep apnea","Normal study"],"key":1,"why":"Sleep apnea is confirmed when events exceed 5 per hour: 5-15 events/h is mild, 15-30 events/h is moderate and more than 30 events/h is severe. It is obstructive if most events involve continued effort to breathe.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S05","cell":"MED-OTHER","type":"DM","setting":"out","topic":"Sleep disorders: treatment of choice","scenario":"A patient has just been diagnosed with moderate obstructive sleep apnea and asks what treatment is recommended first.","stem":"What is the best answer?","opts":["Surgical reconstruction of the upper airway","Positive airway pressure, titrated","Nocturnal oxygen by nasal cannula alone","A sedative-hypnotic taken at bedtime"],"key":1,"why":"Positive airway pressure (CPAP or BiPAP) is the treatment of choice for obstructive sleep apnea, and the pressure levels should always be titrated (by polysomnography or auto-titration). Surgery is generally not the first choice.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S06","cell":"MED-OTHER","type":"DM","setting":"out","topic":"Sleep disorders: CPAP intolerance","scenario":"At a home follow-up visit, a patient with obstructive sleep apnea says he has stopped using CPAP because the mask is uncomfortable and the pressure feels too strong when he is falling asleep.","stem":"What should be recommended?","opts":["Accept that he cannot be treated and discharge him from follow-up","Assess a different mask, humidity, a ramp, or pressure relief","Double the CPAP pressure so that his airway stays fully open","Replace CPAP with nocturnal oxygen by nasal cannula at 2 L/min"],"key":1,"why":"If a patient refuses or rejects CPAP, recommend and assess equipment or interface alternatives to improve tolerance: different mask options, added humidification, a ramp feature, auto-titration, pressure relief, or BiPAP.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S07","cell":"MED-OTHER","type":"DM","setting":"out","topic":"Sleep disorders: central sleep apnea","scenario":"A sleep study in a patient with heart failure shows central sleep apnea with Cheyne-Stokes breathing.","stem":"Which recommendation addresses the underlying problem?","opts":["Optimizing cardiac function","A mandibular repositioning appliance","Positional therapy with a tennis ball","Weight loss alone"],"key":0,"why":"For central sleep apnea, treat the underlying disorder; when it is due to heart failure causing Cheyne-Stokes breathing, recommend optimizing cardiac function. Oral appliances and positional therapy are options for obstructive apnea.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-S08","cell":"MED-OTHER","type":"IG","setting":"out","topic":"Sleep disorders: overnight oximetry","scenario":"Overnight oximetry done at home reports an oxygen desaturation index of 18.","stem":"What does this result indicate?","opts":["It rules out sleep apnea","It indicates sleep apnea-hypopnea syndrome","It is a normal finding","It indicates central apnea specifically"],"key":1,"why":"The oxygen desaturation index is the average number of desaturations per hour of sleep; an ODI of 15 or more indicates sleep apnea-hypopnea syndrome and may make polysomnography unnecessary.","src":[[29383,29552]],"origin":"heuer","age":"adult"},{"id":"CJ-M01","cell":"MED-OTHER","type":"IG","setting":"in","topic":"Immunocompromised patient: imaging","scenario":"A patient receiving chemotherapy is admitted with fever and cough. He is neutropenic, and the chest radiograph shows only subtle changes.","stem":"Which study should be recommended?","opts":["A chest CT scan","A sleep study","Spirometry","No further imaging"],"key":0,"why":"A chest CT should be performed in the immunocompromised patient with suspected pulmonary infection; it often shows abnormalities when the chest radiograph is negative or subtle, and the pattern helps establish the cause.","src":[[30055,30117]],"origin":"heuer","age":"adult"},{"id":"CJ-M02","cell":"MED-OTHER","type":"DM","setting":"in","topic":"Immunocompromised patient: antibiotics","scenario":"A transplant recipient has fever, new pulmonary infiltrates and an SpO2 of 88% on room air. Cultures have been sent and results will take two days.","stem":"What should be recommended?","opts":["Wait for the culture results before starting any treatment","Oxygen with pulse oximetry and immediate empiric antibiotics","Antifungal therapy alone, since fungi are the likely cause","Increase the immunosuppression to treat a possible rejection"],"key":1,"why":"Oxygen should be given to all patients with suspected hypoxemia with continuous pulse oximetry, and immediate empiric antibiotic therapy is recommended while awaiting diagnostic results. Reducing the level of immune suppression, if possible, may be as important as antimicrobials.","src":[[30055,30117]],"origin":"heuer","age":"adult"},{"id":"CJ-M03","cell":"MED-OTHER","type":"IG","setting":"in","topic":"Immunocompromised patient: risk factors","scenario":"You are reviewing the chart of a patient with fever and pulmonary infiltrates to judge whether an opportunistic infection is likely.","stem":"Which finding is the most common risk factor for pulmonary infection in immunocompromised patients?","opts":["Neutropenia","A high hematocrit","Hypertension","Mild anemia"],"key":0,"why":"Neutropenia is the most common risk factor for pulmonary infection in immunocompromised patients; other clues include long-term glucocorticoids, HIV infection, transplantation, and autoimmune conditions.","src":[[30055,30117]],"origin":"heuer","age":"adult"},{"id":"CJ-M04","cell":"MED-OTHER","type":"IG","setting":"in","topic":"Immunocompromised patient: history","scenario":"A patient with rheumatoid arthritis who has taken glucocorticoids for several years is admitted with fever and a nodular infiltrate.","stem":"Why is the medication history important?","opts":["Long-term steroids impair macrophages and neutrophils (immunocompromise)","Glucocorticoids prevent nearly all lung infections in such patients","Glucocorticoids affect only bone density, not the immune response","It is not relevant, since rheumatoid arthritis does not involve the lungs"],"key":0,"why":"An immunocompromised disorder should be suspected when glucocorticoids have been given for a long time; they depress the phagocytic function of alveolar macrophages and neutrophils and reduce movement of inflammatory cells into infected areas.","src":[[30055,30117]],"origin":"heuer","age":"adult"},{"id":"CJ-R01","cell":"NEO-RDS","type":"IG","setting":"in","topic":"Infant RDS: chest radiograph","scenario":"A 29-week, 1,100-gram infant develops grunting, retractions, nasal flaring and a respiratory rate of 72/min one hour after birth.","stem":"Which chest radiograph finding would support respiratory distress syndrome?","opts":["Hyperinflation with flattened diaphragms","Low volumes, ground-glass pattern, air bronchograms","Patchy infiltrates with overexpansion of both lungs","A normal film with clear lung fields"],"key":1,"why":"In infant RDS the chest x-ray shows low lung volume with a diffuse reticulogranular, ground-glass appearance and air bronchograms. Signs include tachypnea above 60 breaths/min, retractions, grunting and nasal flaring.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R02","cell":"NEO-RDS","type":"IG","setting":"in","topic":"Infant RDS: lung maturity","scenario":"A woman is in preterm labor at 33 weeks. Amniotic fluid testing shows a lecithin/sphingomyelin ratio of 1.4 and no phosphatidylglycerol.","stem":"What do these results indicate?","opts":["Mature lungs; no respiratory problems are expected","Pulmonary immaturity and a risk of RDS","A neural tube defect in the fetus","Maternal diabetes has been ruled out"],"key":1,"why":"A lecithin/sphingomyelin ratio of less than 2 and absence of phosphatidylglycerol are indicators of pulmonary immaturity.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R03","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: surfactant","scenario":"A spontaneously breathing 30-week infant has clinical and radiographic findings of respiratory distress syndrome shortly after birth.","stem":"Which approach should be recommended?","opts":["Intubate, give surfactant, extubate to nasal CPAP 4–6","An oxygen hood at 100% with close observation","Immediate high-dose systemic corticosteroids","Inhaled nitric oxide at 20 ppm by nasal CPAP 5"],"key":0,"why":"For spontaneously breathing infants with findings of RDS, early surfactant by the intubation-surfactant-extubation approach is recommended: brief intubation, surfactant, then immediate extubation to nasal CPAP at 4-6 cm H2O.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R04","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: failing CPAP","scenario":"A preterm infant with respiratory distress syndrome on nasal CPAP has worsening grunting and retractions. Blood gas: pH 7.21, PaCO2 68 torr.","stem":"What should be recommended?","opts":["Continue CPAP and recheck in 12 hours","Intubation and mechanical ventilation","Switch to a low-flow nasal cannula","Stop respiratory support"],"key":1,"why":"Intubation and mechanical ventilation are recommended if the infant is apneic, cannot maintain an airway, has increased work of breathing on CPAP, or cannot maintain a pH higher than 7.25 on CPAP.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R05","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: oxygen targets","scenario":"A preterm infant with respiratory distress syndrome on nasal CPAP and an FiO2 of 0.60 has an SpO2 of 99%.","stem":"What should be recommended?","opts":["Reduce the FiO2 to keep the SpO2 between 85% and 92%","Increase the FiO2 to 1.0","Keep the settings; a higher saturation is safer","Stop CPAP"],"key":0,"why":"Provide enough oxygen to keep the PaO2 between 50 and 70 torr or the SpO2 between 85% and 92%.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R06","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: ventilator strategy","scenario":"A preterm infant with respiratory distress syndrome requires mechanical ventilation.","stem":"Which strategy helps avoid volutrauma?","opts":["VT of 10–12 mL/kg, adjusting to normalize the PaCO2 at 40","VT of 4–5 mL/kg, accepting a higher PaCO2 if pH > 7.20","High inspiratory pressures with no PEEP, to open the alveoli","Hyperventilation to a PaCO2 of 25 torr"],"key":1,"why":"To avoid volutrauma, use permissive hypercapnia with low tidal volumes (4-5 mL/kg), letting the PaCO2 rise as long as the pH remains higher than 7.20.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R07","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: extubation","scenario":"A ventilated preterm infant recovering from respiratory distress syndrome has a good respiratory drive, a mean airway pressure of 6 cm H2O, and adequate oxygenation on 30% oxygen.","stem":"What should be recommended?","opts":["Continue ventilation for another week","Early extubation to nasal CPAP","A tracheotomy","Increase the mean airway pressure"],"key":1,"why":"Aim for early extubation to nasal CPAP when the infant has adequate respiratory drive, a mean airway pressure of 7 cm H2O or less, and adequate oxygenation on 35% oxygen or less.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R08","cell":"NEO-RDS","type":"IG","setting":"in","topic":"Infant RDS: differential diagnosis","scenario":"Two newborns have tachypnea soon after birth: one born at 28 weeks and one born at 38 weeks.","stem":"Which statement about the differential diagnosis is correct?","opts":["TTN is generally seen in more mature infants than RDS","RDS is mainly a disease of term infants, not preterm ones","Gestational age does not help to distinguish the two","Both conditions always require surfactant replacement"],"key":0,"why":"Transient tachypnea of the newborn is generally seen in more mature (term or late preterm) infants, compared with RDS, which is a disorder of premature infants lacking surfactant.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R09","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: inhaled nitric oxide","scenario":"A physician asks whether inhaled nitric oxide should be started for a preterm infant with uncomplicated respiratory distress syndrome.","stem":"What is the best response?","opts":["Yes, for every infant with respiratory distress syndrome","Not unless the RDS is accompanied by PPHN","Yes, in place of surfactant replacement","Yes, to prevent retinopathy of prematurity"],"key":1,"why":"Inhaled nitric oxide is not recommended in infant RDS unless it is accompanied by PPHN.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-R10","cell":"NEO-RDS","type":"DM","setting":"in","topic":"Infant RDS: prevention","scenario":"A woman at 30 weeks of pregnancy is admitted in threatened preterm labor.","stem":"Which recommendation reduces the infant's risk of respiratory distress syndrome?","opts":["Corticosteroids given to the mother before birth","Oxygen at 100% given to the mother in labor","Surfactant given to the mother before birth","Delaying all treatment until after delivery"],"key":0,"why":"For women at risk of giving birth between weeks 24 and 34, antenatal corticosteroids are recommended; they enhance lung maturation and reduce the risk of RDS, brain hemorrhage and death.","src":[[31271,31342]],"origin":"heuer","age":"neonatal"},{"id":"CJ-X01","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: meconium","scenario":"A term infant is born through thick meconium-stained fluid. After drying and stimulation the infant is limp and not breathing.","stem":"According to current resuscitation guidance, what should be done next?","opts":["Laryngoscopy and tracheal suctioning before any ventilation","Begin PPV; suction only if the airway appears obstructed","Chest compressions at a 3:1 ratio with free-flow oxygen","Observe for 2 minutes while giving free-flow oxygen"],"key":1,"why":"The 2025 AHA/AAP guideline reserves suctioning for airway obstruction and describes direct laryngoscopy with endotracheal suctioning for meconium-stained fluid as past practice; an apneic infant needs ventilation. NOTE: Heuer and Rodriguez 4th ed. still teaches immediate intubation and tracheal suction for the non-vigorous meconium-stained newborn, so know both.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X02","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: initial oxygen, late preterm","scenario":"A 36-week infant is apneic after the initial steps and positive-pressure ventilation is being started.","stem":"Which oxygen concentration should ventilation begin with?","opts":["21%","40%","60%","100%"],"key":0,"why":"For infants born at 35 weeks or more it is reasonable to begin respiratory support with 21% oxygen, then titrate to saturation targets with a pulse oximeter placed early.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X03","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: initial oxygen, preterm","scenario":"A 33-week infant needs positive-pressure ventilation at birth.","stem":"Which starting oxygen concentration is recommended?","opts":["21% to 30%","50% to 60%","80%","100%"],"key":0,"why":"For preterm infants born at 32 to 34+6/7 weeks it is reasonable to begin with 21% to 30% oxygen; infants under 32 weeks may need 30-100% to reach saturation targets.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X04","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: chest compressions","scenario":"A newborn's heart rate is 50/min after 30 seconds of ventilation that visibly moves the chest.","stem":"What is the next step?","opts":["Continue ventilation alone for 5 more minutes","Start chest compressions, 3:1 with ventilation","Give sodium bicarbonate through the umbilical vein","Stop ventilation and give tactile stimulation"],"key":1,"why":"Chest compressions are recommended if the heart rate remains less than 60/min despite 30 seconds of ventilation that moves the chest, using 3 compressions to 1 ventilation.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X05","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: epinephrine","scenario":"Despite 60 seconds of chest compressions with adequate ventilation, a newborn's heart rate remains 40/min.","stem":"What should be recommended?","opts":["Epinephrine, preferably intravascular","Atropine by face mask or the ETT","Stopping resuscitation efforts","Naloxone by intramuscular injection"],"key":0,"why":"If the heart rate stays below 60/min despite 60 seconds of chest compressions and adequate ventilation, epinephrine is indicated, ideally by an intravascular route; the endotracheal route may be considered while access is obtained.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X06","cell":"NEO-RESUS","type":"IG","setting":"in","topic":"Neonatal resuscitation: heart rate assessment","scenario":"During resuscitation the team needs a fast, accurate heart rate.","stem":"Which method is most useful?","opts":["Palpating the brachial pulse","ECG","Observing skin color","Capillary refill"],"key":1,"why":"ECG can be useful for fast and accurate heart rate assessment in newborns; auscultation and pulse oximetry are reasonable alternatives.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X07","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: ventilation settings","scenario":"A term newborn is gasping with a heart rate of 80/min after the initial steps.","stem":"Which ventilation should be provided?","opts":["30–60 inflations/min at initial pressures of 20–30 cm H2O","10 inflations/min at a peak inflation pressure of 50 cm H2O","100 inflations/min at a peak inflation pressure of 10 cm H2O","Free-flow oxygen only, at 10 L/min by face mask"],"key":0,"why":"Ventilation is needed for an infant who is gasping, apneic or has a heart rate below 100/min: 30 to 60 inflations per minute, with initial peak inflation pressures of 20 to 30 cm H2O adjusted to give effective ventilation.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X08","cell":"NEO-RESUS","type":"DM","setting":"in","topic":"Neonatal resuscitation: vigorous infant","scenario":"A term infant is born crying with good tone and does not need resuscitation.","stem":"Which cord management is recommended?","opts":["Immediate cord clamping","Deferring cord clamping for at least 60 seconds","Cutting the cord before the infant breathes","Milking the cord toward the placenta"],"key":1,"why":"Deferring cord clamping for at least 60 seconds is recommended in most instances for infants who do not need immediate resuscitation.","src":"AHA2025","origin":"external","cite":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","age":"neonatal"},{"id":"CJ-X09","cell":"NEO-RESUS","type":"IG","setting":"in","topic":"Neonatal resuscitation: Apgar score","scenario":"A newborn who needed brief ventilation has a 5-minute Apgar score of 5.","stem":"What should be done about scoring?","opts":["No further Apgar scores are needed","Repeat every 5 minutes for up to 20 minutes","Repeat it once more, at 1 hour of age","Delay ventilation until the score is recorded"],"key":1,"why":"If the 5-minute Apgar score is less than 7, the assessment is repeated every 5 minutes for up to 20 minutes; action is never delayed to perform the score.","src":[[30961,31053]],"origin":"heuer","age":"neonatal"}]}</script>
<script>
"use strict";
const B=JSON.parse(document.getElementById('bank').textContent), BP=B.blueprint;
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
let store={hist:{},exams:[]};
try{store=Object.assign(store,JSON.parse(localStorage.getItem('rte27')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rte27',JSON.stringify(store))}catch(e){}};
const LIVE_B=B.breadth.filter(q=>!q.dropped), LIVE_CJ=B.cj.filter(q=>!q.hold&&BP.depth.cells[q.cell]);
const domainOf=sec=>sec.split('-')[0];
function srcText(q){
  if(q.origin==='external') return 'Source: '+q.cite;
  const s=(q.src||[]).map(p=>p[0]+'–'+p[1]).join(', ');
  return 'Source: Heuer & Rodriguez, 4th ed., extracted text lines '+s;
}
function record(q,ok){const h=store.hist[q.id]||{n:0,ok:0};h.n++;if(ok)h.ok++;h.last=ok?1:0;store.hist[q.id]=h;save()}
/* ---------- form assembly ---------- */
function buildBreadth(){
  let out=[];
  for(const [sec,v] of Object.entries(BP.breadth)){
    const pool=LIVE_B.filter(q=>q.sec===sec);
    out=out.concat(sample(pool.filter(q=>q.lvl27==='recall'),v.recall),sample(pool.filter(q=>q.lvl27!=='recall'),v.integ));
  }
  // whole-exam age rule: 15-18 neonatal/pediatric items; the judgment portion supplies 10, so breadth needs 5-8
  const lo=BP.age_whole_exam.neonatal_or_pediatric_min-10, hi=BP.age_whole_exam.neonatal_or_pediatric_max-10;
  const kids=()=>out.filter(q=>q.age==='child').length;
  for(let it=0;it<4000&&(kids()<lo||kids()>hi);it++){
    const need=kids()<lo?'child':'adult', i=rnd(out.length), cur=out[i];
    if(cur.age===need) continue;
    const alt=LIVE_B.filter(q=>q.sec===cur.sec&&q.lvl27===cur.lvl27&&q.age===need&&!out.includes(q));
    if(alt.length) out[i]=alt[rnd(alt.length)];
  }
  return out;
}
function buildCJ(){
  const cells=BP.depth.cells, wantIG=BP.depth.type.IG, wantOut=BP.depth.setting.out;
  for(let attempt=0;attempt<20;attempt++){
    const pick={};
    for(const c in cells) pick[c]=sample(LIVE_CJ.filter(q=>q.cell===c),cells[c].n);
    const all=()=>Object.values(pick).flat();
    const score=()=>{const a=all();return Math.abs(a.filter(q=>q.type==='IG').length-wantIG)+Math.abs(a.filter(q=>q.setting==='out').length-wantOut)};
    let s=score();const keys=Object.keys(cells);
    for(let it=0;it<6000&&s;it++){
      const c=keys[rnd(keys.length)], pool=LIVE_CJ.filter(q=>q.cell===c&&!pick[c].includes(q));
      if(!pool.length) continue;
      const j=rnd(pick[c].length), old=pick[c][j];pick[c][j]=pool[rnd(pool.length)];
      const t=score(); if(t<=s) s=t; else pick[c][j]=old;
    }
    if(!s) return all();
  }
  return Object.entries(BP.depth.cells).flatMap(([c,v])=>sample(LIVE_CJ.filter(q=>q.cell===c),v.n));
}
function present(q,portion){const order=shuffle([0,1,2,3]);return {q,portion,order,ans:null,flag:false}}
function makeExam(scale){
  let b=buildBreadth().map(q=>present(q,'B')), c=buildCJ().map(q=>present(q,'C'));
  if(scale<1){ // proportional short form
    const keep=(arr,key)=>{const g={};arr.forEach(x=>{(g[key(x)]=g[key(x)]||[]).push(x)});return Object.values(g).flatMap(v=>sample(v,Math.max(1,Math.round(v.length*scale))))};
    b=keep(b,x=>x.q.sec); c=keep(c,x=>x.q.cell);
  }
  return shuffle(b).concat(shuffle(c));
}
/* ---------- views ---------- */
function home(){
  const seen=Object.keys(store.hist).length, tot=LIVE_B.length+LIVE_CJ.length;
  const missed=[...LIVE_B,...LIVE_CJ].filter(q=>store.hist[q.id]&&store.hist[q.id].last===0).length;
  app.innerHTML='';
  app.append($(`<div>
  <h1>Respiratory Therapy Examination trainer</h1>
  <p class="mute">Built to the NBRC detailed content outline effective January 2027. One exam replaces the TMC and the CSE: ${BP.scored} scored multiple-choice items (${BP.scored+BP.pretest} with pretest items) in 4 hours.</p>
  <div class="card"><h2 style="margin-top:0">Practice exam</h2>
   <p>Assembled to the blueprint each time: 100 breadth-of-knowledge items (Patient Data 25, Devices and Safety 25, Interventions 50) and 60 clinical-judgment items in the outline's exact mix of conditions, with 20 information-gathering and 40 decision-making items, 46 set in a hospital and 14 outside one.</p>
   <div class="row"><button class="pri" id="full">Full exam: 160 items, 4 hours</button><button id="half">Half exam: about 90 items, 2 h 15 min</button><button id="quick">Quick set: about 35 items, 53 min</button></div></div>
  <div class="card"><h2 style="margin-top:0">Drill</h2>
   <p class="small mute">Answer shown after each question, with the reason and the source.</p>
   <div class="row"><select id="dsel"></select><button id="drill">Start drill</button><button id="missed" ${missed?'':'disabled'}>Missed questions (${missed})</button></div></div>
  <div class="card"><h2 style="margin-top:0">Progress</h2><p>${seen} of ${tot} questions attempted.</p><div id="prog"></div>
   <div class="row" style="margin-top:8px"><button id="blue">Blueprint and what changed</button><button id="reset">Reset progress</button></div></div>
  <p class="small mute">Bank: ${B.breadth.length} breadth questions (${B.breadth.filter(q=>q.origin==='external').length} on topics new for 2027, each cited to its source) and ${B.cj.length} clinical-judgment items. The NBRC does not publish its cut scores as a percent, so this trainer reports percent correct only.</p></div>`));
  const sel=app.querySelector('#dsel');
  const add=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)};
  add('mix','Mixed: everything');add('new27','New 2027 topics only');add('B','All breadth questions');add('C','All clinical-judgment items');
  for(const [s,v] of Object.entries(BP.breadth)) add('sec:'+s,s+'  '+v.title);
  for(const [c,v] of Object.entries(BP.depth.cells)) add('cell:'+c,'Judgment: '+v.title);
  add('unplaced','Extra neonatal items outside the 2027 categories');add('dropped','2020-outline-only questions (not on the 2027 outline)');
  app.querySelector('#full').onclick=()=>startExam(1,240);
  app.querySelector('#half').onclick=()=>startExam(.5,135);
  app.querySelector('#quick').onclick=()=>startExam(.2,53);
  app.querySelector('#drill').onclick=()=>startDrill(sel.value);
  app.querySelector('#missed').onclick=()=>startDrill('missed');
  app.querySelector('#blue').onclick=blueprint;
  app.querySelector('#reset').onclick=()=>{if(confirm('Erase all saved progress on this device?')){store={hist:{},exams:[]};save();home()}};
  const p=app.querySelector('#prog');
  if(store.exams.length){p.append($(`<table><tr><th>Date</th><th>Form</th><th class="n">Score</th></tr>${store.exams.slice(-6).reverse().map(e=>`<tr><td>${esc(e.d)}</td><td>${e.n} items</td><td class="n">${e.ok}/${e.n} (${Math.round(100*e.ok/e.n)}%)</td></tr>`).join('')}</table>`))}
}
function poolFor(v){
  if(v==='mix') return [...LIVE_B,...LIVE_CJ];
  if(v==='new27') return [...LIVE_B.filter(q=>q.new27),...LIVE_CJ.filter(q=>q.origin==='external')];
  if(v==='B') return LIVE_B; if(v==='C') return LIVE_CJ;
  if(v==='missed') return [...LIVE_B,...LIVE_CJ].filter(q=>store.hist[q.id]&&store.hist[q.id].last===0);
  if(v==='dropped') return B.breadth.filter(q=>q.dropped);
  if(v==='unplaced') return B.cj.filter(q=>!q.hold&&!BP.depth.cells[q.cell]);
  if(v.startsWith('sec:')) return LIVE_B.filter(q=>q.sec===v.slice(4));
  if(v.startsWith('cell:')) return LIVE_CJ.filter(q=>q.cell===v.slice(5));
  return [];
}
function qHead(p,i,n){
  const q=p.q, isC=q.cell!==undefined;
  const label=isC?(BP.depth.cells[q.cell]?BP.depth.cells[q.cell].title:'Neonatal (outside the 2027 categories)'):(q.sec+' '+BP.breadth[q.sec].title);
  let chips=`<span class="chip">${isC?'Clinical judgment':'Breadth'}</span><span class="chip">${esc(label)}</span>`;
  if(isC) chips+=`<span class="chip">${q.type==='IG'?'Information gathering':'Decision making'}</span><span class="chip">${q.setting==='out'?'Outside a hospital':'In a hospital'}</span>`;
  if(q.dropped) chips+=`<span class="chip warn">2020 outline only</span>`;
  if(q.origin==='external') chips+=`<span class="chip">New for 2027</span>`;
  return `<div class="small mute tabnum">Question ${i+1} of ${n}</div><div>${chips}</div>${q.scenario?`<div class="scen">${esc(q.scenario)}</div>`:''}<p><b>${esc(q.stem)}</b></p>`;
}
function explain(q){return `<div class="why"><b>Why:</b> ${esc(q.why)}${q.dropped?`<div class="src">Note: ${esc(q.dropped)}.</div>`:''}<div class="src">${esc(srcText(q))} · ${esc(q.topic)}</div></div>`}
function startDrill(v){
  const items=shuffle(poolFor(v)).map(q=>present(q,q.cell!==undefined?'C':'B'));
  if(!items.length){alert('No questions in that set.');return}
  let i=0,ok=0,done=0;
  const show=()=>{
    const p=items[i];app.innerHTML='';
    const el=$(`<div><div class="row top"><button id="back">← Home</button><span class="grow"></span><span class="small mute tabnum">${ok} right of ${done}</span></div><div class="card">${qHead(p,i,items.length)}<div id="opts"></div><div id="fb"></div></div><div class="row"><span class="grow"></span><button class="pri" id="next" disabled>Next</button></div></div>`);
    app.append(el);
    const opts=el.querySelector('#opts');
    p.order.forEach((oi,k)=>{const b=$(`<button class="opt">${'ABCD'[k]}. ${esc(p.q.opts[oi])}</button>`);
      b.onclick=()=>{if(p.ans!==null)return;p.ans=oi;const right=oi===p.q.key;done++;if(right)ok++;record(p.q,right);
        [...opts.children].forEach((c,kk)=>{c.disabled=true;if(p.order[kk]===p.q.key)c.classList.add('right');else if(kk===k)c.classList.add('wrong')});
        el.querySelector('#fb').innerHTML=explain(p.q);el.querySelector('#next').disabled=false;el.querySelector('.row.top .tabnum').textContent=ok+' right of '+done};
      opts.append(b)});
    el.querySelector('#back').onclick=home;
    el.querySelector('#next').onclick=()=>{i++;if(i>=items.length){app.innerHTML='';app.append($(`<div class="card"><h2 style="margin-top:0">Drill complete</h2><p>${ok} of ${done} correct (${Math.round(100*ok/Math.max(1,done))}%).</p><button class="pri" id="h">Home</button></div>`));app.querySelector('#h').onclick=home}else show()};
    window.scrollTo(0,0);
  };
  show();
}
let timer=null;
function startExam(scale,minutes){
  const items=makeExam(scale);let i=0;const end=Date.now()+minutes*60000;
  const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return String(Math.floor(s/3600))+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const finish=()=>{clearInterval(timer);results(items)};
  const show=(grid)=>{
    const p=items[i];app.innerHTML='';
    const answered=items.filter(x=>x.ans!==null).length;
    const el=$(`<div><div class="row top"><span class="tabnum" id="clock">${fmt(end-Date.now())}</span><span class="grow"></span><span class="small mute tabnum">${answered}/${items.length} answered</span><button id="g">${grid?'Question':'Overview'}</button><button id="fin">Finish</button></div><div id="body"></div></div>`);
    app.append(el);const body=el.querySelector('#body');
    if(grid){
      const gr=$(`<div class="card"><p class="small mute">Tap a number to jump. Filled = answered, outlined = flagged.</p><div class="grid"></div></div>`);
      items.forEach((x,k)=>{const b=$(`<button class="${x.ans!==null?'done':''} ${x.flag?'flag':''} ${k===i?'cur':''}">${k+1}</button>`);b.onclick=()=>{i=k;show(false)};gr.querySelector('.grid').append(b)});
      body.append(gr);
    }else{
      const card=$(`<div class="card">${qHead(p,i,items.length)}<div id="opts"></div></div>`);
      p.order.forEach((oi,k)=>{const b=$(`<button class="opt ${p.ans===oi?'sel':''}">${'ABCD'[k]}. ${esc(p.q.opts[oi])}</button>`);b.onclick=()=>{p.ans=oi;show(false)};card.querySelector('#opts').append(b)});
      body.append(card);
      const nav=$(`<div class="row"><button id="prev" ${i?'':'disabled'}>← Previous</button><button id="flag">${p.flag?'Unflag':'Flag'}</button><span class="grow"></span><button class="pri" id="next">${i<items.length-1?'Next →':'Overview'}</button></div>`);
      body.append(nav);
      nav.querySelector('#prev').onclick=()=>{i--;show(false)};
      nav.querySelector('#flag').onclick=()=>{p.flag=!p.flag;show(false)};
      nav.querySelector('#next').onclick=()=>{if(i<items.length-1){i++;show(false)}else show(true)};
    }
    el.querySelector('#g').onclick=()=>show(!grid);
    el.querySelector('#fin').onclick=()=>{const left=items.filter(x=>x.ans===null).length;if(confirm(left?left+' questions are unanswered. Finish and score the exam?':'Finish and score the exam?'))finish()};
    window.scrollTo(0,0);
  };
  clearInterval(timer);
  timer=setInterval(()=>{const c=document.getElementById('clock');if(!c){return}const left=end-Date.now();c.textContent=fmt(left);if(left<=0)finish()},1000);
  show(false);
}
function results(items){
  const okOf=a=>a.filter(x=>x.ans===x.q.key).length;
  items.forEach(x=>{if(x.ans!==null)record(x.q,x.ans===x.q.key)});
  const tot=okOf(items);store.exams.push({d:new Date().toLocaleDateString(),n:items.length,ok:tot});save();
  const row=(name,a)=>a.length?`<tr><td>${esc(name)}</td><td class="n tabnum">${okOf(a)}/${a.length}</td><td class="n tabnum">${Math.round(100*okOf(a)/a.length)}%</td><td><div class="bar"><i style="width:${100*okOf(a)/a.length}%"></i></div></td></tr>`:'';
  const Bi=items.filter(x=>x.portion==='B'), Ci=items.filter(x=>x.portion==='C');
  let h=`<div><h1>Result</h1><div class="card"><p style="font-size:1.4rem;margin:0"><b>${tot} of ${items.length}</b> correct (${Math.round(100*tot/items.length)}%)</p><p class="small mute">The real exam awards the CRT at a lower cut score and the RRT at a higher one. The NBRC does not publish those as a percent, so no pass or fail line is shown here.</p></div>`;
  h+=`<div class="card"><h2 style="margin-top:0">By portion and domain</h2><table>${row('Breadth of knowledge',Bi)}${Object.entries(BP.domains).map(([d,t])=>row(' '+d+'. '+t,Bi.filter(x=>domainOf(x.q.sec)===d))).join('')}${row('Depth of clinical judgment',Ci)}${row(' Information gathering',Ci.filter(x=>x.q.type==='IG'))}${row(' Decision making',Ci.filter(x=>x.q.type==='DM'))}${row(' In a hospital',Ci.filter(x=>x.q.setting==='in'))}${row(' Outside a hospital',Ci.filter(x=>x.q.setting==='out'))}</table></div>`;
  h+=`<div class="card"><h2 style="margin-top:0">By section</h2><table>${Object.entries(BP.breadth).map(([s,v])=>row(s+' '+v.title,Bi.filter(x=>x.q.sec===s))).join('')}${Object.entries(BP.depth.cells).map(([c,v])=>row(v.title,Ci.filter(x=>x.q.cell===c))).join('')}</table></div>`;
  h+=`<div class="row"><button class="pri" id="h">Home</button><button id="rm">Review missed (${items.length-tot})</button><button id="ra">Review all</button></div><div id="rev"></div></div>`;
  app.innerHTML='';app.append($(h));
  app.querySelector('#h').onclick=home;
  const rev=(only)=>{const r=app.querySelector('#rev');r.innerHTML='';items.forEach((p,k)=>{const right=p.ans===p.q.key;if(only&&right)return;
    const c=$(`<div class="card">${qHead(p,k,items.length)}<div>${p.order.map((oi,kk)=>`<div class="opt card ${oi===p.q.key?'right':(oi===p.ans?'wrong':'')}" style="margin:6px 0;padding:8px 12px">${'ABCD'[kk]}. ${esc(p.q.opts[oi])}${oi===p.ans?' <span class="small mute">(your answer)</span>':''}</div>`).join('')}</div>${p.ans===null?'<p class="small bad">Not answered</p>':''}${explain(p.q)}</div>`);r.append(c)})};
  app.querySelector('#rm').onclick=()=>rev(true);app.querySelector('#ra').onclick=()=>rev(false);
  window.scrollTo(0,0);
}
function blueprint(){
  const cnt=(a,f)=>a.filter(f).length;
  let h=`<div><div class="row top"><button id="back">← Home</button></div><h1>2027 blueprint</h1>
  <p class="mute small">${esc(BP.source)}</p>
  <div class="card"><h2 style="margin-top:0">Breadth of knowledge: 100 items</h2><table><tr><th>Section</th><th class="n">Recall</th><th class="n">Apply/analyze</th><th class="n">In bank</th></tr>${Object.entries(BP.breadth).map(([s,v])=>`<tr><td>${s} ${esc(v.title)}</td><td class="n">${v.recall}</td><td class="n">${v.integ}</td><td class="n">${cnt(LIVE_B,q=>q.sec===s)}</td></tr>`).join('')}</table></div>
  <div class="card"><h2 style="margin-top:0">Depth of clinical judgment: 60 items</h2><table><tr><th>Patient condition</th><th class="n">Per exam</th><th class="n">In bank</th></tr>${Object.entries(BP.depth.cells).map(([c,v])=>`<tr><td>${esc(v.title)}</td><td class="n">${v.n}</td><td class="n">${cnt(LIVE_CJ,q=>q.cell===c)}</td></tr>`).join('')}</table>
  <p class="small">Information gathering 20, decision making 40. In a hospital 46, outside a hospital 14. Across the whole exam, 15 to 18 items are neonatal or pediatric.</p></div>
  <div class="card"><h2 style="margin-top:0">What changed from the TMC and CSE</h2>
  <p>The branching simulations are gone; clinical judgment is tested with standalone multiple-choice items. Devices and patient safety grew to a quarter of the breadth portion.</p>
  <p><b>Named in the 2027 outline and not in the 2020 one:</b> vaccination status, respiratory pathogen studies, social determinants of health, vaping history, SpCO, SpO2/FiO2, ventilator-associated events, video laryngoscope and bougie, T-piece resuscitator, epoprostenol and nitric oxide delivery, antifibrinolytics, biologics for asthma, CFTR modulators, closed-loop communication, debriefing, handoffs, trauma-informed and culturally aware care.</p>
  <p><b>No longer listed:</b> diagnostic chest percussion, tactile fremitus, PET scan, FeNO, cardiopulmonary stress testing, long-term oxygen therapy as a device heading, esophageal-tracheal tubes, intrapulmonary percussive ventilation by name.</p>
  <p class="small mute">Questions on the removed tasks are kept in a separate drill set and never appear on a practice exam.</p></div>
  <div class="card"><h2 style="margin-top:0">Where the content comes from</h2>
  <p>Questions marked with book line numbers were written against Heuer and Rodriguez, 4th edition. Questions marked "New for 2027" come from these sources:</p><ul class="small">${Object.values(B.cites).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
  <p class="small"><b>Known conflict:</b> the textbook teaches immediate intubation and tracheal suction for a non-vigorous meconium-stained newborn. The 2025 AHA/AAP guideline reserves suctioning for airway obstruction. The two older items built on the textbook wording are withheld, and the replacement item states both.</p>
  <p class="small"><b>Format note:</b> items worded "all of the following EXCEPT" were converted from select-many simulation steps. The NBRC has not published sample items in that form.</p></div></div>`;
  app.innerHTML='';app.append($(h));app.querySelector('#back').onclick=home;window.scrollTo(0,0);
}
home();
</script></body></html>
