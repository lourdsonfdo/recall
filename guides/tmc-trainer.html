ollows the event to improve performance through lessons learned and reinforcement of positive behaviors.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-35","sec":"III-G","lvl27":"integ","topic":"Debriefing","stem":"After an unexpected extubation that led to a cardiac arrest, the team gathers for ten minutes to review what happened and what to do differently. This is a:","opts":["Brief","Huddle","Debrief","Handoff"],"key":2,"why":"Reviewing the team's performance after an event, to capture lessons learned, is a debrief.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-36","sec":"III-G","lvl27":"integ","topic":"Team communication","stem":"Before a planned bedside tracheostomy, the team meets to share the plan, assign roles and discuss what could go wrong. This is a:","opts":["Brief","Debrief","Check-back","Teach-back"],"key":0,"why":"A brief is a short session before the start to share the plan, assign roles and responsibilities, and anticipate outcomes and likely contingencies.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-37","sec":"III-I","lvl27":"recall","topic":"Handoffs","stem":"Which tool is described as the preferred handoff tool for patient transitions in care?","opts":["I-PASS","Apgar","STOP-BANG","AVPU"],"key":0,"why":"I-PASS is the preferred handoff tool; it begins with Illness severity and Patient summary.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-38","sec":"III-I","lvl27":"integ","topic":"Handoffs","stem":"At shift change a therapist gives a verbal report on a ventilated patient. Which element makes it a proper handoff?","opts":["Leaving a written note without speaking to the next therapist","Verbal transfer of responsibility, acknowledged, with time for questions","Reporting the ventilator mode and settings to the oncoming therapist","Giving the report to the patient's nurse instead of the therapist"],"key":1,"why":"A proper handoff transfers responsibility and accountability, gives clear information verbally, is acknowledged by the receiver, and allows questions and review.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-39","sec":"III-I","lvl27":"recall","topic":"Team communication","stem":"In SBAR, the letters stand for:","opts":["Situation, Background, Assessment, Recommendation","Symptoms, Breathing, Airway, Response to therapy","Safety, Briefing, Action, Review of the outcome","Status, Baseline, Alarm limits, Report to team"],"key":0,"why":"SBAR is a technique for communicating critical information that needs immediate attention: Situation, Background, Assessment, Recommendation or Request.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-40","sec":"III-I","lvl27":"integ","topic":"Escalating a concern","stem":"A therapist tells a physician that an ordered tidal volume appears unsafe. The physician does not respond. What should the therapist do next?","opts":["Carry out the order as written without further comment","Restate the concern assertively; use the chain of command if needed","Leave the unit and ask another therapist to take the patient","Change the order on your own and say nothing to the physician"],"key":1,"why":"Under the two-challenge rule, when a first assertive statement is ignored it is the team member's responsibility to restate the concern; if the safety issue is still not addressed, take a stronger course of action, engage other team members, or use the supervisor or chain of command.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-41","sec":"III-I","lvl27":"integ","topic":"Patient education","stem":"After teaching a patient to use a new inhaler, which technique best confirms that the teaching was understood?","opts":["Ask, 'Do you understand how to use it?'","Have the patient explain and show the steps (teach-back)","Give a printed pamphlet with pictures to take home","Repeat the instructions more slowly and clearly"],"key":1,"why":"In a teach-back the patient or family member explains, in their own words, the information they need to know or the actions they need to take.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"},{"id":"N27-42","sec":"III-I","lvl27":"integ","topic":"Team communication","stem":"A therapist needs to call a physician about a patient whose condition is suddenly worsening. Which structure should the call follow?","opts":["SBAR","A debrief","A brief","A teach-back"],"key":0,"why":"SBAR is the technique for communicating critical information that requires immediate attention and action concerning a patient's condition.","src":"AHRQ-TS","origin":"external","cite":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","new27":true,"age":"adult"}],"cj":[{"id":"CJ-011","cell":"CLD-OUT","type":"IG","setting":"out","topic":"COPD: Outpatient Management","scenario":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He walks slower than people his age on level ground and sometimes stops for breath at his own pace, but can walk several hundred yards before stopping. He has had two exacerbations in the past year.","stem":"In the initial information gathering for this clinic visit, all of the following are appropriate EXCEPT:","opts":["History of previous exacerbations","Limitation of activities — ability to walk, eat, or sleep due to dyspnea","Emergent chest CT angiogram","Baseline respiratory status and present treatment regimen"],"key":2,"why":"Not appropriate: Emergent chest CT angiogram — No clinical suspicion of PE; unnecessary radiation and contrast. The other three are appropriate: • Baseline respiratory status and present treatment regimen: Essential. Establishes what has changed and what the patient is already taking. • History of previous exacerbations: Two or more per year drives risk classification and controller escalation. • Limitation of activities — ability to walk, eat, or sleep due to dyspnea: Functional limitation is a core severity measure.","src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]],"origin":"heuer","age":"adult"},{"id":"CJ-012","cell":"CLD-OUT","type":"IG","setting":"out","topic":"COPD: Outpatient Management","scenario":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He walks slower than people his age on level ground and sometimes stops for breath at his own pace, but can walk several hundred yards before stopping. He has had two exacerbations in the past year. Post-bronchodilator FEV1 is 46% predicted, FEV1/FVC 0.58. SpO2 94% on room air. Two exacerbations last year, neither requiring admission.","stem":"Using the ATS Breathlessness Scale, how would you grade this patient?","opts":["Grade 4 — Very severe: too breathless to leave the house or to dress","Grade 1 — Slight: troubled only when hurrying on level ground or up a small hill","Grade 3 — Severe: stops for breath after about 100 yards or a few minutes","Grade 2 — Moderate: walks slower than peers on level ground or stops for breath at own pace"],"key":3,"why":"Matches his description exactly. • Grade 4 — Very severe: too breathless to leave the house or to dress: Far overstates his limitation. • Grade 1 — Slight: troubled only when hurrying on level ground or up a small hill: Understates his limitation. • Grade 3 — Severe: stops for breath after about 100 yards or a few minutes: Close, but he describes stopping at his own pace on level ground, which is grade 2.","src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]],"origin":"heuer","age":"adult"},{"id":"CJ-013","cell":"CLD-OUT","type":"DM","setting":"out","topic":"COPD: Outpatient Management","scenario":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He walks slower than people his age on level ground and sometimes stops for breath at his own pace, but can walk several hundred yards before stopping. He has had two exacerbations in the past year. Post-bronchodilator FEV1 is 46% predicted, FEV1/FVC 0.58. SpO2 94% on room air. Two exacerbations last year, neither requiring admission.","stem":"What is the single most important intervention to recommend?","opts":["Smoking cessation counseling and pharmacologic support","Begin daily systemic corticosteroids","Start long-term oxygen therapy","Start a LABA plus long-acting anticholinergic combination"],"key":0,"why":"Nothing else alters the disease trajectory as much. • Begin daily systemic corticosteroids: Chronic systemic steroids are not indicated for stable COPD and carry major harm. • Start long-term oxygen therapy: His SpO2 is 94%; he does not meet criteria for LTOT. • Start a LABA plus long-acting anticholinergic combination: Appropriate maintenance therapy, but secondary to cessation.","src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]],"origin":"heuer","age":"adult"},{"id":"CJ-014","cell":"CLD-OUT","type":"DM","setting":"out","topic":"COPD: Outpatient Management","scenario":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He walks slower than people his age on level ground and sometimes stops for breath at his own pace, but can walk several hundred yards before stopping. He has had two exacerbations in the past year. Post-bronchodilator FEV1 is 46% predicted, FEV1/FVC 0.58. SpO2 94% on room air. Two exacerbations last year, neither requiring admission.","stem":"Which maintenance regimen provides both long-acting beta2-agonist and long-acting anticholinergic bronchodilation?","opts":["A long-acting anticholinergic alone (e.g., tiotropium) once daily","A LABA plus long-acting anticholinergic (e.g., umeclidinium/vilanterol)","Scheduled short-acting albuterol four times daily as the only therapy","A LABA alone (e.g., salmeterol), with no anticholinergic or steroid"],"key":1,"why":"For maintenance of bronchospasm in COPD, consider a LABA, a long-acting anticholinergic, or the combination. • Scheduled short-acting albuterol four times daily as the only therapy: SABAs are relievers, not controllers. • A LABA alone (e.g., salmeterol), with no anticholinergic or steroid: Acceptable but less effective than combination therapy here. • A long-acting anticholinergic alone (e.g., tiotropium) once daily: A reasonable single-agent maintenance choice.","src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]],"origin":"heuer","age":"adult"},{"id":"CJ-015","cell":"CLD-OUT","type":"IG","setting":"out","topic":"COPD: Outpatient Management","scenario":"A 68-year-old with a 45 pack-year history presents to the pulmonary clinic. He walks slower than people his age on level ground and sometimes stops for breath at his own pace, but can walk several hundred yards before stopping. He has had two exacerbations in the past year. Post-bronchodilator FEV1 is 46% predicted, FEV1/FVC 0.58. SpO2 94% on room air. Two exacerbations last year, neither requiring admission.","stem":"All of the following education topics should be covered before he leaves the clinic EXCEPT:","opts":["How to recognize early signs of an exacerbation and when to call","Limit the session to about an hour and leave EZ-read printed material","A detailed written pharmacology manual only, with no demonstration","Correct inhaler technique with return demonstration"],"key":2,"why":"Not appropriate: A detailed written pharmacology manual only, with no demonstration — Ignores literacy limits and omits return demonstration. The other three are appropriate: • Correct inhaler technique with return demonstration: Evaluate patient skill by return demonstration. • How to recognize early signs of an exacerbation and when to call: Central to self-management. • Limit the session to about an hour and leave EZ-read printed material: Avoids information overload and accommodates health literacy.","src":[[26618,26760],[2912,2947],[18356,18359],[24042,24052]],"origin":"heuer","age":"adult"},{"id":"CJ-021","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air.","stem":"All of the following information and tests are appropriate to obtain now EXCEPT:","opts":["Vital signs including temperature, and SpO2","Duration of worsening symptoms and recent medication use","Signs of airway infection — fever, change in sputum volume and color","Spirometry"],"key":3,"why":"Not appropriate: Spirometry — In an acute COPD exacerbation spirometry is of little value; use oximetry and ABGs. The other three are appropriate: • Vital signs including temperature, and SpO2: Baseline physical assessment for an exacerbation. • Duration of worsening symptoms and recent medication use: Defines the exacerbation and what has already failed. • Signs of airway infection — fever, change in sputum volume and color: Guides the decision on antibiotics.","src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]],"origin":"heuer","age":"adult"},{"id":"CJ-022","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air. ABG on room air: pH 7.33, PaCO2 58, PaO2 48, HCO3 30, BE +4. Chest film shows hyperinflation, no infiltrate. Temp 38.1°C.","stem":"What oxygen target and device do you choose?","opts":["PaO2 60–65 torr / SpO2 88–92% with a 28% air-entrainment mask","Nonrebreathing mask at 15 L/min to maximize oxygenation quickly","Room air only, because the PaCO2 is already elevated at 58","Nasal cannula at 6 L/min, titrated to an SpO2 of 96–98%"],"key":0,"why":"Correct target for an acute COPD exacerbation, delivered by a stable low-FiO2 high-flow device. • Nonrebreathing mask at 15 L/min to maximize oxygenation quickly: Risks O2-induced hypoventilation in a CO2 retainer. • Room air only, because the PaCO2 is already elevated at 58: Withholding oxygen from a hypoxemic patient is never correct. • Nasal cannula at 6 L/min, titrated to an SpO2 of 96–98%: Variable FiO2 and likely too much for a retainer.","src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]],"origin":"heuer","age":"adult"},{"id":"CJ-023","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air. ABG on room air: pH 7.33, PaCO2 58, PaO2 48, HCO3 30, BE +4. Chest film shows hyperinflation, no infiltrate. Temp 38.1°C.","stem":"All of the following pharmacologic and supportive measures should be recommended EXCEPT:","opts":["Systemic steroids in addition to inhaled steroids","A mucolytic without a preceding bronchodilator","Increase the β-agonist dose and frequency","Add an inhaled anticholinergic if not already prescribed"],"key":1,"why":"Not appropriate: A mucolytic without a preceding bronchodilator — All mucolytics irritate the airway; always precede with a bronchodilator. The other three are appropriate: • Increase the β-agonist dose and frequency: First-line in an exacerbation. • Add an inhaled anticholinergic if not already prescribed: Standard addition in acute COPD. • Systemic steroids in addition to inhaled steroids: Recommended for acute exacerbation.","src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]],"origin":"heuer","age":"adult"},{"id":"CJ-024","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air. ABG on room air: pH 7.33, PaCO2 58, PaO2 48, HCO3 30, BE +4. Chest film shows hyperinflation, no infiltrate. Temp 38.1°C.","stem":"Two hours later: RR 30, still using accessory muscles, ABG pH 7.28 / PaCO2 66 / PaO2 62 on 28%. What now?","opts":["Add heliox by nonrebreathing mask","Intubate and begin invasive ventilation","Initiate noninvasive positive-pressure ventilation","Increase the FiO2 to 40% and continue observing"],"key":2,"why":"Failure of basic management with worsening respiratory acidosis is the classic NPPV indication; NPPV is preferred because intubated COPD patients are difficult to wean. • Increase the FiO2 to 40% and continue observing: Does not address the rising PaCO2 and falling pH. • Add heliox by nonrebreathing mask: Not the evidence-based next step for hypercapnic COPD failure. • Intubate and begin invasive ventilation: Premature — he is alert and protecting his airway, so NPPV should be tried first.","src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]],"origin":"heuer","age":"adult"},{"id":"CJ-025","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 71-year-old with known COPD arrives in the ED with three days of worsening dyspnea, increased cough, and thicker yellow sputum. RR 28, HR 114, using accessory muscles. SpO2 84% on room air. ABG on room air: pH 7.33, PaCO2 58, PaO2 48, HCO3 30, BE +4. Chest film shows hyperinflation, no infiltrate. Temp 38.1°C.","stem":"Select your initial BiPAP settings.","opts":["IPAP 20 / EPAP 10 cm H2O, backup rate 20/min, I:E 1:2, FiO2 0.60","CPAP 10 cm H2O alone, FiO2 titrated to keep the SpO2 above 95%","IPAP 10 / EPAP 5 cm H2O, backup rate 10/min, I:E of 1:1, FiO2 0.40","IPAP 10 / EPAP 5, backup rate 10/min, I:E 1:3 or lower, SpO2 88–95%"],"key":3,"why":"Exactly the recommended starting point for COPD, including enough expiratory time for complete exhalation. • IPAP 20 / EPAP 10 cm H2O, backup rate 20/min, I:E 1:2, FiO2 0.60: IPAP near the esophageal opening pressure risks gastric insufflation, and the high rate shortens expiratory time. • CPAP 10 cm H2O alone, FiO2 titrated to keep the SpO2 above 95%: Provides no pressure support to unload the ventilatory muscles or lower the PaCO2. • IPAP 10 / EPAP 5 cm H2O, backup rate 10/min, I:E of 1:1, FiO2 0.40: Insufficient expiratory time will worsen air trapping.","src":[[26761,26896],[9407,9408],[16606,16615],[18365,18366]],"origin":"heuer","age":"adult"},{"id":"CJ-031","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"The same 71-year-old is now on BiPAP 12/5 cm H2O with a backup rate of 10. He is more comfortable, but the ventilator flow waveform shows expiratory flow that does not return to zero before the next breath. pH 7.34, PaCO2 54, PaO2 70 on FiO2 0.35.","stem":"All of the following assessments help confirm auto-PEEP EXCEPT:","opts":["Read the auto-PEEP value directly off the pressure-versus-time graphic","Inspect the flow-versus-time waveform for expiratory flow not returning to baseline","Inspect the flow–volume loop","Perform an end-expiratory pause to measure the trapped pressure"],"key":0,"why":"Not appropriate: Read the auto-PEEP value directly off the pressure-versus-time graphic — Auto-PEEP is invisible there — that is why it is called occult PEEP. The other three are appropriate: • Inspect the flow-versus-time waveform for expiratory flow not returning to baseline: Auto-PEEP is not visible on the pressure-time graphic; the flow waveform or flow-volume loop is how you detect it. • Inspect the flow–volume loop: The other graphic that reveals air trapping. • Perform an end-expiratory pause to measure the trapped pressure: Measurement of auto-PEEP requires an end-expiratory pause.","src":[[5155,5170],[17341,17345],[26879,26896]],"origin":"heuer","age":"adult"},{"id":"CJ-032","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"The same 71-year-old is now on BiPAP 12/5 cm H2O with a backup rate of 10. He is more comfortable, but the ventilator flow waveform shows expiratory flow that does not return to zero before the next breath. pH 7.34, PaCO2 54, PaO2 70 on FiO2 0.35. End-expiratory pause reveals a total PEEP of 9 cm H2O against a set EPAP of 5 — auto-PEEP of about 4 cm H2O.","stem":"His pH and PaCO2 are now adequate. How do you address the auto-PEEP?","opts":["Raise IPAP alone, to 16 cm H2O with EPAP still at 5","Raise EPAP and IPAP equally — for example, to 14/7 cm H2O","Increase the backup rate to 16/min to shorten each breath","Lower EPAP to 3 cm H2O to reduce the total end-expiratory pressure"],"key":1,"why":"With adequate PCO2/pH, raise EPAP and IPAP equally: this raises the baseline to counterbalance trapping while keeping ΔP — and therefore ventilation — constant. • Increase the backup rate to 16/min to shorten each breath: Shortens expiratory time and will worsen air trapping. • Lower EPAP to 3 cm H2O to reduce the total end-expiratory pressure: Reduces the counterbalancing baseline pressure and worsens the trigger burden. • Raise IPAP alone, to 16 cm H2O with EPAP still at 5: Increases ΔP and ventilation, which he does not need, and does nothing for trapping.","src":[[5155,5170],[17341,17345],[26879,26896]],"origin":"heuer","age":"adult"},{"id":"CJ-033","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"The same 71-year-old is now on BiPAP 12/5 cm H2O with a backup rate of 10. He is more comfortable, but the ventilator flow waveform shows expiratory flow that does not return to zero before the next breath. pH 7.34, PaCO2 54, PaO2 70 on FiO2 0.35. End-expiratory pause reveals a total PEEP of 9 cm H2O against a set EPAP of 5 — auto-PEEP of about 4 cm H2O.","stem":"Overall, what should your pH/PaCO2 goal be for this patient?","opts":["Aim for a PaCO2 of exactly 40 torr","Accept any pH above 7.15","Aim for a normal pH, not necessarily a normal PaCO2","Aim for a PaCO2 below 35 torr to maximize the safety margin"],"key":2,"why":"The explicit rule in COPD — he is a chronic retainer whose baseline PaCO2 is high. • Aim for a PaCO2 below 35 torr to maximize the safety margin: Frank overventilation. • Aim for a PaCO2 of exactly 40 torr: Overventilating a chronic retainer produces a post-hypercapnic metabolic alkalosis. • Accept any pH above 7.15: Far too permissive outside a lung-protective ARDS strategy.","src":[[5155,5170],[17341,17345],[26879,26896]],"origin":"heuer","age":"adult"},{"id":"CJ-034","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"The same 71-year-old is now on BiPAP 12/5 cm H2O with a backup rate of 10. He is more comfortable, but the ventilator flow waveform shows expiratory flow that does not return to zero before the next breath. pH 7.34, PaCO2 54, PaO2 70 on FiO2 0.35. End-expiratory pause reveals a total PEEP of 9 cm H2O against a set EPAP of 5 — auto-PEEP of about 4 cm H2O.","stem":"Two days later he is comfortable on 10/5 with a normal pH. How do you wean him from NPPV?","opts":["Switch to invasive ventilation to wean more reliably","Abruptly discontinue and place on a nonrebreathing mask","Reduce IPAP to equal EPAP and leave the mask on continuously","Progressively decrease the time on NPPV"],"key":3,"why":"Weaning from NPPV is best accomplished by progressively decreasing the time on the device. • Switch to invasive ventilation to wean more reliably: Intubating a patient improving on NPPV reverses the whole point. • Abruptly discontinue and place on a nonrebreathing mask: No graded reduction and the wrong oxygen device for a retainer. • Reduce IPAP to equal EPAP and leave the mask on continuously: Eliminates support without reducing exposure to the interface.","src":[[5155,5170],[17341,17345],[26879,26896]],"origin":"heuer","age":"adult"},{"id":"CJ-041","cell":"CLD-IMV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 66-year-old with severe COPD has been on BiPAP for four hours. He is now somnolent and difficult to rouse, RR 34, and cannot clear copious secretions. ABG: pH 7.19, PaCO2 82, PaO2 55 on FiO2 0.50.","stem":"All of the following findings justify moving to invasive ventilation EXCEPT:","opts":["Inability to manage secretions","His SpO2 is 90%, which is acceptable","Severe acidosis with pH < 7.25 and hypercapnia with PaCO2 > 60 torr","Decreased level of consciousness"],"key":1,"why":"Not appropriate: His SpO2 is 90%, which is acceptable — Oxygenation is not the problem here — ventilatory failure is. The other three are appropriate: • Severe acidosis with pH < 7.25 and hypercapnia with PaCO2 > 60 torr: An explicit indication for intubation and invasive ventilation in COPD. • Decreased level of consciousness: Both an indicator of treatment failure and a contraindication to continuing NPPV. • Inability to manage secretions: BiPAP requires the patient control the upper airway and manage secretions.","src":[[26923,26932],[16798,16803],[20110,20115],[5593,5599],[13934,13938],[22736,22739]],"origin":"heuer","age":"adult"},{"id":"CJ-042","cell":"CLD-IMV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 66-year-old with severe COPD has been on BiPAP for four hours. He is now somnolent and difficult to rouse, RR 34, and cannot clear copious secretions. ABG: pH 7.19, PaCO2 82, PaO2 55 on FiO2 0.50. Chart review confirms full code status. The patient is intubated with an 8.0 ETT.","stem":"Select initial ventilator settings.","opts":["PS 10 cm H2O alone with CPAP 5 cm H2O and FiO2 0.50","SIMV at a rate of 4 with no pressure support on spontaneous breaths","VC A/C, VT 6–8 mL/kg PBW, rate 12, I:E 1:4 or lower","VC A/C, VT 12 mL/kg PBW, rate 20, I:E 1:1 to ensure CO2 removal"],"key":2,"why":"Full ventilatory support at a lung-protective volume, with the long expiratory time obstructive patients require. • VC A/C, VT 12 mL/kg PBW, rate 20, I:E 1:1 to ensure CO2 removal: Injurious volume plus an I:E that guarantees severe air trapping. • PS 10 cm H2O alone with CPAP 5 cm H2O and FiO2 0.50: Not full ventilatory support for a somnolent patient in ventilatory failure. • SIMV at a rate of 4 with no pressure support on spontaneous breaths: Imposes a large spontaneous workload on an exhausted patient.","src":[[26923,26932],[16798,16803],[20110,20115],[5593,5599],[13934,13938],[22736,22739]],"origin":"heuer","age":"adult"},{"id":"CJ-043","cell":"CLD-IMV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 66-year-old with severe COPD has been on BiPAP for four hours. He is now somnolent and difficult to rouse, RR 34, and cannot clear copious secretions. ABG: pH 7.19, PaCO2 82, PaO2 55 on FiO2 0.50. Chart review confirms full code status. The patient is intubated with an 8.0 ETT.","stem":"Over the first hour of ventilation, all of the following should be monitored or targeted EXCEPT:","opts":["Plateau pressure, keeping it at or below 30 cm H2O","Auto-PEEP via end-expiratory pause","Arterial blood gas to confirm the pH is correcting","Rapid correction of the PaCO2 to 40 torr within the hour"],"key":3,"why":"Not appropriate: Rapid correction of the PaCO2 to 40 torr within the hour — Correcting a chronic retainer's PaCO2 abruptly causes seizures and severe alkalosis. The other three are appropriate: • Plateau pressure, keeping it at or below 30 cm H2O: Core lung-protective monitoring. • Auto-PEEP via end-expiratory pause: Essential in any ventilated obstructive patient. • Arterial blood gas to confirm the pH is correcting: Confirms the adequacy of the new settings.","src":[[26923,26932],[16798,16803],[20110,20115],[5593,5599],[13934,13938],[22736,22739]],"origin":"heuer","age":"adult"},{"id":"CJ-044","cell":"CLD-IMV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 66-year-old with severe COPD has been on BiPAP for four hours. He is now somnolent and difficult to rouse, RR 34, and cannot clear copious secretions. ABG: pH 7.19, PaCO2 82, PaO2 55 on FiO2 0.50. Chart review confirms full code status. The patient is intubated with an 8.0 ETT.","stem":"Blood gas one hour later: pH 7.47, PaCO2 38. What do you recommend?","opts":["Decrease the rate so the PaCO2 rises toward his baseline","Increase the rate further to maintain the improvement","Leave the settings unchanged, since the PaCO2 is normal","Add mechanical deadspace and increase the tidal volume"],"key":0,"why":"He is being overventilated relative to his compensated baseline; aim for a normal pH at his own PaCO2. • Increase the rate further to maintain the improvement: Worsens the alkalosis. • Leave the settings unchanged, since the PaCO2 is normal: 'Normal' is wrong for a chronic retainer — the alkalemia proves it. • Add mechanical deadspace and increase the tidal volume: Adding deadspace is a legitimate tool, but a rate reduction is the simpler first move.","src":[[26923,26932],[16798,16803],[20110,20115],[5593,5599],[13934,13938],[22736,22739]],"origin":"heuer","age":"adult"},{"id":"CJ-051","cell":"CLD-IMV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"Day 4 of invasive ventilation for a COPD exacerbation. The patient is alert and following commands. FiO2 0.35, PEEP 5, pH 7.38, PaCO2 52, PaO2 78. Secretions are minimal.","stem":"Before a spontaneous breathing trial, all of the following readiness criteria should be verified EXCEPT:","opts":["P/F ratio 150–200 or better, PEEP ≤ 5–8 cm H2O, FiO2 ≤ 0.4–0.5","pH ≥ 7.25","A normal PaCO2 of 40 torr","Evidence of some reversal of the underlying cause of respiratory failure"],"key":2,"why":"Not appropriate: A normal PaCO2 of 40 torr — Never the target in a chronic retainer. The other three are appropriate: • Evidence of some reversal of the underlying cause of respiratory failure: The first readiness criterion. • P/F ratio 150–200 or better, PEEP ≤ 5–8 cm H2O, FiO2 ≤ 0.4–0.5: Adequate oxygenation criteria. • pH ≥ 7.25: Acid-base criterion for readiness.","src":[[5369,5399],[21269,21274],[20256,20258]],"origin":"heuer","age":"adult"},{"id":"CJ-052","cell":"CLD-IMV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"Day 4 of invasive ventilation for a COPD exacerbation. The patient is alert and following commands. FiO2 0.35, PEEP 5, pH 7.38, PaCO2 52, PaO2 78. Secretions are minimal. All criteria met. P/F is 223. You begin a spontaneous breathing trial.","stem":"Which SBT mode supplies continuous positive airway pressure without added inspiratory pressure support, and may improve triggering if auto-PEEP is present?","opts":["Return to SIMV with a rate of 4 and pressure support of 10","Straight T-tube breathing with heated humidity at FiO2 0.40","Pressure support plus CPAP, at the lowest level he tolerates","CPAP, because it can help triggering when auto-PEEP is present"],"key":3,"why":"CPAP supplies continuous positive airway pressure without added inspiratory pressure support, and it may improve triggering if auto-PEEP is present. No one SBT approach is better than the others by evidence. • Return to SIMV with a rate of 4 and pressure support of 10: SIMV weaning is not a spontaneous breathing trial. • Straight T-tube breathing with heated humidity at FiO2 0.40: An accepted SBT mode, but it supplies no CPAP. • Pressure support plus CPAP, at the lowest level he tolerates: An accepted SBT mode, but it adds the inspiratory pressure support that this question excludes.","src":[[5369,5399],[21269,21274],[20256,20258]],"origin":"heuer","age":"adult"},{"id":"CJ-053","cell":"CLD-IMV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"Day 4 of invasive ventilation for a COPD exacerbation. The patient is alert and following commands. FiO2 0.35, PEEP 5, pH 7.38, PaCO2 52, PaO2 78. Secretions are minimal. All criteria met. P/F is 223. You begin a spontaneous breathing trial.","stem":"After a 3-minute screening period he is comfortable with stable vitals and RR 26. What next?","opts":["Continue the SBT for at least 30 but no more than 120 minutes","Continue the trial for 6 hours to be certain he tolerates it","Return him to full support now and retry the trial tomorrow","Extubate immediately, since the screening phase was passed"],"key":0,"why":"The screening phase is 2–5 minutes; if tolerated, continue 30–120 minutes before deciding. • Continue the trial for 6 hours to be certain he tolerates it: Beyond 120 minutes only fatigues the patient without adding information. • Return him to full support now and retry the trial tomorrow: He is passing; there is no reason to stop. • Extubate immediately, since the screening phase was passed: Too early — the screening phase alone does not establish tolerance.","src":[[5369,5399],[21269,21274],[20256,20258]],"origin":"heuer","age":"adult"},{"id":"CJ-054","cell":"CLD-IMV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"Day 4 of invasive ventilation for a COPD exacerbation. The patient is alert and following commands. FiO2 0.35, PEEP 5, pH 7.38, PaCO2 52, PaO2 78. Secretions are minimal. All criteria met. P/F is 223. You begin a spontaneous breathing trial.","stem":"At 45 minutes: RR 24, stable vitals, ABG pH 7.37 / PaCO2 54 / PaO2 82. What do you recommend?","opts":["Extubate and place on NPPV prophylactically","Discontinue ventilatory support and consider extubation","Restore prior support and determine why the trial failed","Extubate directly to a nonrebreathing mask"],"key":1,"why":"Acceptable ABGs, stable vitals, and no signs of failure after a completed SBT. • Restore prior support and determine why the trial failed: The trial did not fail. • Extubate directly to a nonrebreathing mask: Wrong oxygen device for a CO2 retainer. • Extubate and place on NPPV prophylactically: Reasonable in selected high-risk COPD patients to avoid reintubation, but not required when the SBT is clearly passed.","src":[[5369,5399],[21269,21274],[20256,20258]],"origin":"heuer","age":"adult"},{"id":"CJ-061","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"An 79-year-old with GOLD stage 4 COPD, on home oxygen, has been admitted four times in six months. He is alert, cachexic, and says he 'does not want the breathing tube again.' SpO2 87% on 2 L/min. pH 7.34, PaCO2 62.","stem":"All of the following should be gathered first EXCEPT:","opts":["Whether advance directives have been established","Whether a written DNR/DNI order is in the record by the attending physician","Baseline respiratory status and recent exacerbation history","Nothing — act on the patient's verbal statement alone"],"key":3,"why":"Not appropriate: Nothing — act on the patient's verbal statement alone — A verbal preference is not an order; it must be documented by the attending physician. The other three are appropriate: • Whether advance directives have been established: You should always determine whether advance directives exist, and presume the patient wants lifesaving treatment until informed otherwise. • Whether a written DNR/DNI order is in the record by the attending physician: A DNR request can come from patient or surrogate, but the written order must be placed by the attending physician. • Baseline respiratory status and recent exacerbation history: Establishes trajectory.","src":[[1111,1145],[26845,26853],[17216,17221]],"origin":"heuer","age":"adult"},{"id":"CJ-062","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"An 79-year-old with GOLD stage 4 COPD, on home oxygen, has been admitted four times in six months. He is alert, cachexic, and says he 'does not want the breathing tube again.' SpO2 87% on 2 L/min. pH 7.34, PaCO2 62. No advance directive is on file. The patient is alert and oriented x3 and repeats his wishes clearly.","stem":"What is your immediate action regarding his stated wishes?","opts":["Notify the attending physician so the request can be documented in the record","Ignore the statement because no order exists","Write a DNI note in the respiratory therapy charting and consider it handled","Ask a family member to decide instead"],"key":0,"why":"The physician is obliged to document the request; until then you must presume he wants lifesaving treatment. • Ignore the statement because no order exists: Failing to escalate the request is a serious omission. • Write a DNI note in the respiratory therapy charting and consider it handled: RT documentation does not constitute a physician order. • Ask a family member to decide instead: He is alert and oriented — his own wishes govern.","src":[[1111,1145],[26845,26853],[17216,17221]],"origin":"heuer","age":"adult"},{"id":"CJ-063","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"An 79-year-old with GOLD stage 4 COPD, on home oxygen, has been admitted four times in six months. He is alert, cachexic, and says he 'does not want the breathing tube again.' SpO2 87% on 2 L/min. pH 7.34, PaCO2 62. No advance directive is on file. The patient is alert and oriented x3 and repeats his wishes clearly.","stem":"For this admission, all of the following are appropriate recommendations EXCEPT:","opts":["Systemic steroids","Elective intubation now to prevent deterioration","Supplemental O2 titrated to a PaO2 of 60–65 torr / SpO2 88–92%","Increase β-agonist dose and frequency, add inhaled anticholinergic"],"key":1,"why":"Not appropriate: Elective intubation now to prevent deterioration — Directly contrary to his stated wishes and clinically unjustified. The other three are appropriate: • Supplemental O2 titrated to a PaO2 of 60–65 torr / SpO2 88–92%: Correct target for a chronic retainer. • Increase β-agonist dose and frequency, add inhaled anticholinergic: Basic exacerbation management. • Systemic steroids: Recommended in an acute exacerbation.","src":[[1111,1145],[26845,26853],[17216,17221]],"origin":"heuer","age":"adult"},{"id":"CJ-064","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"An 79-year-old with GOLD stage 4 COPD, on home oxygen, has been admitted four times in six months. He is alert, cachexic, and says he 'does not want the breathing tube again.' SpO2 87% on 2 L/min. pH 7.34, PaCO2 62. No advance directive is on file. The patient is alert and oriented x3 and repeats his wishes clearly.","stem":"He asks what the BiPAP mask would be for. Your best explanation is:","opts":["It requires a breathing tube through your mouth into your windpipe","It is only used for patients who are expected to die within a few days","It supports his breathing without a tube and can ease breathlessness","It will cure the underlying emphysema if he uses it every night at home"],"key":2,"why":"An accurate, patient-level explanation; alleviating breathlessness and fatigue in terminally ill patients is a recognized indication for NPPV. • It will cure the underlying emphysema if he uses it every night at home: False. • It requires a breathing tube through your mouth into your windpipe: BiPAP delivers support through a mask without endotracheal intubation. • It is only used for patients who are expected to die within a few days: Inaccurate and frightening.","src":[[1111,1145],[26845,26853],[17216,17221]],"origin":"heuer","age":"adult"},{"id":"CJ-071","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 34-year-old with asthma arrives in the ED unable to speak in full sentences. RR 32, HR 128, diffuse wheezing with a prolonged expiratory phase, and a pulse that weakens on inspiration. SpO2 90% on room air.","stem":"All of the following are appropriate initial assessment priorities EXCEPT:","opts":["Order full pulmonary function testing with lung volumes","Assess whether she can speak in full sentences","Note the pulsus paradoxus","Assess accessory muscle use and thoracic–abdominal paradox"],"key":0,"why":"Not appropriate: Order full pulmonary function testing with lung volumes — Inappropriate in acute severe distress. The other three are appropriate: • Assess whether she can speak in full sentences: Interrupted speech indicates respiratory distress. • Note the pulsus paradoxus: A pulse varying with the breathing cycle indicates severe airway obstruction such as status asthmaticus, or cardiac tamponade. • Assess accessory muscle use and thoracic–abdominal paradox: These always indicate increased work of breathing.","src":[[3727,3730],[1398,1410],[21168,21179],[18346,18355],[4282,4287]],"origin":"heuer","age":"adult"},{"id":"CJ-072","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 34-year-old with asthma arrives in the ED unable to speak in full sentences. RR 32, HR 128, diffuse wheezing with a prolonged expiratory phase, and a pulse that weakens on inspiration. SpO2 90% on room air. PEFR is 33% of her personal best. ABG: pH 7.47, PaCO2 30, PaO2 62 on room air.","stem":"How do you interpret that blood gas?","opts":["Acute respiratory acidosis indicating imminent arrest","Uncompensated respiratory alkalosis with mild hypoxemia","Fully compensated respiratory alkalosis with mild hypoxemia","Normal for an asthma exacerbation, requiring no action"],"key":1,"why":"The elevated pH with a low PaCO2 indicates respiratory alkalosis that is not compensated (the pH is still alkalemic); a room-air PaO2 of 62 torr is mild hypoxemia. This is the classic pattern listed for asthma attack, pneumonia, or pulmonary embolus. • Fully compensated respiratory alkalosis with mild hypoxemia: HCO3 would be reduced; the pH is frankly alkalemic. • Normal for an asthma exacerbation, requiring no action: The hypoxemia requires treatment. • Acute respiratory acidosis indicating imminent arrest: Not yet — but a rising PaCO2 later would be exactly that warning sign.","src":[[3727,3730],[1398,1410],[21168,21179],[18346,18355],[4282,4287]],"origin":"heuer","age":"adult"},{"id":"CJ-073","cell":"CLD-NIV","type":"IG","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 34-year-old with asthma arrives in the ED unable to speak in full sentences. RR 32, HR 128, diffuse wheezing with a prolonged expiratory phase, and a pulse that weakens on inspiration. SpO2 90% on room air. PEFR is 33% of her personal best. ABG: pH 7.47, PaCO2 30, PaO2 62 on room air.","stem":"All of the following treatments should be recommended EXCEPT:","opts":["Add inhaled ipratropium bromide","Oral or IV systemic corticosteroids","A long-acting β-agonist for rapid relief","Repetitive or continuous short-acting β-agonist nebulization"],"key":2,"why":"Not appropriate: A long-acting β-agonist for rapid relief — LABAs should not be used to treat acute exacerbations of asthma. The other three are appropriate: • Repetitive or continuous short-acting β-agonist nebulization: Repeat every 20 minutes up to three times, or nebulize continuously until symptoms are relieved. • Add inhaled ipratropium bromide: Recommended in severe exacerbations. • Oral or IV systemic corticosteroids: Given in moderate or severe exacerbations or when the patient fails to respond promptly to SABA.","src":[[3727,3730],[1398,1410],[21168,21179],[18346,18355],[4282,4287]],"origin":"heuer","age":"adult"},{"id":"CJ-074","cell":"CLD-NIV","type":"DM","setting":"in","topic":"COPD—In-Hospital, Critical Care Management","scenario":"A 34-year-old with asthma arrives in the ED unable to speak in full sentences. RR 32, HR 128, diffuse wheezing with a prolonged expiratory phase, and a pulse that weakens on inspiration. SpO2 90% on room air. PEFR is 33% of her personal best. ABG: pH 7.47, PaCO2 30, PaO2 62 on room air. After 60 minutes of continuous nebulization she remains tachypneic. Repeat ABG: pH 7.35, PaCO2 42, PaO2 66 on 40%.","stem":"The PaCO2 has risen from 30 to 42. What does this mean and what do you do?","opts":["It means she is improving, since her PaCO2 is now back in the normal range","Stop the bronchodilator and observe her for another 60 minutes on oxygen","Plan discharge once the wheezing decreases and her SpO2 is above 92%","Fatigue and impending failure; consider IV magnesium or heliox, prepare to intubate"],"key":3,"why":"A 'normalizing' PaCO2 in status asthmaticus is an ominous sign. Adjunctive magnesium or heliox is considered in severe exacerbations unresponsive to treatment. • It means she is improving, since her PaCO2 is now back in the normal range: The single most dangerous misreading in status asthmaticus. • Stop the bronchodilator and observe her for another 60 minutes on oxygen: Withdrawing therapy during deterioration. • Plan discharge once the wheezing decreases and her SpO2 is above 92%: A silent chest in asthma means less air movement, not improvement.","src":[[3727,3730],[1398,1410],[21168,21179],[18346,18355],[4282,4287]],"origin":"heuer","age":"adult"},{"id":"CJ-081","cell":"TRAUMA","type":"IG","setting":"in","topic":"Burns/Smoke Inhalation","scenario":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused.","stem":"All of the following assessments and diagnostic recommendations are appropriate EXCEPT:","opts":["ABG, CBC, electrolytes, lactate, and a coagulation profile","Rely on the SpO2 of 99% as evidence of adequate oxygenation","Assess for signs of inhalation injury: facial/neck burns, singed nasal hairs, sooty sputum, hoarseness, stridor","CO-oximetry to measure carboxyhemoglobin"],"key":1,"why":"Not appropriate: Rely on the SpO2 of 99% as evidence of adequate oxygenation — The single most dangerous error in this case. The other three are appropriate: • Assess for signs of inhalation injury: facial/neck burns, singed nasal hairs, sooty sputum, hoarseness, stridor: Closed-space fire victims are most prone to inhalation injuries; all of these are present. • CO-oximetry to measure carboxyhemoglobin: Essential — SpO2 cannot detect carboxyhemoglobin and will read falsely high. • ABG, CBC, electrolytes, lactate, and a coagulation profile: The recommended initial laboratory panel for a major burn.","src":[[27286,27361],[1358,1364],[6520,6522]],"origin":"heuer","age":"adult"},{"id":"CJ-082","cell":"TRAUMA","type":"DM","setting":"in","topic":"Burns/Smoke Inhalation","scenario":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused. COHb is 28%. Lactate 9.2 mmol/L. ABG: pH 7.26, PaCO2 34, PaO2 96 on room air. Burns cover 30% BSA including a circumferential full-thickness band around the thorax.","stem":"What is your immediate oxygen recommendation?","opts":["28% air-entrainment mask, titrated to an SpO2 of 92%","Room air, since the PaO2 is normal at 96 torr","The highest O2 possible, by nonrebreather or high-flow cannula","Nasal cannula at 4 L/min, with a repeat ABG in an hour"],"key":2,"why":"Recommended for all patients suspected of inhalation injury. With confirmed CO poisoning, continue 100% oxygen until symptom-free (usually about 4–5 hours); a conventional SpO2 reads falsely high while COHb is present and must not guide oxygen reduction. • Nasal cannula at 4 L/min, with a repeat ABG in an hour: Grossly inadequate for CO poisoning. • 28% air-entrainment mask, titrated to an SpO2 of 92%: Grossly inadequate. • Room air, since the PaO2 is normal at 96 torr: PaO2 is normal because CO poisoning does not lower dissolved oxygen — it destroys carrying capacity.","src":[[27286,27361],[1358,1364],[6520,6522]],"origin":"heuer","age":"adult"},{"id":"CJ-083","cell":"TRAUMA","type":"IG","setting":"in","topic":"Burns/Smoke Inhalation","scenario":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused. COHb is 28%. Lactate 9.2 mmol/L. ABG: pH 7.26, PaCO2 34, PaO2 96 on room air. Burns cover 30% BSA including a circumferential full-thickness band around the thorax.","stem":"A lactate of 9.2 mmol/L with confusion raises concern for an additional toxic exposure. All of the following statements are correct EXCEPT:","opts":["Cyanide poisoning — blood lactate is typically ≥ 8 mmol/L, indicating tissue hypoxia","Headache, confusion, seizures or coma","Chest tightness, nausea/vomiting, mydriasis","The lactate is explained entirely by the burn itself and needs no further thought"],"key":3,"why":"Not appropriate: The lactate is explained entirely by the burn itself and needs no further thought — Misses a lethal, treatable diagnosis. The other three are appropriate: • Cyanide poisoning — blood lactate is typically ≥ 8 mmol/L, indicating tissue hypoxia: A key marker listed for CN poisoning in fire victims. • Headache, confusion, seizures or coma: Listed signs of cyanide poisoning. • Chest tightness, nausea/vomiting, mydriasis: Listed signs of cyanide poisoning.","src":[[27286,27361],[1358,1364],[6520,6522]],"origin":"heuer","age":"adult"},{"id":"CJ-084","cell":"TRAUMA","type":"DM","setting":"in","topic":"Burns/Smoke Inhalation","scenario":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused. COHb is 28%. Lactate 9.2 mmol/L. ABG: pH 7.26, PaCO2 34, PaO2 96 on room air. Burns cover 30% BSA including a circumferential full-thickness band around the thorax.","stem":"His chest has a circumferential full-thickness burn and peak pressures are rising on manual ventilation. What do you recommend?","opts":["Prompt escharotomy to allow adequate ventilation","Increase the ventilating pressure and continue","Administer a neuromuscular blocking agent","Switch to pressure control at a lower PIP"],"key":0,"why":"Circumferential full-thickness thoracic burns significantly reduce chest wall compliance; escharotomy is the specific remedy. • Increase the ventilating pressure and continue: Treats the symptom, not the mechanical cause, and risks barotrauma. • Administer a neuromuscular blocking agent: The restriction is the eschar, not muscle tone. • Switch to pressure control at a lower PIP: Reasonable ventilator management, but does not relieve the chest wall restriction.","src":[[27286,27361],[1358,1364],[6520,6522]],"origin":"heuer","age":"adult"},{"id":"CJ-085","cell":"TRAUMA","type":"IG","setting":"in","topic":"Burns/Smoke Inhalation","scenario":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused. COHb is 28%. Lactate 9.2 mmol/L. ABG: pH 7.26, PaCO2 34, PaO2 96 on room air. Burns cover 30% BSA including a circumferential full-thickness band around the thorax.","stem":"All of the following supportive measures should be recommended EXCEPT:","opts":["Cover the patient to prevent heat and fluid loss","Withhold fluids to avoid pulmonary edema","Immediate IV access with fluid and electrolyte replacement","Urinary catheterization to monitor fluid balance, targeting about 1.0 mL/kg/h"],"key":1,"why":"Not appropriate: Withhold fluids to avoid pulmonary edema — Burn shock and multiple-organ failure follow inadequate resuscitation. The other three are appropriate: • Immediate IV access with fluid and electrolyte replacement: A 70-kg patient may need 8–10 L or more over the first 24 hours. • Urinary catheterization to monitor fluid balance, targeting about 1.0 mL/kg/h: The stated output goal. • Cover the patient to prevent heat and fluid loss: Explicitly recommended.","src":[[27286,27361],[1358,1364],[6520,6522]],"origin":"heuer","age":"adult"},{"id":"CJ-091","cell":"CV","type":"IG","setting":"in","topic":"Congestive Heart Failure (CHF)","scenario":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air.","stem":"All of the following assessments and diagnostic recommendations are appropriate EXCEPT:","opts":["Assess cough and sputum for frothy or pink blood-tinged secretions","Assess peripheral perfusion — cold, pale, cyanotic or mottled skin, slow capillary refill","Insert a pulmonary artery catheter immediately","Assess breath sounds — marked bilateral crackles and wheezing indicate acute decompensation"],"key":2,"why":"Not appropriate: Insert a pulmonary artery catheter immediately — Do not recommend PA catheter insertion unless the diagnosis cannot be confirmed without it or there are unexpected responses to therapy. The other three are appropriate: • Assess breath sounds — marked bilateral crackles and wheezing indicate acute decompensation: Explicitly listed as a sign of decompensation. • Assess cough and sputum for frothy or pink blood-tinged secretions: Pink, watery, frothy secretions suggest pulmonary edema. • Assess peripheral perfusion — cold, pale, cyanotic or mottled skin, slow capillary refill: Listed assessment for acute decompensation.","src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"origin":"heuer","age":"adult"},{"id":"CJ-092","cell":"CV","type":"DM","setting":"in","topic":"Congestive Heart Failure (CHF)","scenario":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air. BNP 1,240 pg/mL. Troponin I 0.2 µg/L. Chest film: cardiomegaly, bilateral fluffy perihilar infiltrates, Kerley B lines, small pleural effusions. ABG: pH 7.49, PaCO2 30, PaO2 49 on room air.","stem":"How do you interpret the chest film and BNP together?","opts":["A normal film for her age, with a BNP that is expected in CHF","ARDS, based on the bilateral fluffy infiltrates on the film alone","Bilateral pneumonia, with a BNP raised by fever and tachycardia","Cardiogenic pulmonary edema — cardiomegaly, Kerley B lines, BNP > 500"],"key":3,"why":"The classic combination. ARDS would show bilateral opacities with a NORMAL heart size. • A normal film for her age, with a BNP that is expected in CHF: Clearly abnormal. • ARDS, based on the bilateral fluffy infiltrates on the film alone: ARDS requires that edema not be due to cardiac failure, and the heart size here is enlarged. • Bilateral pneumonia, with a BNP raised by fever and tachycardia: Does not explain cardiomegaly, Kerley B lines, or the BNP.","src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"origin":"heuer","age":"adult"},{"id":"CJ-093","cell":"CV","type":"DM","setting":"in","topic":"Congestive Heart Failure (CHF)","scenario":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air. BNP 1,240 pg/mL. Troponin I 0.2 µg/L. Chest film: cardiomegaly, bilateral fluffy perihilar infiltrates, Kerley B lines, small pleural effusions. ABG: pH 7.49, PaCO2 30, PaO2 49 on room air.","stem":"Her systolic BP is 168 and she is alert. What respiratory support do you recommend?","opts":["Mask CPAP at 10 cm H2O on 100% O2, titrated to SpO2 > 90%","Nasal cannula at 6 L/min, titrated to an SpO2 above 92%","Immediate intubation and invasive ventilation with PEEP 10","Bilevel NPPV with a backup rate as the first choice of support"],"key":0,"why":"CPAP is indicated for acute cardiogenic pulmonary edema; start at 10 cm H2O on 100% O2. None of the contraindications — systolic BP < 90, acute MI, GCS ≤ 8, need for intubation — are present. • Nasal cannula at 6 L/min, titrated to an SpO2 above 92%: Will not correct shunt-level hypoxemia or reduce preload. • Immediate intubation and invasive ventilation with PEEP 10: Premature in an alert, hypertensive patient who is a good CPAP candidate. • Bilevel NPPV with a backup rate as the first choice of support: Appropriate if hypopnea or hypercapnia were evident; here straight CPAP is the stated starting point.","src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"origin":"heuer","age":"adult"},{"id":"CJ-094","cell":"CV","type":"IG","setting":"in","topic":"Congestive Heart Failure (CHF)","scenario":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air. BNP 1,240 pg/mL. Troponin I 0.2 µg/L. Chest film: cardiomegaly, bilateral fluffy perihilar infiltrates, Kerley B lines, small pleural effusions. ABG: pH 7.49, PaCO2 30, PaO2 49 on room air. After 30 minutes on CPAP 10 with 100% O2: RR 24, SpO2 94%, crackles decreasing. Repeat ABG pH 7.44, PaCO2 36, PaO2 88.","stem":"All of the following additional therapies should be recommended EXCEPT:","opts":["Restrict and closely monitor fluid intake","Increase IV fluid intake to improve perfusion","Diuretic therapy","Positive inotropic agents"],"key":1,"why":"Not appropriate: Increase IV fluid intake to improve perfusion — Exactly backwards — she is fluid overloaded. The other three are appropriate: • Diuretic therapy: Indicated for overhydration and pulmonary edema from CHF. • Positive inotropic agents: Recommended for pulmonary edema associated with heart failure. • Restrict and closely monitor fluid intake: Core management of positive fluid balance.","src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"origin":"heuer","age":"adult"},{"id":"CJ-095","cell":"CV","type":"DM","setting":"in","topic":"Congestive Heart Failure (CHF)","scenario":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air. BNP 1,240 pg/mL. Troponin I 0.2 µg/L. Chest film: cardiomegaly, bilateral fluffy perihilar infiltrates, Kerley B lines, small pleural effusions. ABG: pH 7.49, PaCO2 30, PaO2 49 on room air. After 30 minutes on CPAP 10 with 100% O2: RR 24, SpO2 94%, crackles decreasing. Repeat ABG pH 7.44, PaCO2 36, PaO2 88.","stem":"She improves and is ready for discharge planning. What is the most important education point?","opts":["No further teaching, since she has managed CHF for years","Instruction on incentive spirometry technique at home","Disease management, with an emphasis on sodium restriction","How to self-administer an aerosolized antibiotic at home"],"key":2,"why":"The lead treatment recommendation for chronic CHF management. • How to self-administer an aerosolized antibiotic at home: Irrelevant here. • No further teaching, since she has managed CHF for years: Knowledge does not always change behavior — reinforcement and follow-up matter. • Instruction on incentive spirometry technique at home: Not the priority in heart failure.","src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"origin":"heuer","age":"adult"},{"id":"CJ-101","cell":"CV","type":"IG","setting":"in","topic":"Pulmonary Embolism (PE)","scenario":"A 58-year-old is on postoperative day 3 after a total hip replacement. She develops sudden dyspnea over about a minute, pleuritic chest pain, and a cough. RR 30, HR 118, temp 38.0°C. Her right calf is swollen and tender. SpO2 89% on room air. Chest film is normal.","stem":"All of the following findings and tests support the suspected diagnosis EXCEPT:","opts":["Sudden-onset dyspnea, the most common presenting symptom, with rapid onset within seconds or minutes","Calf swelling, erythema, edema, tenderness — signs of deep venous thrombosis","Unexplained hypoxemia with a normal chest radiograph","D-dimer as the definitive diagnostic test"],"key":3,"why":"Not appropriate: D-dimer as the definitive diagnostic test — An elevated D-dimer alone is insufficient to diagnose PE, and it is often falsely positive after recent surgery — as here. The other three are appropriate: • Sudden-onset dyspnea, the most common presenting symptom, with rapid onset within seconds or minutes: The classic PE presentation. • Calf swelling, erythema, edema, tenderness — signs of deep venous thrombosis: A listed physical finding. • Unexplained hypoxemia with a normal chest radiograph: Should raise clinical suspicion for PE and prompt further evaluation.","src":[[28212,28323],[16606,16615],[15594,15613]],"origin":"heuer","age":"adult"},{"id":"CJ-102","cell":"CV","type":"DM","setting":"in","topic":"Pulmonary Embolism (PE)","scenario":"A 58-year-old is on postoperative day 3 after a total hip replacement. She develops sudden dyspnea over about a minute, pleuritic chest pain, and a cough. RR 30, HR 118, temp 38.0°C. Her right calf is swollen and tender. SpO2 89% on room air. Chest film is normal. ABG: pH 7.48, PaCO2 29, PaO2 56 on room air. CTPA confirms bilateral segmental pulmonary emboli. BP 112/70.","stem":"A D-dimer was also ordered during the work-up. Why was it a poor choice in this patient?","opts":["D-dimer is often falsely positive after recent surgery or trauma","D-dimer is always negative when a true pulmonary embolism is present","D-dimer is only valid as a test in patients who are over 70 years old","D-dimer cannot be resulted quickly enough to guide emergency care"],"key":0,"why":"She is postoperative day 3 — the exact scenario named. • D-dimer is always negative when a true pulmonary embolism is present: The opposite — it is a rule-out test with high sensitivity. • D-dimer is only valid as a test in patients who are over 70 years old: Not a stated limitation. • D-dimer cannot be resulted quickly enough to guide emergency care: Sensitive D-dimer assays are preferred precisely because accurate results are available quickly.","src":[[28212,28323],[16606,16615],[15594,15613]],"origin":"heuer","age":"adult"},{"id":"CJ-103","cell":"CV","type":"DM","setting":"in","topic":"Pulmonary Embolism (PE)","scenario":"A 58-year-old is on postoperative day 3 after a total hip replacement. She develops sudden dyspnea over about a minute, pleuritic chest pain, and a cough. RR 30, HR 118, temp 38.0°C. Her right calf is swollen and tender. SpO2 89% on room air. Chest film is normal. ABG: pH 7.48, PaCO2 29, PaO2 56 on room air. CTPA confirms bilateral segmental pulmonary emboli. BP 112/70.","stem":"What is the correct oxygen therapy target and device here?","opts":["Intubate and ventilate her immediately on FiO2 1.0","Titrate O2 to a PaO2 of 80–100 torr, saturation ≥ 92%","Withhold oxygen, because her pH is already alkalemic","Titrate to a PaO2 of 55–60 torr with an SpO2 ≥ 88%"],"key":1,"why":"She has no chronic hypercapnia, so normal oxygenation targets apply. • Withhold oxygen, because her pH is already alkalemic: The alkalosis is driven by hypoxemia; treating the hypoxemia is the point. • Titrate to a PaO2 of 55–60 torr with an SpO2 ≥ 88%: That is the target for chronic hypercapnia or when normal oxygenation cannot be achieved below 50% O2. • Intubate and ventilate her immediately on FiO2 1.0: She is hemodynamically stable and alert.","src":[[28212,28323],[16606,16615],[15594,15613]],"origin":"heuer","age":"adult"},{"id":"CJ-104","cell":"CV","type":"IG","setting":"in","topic":"Pulmonary Embolism (PE)","scenario":"A 58-year-old is on postoperative day 3 after a total hip replacement. She develops sudden dyspnea over about a minute, pleuritic chest pain, and a cough. RR 30, HR 118, temp 38.0°C. Her right calf is swollen and tender. SpO2 89% on room air. Chest film is normal. ABG: pH 7.48, PaCO2 29, PaO2 56 on room air. CTPA confirms bilateral segmental pulmonary emboli. BP 112/70.","stem":"Going forward, all of the following are appropriate to monitor or recommend EXCEPT:","opts":["Watch for hypercapnia and lactic acidosis as markers of massive PE with obstructive shock","Anticoagulation, since untreated PE carries up to 30% mortality versus 2–11% when treated","Aggressive chest physiotherapy with percussion over the calf","Continuous SpO2 with serial ABGs"],"key":2,"why":"Not appropriate: Aggressive chest physiotherapy with percussion over the calf — Percussion over a DVT risks dislodging further clot; PE is also a contraindication to PDPV. The other three are appropriate: • Continuous SpO2 with serial ABGs: Standard monitoring for degree of hypoxemia. • Watch for hypercapnia and lactic acidosis as markers of massive PE with obstructive shock: These are uncommon but signal a deteriorating, high-mortality course. • Anticoagulation, since untreated PE carries up to 30% mortality versus 2–11% when treated: The central prognostic fact for PE.","src":[[28212,28323],[16606,16615],[15594,15613]],"origin":"heuer","age":"adult"},{"id":"CJ-111","cell":"NEURO","type":"IG","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine.","stem":"All of the following history items and findings help distinguish this diagnosis EXCEPT:","opts":["Ptosis and diplopia that worsen with repeated use","History of a recent febrile illness","Rapidly progressing ascending symmetrical muscle weakness","Sensory dysesthesias — pain or discomfort to touch"],"key":0,"why":"Not appropriate: Ptosis and diplopia that worsen with repeated use — These point to myasthenia gravis, not GBS. The other three are appropriate: • History of a recent febrile illness: Characteristic of Guillain-Barré syndrome. • Rapidly progressing ascending symmetrical muscle weakness: The hallmark of GBS; myasthenia gravis is descending and episodic. • Sensory dysesthesias — pain or discomfort to touch: Present in GBS, absent in MG.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-112","cell":"NEURO","type":"IG","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine. He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour.","stem":"All of the following diagnostic tests should be recommended EXCEPT:","opts":["Antiganglioside antibody testing","Anti-acetylcholine receptor antibody and a tensilon test","Lumbar puncture for cerebrospinal fluid","Electromyography and nerve conduction studies"],"key":1,"why":"Not appropriate: Anti-acetylcholine receptor antibody and a tensilon test — These are the myasthenia gravis work-up, useful only to exclude MG. The other three are appropriate: • Lumbar puncture for cerebrospinal fluid: In GBS shows increased protein content with a low WBC. • Electromyography and nerve conduction studies: Show slowing or blockage of nerve conduction in GBS. • Antiganglioside antibody testing: Elevated in GBS.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-113","cell":"NEURO","type":"DM","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine. He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour. CSF protein is elevated with a normal cell count. VC is 1.4 L (19 mL/kg). MIP is −32 cm H2O.","stem":"How often should you monitor VC and NIF?","opts":["Once daily","Continuously by capnography instead","Every 4 to 8 hours","Only if the patient complains of dyspnea"],"key":2,"why":"Implement VC and NIF monitoring every 4 to 8 hours in both GBS and MG. • Only if the patient complains of dyspnea: Subjective dyspnea is a late and unreliable signal in neuromuscular failure. • Once daily: Too infrequent for a rapidly progressive disease. • Continuously by capnography instead: Capnography is useful but does not replace serial VC and NIF.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-114","cell":"NEURO","type":"DM","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine. He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour. CSF protein is elevated with a normal cell count. VC is 1.4 L (19 mL/kg). MIP is −32 cm H2O.","stem":"Eight hours later: VC 0.9 L (12 mL/kg), MIP −20 cm H2O, and he can no longer cough effectively. What do you recommend?","opts":["Increase oxygen and continue monitoring","Start incentive spirometry to strengthen the muscles","Initiate NPPV","Intubation and mechanical ventilation"],"key":3,"why":"VC below 1.0 L or 15 mL/kg, MIP/NIF less negative than −25 cm H2O, and inability to cough, swallow, and protect the airway are each intubation indications. • Increase oxygen and continue monitoring: Oxygen does not treat ventilatory pump failure. • Start incentive spirometry to strengthen the muscles: Cannot reverse a demyelinating neuropathy and delays definitive care. • Initiate NPPV: He cannot protect his airway or manage secretions — both contraindications to BiPAP.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-115","cell":"NEURO","type":"DM","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine. He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour. CSF protein is elevated with a normal cell count. VC is 1.4 L (19 mL/kg). MIP is −32 cm H2O.","stem":"Given bulbar involvement and likely prolonged support, what should you anticipate recommending?","opts":["Early tracheostomy, since ventilation will likely exceed 10 days","An extubation trial within 24 hours, once his gag returns","A permanent laryngectomy to protect the lower airway from aspiration","An uncuffed tracheostomy tube placed now for phonation"],"key":0,"why":"Severe weakness with bulbar involvement and a likely need for ventilation beyond 10 days are the stated tracheostomy indications. • An extubation trial within 24 hours, once his gag returns: Premature in progressive ascending paralysis. • A permanent laryngectomy to protect the lower airway from aspiration: Unrelated to this disease. • An uncuffed tracheostomy tube placed now for phonation: He needs a cuffed tube for airway protection and positive-pressure ventilation first.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-116","cell":"NEURO","type":"IG","setting":"in","topic":"Guillain-Barré Syndrome","scenario":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine. He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour. CSF protein is elevated with a normal cell count. VC is 1.4 L (19 mL/kg). MIP is −32 cm H2O.","stem":"All of the following are appropriate ongoing respiratory care priorities EXCEPT:","opts":["Head of bed elevated 30 degrees or more","Postural drainage in Trendelenburg with vigorous percussion","Provide O2 therapy as needed to keep SpO2 above 90%","Implement a rigorous infection control / VAP protocol"],"key":1,"why":"Not appropriate: Postural drainage in Trendelenburg with vigorous percussion — Poorly tolerated with dysautonomia and aspiration risk. The other three are appropriate: • Provide O2 therapy as needed to keep SpO2 above 90%: The stated oxygenation goal for both GBS and MG. • Implement a rigorous infection control / VAP protocol: Explicitly recommended for these patients. • Head of bed elevated 30 degrees or more: VAP prevention on every ventilated patient unless contraindicated.","src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"origin":"heuer","age":"adult"},{"id":"CJ-121","cell":"MED-ARDS","type":"IG","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O.","stem":"All of the following findings are needed to establish the diagnosis EXCEPT:","opts":["Confirm the edema is not due to cardiac failure or fluid overload","Spirometry with bronchodilator response","Acute onset within one week of a known clinical insult","Bilateral infiltrates/opacities consistent with pulmonary edema on chest radiograph or CT"],"key":1,"why":"Not appropriate: Spirometry with bronchodilator response — Meaningless in an intubated patient with ARDS. The other three are appropriate: • Acute onset within one week of a known clinical insult: A Berlin criterion; the aspiration was 18 hours ago. • Bilateral infiltrates/opacities consistent with pulmonary edema on chest radiograph or CT: A Berlin criterion. • Confirm the edema is not due to cardiac failure or fluid overload: Required — cardiogenic pulmonary edema is the primary differential and must be excluded.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-122","cell":"MED-ARDS","type":"DM","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O. BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78.","stem":"Classify the severity by the Berlin definition.","opts":["Does not meet ARDS criteria","Moderate — P/F 101–200","Severe — P/F below 100","Mild — P/F 201–300"],"key":2,"why":"Berlin: mild 201–300, moderate 101–200, severe below 100. His P/F of 78 is severe. • Mild — P/F 201–300: Far off. • Does not meet ARDS criteria: He meets all four. • Moderate — P/F 101–200: His P/F is 78.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-123","cell":"MED-ARDS","type":"DM","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O. BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78.","stem":"Calculate his predicted body weight and set the initial ARDSNet tidal volume.","opts":["Use actual body weight, so keep the VT at 700 mL for now","PBW = 45.5 + 2.3(70 − 60) = 68.5 kg; initial VT = 548 mL","PBW = 73 kg; start directly at 4 mL/kg = about 292 mL","PBW = 50 + 2.3(70 − 60) = 73 kg; initial VT ≈ 584 mL"],"key":3,"why":"Male PBW = 50 + 2.3 × (height in inches − 60). ARDSNet starts at 8 mL/kg PBW, then reduces by 1 mL/kg every 2 hours or less to 6 mL/kg. • Use actual body weight, so keep the VT at 700 mL for now: ARDSNet is always based on predicted body weight. • PBW = 45.5 + 2.3(70 − 60) = 68.5 kg; initial VT = 548 mL: That is the FEMALE formula. • PBW = 73 kg; start directly at 4 mL/kg = about 292 mL: 4 mL/kg is the protocol floor, not the starting point.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-124","cell":"MED-ARDS","type":"IG","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O. BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78.","stem":"His plateau pressure is 36 cm H2O. All of the following are correct protocol responses EXCEPT:","opts":["Increase VT to improve ventilation and lower the PaCO2","Decrease VT in 1-mL/kg steps toward a minimum of 4 mL/kg until Pplat is 30 or less","Measure plateau pressure every 4 hours and after each change in PEEP or VT","Accept a higher PaCO2 as permissive hypercapnia while the pH stays above 7.25–7.30"],"key":0,"why":"Not appropriate: Increase VT to improve ventilation and lower the PaCO2 — Directly injurious at a Pplat of 36. The other three are appropriate: • Decrease VT in 1-mL/kg steps toward a minimum of 4 mL/kg until Pplat is 30 or less: The explicit ARDSNet rule when Pplat exceeds 30. • Measure plateau pressure every 4 hours and after each change in PEEP or VT: The stated monitoring interval. • Accept a higher PaCO2 as permissive hypercapnia while the pH stays above 7.25–7.30: The trade for lung protection.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-125","cell":"MED-ARDS","type":"DM","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O. BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78. VT reduced to 6 mL/kg (438 mL). Pplat now 29. ABG: pH 7.26, PaCO2 58, PaO2 82 on FiO2 1.0, PEEP 5.","stem":"pH is 7.26 with a rate of 14. What doe
