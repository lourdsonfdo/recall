iratory distress."},{"t":"Note the pulsus paradoxus","v":3,"fb":"A pulse varying with the breathing cycle indicates severe airway obstruction such as status asthmaticus, or cardiac tamponade."},{"t":"Measure peak expiratory flow if she can cooperate","v":2,"fb":"PEFR is a monitoring tool for assessing severity of asthma symptoms."},{"t":"Assess accessory muscle use and thoracic–abdominal paradox","v":3,"fb":"These always indicate increased work of breathing."},{"t":"Obtain an arterial blood gas","v":2,"fb":"Reasonable in severe distress to detect a rising PaCO2."},{"t":"Order full pulmonary function testing with lung volumes","v":-3,"fb":"Inappropriate in acute severe distress."}],"reveal":"PEFR is 33% of her personal best. ABG: pH 7.47, PaCO2 30, PaO2 62 on room air."},{"type":"DM","prompt":"How do you interpret that blood gas?","pick":"one","opts":[{"t":"Uncompensated respiratory alkalosis with moderate hypoxemia from hyperventilation driven by hypoxemia","v":3,"fb":"The classic pattern listed for asthma attack, pneumonia, or pulmonary embolus."},{"t":"Fully compensated respiratory alkalosis","v":-2,"fb":"HCO3 would be reduced; the pH is frankly alkalemic."},{"t":"Normal for an asthma exacerbation, requiring no action","v":-2,"fb":"The hypoxemia requires treatment."},{"t":"Respiratory acidosis indicating imminent arrest","v":-1,"fb":"Not yet — but a rising PaCO2 later would be exactly that warning sign."}],"reveal":""},{"type":"IG","prompt":"Select your treatment recommendations.","pick":"multi","opts":[{"t":"Repetitive or continuous short-acting β-agonist nebulization","v":3,"fb":"Repeat every 20 minutes up to three times, or nebulize continuously until symptoms are relieved."},{"t":"Add inhaled ipratropium bromide","v":3,"fb":"Recommended in severe exacerbations."},{"t":"Oral or IV systemic corticosteroids","v":3,"fb":"Given in moderate or severe exacerbations or when the patient fails to respond promptly to SABA."},{"t":"Supplemental oxygen as appropriate to correct hypoxemia","v":3,"fb":"Standard emergency care."},{"t":"A long-acting β-agonist for rapid relief","v":-3,"fb":"LABAs should not be used to treat acute exacerbations of asthma."},{"t":"A mucolytic to loosen secretions","v":-2,"fb":"Irritating to the airway and likely to worsen bronchospasm."}],"reveal":"After 60 minutes of continuous nebulization she remains tachypneic. Repeat ABG: pH 7.35, PaCO2 42, PaO2 66 on 40%."},{"type":"DM","prompt":"The PaCO2 has risen from 30 to 42. What does this mean and what do you do?","pick":"one","opts":[{"t":"It signals fatigue and impending ventilatory failure; consider adjunctive IV magnesium sulfate or heliox and prepare for possible intubation","v":3,"fb":"A 'normalizing' PaCO2 in status asthmaticus is an ominous sign. Adjunctive magnesium or heliox is considered in severe exacerbations unresponsive to treatment."},{"t":"It means she is improving, since the PaCO2 is now normal","v":-3,"fb":"The single most dangerous misreading in status asthmaticus."},{"t":"Stop the bronchodilator and observe","v":-3,"fb":"Withdrawing therapy during deterioration."},{"t":"Discharge her once the wheezing decreases","v":-3,"fb":"A silent chest in asthma means less air movement, not improvement."}],"reveal":""}],"src":[[3727,3730],[1398,1410],[21168,21179],[18346,18355],[4282,4287]]},{"cat":"Adult Trauma","topic":"Burns/Smoke Inhalation","title":"House Fire with Suspected Inhalation Injury","stem":"A 42-year-old is pulled from a closed-space house fire. He has facial burns, singed nasal hairs, and a hoarse voice. He is coughing sooty sputum. SpO2 reads 99% on room air. He is confused.","sections":[{"type":"IG","prompt":"Select your assessments and diagnostic recommendations.","pick":"multi","opts":[{"t":"Assess for signs of inhalation injury: facial/neck burns, singed nasal hairs, sooty sputum, hoarseness, stridor","v":3,"fb":"Closed-space fire victims are most prone to inhalation injuries; all of these are present."},{"t":"CO-oximetry to measure carboxyhemoglobin","v":3,"fb":"Essential — SpO2 cannot detect carboxyhemoglobin and will read falsely high."},{"t":"ABG, CBC, electrolytes, lactate, and a coagulation profile","v":3,"fb":"The recommended initial laboratory panel for a major burn."},{"t":"Assess sensorium and Glasgow Coma Scale","v":3,"fb":"He is confused; coma level must be graded."},{"t":"Estimate percent BSA by the rule of nines or Lund and Browder chart","v":3,"fb":"Severity and survival are determined by percent BSA and burn depth."},{"t":"Chest radiograph, recognizing it may be negative early","v":2,"fb":"Recommended, though it may not detect inhalation injury."},{"t":"Fiberoptic bronchoscopy to assess airway damage","v":3,"fb":"Recommended because chest x-rays may not detect inhalation injuries."},{"t":"Rely on the SpO2 of 99% as evidence of adequate oxygenation","v":-3,"fb":"The single most dangerous error in this case."}],"reveal":"COHb is 28%. Lactate 9.2 mmol/L. ABG: pH 7.26, PaCO2 34, PaO2 96 on room air. Burns cover 30% BSA including a circumferential full-thickness band around the thorax."},{"type":"DM","prompt":"What is your immediate oxygen recommendation?","pick":"one","opts":[{"t":"Immediately administer the highest O2 concentration possible via nonrebreathing mask or high-flow cannula","v":3,"fb":"Recommended for all patients suspected of inhalation injury; afterwards titrate to keep SpO2 above 90%."},{"t":"Nasal cannula at 4 L/min","v":-3,"fb":"Grossly inadequate for CO poisoning."},{"t":"28% air-entrainment mask","v":-3,"fb":"Grossly inadequate."},{"t":"Room air, since the PaO2 is 96 torr","v":-3,"fb":"PaO2 is normal because CO poisoning does not lower dissolved oxygen — it destroys carrying capacity."}],"reveal":""},{"type":"IG","prompt":"A lactate of 9.2 mmol/L with confusion raises which additional concern? Select all supporting findings.","pick":"multi","opts":[{"t":"Cyanide poisoning — blood lactate is typically ≥ 8 mmol/L, indicating tissue hypoxia","v":3,"fb":"A key marker listed for CN poisoning in fire victims."},{"t":"Headache, confusion, seizures or coma","v":3,"fb":"Listed signs of cyanide poisoning."},{"t":"Chest tightness, nausea/vomiting, mydriasis","v":3,"fb":"Listed signs of cyanide poisoning."},{"t":"Dyspnea, tachypnea, hyperpnea with early hypertension or late hypotension","v":3,"fb":"Listed signs of cyanide poisoning."},{"t":"The lactate is explained entirely by the burn itself and needs no further thought","v":-3,"fb":"Misses a lethal, treatable diagnosis."}],"reveal":""},{"type":"DM","prompt":"His chest has a circumferential full-thickness burn and peak pressures are rising on manual ventilation. What do you recommend?","pick":"one","opts":[{"t":"Prompt escharotomy to allow adequate ventilation","v":3,"fb":"Circumferential full-thickness thoracic burns significantly reduce chest wall compliance; escharotomy is the specific remedy."},{"t":"Increase the ventilating pressure and continue","v":-2,"fb":"Treats the symptom, not the mechanical cause, and risks barotrauma."},{"t":"Switch to pressure control at a lower PIP","v":-1,"fb":"Reasonable ventilator management, but does not relieve the chest wall restriction."},{"t":"Administer a neuromuscular blocking agent","v":-2,"fb":"The restriction is the eschar, not muscle tone."}],"reveal":""},{"type":"IG","prompt":"Select the other supportive measures you recommend.","pick":"multi","opts":[{"t":"Immediate IV access with fluid and electrolyte replacement","v":3,"fb":"A 70-kg patient may need 8–10 L or more over the first 24 hours."},{"t":"Urinary catheterization to monitor fluid balance, targeting about 1.0 mL/kg/h","v":3,"fb":"The stated output goal."},{"t":"Cover the patient to prevent heat and fluid loss","v":3,"fb":"Explicitly recommended."},{"t":"Morphine analgesia for severe pain, watching for respiratory depression","v":3,"fb":"Recommended with the stated caution."},{"t":"Reevaluate the airway frequently, since inhalation injuries may take hours to develop","v":3,"fb":"A critical management pearl."},{"t":"Consider hyperbaric oxygen given symptomatic CO poisoning","v":2,"fb":"Appropriate consideration when dangerous levels are detected and the patient is symptomatic."},{"t":"Withhold fluids to avoid pulmonary edema","v":-3,"fb":"Burn shock and multiple-organ failure follow inadequate resuscitation."}],"reveal":""}],"src":[[27286,27361],[1358,1364],[6520,6522]],"id":"SIM-08"},{"cat":"Cardiovascular Disease","topic":"Congestive Heart Failure (CHF)","title":"Acute Decompensated Heart Failure","stem":"A 74-year-old with known CHF presents with sudden restlessness, diaphoresis, and severe dyspnea. She is sitting bolt upright. RR 34, HR 122, BP 168/96. Bilateral crackles and wheezing. She coughs pink, frothy sputum. SpO2 85% on room air.","sections":[{"type":"IG","prompt":"Select your assessments and diagnostic recommendations.","pick":"multi","opts":[{"t":"Assess breath sounds — marked bilateral crackles and wheezing indicate acute decompensation","v":3,"fb":"Explicitly listed as a sign of decompensation."},{"t":"Assess cough and sputum for frothy or pink blood-tinged secretions","v":3,"fb":"Pink, watery, frothy secretions suggest pulmonary edema."},{"t":"Assess peripheral perfusion — cold, pale, cyanotic or mottled skin, slow capillary refill","v":3,"fb":"Listed assessment for acute decompensation."},{"t":"Assess for chest pain, whose presence suggests acute myocardial ischemia or infarction","v":3,"fb":"Explicitly listed."},{"t":"Initiate SpO2 monitoring and obtain an ABG","v":3,"fb":"Typically shows hypoxemia with respiratory alkalosis."},{"t":"Immediate chest radiograph","v":3,"fb":"Typically reveals bilateral fluffy infiltrates."},{"t":"Cardiac biomarkers — troponin, CK, CK-MB","v":3,"fb":"To assess for MI."},{"t":"BNP","v":3,"fb":"Useful in diagnosing CHF and its response to treatment; > 500 pg/mL helps rule it in."},{"t":"Insert a pulmonary artery catheter immediately","v":-2,"fb":"Do not recommend PA catheter insertion unless the diagnosis cannot be confirmed without it or there are unexpected responses to therapy."}],"reveal":"BNP 1,240 pg/mL. Troponin I 0.2 µg/L. Chest film: cardiomegaly, bilateral fluffy perihilar infiltrates, Kerley B lines, small pleural effusions. ABG: pH 7.49, PaCO2 30, PaO2 49 on room air."},{"type":"DM","prompt":"How do you interpret the chest film and BNP together?","pick":"one","opts":[{"t":"Cardiogenic pulmonary edema — cardiomegaly with a CT ratio > 50%, Kerley B lines, effusions, and a BNP > 500 pg/mL","v":3,"fb":"The classic combination. ARDS would show bilateral opacities with a NORMAL heart size."},{"t":"ARDS, based on the bilateral infiltrates alone","v":-2,"fb":"ARDS requires that edema not be due to cardiac failure, and the heart size here is enlarged."},{"t":"Bilateral pneumonia","v":-2,"fb":"Does not explain cardiomegaly, Kerley B lines, or the BNP."},{"t":"Normal film for her age","v":-3,"fb":"Clearly abnormal."}],"reveal":""},{"type":"DM","prompt":"Her systolic BP is 168 and she is alert. What respiratory support do you recommend?","pick":"one","opts":[{"t":"Mask CPAP starting at 10 cm H2O and 100% O2, titrating to keep SpO2 above 90%","v":3,"fb":"CPAP is indicated for acute cardiogenic pulmonary edema; start at 10 cm H2O on 100% O2. None of the contraindications — systolic BP \u003c 90, acute MI, GCS ≤ 8, need for intubation — are present."},{"t":"Immediate intubation and invasive ventilation","v":-1,"fb":"Premature in an alert, hypertensive patient who is a good CPAP candidate."},{"t":"Nasal cannula at 6 L/min","v":-2,"fb":"Will not correct shunt-level hypoxemia or reduce preload."},{"t":"Bilevel NPPV with a backup rate as the first choice","v":1,"fb":"Appropriate if hypopnea or hypercapnia were evident; here straight CPAP is the stated starting point."}],"reveal":"After 30 minutes on CPAP 10 with 100% O2: RR 24, SpO2 94%, crackles decreasing. Repeat ABG pH 7.44, PaCO2 36, PaO2 88."},{"type":"IG","prompt":"Select the additional therapies you recommend.","pick":"multi","opts":[{"t":"Diuretic therapy","v":3,"fb":"Indicated for overhydration and pulmonary edema from CHF."},{"t":"Positive inotropic agents","v":3,"fb":"Recommended for pulmonary edema associated with heart failure."},{"t":"Restrict and closely monitor fluid intake","v":3,"fb":"Core management of positive fluid balance."},{"t":"Treat the underlying cause","v":3,"fb":"The first recommendation listed for frothy pink secretions."},{"t":"Increase IV fluid intake to improve perfusion","v":-3,"fb":"Exactly backwards — she is fluid overloaded."},{"t":"Aerosolized antibiotics","v":-2,"fb":"No evidence of infection, and these are reserved for CF with Pseudomonas."}],"reveal":""},{"type":"DM","prompt":"She improves and is ready for discharge planning. What is the most important education point?","pick":"one","opts":[{"t":"Disease management education with an emphasis on sodium restriction","v":3,"fb":"The lead treatment recommendation for chronic CHF management."},{"t":"Instruction on incentive spirometry technique","v":-1,"fb":"Not the priority in heart failure."},{"t":"How to self-administer aerosolized antibiotics","v":-3,"fb":"Irrelevant here."},{"t":"Nothing; she has had CHF for years","v":-2,"fb":"Knowledge does not always change behavior — reinforcement and follow-up matter."}],"reveal":""}],"src":[[27438,27512],[1258,1261],[1571,1577],[16745,16755],[19226,19235],[19359,19370]],"id":"SIM-09"},{"cat":"Cardiovascular Disease","topic":"Pulmonary Embolism (PE)","title":"Postoperative Pulmonary Embolism","stem":"A 58-year-old is on postoperative day 3 after a total hip replacement. She develops sudden dyspnea over about a minute, pleuritic chest pain, and a cough. RR 30, HR 118, temp 38.0°C. Her right calf is swollen and tender. SpO2 89% on room air. Chest film is normal.","sections":[{"type":"IG","prompt":"Select the findings and tests that support your suspicion.","pick":"multi","opts":[{"t":"Sudden-onset dyspnea, the most common presenting symptom, with rapid onset within seconds or minutes","v":3,"fb":"The classic PE presentation."},{"t":"Calf swelling, erythema, edema, tenderness — signs of deep venous thrombosis","v":3,"fb":"A listed physical finding."},{"t":"Unexplained hypoxemia with a normal chest radiograph","v":3,"fb":"Should raise clinical suspicion for PE and prompt further evaluation."},{"t":"ABG — expect respiratory alkalosis and hypocapnia","v":3,"fb":"The expected pattern; hypercapnia and acidosis are uncommon and suggest massive PE with obstructive shock."},{"t":"Fever, which can mimic pneumonia","v":2,"fb":"A listed finding that often misleads."},{"t":"CT pulmonary angiography (chest CT angiogram with contrast)","v":3,"fb":"First-choice diagnostic imaging for most patients with suspected PE — sensitive, specific, and widely available urgently."},{"t":"D-dimer as the definitive diagnostic test","v":-2,"fb":"An elevated D-dimer alone is insufficient to diagnose PE, and it is often falsely positive after recent surgery — as here."},{"t":"Serum troponin to make the diagnosis","v":-1,"fb":"Troponin is useful prognostically but not diagnostically in PE."}],"reveal":"ABG: pH 7.48, PaCO2 29, PaO2 56 on room air. CTPA confirms bilateral segmental pulmonary emboli. BP 112/70."},{"type":"DM","prompt":"Why was D-dimer a poor choice in this specific patient?","pick":"one","opts":[{"t":"D-dimer testing is often falsely positive after recent surgery or trauma, so testing may be contraindicated","v":3,"fb":"She is postoperative day 3 — the exact scenario named."},{"t":"D-dimer is only valid in patients over 70","v":-2,"fb":"Not a stated limitation."},{"t":"D-dimer cannot be resulted quickly enough","v":-2,"fb":"Sensitive D-dimer assays are preferred precisely because accurate results are available quickly."},{"t":"D-dimer is always negative in true PE","v":-3,"fb":"The opposite — it is a rule-out test with high sensitivity."}],"reveal":""},{"type":"DM","prompt":"What is the correct oxygen therapy target and device here?","pick":"one","opts":[{"t":"Titrate supplemental O2 to maintain a PaO2 of 80–100 torr with saturation ≥ 92%","v":3,"fb":"She has no chronic hypercapnia, so normal oxygenation targets apply."},{"t":"Titrate to a PaO2 of 55–60 torr with SpO2 ≥ 88%","v":-2,"fb":"That is the target for chronic hypercapnia or when normal oxygenation cannot be achieved below 50% O2."},{"t":"Withhold oxygen because the pH is alkalemic","v":-3,"fb":"The alkalosis is driven by hypoxemia; treating the hypoxemia is the point."},{"t":"Intubate and ventilate immediately","v":-2,"fb":"She is hemodynamically stable and alert."}],"reveal":""},{"type":"IG","prompt":"Select what you would monitor and recommend going forward.","pick":"multi","opts":[{"t":"Continuous SpO2 with serial ABGs","v":3,"fb":"Standard monitoring for degree of hypoxemia."},{"t":"Watch for hypercapnia and lactic acidosis as markers of massive PE with obstructive shock","v":3,"fb":"These are uncommon but signal a deteriorating, high-mortality course."},{"t":"Serum troponin for prognostic information","v":2,"fb":"Useful prognostically."},{"t":"Anticoagulation, since untreated PE carries up to 30% mortality versus 2–11% when treated","v":3,"fb":"The central prognostic fact for PE."},{"t":"Aggressive chest physiotherapy with percussion over the calf","v":-3,"fb":"Percussion over a DVT risks dislodging further clot; PE is also a contraindication to PDPV."},{"t":"Incentive spirometry as the primary treatment","v":-2,"fb":"Does not treat the embolism."}],"reveal":""}],"src":[[28212,28323],[16606,16615],[15594,15613]],"id":"SIM-10"},{"cat":"Neuromuscular Disorders","topic":"Guillain-Barré Syndrome","title":"Ascending Weakness After a Febrile Illness","stem":"A 39-year-old reports a febrile gastrointestinal illness two weeks ago. Over three days he has developed weakness starting in his feet and ascending to his thighs and hands. He describes painful tingling to light touch. Deep tendon reflexes are absent. He is now short of breath when supine.","sections":[{"type":"IG","prompt":"Select the history and findings that distinguish this diagnosis.","pick":"multi","opts":[{"t":"History of a recent febrile illness","v":3,"fb":"Characteristic of Guillain-Barré syndrome."},{"t":"Rapidly progressing ascending symmetrical muscle weakness","v":3,"fb":"The hallmark of GBS; myasthenia gravis is descending and episodic."},{"t":"Sensory dysesthesias — pain or discomfort to touch","v":3,"fb":"Present in GBS, absent in MG."},{"t":"Decreased or absent deep tendon reflexes","v":3,"fb":"GBS reduces or abolishes reflexes; MG leaves them normal."},{"t":"Ptosis and diplopia that worsen with repeated use","v":-2,"fb":"These point to myasthenia gravis, not GBS."},{"t":"Assess for dysphagia and loss of gag reflex","v":3,"fb":"Bulbar involvement matters in both diseases and drives intubation decisions."},{"t":"Assess for dysautonomia — wide BP swings and arrhythmias","v":3,"fb":"A GBS-specific hazard."}],"reveal":"He has dysphagia and a weak gag. BP swings from 90/50 to 170/95 over an hour."},{"type":"IG","prompt":"Select the diagnostic tests you recommend.","pick":"multi","opts":[{"t":"Lumbar puncture for cerebrospinal fluid","v":3,"fb":"In GBS shows increased protein content with a low WBC."},{"t":"Electromyography and nerve conduction studies","v":3,"fb":"Show slowing or blockage of nerve conduction in GBS."},{"t":"Antiganglioside antibody testing","v":3,"fb":"Elevated in GBS."},{"t":"Anti-acetylcholine receptor antibody and a tensilon test","v":-1,"fb":"These are the myasthenia gravis work-up, useful only to exclude MG."},{"t":"Vital capacity and MIP/NIF measurement","v":3,"fb":"The core respiratory monitoring in any acute neuromuscular disorder."},{"t":"Full spirometry with lung volumes and DLCO","v":-1,"fb":"Not the bedside measure that drives management here."}],"reveal":"CSF protein is elevated with a normal cell count. VC is 1.4 L (19 mL/kg). MIP is −32 cm H2O."},{"type":"DM","prompt":"How often should you monitor VC and NIF?","pick":"one","opts":[{"t":"Every 4 to 8 hours","v":3,"fb":"Implement VC and NIF monitoring every 4 to 8 hours in both GBS and MG."},{"t":"Once daily","v":-2,"fb":"Too infrequent for a rapidly progressive disease."},{"t":"Only if the patient complains of dyspnea","v":-3,"fb":"Subjective dyspnea is a late and unreliable signal in neuromuscular failure."},{"t":"Continuously by capnography instead","v":-1,"fb":"Capnography is useful but does not replace serial VC and NIF."}],"reveal":""},{"type":"DM","prompt":"Eight hours later: VC 0.9 L (12 mL/kg), MIP −20 cm H2O, and he can no longer cough effectively. What do you recommend?","pick":"one","opts":[{"t":"Intubation and mechanical ventilation","v":3,"fb":"VC below 1.0 L or 15 mL/kg, MIP/NIF less negative than −25 cm H2O, and inability to cough, swallow, and protect the airway are each intubation indications."},{"t":"Initiate NPPV","v":-2,"fb":"He cannot protect his airway or manage secretions — both contraindications to BiPAP."},{"t":"Increase oxygen and continue monitoring","v":-3,"fb":"Oxygen does not treat ventilatory pump failure."},{"t":"Start incentive spirometry to strengthen the muscles","v":-3,"fb":"Cannot reverse a demyelinating neuropathy and delays definitive care."}],"reveal":""},{"type":"DM","prompt":"Given bulbar involvement and likely prolonged support, what should you anticipate recommending?","pick":"one","opts":[{"t":"Early tracheostomy, since mechanical ventilation is likely to exceed 10 days","v":3,"fb":"Severe weakness with bulbar involvement and a likely need for ventilation beyond 10 days are the stated tracheostomy indications."},{"t":"Extubation trial within 24 hours","v":-3,"fb":"Premature in progressive ascending paralysis."},{"t":"Permanent laryngectomy","v":-3,"fb":"Unrelated to this disease."},{"t":"An uncuffed tracheostomy tube for phonation immediately","v":-1,"fb":"He needs a cuffed tube for airway protection and positive-pressure ventilation first."}],"reveal":""},{"type":"IG","prompt":"Select the ongoing respiratory care priorities.","pick":"multi","opts":[{"t":"Provide O2 therapy as needed to keep SpO2 above 90%","v":3,"fb":"The stated oxygenation goal for both GBS and MG."},{"t":"Implement a rigorous infection control / VAP protocol","v":3,"fb":"Explicitly recommended for these patients."},{"t":"Head of bed elevated 30 degrees or more","v":3,"fb":"VAP prevention on every ventilated patient unless contraindicated."},{"t":"Suctioning and mechanical insufflation–exsufflation for secretion clearance","v":3,"fb":"The recommended airway clearance strategy for neuromuscular disease."},{"t":"Postural drainage in Trendelenburg with vigorous percussion","v":-2,"fb":"Poorly tolerated with dysautonomia and aspiration risk."}],"reveal":""}],"src":[[28359,28380],[28408,28452],[15572,15573],[13934,13938],[17226,17236]],"id":"SIM-11"},{"cat":"Adult Medical or Surgical","topic":"Acute Respiratory Distress Syndrome","title":"ARDS After Aspiration","stem":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O.","sections":[{"type":"IG","prompt":"Select the findings you need to establish the diagnosis.","pick":"multi","opts":[{"t":"Acute onset within one week of a known clinical insult","v":3,"fb":"A Berlin criterion; the aspiration was 18 hours ago."},{"t":"Bilateral infiltrates/opacities consistent with pulmonary edema on chest radiograph or CT","v":3,"fb":"A Berlin criterion."},{"t":"Confirm the edema is not due to cardiac failure or fluid overload","v":3,"fb":"Required — cardiogenic pulmonary edema is the primary differential and must be excluded."},{"t":"P/F ratio below 300 on PEEP/CPAP of 5 cm H2O","v":3,"fb":"The oxygenation criterion; his P/F is 78."},{"t":"Plasma BNP to help rule out CHF/cardiogenic pulmonary edema","v":3,"fb":"Explicitly recommended."},{"t":"Echocardiography to rule out cardiogenic pulmonary edema","v":3,"fb":"Explicitly recommended."},{"t":"Confirm absence of S3/S4 gallop, JVD, cardiomegaly, or pleural effusions","v":3,"fb":"Findings that would point to cardiac failure instead."},{"t":"Spirometry with bronchodilator response","v":-3,"fb":"Meaningless in an intubated patient with ARDS."}],"reveal":"BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78."},{"type":"DM","prompt":"Classify the severity by the Berlin definition.","pick":"one","opts":[{"t":"Severe — P/F below 100","v":3,"fb":"Berlin: mild 201–300, moderate 101–200, severe below 100. His P/F of 78 is severe."},{"t":"Moderate — P/F 101–200","v":-2,"fb":"His P/F is 78."},{"t":"Mild — P/F 201–300","v":-3,"fb":"Far off."},{"t":"Does not meet ARDS criteria","v":-3,"fb":"He meets all four."}],"reveal":""},{"type":"DM","prompt":"Calculate his predicted body weight and set the initial ARDSNet tidal volume.","pick":"one","opts":[{"t":"PBW = 50 + 2.3(70 − 60) = 73 kg; initial VT = 8 mL/kg = about 584 mL","v":3,"fb":"Male PBW = 50 + 2.3 × (height in inches − 60). ARDSNet starts at 8 mL/kg PBW, then reduces by 1 mL/kg every 2 hours or less to 6 mL/kg."},{"t":"PBW = 45.5 + 2.3(70 − 60) = 68.5 kg; VT = 548 mL","v":-2,"fb":"That is the FEMALE formula."},{"t":"Use actual body weight, so keep VT at 700 mL","v":-3,"fb":"ARDSNet is always based on predicted body weight."},{"t":"PBW = 73 kg; start directly at 4 mL/kg = 292 mL","v":-1,"fb":"4 mL/kg is the protocol floor, not the starting point."}],"reveal":""},{"type":"IG","prompt":"His plateau pressure is 36 cm H2O. Select the correct protocol responses.","pick":"multi","opts":[{"t":"Decrease VT in 1-mL/kg steps toward a minimum of 4 mL/kg until Pplat is 30 or less","v":3,"fb":"The explicit ARDSNet rule when Pplat exceeds 30."},{"t":"Measure plateau pressure every 4 hours and after each change in PEEP or VT","v":3,"fb":"The stated monitoring interval."},{"t":"Accept a higher PaCO2 as permissive hypercapnia while the pH stays above 7.25–7.30","v":3,"fb":"The trade for lung protection."},{"t":"Aim to keep the pH between 7.30 and 7.45","v":3,"fb":"The ARDSNet acid-base goal."},{"t":"Increase VT to improve ventilation and lower the PaCO2","v":-3,"fb":"Directly injurious at a Pplat of 36."},{"t":"Switch to pressure control with a PIP under 30 cm H2O if volume control cannot meet the goal","v":2,"fb":"A legitimate alternative to reduce plateau pressure in low-compliance patients."}],"reveal":"VT reduced to 6 mL/kg (438 mL). Pplat now 29. ABG: pH 7.26, PaCO2 58, PaO2 82 on FiO2 1.0, PEEP 5."},{"type":"DM","prompt":"pH is 7.26 with a rate of 14. What does the protocol direct?","pick":"one","opts":[{"t":"Increase the rate until pH exceeds 7.30 or PaCO2 falls below 25, to a maximum of 35/min","v":3,"fb":"For pH above 7.15 but below 7.30, increase the rate to a maximum of 35/min."},{"t":"Increase VT back to 8 mL/kg","v":-3,"fb":"Only permitted if the rate is already 35/min and pH remains below 7.15."},{"t":"Give sodium bicarbonate now","v":-1,"fb":"Considered only when the rate is maxed at 35 and pH is still below 7.15."},{"t":"Accept the pH and make no change","v":-2,"fb":"Below the 7.30 protocol floor."}],"reveal":""},{"type":"DM","prompt":"Oxygenation remains poor: P/F 82 on FiO2 1.0 with PEEP now 12. What do you recommend next?","pick":"one","opts":[{"t":"A prone positioning trial, maintained at least 12 hours as tolerated","v":3,"fb":"Recommended for ARDS when oxygenation is inadequate on FiO2 ≥ 0.6 and PEEP ≥ 10 cm H2O. A PaO2 rise over 10 torr in the first 30 minutes predicts success."},{"t":"Increase PEEP to 25 cm H2O and hold it there","v":-2,"fb":"Sustained very high PEEP risks overdistention; recruitment maneuvers are brief."},{"t":"Begin high-frequency oscillatory ventilation now","v":-1,"fb":"HFV should not be used as rescue therapy, and studies show increased mortality in ARDS."},{"t":"Reduce PEEP to 5 to lower plateau pressure","v":-3,"fb":"Will worsen the shunt."}],"reveal":""}],"src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"id":"SIM-12"},{"cat":"Adult Medical or Surgical","topic":"Pneumonia","title":"Ventilator-Associated Pneumonia","stem":"A 62-year-old has been ventilated for six days after abdominal surgery. Over 24 hours he develops a temperature of 38.7°C, thick purulent secretions, and a new right lower lobe infiltrate. Peak pressures have risen from 28 to 38 cm H2O and exhaled VT has fallen.","sections":[{"type":"IG","prompt":"Select the findings that support your suspicion.","pick":"multi","opts":[{"t":"New or progressive pulmonary infiltrates with fever, mucopurulent secretions, and leukocytosis","v":3,"fb":"The definition of suspected VAP in a ventilated patient."},{"t":"Reduced tidal volume, increased inspiratory pressures, decreased compliance, increased plateau pressures","v":3,"fb":"Common ventilator findings in VAP."},{"t":"Worsening hypoxemia on ABG and leukocytosis","v":3,"fb":"Listed diagnostic findings."},{"t":"Obtain respiratory samples BEFORE starting or changing antibiotics","v":3,"fb":"Explicitly required — otherwise cultures are compromised."},{"t":"Rhonchi, crackles, reduced breath sounds, bronchospasm","v":2,"fb":"Listed clinical findings."},{"t":"Start broad-spectrum antibiotics first, then culture","v":-3,"fb":"Reverses the required order and risks a non-diagnostic culture."},{"t":"Assume the rising pressure is simply a kinked circuit and make no further assessment","v":-2,"fb":"A rising pressure with fever and a new infiltrate demands a VAP work-up."}],"reveal":"Endotracheal aspirate sent before antibiotics. WBC 18,400. ABG: pH 7.33, PaCO2 47, PaO2 62 on FiO2 0.60, PEEP 8."},{"type":"DM","prompt":"Which sampling method best confirms the diagnosis?","pick":"one","opts":[{"t":"Lower respiratory tract aspirates identifying a pathogen — invasive mini-BAL, bronchoscopic BAL, or protected specimen brush","v":3,"fb":"VAP is confirmed when lower respiratory tract aspirates identify a pathogen; invasive methods are preferred."},{"t":"Endotracheal aspirate into a sterile specimen trap","v":2,"fb":"The alternative noninvasive approach when invasive methods are not available."},{"t":"Blood culture alone","v":-1,"fb":"Useful for bacteremia but does not confirm VAP."},{"t":"Sputum expectorated by the patient","v":-3,"fb":"He is intubated; this is not possible or valid."}],"reveal":""},{"type":"IG","prompt":"Select the treatment and supportive measures.","pick":"multi","opts":[{"t":"Antibiotic selection based on likely organisms, clinical course, and MDRO risk factors","v":3,"fb":"The stated principle — accurate diagnosis avoids antibiotic overuse and multidrug-resistant organisms."},{"t":"O2 therapy to treat hypoxemia and decrease work of breathing","v":3,"fb":"Explicitly recommended."},{"t":"Aggressive bronchopulmonary toilet and hyperinflation therapy protocols","v":3,"fb":"Recommended to manage secretions and offset consolidation and atelectasis."},{"t":"Lung-protective ventilation guidelines for hypoxic and hypercapnic failure","v":3,"fb":"Ventilatory management of the intubated pneumonia patient follows lung-protective strategies."},{"t":"Head of bed elevated 30 degrees or more and subglottic secretion drainage","v":3,"fb":"Core VAP prevention: HOB elevation prevents reflux aspiration and subglottic ETTs continuously remove secretions above the cuff."},{"t":"Routine daily chest x-ray to monitor progress","v":-1,"fb":"Routine daily chest x-ray is no longer recommended to monitor mechanically ventilated patients."},{"t":"Instill saline before each suction pass to loosen secretions","v":-2,"fb":"Do not routinely lavage with saline; its use is controversial."}],"reveal":""},{"type":"DM","prompt":"Cuff pressure measures 18 cm H2O with an audible leak. What do you do?","pick":"one","opts":[{"t":"Adjust the pressure to eliminate gurgling at the cuff through inspiration, but no higher than 30 cm H2O","v":3,"fb":"Low cuff pressures permit leakage-type aspiration, which leads to VAP; adjust for a leak-free seal below the 25–30 cm H2O ceiling."},{"t":"Leave it, since lower pressures protect the mucosa","v":-2,"fb":"Too low a pressure is exactly how VAP develops."},{"t":"Inflate to 40 cm H2O to guarantee a seal","v":-3,"fb":"Above 25–30 cm H2O obstructs tracheal blood flow and causes ulceration and necrosis."},{"t":"Measure it but do not adjust it","v":-2,"fb":"Attaching the manometer itself lowers cuff pressure, so you must always adjust, never merely measure."}],"reveal":""}],"src":[[29060,29111],[5593,5599],[5637,5641],[14614,14621],[13934,13938],[15770,15770],[8256,8262]],"id":"SIM-13"},{"cat":"Adult Medical or Surgical","topic":"Shock","title":"Septic Shock from a Urinary Source","stem":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling.","sections":[{"type":"IG","prompt":"Select your assessments and laboratory recommendations.","pick":"multi","opts":[{"t":"Serum lactate","v":3,"fb":"Elevated lactate indicates severity of sepsis and is used to follow the therapeutic response."},{"t":"Blood cultures from at least two different sites, plus urinalysis and cultures from suspected sources","v":3,"fb":"The stated microbiologic work-up."},{"t":"CBC with differential, chemistries, liver function tests, and coagulation studies including D-dimer","v":3,"fb":"Explicitly recommended."},{"t":"ABG to assess for acidosis, hypoxemia, or hypercapnia","v":3,"fb":"Explicitly recommended."},{"t":"Imaging targeted at the suspected site of infection","v":3,"fb":"Chest radiography and CT of chest and abdomen as indicated."},{"t":"Bedside telemetry or ECG","v":3,"fb":"Recommended in undifferentiated hypotension and shock; may reveal arrhythmia, ischemic ST changes, or low voltage suggesting effusion."},{"t":"Renal and liver function tests and cardiac enzymes","v":3,"fb":"Part of the early shock panel to identify cause and organ injury."},{"t":"Wait for the blood cultures to result before giving antibiotics or fluids","v":-3,"fb":"Resuscitation must not be delayed."}],"reveal":"Lactate 5.4 mmol/L. WBC 21,000. ABG: pH 7.28, PaCO2 28, PaO2 68 on room air, HCO3 13, BE −12. Urinalysis is positive."},{"type":"DM","prompt":"Interpret the blood gas.","pick":"one","opts":[{"t":"Partially compensated metabolic acidosis with hypoxemia — a high anion gap acidosis from lactate","v":3,"fb":"Low pH with a PaCO2 under 45 makes the primary problem metabolic acidosis; the low PaCO2 and BE of −12 show partial respiratory compensation. A high anion gap metabolic acidosis should always raise clinical suspicion in shock."},{"t":"Uncompensated respiratory alkalosis","v":-2,"fb":"The pH is acidemic, not alkalemic."},{"t":"Fully compensated metabolic acidosis","v":-1,"fb":"Compensation is partial because the pH remains below normal."},{"t":"Combined respiratory and metabolic acidosis","v":-2,"fb":"The PaCO2 is low, not high, so there is no respiratory acidosis."}],"reveal":""},{"type":"IG","prompt":"Select your immediate management recommendations.","pick":"multi","opts":[{"t":"Administer oxygen to all patients with sepsis and monitor continuously with pulse oximetry","v":3,"fb":"Explicitly recommended."},{"t":"Establish venous access as soon as possible","v":3,"fb":"Most will need central access, but line insertion must not delay fluids and antibiotics."},{"t":"Balanced crystalloid infusion","v":3,"fb":"First-line circulatory support."},{"t":"Vasopressors — norepinephrine, with vasopressin if needed","v":3,"fb":"The stated vasopressor strategy."},{"t":"Consider inotropic drugs such as dobutamine in selected cases","v":2,"fb":"Listed as part of circulatory support."},{"t":"Delay antibiotics until a central line is placed","v":-3,"fb":"Central line insertion should not delay resuscitative fluids and antibiotics."},{"t":"Diuretics to improve urine output","v":-3,"fb":"He is hypotensive and hypovolemic; diuresis would be harmful."}],"reveal":"After 2 L of crystalloid, BP is 92/54. He becomes increasingly somnolent and difficult to rouse."},{"type":"DM","prompt":"He is now somnolent. What do you recommend?","pick":"one","opts":[{"t":"Intubation and mechanical ventilation, both for the increased work of breathing and for airway protection","v":3,"fb":"Intubation may be needed for the increased work of breathing typical of sepsis, and is also indicated for airway protection since encephalopathy and depressed consciousness frequently complicate sepsis."},{"t":"Start NPPV","v":-2,"fb":"A somnolent patient who cannot protect the airway is not a BiPAP candidate."},{"t":"Increase oxygen to a nonrebreathing mask and continue to observe","v":-2,"fb":"Does not address airway protection or ventilatory fatigue."},{"t":"Give a sedative to calm him","v":-3,"fb":"Would deepen the obtundation and precipitate arrest."}],"reveal":""},{"type":"DM","prompt":"His mixed venous oxygen saturation is reported as 82% despite the lactate of 5.4. How do you interpret this?","pick":"one","opts":[{"t":"In sepsis, mixed venous O2 can be higher than normal even with tissue hypoxia; lactate is the better indicator here","v":3,"fb":"Explicitly stated for both sepsis and cyanide poisoning — in conditions that decrease O2 demand, mixed venous lactate is a better indicator of tissue oxygenation."},{"t":"Tissue oxygenation is adequate and the lactate must be a lab error","v":-3,"fb":"The classic trap."},{"t":"Oxygen delivery is excessive and the FiO2 should be cut","v":-2,"fb":"Misreads the physiology."},{"t":"The sample was drawn with the balloon inflated","v":-1,"fb":"That would cause a falsely high reading, but the sepsis explanation is the intended one here."}],"reveal":""}],"src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"id":"SIM-14"},{"cat":"Adult Medical or Surgical","topic":"Cystic Fibrosis","title":"Cystic Fibrosis Exacerbation","stem":"A 24-year-old with cystic fibrosis comes to the ED with four days of increasing productive cough, thick green sputum, fatigue, and poor appetite. She has lost 6 pounds. RR 26 with intercostal retractions and accessory muscle use. Coarse rhonchi throughout. SpO2 88% on room air.","sections":[{"type":"IG","prompt":"Select the assessments and tests you want.","pick":"multi","opts":[{"t":"Development of fever and change in sputum volume, color, and character","v":3,"fb":"Core exacerbation criteria in CF."},{"t":"New-onset or increased hemoptysis","v":3,"fb":"A listed exacerbation feature."},{"t":"Chest x-ray looking for a new infiltrate","v":3,"fb":"Explicitly recommended."},{"t":"Labs: CBC for leukocytosis, and electrolytes for low Na+, Cl−, and K+","v":3,"fb":"CF exacerbations show leukocytosis and a hypochloremic metabolic alkalosis pattern with low sodium, chloride, and potassium."},{"t":"ABG or pulse oximetry, expecting moderate hypoxemia with SpO2 below 90% on room air","v":3,"fb":"The stated expectation."},{"t":"Sputum culture and sensitivity","v":3,"fb":"Determines the colonizing organism and directs antibiotic choice."},{"t":"Spirometry (FEV1) to establish a baseline for response","v":2,"fb":"Used to assess the effectiveness of the regimen."},{"t":"Place her in a room with another CF patient for peer support","v":-3,"fb":"Minimize contact between CF patients and apply transmission-based precautions."}],"reveal":"Sputum grows Pseudomonas aeruginosa. WBC 16,200. FEV1 is 38% predicted. SpO2 improves to 93% on 2 L/min."},{"type":"DM","prompt":"Select the correct SEQUENCE for her inhaled therapy session.","pick":"one","opts":[{"t":"Bronchodilator → dornase alfa or hypertonic saline → airway clearance therapy → aerosolized antibiotic","v":3,"fb":"The recommended order: bronchodilator first, then mucolytic, then airway clearance, then steroids, and finally the aerosolized antibiotic."},{"t":"Aerosolized antibiotic → bronchodilator → mucolytic → airway clearance","v":-3,"fb":"Reverses the sequence; the antibiotic is deposited in obstructed airways."},{"t":"Mucolytic → bronchodilator → antibiotic → airway clearance","v":-2,"fb":"A mucolytic before a bronchodilator risks bronchospasm."},{"t":"Airway clearance → bronchodilator → antibiotic → mucolytic","v":-2,"fb":"Clearance before bronchodilation is far less effective."}],"reveal":""},{"type":"DM","prompt":"Which inhaled antibiotic and device pairing is correct for confirmed Pseudomonas?","pick":"one","opts":[{"t":"Tobramycin (TOBI) via breath-enhanced nebulizer or DPI, Colistin via breath-enhanced nebulizer, or aztreonam (Cayston) via mesh nebulizer","v":3,"fb":"The stated device pairings; Cayston is approved only for specific vibrating-mesh nebulizers."},{"t":"Aztreonam (Cayston) via a standard small-volume jet nebulizer","v":-2,"fb":"Cayston is approved for administration only via specific electronic mesh nebulizers."},{"t":"Any aerosolized antibiotic via MDI with a spacer","v":-3,"fb":"These drugs are not formulated for MDI delivery."},{"t":"Oral antibiotics only, since inhaled agents are ineffective","v":-2,"fb":"Inhaled antibiotics are specifically indicated for CF with Pseudomonas."}],"reveal":""},{"type":"IG","prompt":"Select the airway clearance and long-term recommendations.","pick":"multi","opts":[{"t":"PEP therapy or high-frequency chest wall oscillation","v":3,"fb":"Recommended techniques for CF in adults, including those living alone."},{"t":"Avoid head-down positioning during postural drainage","v":3,"fb":"CF patients are at higher risk for gastroesophageal reflux, so head-down positioning is no longer recommended."},{"t":"Supplemental O2 to keep SpO2 above 90%","v":3,"fb":"The stated target."},{"t":"High-energy, high-fat diet with increased salt intake, pancreatic enzymes, and vitamin supplements","v":3,"fb":"The stated nutritional plan."},{"t":"Annual influenza immunization and regular exercise","v":3,"fb":"Both explicitly recommended; exercise improves airway clearance and reduces exacerbations."},{"t":"Assess response by subjective report, SpO2, sputum production, breath sounds, FEV1, and chest x-ray","v":3,"fb":"The stated effectiveness measures — note breath sounds may increase as secretions move centrally."},{"t":"Restrict salt intake to reduce fluid retention","v":-3,"fb":"CF patients lose excessive salt and need increased intake."}],"reveal":""}],"src":[[28730,28790],[18323,18325],[18506,18509],[15558,15568],[15650,15652]],"id":"SIM-15"},{"cat":"Adult Medical or Surgical","topic":"Drug Overdose and Poisonings","title":"Opioid Overdose with Respiratory Depression","stem":"A 27-year-old is brought in unresponsive after a suspected opioid overdose. RR 6 and shallow, pinpoint pupils. SpO2 78% on room air. He does not respond to verbal stimulus, and withdraws only to a firm pinch.","sections":[{"type":"IG","prompt":"Select your immediate assessments.","pick":"multi","opts":[{"t":"Apply the AVPU scale — he responds to Pain, not to Verbal stimulus","v":3,"fb":"AVPU: Alert, responds to Verbal, responds to Pain, Unresponsive. He is a 'P'."},{"t":"Glasgow Coma Scale to objectively grade consciousness","v":3,"fb":"The most objective assessment of consciousness; a total of 8 or less indicates coma."},{"t":"Obtain an arterial blood gas","v":3,"fb":"Needed to quantify the ventilatory failure."},{"t":"Assess the airway for patency and protective reflexes","v":3,"fb":"Diminished neurologic function from drug overdose is an explicit indication for immediate intubation when airway protection is inadequate."},{"t":"Capnography to monitor ventilation during opioid analgesia or sedation","v":3,"fb":"An explicit capnography indication — monitoring patients receiving opioid analgesia for suppression of ventilation."},{"t":"Drug-screening panels and liver enzymes","v":2,"fb":"Recommended for suspected drug abuse."},{"t":"Full pulmonary function testing","v":-3,"fb":"Impossible and irrelevant in an unresponsive patient."}],"reveal":"GCS is E2 V2 M4 = 8. ABG on room air: pH 7.18, PaCO2 78, PaO2 44, HCO3 28, BE +1."},{"type":"DM","prompt":"Interpret the blood gas.","pick":"one","opts":[{"t":"Acute (uncompensated) respiratory acidosis with severe hypoxemia","v":3,"fb":"pH below 7.35 with PaCO2 above 45 makes the primary problem respiratory acidosis; a normal HCO3 and BE mean no compensation, so it is acute. A PaO2 of 44 is moderate hypoxemia, and below 40 would be severe."},{"t":"Fully compensated respiratory acidosis","v":-3,"fb":"HCO3 and BE are normal — there has been no time to compensate."},{"t":"Combined respiratory and metabolic acidosis","v":-2,"fb":"The BE is +1, which is normal."},{"t":"Metabolic acidosis with respiratory compensation","v":-3,"fb":"The PaCO2 is high, not low."}],"reveal":""},{"type":"DM","prompt":"His GCS is 8. What does this tell you and what is the immediate priority?","pick":"one","opts":[{"t":"A GCS of 8 or less indicates coma; secure ventilation and be prepared to intubate for airway protection","v":3,"fb":"Severe impairment is a GCS of 8 or less. Diminished neurologic function from drug overdose with inadequate airway protection is an explicit indication for immediate intubation."},{"t":"A GCS of 8 is mild impairment; observe","v":-3,"fb":"Mild is 13–15, moderate 9–12, severe/coma 8 or less."},{"t":"Start NPPV","v":-2,"fb":"He cannot protect his airway — a contraindication to BiPAP."},{"t":"Apply a nonrebreathing mask and wait for the drug to wear off","v":-3,"fb":"Oxygen alone does not treat ventilatory failure or protect the airway."}],"reveal":""},{"type":"IG","prompt":"If IV access cannot be obtained immediately, select the correct statements about ETT drug instillation.","pick":"multi","opts":[{"t":"Naloxone is among the agents that can be instilled down the ETT when IV access is unavailable — remember L-E-A-N","v":3,"fb":"Lidocaine, Epinephrine, Atropine, Naloxone can be instilled via ETT in emergencies without IV access."},{"t":"Double the dose when instilling via ETT","v":3,"fb":"The stated adjustment for endotracheal instillation."},{"t":"Follow with about 10 mL of normal saline","v":3,"fb":"The recommended flush volume."},{"t":"Provide 5–10 rapid inflations via a bag-valve resuscitator immediately after instillation","v":3,"fb":"The stated technique for endotracheal drug delivery."},{"t":"Halve the dose because absorption is faster via the airway","v":-3,"fb":"The opposite — absorption is less reliable, so the dose is doubled."},{"t":"Instill the drug undiluted with no flush and no ventilation","v":-2,"fb":"Without dilution and inflations the drug will not reach the distal airways."}],"reveal":""}],"src":[[2785,2801],[4280,4280],[8199,8201],[8637,8639],[19433,19436],[19020,19025],[21547,21550]],"id":"SIM-16"},{"cat":"Pediatric Problems","topic":"Croup and Epiglottitis","title":"Stridor in a Toddler","stem":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air.","sections":[{"type":"IG","prompt":"Select the history and findings that help you distinguish croup from epiglottitis.","pick":"multi","opts":[{"t":"Age: infant/toddler with initial cold-like symptoms and a low-grade fever progressing at night","v":3,"fb":"The classic croup presentation; epiglottitis is abrupt in a toddler-to-school-age child."},{"t":"Hoarseness, barking cough, and inspiratory stridor","v":3,"fb":"Croup's hallmark triad."},{"t":"Assess for agitation; in severe cases look for significant tachypnea and tachycardia","v":3,"fb":"Stated croup assessment; lethargy, hypotonia, and cyanosis are late signs."},{"t":"Ask about high fever up to 40°C with sore throat, drooling, and difficulty swallowing","v":3,"fb":"Screening for epiglottitis — their absence here supports croup."},{"t":"Determine immunization status for H. influenzae","v":3,"fb":"Relevant to epiglottitis risk."},{"t":"Lateral neck x-ray","v":3,"fb":"Look for the subglottic 'steeple sign' of croup versus the 'thumb sign' of epiglottitis."},{"t":"Immediately examine the pharynx with a tongue depressor","v":-3,"fb":"In suspected epiglottitis, minimize procedures that could precipitate airway compromise, including upper airway manipulation."},{"t":"Obtain venipuncture for blood cultures right away","v":-2,"fb":"Also a procedure that can precipitate airway compromise if epiglottitis is possible."}],"reveal":"AP film shows a narrowed, tapering subglottic airway — the steeple sign. Lateral neck film is unremarkable. He is agitated but not drooling and is fully immunized."},{"type":"DM","prompt":"What is your diagnosis and why?","pick":"one","opts":[{"t":"Croup — steeple sign on the AP film with a normal lateral neck film and no supraglottic involvement","v":3,"fb":"In croup the AP film shows the steeple sign while the lateral neck may appear normal; in epiglottitis the pattern reverses."},{"t":"Epiglottitis — the stridor and retractions are diagnostic","v":-2,"fb":"Stridor occurs in both; the radiographic pattern, gradual onset, and absent drooling point to croup."},{"t":"Foreign-body aspiration","v":-1,"fb":"Possible in this age group, but the 2-day viral prodrome and steeple sign point to croup."},{"t":"Bronchiolitis","v":-2,"fb":"Produces wheezing and lower airway signs, not inspiratory stridor with a barking cough."}],"reveal":""},{"type":"IG","prompt":"Select your treatment recommendations.","pick":"multi","opts":[{"t":"Close respiratory and cardiac monitoring including SpO2","v":3,"fb":"Recommended for both croup and epiglottitis."},{"t":"Supplemental O2 as needed to keep SpO2 above 90%","v":3,"fb":"The stated oxygenation target."},{"t":"Aerosolized racemic epinephrine, 0.25–0.50 mL of 2.25% solution with 3.0 mL saline, repeated up to three times","v":3,"fb":"The specific croup dosing and repetition limit."},{"t":"Systemic corticosteroids, oral or IM; aerosolized budesonide is an option","v":3,"fb":"Recommended for croup."},{"t":"Adequate hydration and an antipyretic for fever","v":3,"fb":"Both recommended."},{"t":"Droplet precautions if admitted","v":3,"fb":"The stated isolation recommendation for croup."},{"t":"Broad-spectrum antibiotics and viral serology","v":-2,"fb":"Do not recommend antibiotics or viral serology for croup — those belong to epiglottitis management, after the airway is secure."},{"t":"Cool mist alone with no other therapy","v":-1,"fb":"Cool aerosol helps upper airway edema but is inadequate as sole therapy for stridor at rest."}],"reveal":"After two racemic epinephrine treatments his stridor persists at rest and retractions continue."},{"type":"DM","prompt":"Repeat racemic epinephrine has failed. What do you recommend next?","pick":"one","opts":[{"t":"Heliox via a high-flow cannula or nonrebreathing mask","v":3,"fb":"If repeat racemic epinephrine treatments fail to relieve symptoms, recommend heliox — it decreases the work of breathing associated with large-airway obstruction."},{"t":"Immediate cricothyroidotomy","v":-3,"fb":"Reserved for failed intubation with worsening obstruction in epiglottitis."},{"t":"Discharge home with oral steroids","v":-3,"fb":"Stridor at rest after failed treatment requires escalation, and symptoms persisting beyond 4 hours warrant hospital admission."},{"t":"Begin broad-spectrum antibiotics","v":-2,"fb":"Croup is viral."}],"reveal":""},{"type":"DM","prompt":"If this child had instead presented with abrupt high fever, drooling, and a preference for sitting upright and leaning forward, what would you recommend?","pick":"one","opts":[{"t":"Minimize airway manipulation, prepare for fiberoptic-assisted nasotracheal intubation under controlled conditions, and give antibiotics after the airway is secure","v":3,"fb":"The epiglottitis pathway: minimize procedures that could precipitate compromise, secure the airway under controlled conditions, then give a broad-spectrum cephalosporin for 7–10 days."},{"t":"Aerosolized racemic epinephrine and discharge","v":-3,"fb":"Epiglottitis is a bacterial airway emergency."},{"t":"Examine the throat directly to confirm the diagnosis","v":-3,"fb":"Can precipitate complete obstruction."},{"t":"Oral antibiotics and outpatient follow-up","v":-3,"fb":"Dangerously inadequate."}],"reveal":""}],"src":[[30145,30235],[4253,4268],[19024,19026]],"id":"SIM-17"},{"cat":"Pediatric Problems","topic":"Asthma","title":"Pediatric Status Asthmaticus","stem":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best.","sections":[{"type":"IG","prompt":"Select your initial assessments.","pick":"multi","opts":[{"t":"Assess breathlessness by how she talks — phrases versus words versus limited effort","v":3,"fb":"The severity table grades moderate as dyspnea at rest talking in phrases, severe as talking in words."},{"t":"Measure PEF or FEV1 as a percentage of predicted or personal best","v":3,"fb":"Objective severity measure in children 5 years and older."},{"t":"Obtain SpO2 and, if severe, an arterial blood gas","v":3,"fb":"Monitor response with repeat lung function, physical exam, signs and symptoms, and pulse oximetry in the ED."},{"t":"Assess accessory muscle use and retractions","v":3,"fb":"Markers of increased work of breathing."},{"t":"Watch for drowsiness, bradypnea, bradycardia, decreased breath sounds, and fatigue","v":3,"fb":"These mark progression to life-threatening respiratory failure."},{"t":"Order a chest CT scan","v":-2,"fb":"Not indicated in an acute asthma exacerbation."},{"t":"Perform full pulmonary function testing with lung volumes and DLCO","v":-3,"fb":"Inappropriate during an acute exacerbation."}],"reveal":"ABG: pH 7.46, PaCO2 31, PaO2 66 on room air."},{"type":"DM","prompt":"How do you interpret that blood gas in the context of asthma severity?","pick":"one","opts":[{"t":"Early respiratory alkalosis with mild-to-moderate hypoxemia — expected, but watch for the 'cross-over point'","v":3,"fb":"Early on the ABG typically shows respiratory alkalosis with mild to moderate hypoxemia; normalization of the pH — the cross-over point — usually indicates a rising PaCO2 and progression toward respiratory acidosis and failure."},{"t":"Normal blood gas requiring no follow-up","v":-2,"fb":"It is abnormal and, more importantly, it is the baseline against which deterioration is judged."},{"t":"Respiratory acidosis indicating imminent failure","v":-1,"fb":"Not yet — but that is exactly what you are watching for."},{"t":"Metabolic alkalosis from albuterol","v":-2,"fb":"Albuterol lowers potassium but does not produce this pattern."}],"reveal":""},{"type":"IG","prompt":"Select your initial treatment.","pick":"multi","opts":[{"t":"Repetitive or continuous short-acting β-agonist","v":3,"fb":"Standard emergency care; repeat every 20 minutes up to three times or nebulize continuously."},{"t":"Add inhaled ipratropium bromide given the severity","v":3,"fb":"Recommended in severe exacerbations."},{"t":"Oral systemic corticosteroids","v":3,"fb":"Given in moderate or severe exacerbations or when the response to SABA is incomplete."},{"t":"Supplemental oxygen as appropriate to correct hypoxemia","v":3,"fb":"Standard emergency care."},{"t":"Deliver the bronchodilator by MDI with a valved holding chamber and mask if a nebulizer is unavailable","v":2,"fb":"Appropriate for children; note a mask reduces lung deposition by 50%."},{"t":"A long-acting β-agonist for rapid relief","v":-3,"fb":"LABAs should never be used to treat acute exacerbations."},{"t":"A mucolytic to thin secretions","v":-2,"fb":"Irritating to the airway and likely to worsen bronchospasm."}],"reveal":"After one hour of treatment her symptoms are improved, PEF is 74% of personal best, and the improvement holds for a full hour with no further treatment."},{"type":"DM","prompt":"How do you classify her response, and what do you recommend?","pick":"one","opts":[{"t":"Good response — symptoms relieved, PEF ≥ 70% of personal best, sustained at least 1 hour without further intervention; plan discharge","v":3,"fb":"All three criteria for a good response are met."},{"t":"Incomplete response — continue in the ED","v":-1,"fb":"Incomplete response is mild-to-moderate symptoms persisting with PEF 40–69%; she exceeds that."},{"t":"Poor response — admit to the ICU","v":-3,"fb":"Not supported by any finding."},{"t":"Response cannot be judged without an ABG","v":-2,"fb":"Lung function, exam, and symptoms are the stated measures."}],"reveal":""},{"type":"IG","prompt":"Select what must be included in her discharge plan.","pick":"multi","opts":[{"t":"SABA and oral systemic corticosteroids, with consideration of starting an inhaled corticosteroid","v":3,"fb":"The stated discharge medication plan."},{"t":"A written asthma action plan","v":3,"fb":"Developed in partnership with the patient and family."},{"t":"Review of inhaler technique and, whenever possible, environmental control measures","v":3,"fb":"Explicitly required at discharge."},{"t":"Referral to follow-up care","v":3,"fb":"Explicitly required."},{"t":"Teaching that quick-relief medicine needed more than 2 days a week means controller therapy should start or increase","v":3,"fb":"A key self-management message."},{"t":"Instruction to use the LABA whenever symptoms flare","v":-3,"fb":"LABAs must never be used for acute symptoms and should only be used with an inhaled steroid."},{"t":"No follow-up needed if she feels well at discharge","v":-3,"fb":"Directly contrary to the guideline."}],"reveal":""}],"src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"id":"SIM-18"},{"cat":"Neonatal Problems","topic":"Meconium Aspiration","title":"Meconium-Stained Delivery","stem":"You are called to a delivery at 41 weeks' gestation for thick meconium-stained amniotic fluid. The mother had preeclampsia and there were abnormal fetal heart rate patterns. The infant is delivered limp, with poor respiratory effort and a heart rate of 88/min.","sections":[{"type":"DM","prompt":"The baby is meconium-stained with poor respiratory effort, poor tone, and a heart rate under 100. What is your immediate action?","pick":"one","opts":[{"t":"Intubate and suction the trachea immediately after delivery","v":3,"fb":"For a meconium-stained baby with poor or no respiratory effort and poor tone, intubate and suction the trachea immediately. A vigorous baby with normal effort, tone, and heart rate is NOT intubated — you clear the mouth first, then the nose, with a bulb syringe."},{"t":"Clear the mouth and nose with a bulb syringe and observe","v":-2,"fb":"That is the approach for a VIGOROUS meconium-stained baby, not this one."},{"t":"Begin chest compressions immediately","v":-1,"fb":"The heart rate is 88; compressions are indicated below 60."},{"t":"Administer epinephrine first","v":-3,"fb":"Far out of sequence."}],"reveal":"Meconium is retrieved on suctioning. The heart rate is now 84/min."},{"type":"DM","prompt":"Meconium was retrieved and the heart rate is 84/min. What now?","pick":"one","opts":[{"t":"Administer positive-pressure ventilation and consider suctioning again later","v":3,"fb":"If meconium is retrieved and the heart rate is above 100, re-suction; if the heart rate is below 100, administer PPV and consider suctioning again later."},{"t":"Re-suction the trachea immediately","v":-1,"fb":"Re-suctioning is for a heart rate above 100/min; below 100 the priority is ventilation."},{"t":"Begin chest compressions","v":-1,"fb":"Compressions are for a heart rate under 60."},{"t":"Place on CPAP and observe","v":-2,"fb":"Inadequate for a depressed newborn who is not breathing effectively."}],"reveal":""},{"type":"IG","prompt":"PPV is begun. Select the correct technique and targets.","pick":"multi","opts":[{"t":"PPV is the most effective intervention in the delivery room for improving outcomes","v":3,"fb":"Explicitly stated in the neonatal resuscitation guidance."},{"t":"PPV may be delivered with a flow-inflating bag, self-inflating bag, or T-piece resuscitator","v":3,"fb":"All three are acceptable devices."},{"t":"Use a PEEP of 5 cm H2O or less","v":3,"fb":"Always recommended during neonatal PPV."},{"t":"Titrate oxygen to targeted preductal SpO2 — about 80–85% at 5 minutes and 85–95% at 10 minutes","v":3,"fb":"The targeted preductal SpO2 table."},{"t":"Begin chest compressions if the heart rate stays below 60 despite effective PPV","v":3,"fb":"A heart rate under 60 always requires chest compressions in a neonate."},{"t":"Start at 100% oxygen regardless of gestational age","v":-1,"fb":"For preterm newborns under 35 weeks, start at 21–30%; this infant is term, but titration to SpO2 targets still governs."},{"t":"Use a PEEP of 10 cm H2O to recruit the lungs","v":-2,"fb":"Above the recommended neonatal ceiling."}],"reveal":"Heart rate rises to 140. The infant is transferred to the NICU with tachypnea, grunting, intercostal retractions, nasal flaring, and a barrel-shaped chest."},{"type":"IG","prompt":"Select the assessments and tests you recommend in the NICU.","pick":"multi","opts":[{"t":"Chest x-ray looking for patchy overexpansion and infiltration/atelectasis, and for air leaks","v":3,"fb":"MAS shows diffuse or localized hyperinflation with infiltration/atelectasis; pneumothorax and PIE may be evident, and cardiomegaly suggests coexisting PPHN."},{"t":"Auscultate for coarse bilateral rhonchi and crackles, and for a systolic murmur suggesting PPHN","v":3,"fb":"The stated auscultatory findings; a tricuspid regurgitation murmur points to PPHN."},{"t":"Echocardiography to rule out congenital heart disease and assess right-to-left shunting","v":3,"fb":"Explicitly recommended for MAS."},{"t":"ABG and CBC with differential, Hb and Hct","v":3,"fb":"Polycythemia can impair pulmonary blood flow, thrombocytopenia raises hemorrhage risk, and neutropenia or neutrophilia may indicate infection."},{"t":"Monitor any infant born through meconium-stained fluid for respiratory distress for at least 24 hours","v":3,"fb":"Explicitly stated."},{"t":"Pre- and postductal SpO2 comparison","v":3,"fb":"Used to screen for critical congenital heart defects and to detect right-to-left shunting."},{"t":"Discharge to the newborn nursery since the heart rate normalized","v":-3,"fb":"He has clear signs of respiratory distress after MSAF."}],"reveal":""},{"type":"DM","prompt":"He requires 55% oxygen to maintain adequate oxygenation. How is his MAS classified, and what do you recommend?","pick":"one","opts":[{"t":"Moderate — more than 40% O2 is needed; recommend prophylactic surfactant by the INSURE method with prompt extubation to nasal CPAP","v":3,"fb":"MAS is mild if under 40% O2, moderate if over 40%, and severe if positive-pressure ventilation is needed to support life. Surfactant is inactivated by meconium, so replacement using intubation-surfactant-extubation is recommended."},{"t":"Mild — under 40% O2 is needed; observe only","v":-2,"fb":"He needs 55%."},{"t":"Severe — recommend immediate ECMO","v":-2,"fb":"Severe means PPV is necessary to support life; ECMO has its own separate criteria."},{"t":"Classification does not affect management","v":-3,"fb":"It directly drives the treatment plan."}],"reveal":""}],"src":[[31056,31120],[21632,21690],[6532,6534]],"id":"SIM-19"},{"cat":"Neonatal Problems","topic":"Apnea of Prematurity","title":"Recurrent Apnea in a Preterm Infant","stem":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation.","sections":[{"type":"IG","prompt":"Select the assessments needed to define and explain these events.","pick":"multi","opts":[{"t":"Confirm the episodes are recurrent and either last more than 20 seconds or are accompanied by cyanosis, a 4% or greater fall in SpO2, or bradycardia","v":3,"fb":"That is the definition of apnea of prematurity."},{"t":"Note that he was born at less than 37 weeks' gestation and the events are in the first 2 to 3 days","v":3,"fb":"The stated clinical window for apnea of prematurity."},{"t":"Rule out hypoxemia, anemia, and sepsis","v":3,"fb":"Named alternative causes that must be excluded."},{"t":"Rule out an unstable thermal environment — hypothermia or hyperthermia","v":3,"fb":"A named alternative cause."},{"t":"Rule out maternal or neonatal opiate administration","v":3,"fb":"A named alternative cause."},{"t":"Rule out intracranial hemorrhage, congenital upper airway anomalies such as choanal atresia, seizures, and electrolyte or acid-base disturbances","v":3,"fb":"All named alternative causes."},{"t":"Assume it is simply prematurity and order no work-up","v":-3,"fb":"Apnea of prematurity is a diagnosis of exclusion."},{"t":"Perform simple impedance apnea monitoring to diagnose obstructive sleep apnea","v":-2,"fb":"Impedance monitoring measures chest wall movement, not airflow, so it cannot detect obstructive apnea."}],"reveal":"Work-up is negative: normal glucose and electrolytes, no anemia, cultures pending and infant is afebrile, head ultrasound normal."},{"type":"DM","prompt":"How should this infant be positioned?","pick":"one","opts":[{"t":"Prone","v":3,"fb":"Recommend that the infant be cared for in the prone position for apnea of prematurity."},{"t":"Supine with the head of the bed flat","v":-2,"fb":"Not the stated recommendation for apnea of prematurity."},{"t":"Left lateral decubitus","v":-1,"fb":"Not the stated recommendation."},{"t":"Semi-Fowler's at 30 degrees","v":-1,"fb":"That is the VAP-prevention position for ventilated patients, not this."}],"reveal":""},{"type":"IG","prompt":"Select your monitoring and alarm setup.","pick":"multi","opts":[{"t":"Continuous apnea monitoring for respiration and heart rate","v":3,"fb":"Explicitly recommended."},{"t":"Continuous pulse oximetry, since episodes of desaturation are occurring","v":3,"fb":"Explicitly recommended when desaturation accompanies the apnea."},{"t":"Set the apnea time alarm limit at 15–20 seconds","v":3,"fb":"The typical setting."},{"t":"Set low/high heart rate alarms at about 80–210 for a neonate","v":3,"fb":"The typical neonatal range."},{"t":"Secure the sensors on the right and left chest, midway between the nipple line and midaxillary line","v":3,"fb":"Where the greatest chest motion occurs."},{"t":"Confirm that monitor signals match the patient's actual heart and respiratory rate","v":3,"fb":"Required at setup — always confirm patient status by visual inspection as well."},{"t":"Rely on the monitor alone without visual confirmation of the infant","v":-3,"fb":"You should always confirm a patient's status by visual inspection."}],"reveal":""},{"type":"DM","prompt":"An alarm sounds. The infant is apneic but pink with normal color. What do you do?","pick":"one","opts":[{"t":"Wait 10 seconds to see if the apnea self-corrects, then stimulate by flicking the feet or stroking the abdomen","v":3,"fb":"Intervene immediately only if the infant exhibits cyanosis or severe pallor; otherwise wait 10 seconds for self-correction before tactile stimulation."},{"t":"Intervene immediately with bag-mask ventilation","v":-1,"fb":"Immediate intervention is reserved for cyanosis or severe pallor."},{"t":"Intubate for recurrent apnea","v":-3,"fb":"Far out of proportion to a self-limited event."},{"t":"Silence the alarm and continue observing without touching the infant","v":-2,"fb":"Tactile stimulation is the next step if the apnea does not self-correct."}],"reveal":""},{"type":"DM","prompt":"The parents ask when this will stop. Your best answer is:","pick":"one","opts":[{"t":"The incidence typically decreases over time, often resolving by 34–36 weeks' postconceptual age","v":3,"fb":"The stated natural history."},{"t":"It usually persists until at least one year of age","v":-2,"fb":"Inaccurate and needlessly alarming."},{"t":"It never resolves and requires lifelong monitoring","v":-3,"fb":"False."},{"t":"It should resolve within 24 hours","v":-2,"fb":"Inaccurate; it varies inversely with gestational age and birth weight."}],"reveal":""}],"src":[[31215,31252],[5406,5433],[13934,13938]],"id":"SIM-20"}],"chapters":[{"ch":1,"title":"Evaluate Data in the Patient Record","sec":"I-A","nbrc":10,"bank":30,"area":"Patient Data"},{"ch":2,"title":"Perform Clinical Assessment","sec":"I-B","nbrc":10,"bank":30,"area":"Patient Data"},{"ch":3,"title":"Perform Procedures to Gather Clinical Information","sec":"I-C","nbrc":12,"bank":36,"area":"Patient Data"},{"ch":4,"title":"Evaluate Procedure Results","sec":"I-D","nbrc":10,"bank":30,"area":"Patient Data"},{"ch":5,"title":"Recommend Diagnostic Procedures","sec":"I-E","nbrc":8,"bank":24,"area":"Patient Data"},{"ch":6,"title":"Assemble and Troubleshoot Devices","sec":"II-A","nbrc":15,"bank":45,"area":"Troubleshooting, QC & Infection Control"},{"ch":7,"title":"Ensure Infection Prevention","sec":"II-B","nbrc":2,"bank":6,"area":"Troubleshooting, QC & Infection Control"},{"ch":8,"title":"Perform Quality Control Procedures","sec":"II-C","nbrc":3,"bank":9,"area":"Troubleshooting, QC & Infection Control"},{"ch":9,"title":"Maintain a Patent Airway","sec":"III-A","nbrc":10,"bank":30,"area":"Initiation & Modification of Interventions"},{"ch":10,"title":"Perform Airway Clearance and Lung Expansion","sec":"III-B","nbrc":5,"bank":15,"area":"Initiation & Modification of Interventions"},{"ch":11,"title":"Support Oxygenation and Ventilation","sec":"III-C","nbrc":15,"bank":45,"area":"Initiation & Modification of Interventions"},{"ch":12,"title":"Administer Medications and Specialty Gases","sec":"III-D","nbrc":4,"bank":12,"area":"Initiation & Modification of Interventions"},{"ch":13,"title":"Ensure Modifications to the Respiratory Care Plan","sec":"III-E","nbrc":18,"bank":54,"area":"Initiation & Modification of Interventions"},{"ch":14,"title":"Utilize Evidence-Based Principles","sec":"III-F","nbrc":6,"bank":18,"area":"Initiation & Modification of Interventions"},{"ch":15,"title":"Provide Respiratory Care in High-Risk Situations","sec":"III-G","nbrc":5,"bank":15,"area":"Initiation & Modification of Interventions"},{"ch":16,"title":"Assist a Physician/Provider","sec":"III-H","nbrc":4,"bank":12,"area":"Initiation & Modification of Interventions"},{"ch":17,"title":"Initiate and Conduct Patient and Family Education","sec":"III-I","nbrc":3,"bank":9,"area":"Initiation & Modification of Interventions"}],"meta":{"total":420,"nbrc_scored":140,"mult":3}};</script>
<script>
(function(){
"use strict";
var D = window.__BANK__;
var Q = D.questions, SIMS = D.sims, CH = D.chapters;
var view = document.getElementById('view');
var LVL = {recall:'Recall', application:'Application', analysis:'Analysis'};

/* ---------- storage (per-viewer convenience only) ---------- */
function load(k,d){ try{ var v=localStorage.getItem('tmc.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem('tmc.'+k, JSON.stringify(v)); }catch(e){} }

/* ---------- theme ---------- */
var t0 = load('theme', null);
if (t0) document.documentElement.setAttribute('data-theme', t0);
document.getElementById('theme').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  if(!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next); save('theme', next);
});

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function chOf(n){ for(var i=0;i<CH.length;i++) if(CH[i].ch===n) return CH[i]; return null; }
function srcTxt(src){
  var sp = Array.isArray(src[0]) ? src : [src];
  return sp.map(function(p){ return p[0]+'–'+p[1]; }).join(', ');
}
var AREAS = ['Patient Data','Troubleshooting, QC & Infection Control','Initiation & Modification of Interventions'];

/* ---------- routing ---------- */
var route = 'home', state = {};
function go(r, s){ route = r; state = s || {}; render(); window.scrollTo(0,0); }
document.querySelectorAll('.nav').forEach(function(b){
  b.addEventListener('click', function(){ go(b.dataset.go); });
});
function render(){
  document.querySelectorAll('.nav').forEach(function(b){
    if(b.dataset.go===route) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  view.innerHTML='';
  ({home:Home, build:Build, drill:Drill, sims:SimList, exam:Exam, results:Results, sim:SimRun})[route]();
}

/* ---------- home ---------- */
function Home(){
  var best = load('best', {});
  var done = Object.keys(load('simsDone',{})).length;
  var h = el('<div class="read"></div>');
  h.innerHTML =
    '<div class="hero">'+
      '<div class="eyebrow">NBRC TMC &amp; Clinical Simulation Exam</div>'+
      '<h1>Practice built to the real exam blueprint</h1>'+
      '<p class="lede">Every question is mapped to an NBRC content section and weighted to the same proportions as the scored TMC exam — three practice items for each of the 140 scored items, at the exam’s own recall / application / analysis mix.</p>'+
    '</div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+Q.length+'</b><span>practice questions</span></div>'+
      '<div class="stat"><b>'+SIMS.length+'</b><span>clinical simulations</span></div>'+
      '<div class="stat"><b>'+(best.pct!=null?best.pct+'%':'—')+'</b><span>your best exam</span></div>'+
      '<div class="stat"><b>'+done+'/'+SIMS.length+'</b><span>simulations done</span></div>'+
    '</div>'+
    '<div class="modes">'+
      '<button class="mode" data-go="build"><span class="tag">Timed or untimed</span><h3>Build a TMC exam</h3><p>A 140-item blueprint exam that mirrors the real section weighting, or a custom set filtered by content area, chapter, and cognitive level.</p></button>'+
      '<button class="mode" data-go="drill"><span class="tag">17 sections</span><h3>Drill one chapter</h3><p>Work straight through a single NBRC section with the rationale shown after every answer.</p></button>'+
      '<button class="mode" data-go="sims"><span class="tag">7 disease categories</span><h3>Run a simulation</h3><p>Branching information-gathering and decision-making sections scored −3 to +3, at the CSE’s real case distribution.</p></button>'+
    '</div>';
  h.querySelectorAll('.mode').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.go); }); });

  var rows='';
  AREAS.forEach(function(area){
    var list = CH.filter(function(c){ return c.area===area; });
    var n = list.reduce(function(a,c){ return a+c.nbrc; },0);
    var b = list.reduce(function(a,c){ return a+c.bank; },0);
    rows += '<tr class="area-row"><td colspan="4">'+esc(area)+' — '+n+' scored items</td></tr>';
    list.forEach(function(c){
      rows += '<tr><td class="secref">'+esc(c.sec)+'</td><td>'+esc(c.title)+'</td>'+
              '<td class="num">'+c.nbrc+'</td><td class="num">'+c.bank+'</td></tr>';
    });
  });
  var blue = el('<section class="blue read"></section>');
  blue.innerHTML =
    '<div class="eyebrow">Exam blueprint</div>'+
    '<h2 style="font-size:19px;margin-top:6px">How the 140 scored items are distributed</h2>'+
    '<p class="note" style="margin:8px 0 0">These counts come from the exam-preparation text’s own "What to Expect" figures for each NBRC section. The bank holds three questions per scored item.</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Section</th><th>Content</th><th style="text-align:right">TMC items</th><th style="text-align:right">In bank</th></tr></thead><tbody>'+rows+
    '</tbody></table></div>';

  var f = el('<footer></footer>');
  f.innerHTML = 'Original practice material written against <i>Comprehensive Respiratory Therapy Exam Preparation</i> (Heuer &amp; Rodriguez, 4th ed.) and mapped to the NBRC content matrix. Not affiliated with or endorsed by the NBRC or Jones &amp; Bartlett Learning, and not a reproduction of any commercial question bank. Every rationale cites the source lines it was written from.';
  view.appendChild(h); view.appendChild(blue); view.appendChild(f);
}

/* ---------- exam builder ---------- */
var cfg = load('cfg', {areas:[], chs:[], lvls:[], n:140});
function Build(){
  var wrap = el('<div class="read"></div>');
  wrap.innerHTML = '<div class="eyebrow">Build an exam</div><h1 style="font-size:26px;margin:6px 0 10px">TMC exam generator</h1>'+
    '<p class="lede" style="font-size:15.5px;margin-bottom:20px">Leave every filter empty for a full blueprint-proportional exam — each section contributes in the same ratio as the real TMC.</p>';
  var p = el('<div class="panel"></div>');

  function chipRow(label, key, items, getLab, getVal){
    var f = el('<div class="field"><label>'+label+'</label><div class="chips"></div></div>');
    var box = f.querySelector('.chips');
    items.forEach(function(it){
      var v = getVal(it);
      var b = el('<button class="chip" type="button">'+esc(getLab(it))+'</button>');
      b.setAttribute('aria-pressed', cfg[key].indexOf(v)>-1 ? 'true':'false');
      b.addEventListener('click', function(){
        var i = cfg[key].indexOf(v);
        if(i>-1) cfg[key].splice(i,1); else cfg[key].push(v);
        b.setAttribute('aria-pressed', cfg[key].indexOf(v)>-1 ? 'true':'false');
        save('cfg',cfg); sync();
      });
      box.appendChild(b);
    });
    return f;
  }
  p.appendChild(chipRow('Content area','areas',AREAS,function(a){return a;},function(a){return a;}));
  p.appendChild(chipRow('Chapter','chs',CH,function(c){return c.sec+' · '+c.title;},function(c){return c.ch;}));
  p.appendChild(chipRow('Cognitive level','lvls',['recall','application','analysis'],function(l){return LVL[l];},function(l){return l;}));

  var cf = el('<div class="field"><label for="count">Number of questions</label>'+
    '<div class="count-row"><b id="cval">'+cfg.n+'</b><span id="cmax"></span></div>'+
    '<input type="range" id="count" min="5" max="140" step="5" value="'+cfg.n+'"></div>');
  p.appendChild(cf);
  var go_ = el('<button class="btn" id="start">Start exam</button>');
  p.appendChild(go_);
  wrap.appendChild(p); view.appendChild(wrap);

  var rng = cf.querySelector('#count'), cval = cf.querySelector('#cval'), cmax = cf.querySelector('#cmax');
  function pool(){
    return Q.filter(function(q){
      if(cfg.areas.length && cfg.areas.indexOf(chOf(q.ch).area)<0) return false;
      if(cfg.chs.length && cfg.chs.indexOf(q.ch)<0) return false;
      if(cfg.lvls.length && cfg.lvls.indexOf(q.lvl)<0) return false;
      return true;
    });
  }
  function sync(){
    var n = pool().length;
    rng.max = Math.max(5, Math.min(140, n));
    if(+rng.value > +rng.max){ rng.value = rng.max; }
    cfg.n = +rng.value; cval.textContent = cfg.n;
    var filtered = cfg.areas.length||cfg.chs.length||cfg.lvls.length;
    cmax.textContent = 'of '+n+' matching'+(filtered?'':' · blueprint-proportional');
    go_.disabled = n===0;
    save('cfg',cfg);
  }
  rng.addEventListener('input', sync); sync();
  go_.addEventListener('click', function(){
    var p_ = pool(), picked;
    var filtered = cfg.areas.length||cfg.chs.length||cfg.lvls.length;
    if(!filtered){
      // blueprint-proportional: sample each chapter in proportion to its NBRC item count
      picked = [];
      var scale = cfg.n/140;
      CH.forEach(function(c){
        var want = Math.round(c.nbrc*scale);
