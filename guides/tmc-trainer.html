        var sub = shuffle(Q.filter(function(q){ return q.ch===c.ch; }));
        picked = picked.concat(sub.slice(0, Math.min(want, sub.length)));
      });
      var left = shuffle(Q.filter(function(q){ return picked.indexOf(q)<0; }));
      while(picked.length < cfg.n && left.length) picked.push(left.pop());
      picked = shuffle(picked).slice(0, cfg.n);
    } else {
      picked = shuffle(p_).slice(0, cfg.n);
    }
    go('exam', {qs:picked, i:0, ans:[], mode:'exam'});
  });
}

/* ---------- chapter drill ---------- */
function Drill(){
  var w = el('<div class="read"></div>');
  w.innerHTML = '<div class="eyebrow">Chapter drill</div><h1 style="font-size:26px;margin:6px 0 10px">Work one section at a time</h1>'+
    '<p class="lede" style="font-size:15.5px;margin-bottom:20px">Rationale is shown after every answer.</p>';
  view.appendChild(w);
  AREAS.forEach(function(area){
    var g = el('<section class="catgroup"></section>');
    g.innerHTML = '<h2>'+esc(area)+'</h2><p>'+CH.filter(function(c){return c.area===area;}).reduce(function(a,c){return a+c.nbrc;},0)+' scored TMC items</p>';
    var grid = el('<div class="simgrid"></div>');
    CH.filter(function(c){ return c.area===area; }).forEach(function(c){
      var b = el('<button class="simcard"><span class="eyebrow">'+esc(c.sec)+'</span><h3>'+esc(c.title)+'</h3><p>'+c.bank+' questions · '+c.nbrc+' scored items on the TMC</p></button>');
      b.addEventListener('click', function(){
        go('exam', {qs:shuffle(Q.filter(function(q){return q.ch===c.ch;})), i:0, ans:[], mode:'drill', label:c.sec+' · '+c.title});
      });
      grid.appendChild(b);
    });
    g.appendChild(grid); view.appendChild(g);
  });
}

/* ---------- exam runner ---------- */
function Exam(){
  var s = state, q = s.qs[s.i];
  var pct = Math.round(s.i/s.qs.length*100);
  var head = el('<div class="prog"></div>');
  head.innerHTML = '<span class="mono">'+(s.i+1)+' / '+s.qs.length+'</span>'+
    '<div class="track"><i style="width:'+pct+'%"></i></div>'+
    (s.mode==='drill' ? '<span class="mono">'+esc(s.label||'')+'</span>' : '<span class="mono">'+s.ans.length+' answered</span>');
  view.appendChild(head);

  var c = chOf(q.ch);
  var box = el('<div></div>');
  var meta = '<div class="qmeta"><span class="pill">'+esc(q.sec)+'</span><span class="pill lvl">'+LVL[q.lvl]+'</span>'+(s.mode==='drill' ? '' : '<span class="pill">'+esc(c.title)+'</span>')+'</div>';
  box.innerHTML = meta + '<p class="stem">'+esc(q.stem)+'</p>';
  var opts = el('<div class="opts"></div>');
  var order = s.order || (s.order = {});
  if(!order[q.id]) order[q.id] = shuffle(q.opts.map(function(_,i){ return i; }));
  var ord = order[q.id];
  var answered = false, sel = null, drill = (s.mode === 'drill');
  var act = el('<div class="actions"></div>');
  var nxt = el('<button class="btn">' + (s.i+1 < s.qs.length ? 'Next question' : (drill ? 'See results' : 'Finish and score')) + '</button>');
  var quit = el('<button class="btn ghost sm">End and score</button>');
  quit.addEventListener('click', function(){ if(sel!==null && !answered) record(sel); go('results', s); });

  function record(oi){
    answered = true;
    s.ans.push({id:q.id, ok:(oi === q.key), chose:oi, q:q});
  }
  function advance(){
    if(s.i+1 < s.qs.length){ s.i++; go('exam', s); } else go('results', s);
  }

  ord.forEach(function(oi, pos){
    var b = el('<button class="opt"><span class="k">'+'ABCD'[pos]+'</span><span>'+esc(q.opts[oi])+'</span></button>');
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click', function(){
      if(answered) return;
      if(drill){
        record(oi);
        opts.querySelectorAll('.opt').forEach(function(x, k){
          x.disabled = true;
          if(ord[k] === q.key) x.classList.add('correct');
          else if(ord[k] === oi) x.classList.add('wrong');
        });
        box.insertBefore(el('<div class="why"><div class="eyebrow">'+(oi===q.key ? 'Correct' : 'Why the right answer is right')+
          '</div><p>'+esc(q.why)+'</p><div class="src">Source \u00b7 Heuer &amp; Rodriguez 4th ed., extracted lines '+esc(srcTxt(q.src))+'</div></div>'), act);
        nxt.focus();
      } else {
        // exam mode: mark the selection only. Correctness is withheld until scoring.
        sel = oi;
        opts.querySelectorAll('.opt').forEach(function(x, k){
          x.setAttribute('aria-pressed', ord[k] === oi ? 'true' : 'false');
        });
        nxt.disabled = false;
      }
    });
    opts.appendChild(b);
  });

  nxt.addEventListener('click', function(){
    if(!drill){ if(sel === null) return; record(sel); }
    advance();
  });
  if(!drill) nxt.disabled = true;
  box.appendChild(opts);
  act.appendChild(nxt);
  if(s.qs.length > 5) act.appendChild(quit);
  box.appendChild(act);
  view.appendChild(box);
}

/* ---------- results ---------- */
function Results(){
  var s = state, n = s.ans.length, right = s.ans.filter(function(a){return a.ok;}).length;
  var pct = n ? Math.round(right/n*100) : 0;
  var v = pct>=80 ? ['pass','At or above the 80% mastery mark'] :
          pct>=70 ? ['near','Adequately prepared — review the misses'] :
                    ['fail','Below 70% — review the content before re-testing'];
  if(s.mode==='exam'){
    var best = load('best',{});
    if(best.pct==null || pct>best.pct) save('best',{pct:pct, n:n, when:Date.now()});
  }
  var h = el('<div class="read"></div>');
  h.innerHTML = '<div class="eyebrow">'+(s.mode==='drill'?esc(s.label||'Chapter drill'):'TMC practice exam')+'</div>'+
    '<div class="score-hero"><b>'+pct+'%</b><span class="verdict '+v[0]+'">'+v[1]+'</span>'+
    '<span class="note">'+right+' of '+n+' correct. The text advises that scoring at least 70–80% indicates adequate preparation for a section; below 70%, review your wrong answers and the underlying content before re-testing.</span></div>';
  view.appendChild(h);

  // per-area breakdown
  var by = {};
  s.ans.forEach(function(a){
    var k = chOf(a.q.ch).area;
    (by[k] = by[k] || {n:0,r:0}); by[k].n++; if(a.ok) by[k].r++;
  });
  var bd = el('<div class="breakdown read"></div>');
  AREAS.forEach(function(area){
    if(!by[area]) return;
    var o = by[area], p = Math.round(o.r/o.n*100);
    var row = el('<div class="brow"></div>');
    row.innerHTML = '<span>'+esc(area)+'</span><span class="mono">'+o.r+'/'+o.n+'</span><span class="mono">'+p+'%</span>'+
      '<div class="bar-mini"><i style="width:'+p+'%"></i></div>';
    bd.appendChild(row);
  });
  view.appendChild(bd);

  var act = el('<div class="actions read" style="margin-bottom:22px"></div>');
  var again = el('<button class="btn">New exam</button>');
  again.addEventListener('click', function(){ go(s.mode==='drill'?'drill':'build'); });
  var home = el('<button class="btn ghost">Home</button>');
  home.addEventListener('click', function(){ go('home'); });
  act.appendChild(again); act.appendChild(home); view.appendChild(act);

  var wrong = s.ans.filter(function(a){ return !a.ok; });
  var rh = el('<div class="read"><div class="eyebrow">Review</div><h2 style="font-size:18px;margin:6px 0 12px">'+
    (wrong.length? wrong.length+' missed — tap to expand' : 'Nothing missed. Every answer below was correct.')+'</h2></div>');
  view.appendChild(rh);
  var list = el('<div class="rev read"></div>');
  (wrong.length ? wrong : s.ans).forEach(function(a){
    var q = a.q;
    var it = el('<div class="rev-item"></div>');
    var head = el('<button class="rev-head"><span class="dot '+(a.ok?'ok':'no')+'"></span><span class="t">'+esc(q.stem)+'</span><span class="eyebrow">'+esc(q.sec)+'</span></button>');
    var body = el('<div class="rev-body" hidden></div>');
    body.innerHTML =
      (a.ok?'':'<div class="line"><b>You chose</b>'+esc(q.opts[a.chose])+'</div>')+
      '<div class="line"><b>Correct answer</b>'+esc(q.opts[q.key])+'</div>'+
      '<div class="line"><b>Rationale</b>'+esc(q.why)+'</div>'+
      '<div class="src">Source · extracted lines '+esc(srcTxt(q.src))+' · '+esc(q.topic)+'</div>';
    head.addEventListener('click', function(){ body.hidden = !body.hidden; });
    it.appendChild(head); it.appendChild(body); list.appendChild(it);
  });
  view.appendChild(list);
}

/* ---------- simulation list ---------- */
function SimList(){
  var done = load('simsDone',{});
  var w = el('<div class="read"></div>');
  w.innerHTML = '<div class="eyebrow">Clinical Simulation Exam</div><h1 style="font-size:26px;margin:6px 0 10px">'+SIMS.length+' cases at the CSE’s real distribution</h1>'+
    '<p class="lede" style="font-size:15.5px">The CSE draws its 20 cases from seven disease categories in fixed proportions. These cases follow that same distribution. Each section is scored from −3 to +3: information-gathering sections let you select everything you would obtain, decision-making sections take a single choice.</p>';
  view.appendChild(w);
  var cats = [];
  SIMS.forEach(function(s){ if(cats.indexOf(s.cat)<0) cats.push(s.cat); });
  cats.forEach(function(cat){
    var list = SIMS.filter(function(s){ return s.cat===cat; });
    var g = el('<section class="catgroup"></section>');
    g.innerHTML = '<h2>'+esc(cat)+'</h2><p>'+list.length+' case'+(list.length>1?'s':'')+' in the CSE</p>';
    var grid = el('<div class="simgrid"></div>');
    list.forEach(function(s){
      var d = done[s.id];
      var b = el('<button class="simcard"><span class="eyebrow">'+esc(s.id)+(d?' · '+d.pct+'%':'')+'</span><h3>'+esc(s.title)+'</h3><p>'+esc(s.topic)+' · '+s.sections.length+' sections</p></button>');
      b.addEventListener('click', function(){ go('sim', {sim:s, i:0, log:[], score:0, max:0}); });
      grid.appendChild(b);
    });
    g.appendChild(grid); view.appendChild(g);
  });
}

/* ---------- simulation runner ---------- */
function SimRun(){
  var s = state, sim = s.sim;
  var bar = el('<div class="simbar"></div>');
  bar.innerHTML = '<span class="eyebrow">'+esc(sim.cat)+'</span>'+
    '<span class="mono" style="color:var(--ink-3)">Section '+Math.min(s.i+1,sim.sections.length)+' of '+sim.sections.length+'</span>'+
    '<span class="mono" style="margin-left:auto">Score <b style="color:var(--ink)">'+s.score+'</b> / '+s.max+'</span>';
  view.appendChild(bar);

  var head = el('<div class="read"></div>');
  head.innerHTML = '<h1 style="font-size:23px;margin-bottom:12px">'+esc(sim.title)+'</h1>'+
    '<p class="scenario">'+esc(sim.stem)+'</p>';
  view.appendChild(head);

  var log = el('<div class="log"></div>'); view.appendChild(log);
  s.log.forEach(function(e){ log.appendChild(entryNode(e.sec, e.picked, true)); });

  if(s.i >= sim.sections.length){ log.appendChild(simDone(s)); return; }

  var sec = sim.sections[s.i];
  var live = el('<div class="entry"></div>');
  live.innerHTML = '<div class="entry-h"><span class="badge '+(sec.type==='IG'?'ig':'dm')+'">'+(sec.type==='IG'?'Information gathering':'Decision making')+'</span>'+
    '<span class="eyebrow">'+(sec.type==='IG'?'select all that apply':'select one')+'</span></div>';
  var body = el('<div class="entry-b"></div>');
  body.innerHTML = '<p class="stem" style="font-size:16.5px;margin-bottom:14px">'+esc(sec.prompt)+'</p>';
  var opts = el('<div class="opts"></div>');
  var chosen = [];
  var order = shuffle(sec.opts.map(function(_,i){return i;}));
  order.forEach(function(oi, pos){
    var b = el('<button class="opt"><span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+esc(sec.opts[oi].t)+'</span></button>');
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click', function(){
      if(sec.pick === 'one'){ commit([oi]); return; }
      var k = chosen.indexOf(oi);
      if(k>-1) chosen.splice(k,1); else chosen.push(oi);
      b.setAttribute('aria-pressed', chosen.indexOf(oi)>-1 ? 'true':'false');
      submit.disabled = chosen.length===0;
    });
    opts.appendChild(b);
  });
  body.appendChild(opts);
  var submit = el('<button class="btn" style="margin-top:16px">Submit selections</button>');
  if(sec.pick === 'multi'){ submit.disabled = true; submit.addEventListener('click', function(){ commit(chosen); }); body.appendChild(submit); }
  live.appendChild(body); log.appendChild(live);

  function commit(picked){
    var max = sec.opts.reduce(function(a,o){ return a + (o.v>0?o.v:0); },0);
    if(sec.pick==='one') max = 3;
    var got = picked.reduce(function(a,i){ return a + sec.opts[i].v; },0);
    s.score += got; s.max += max;
    s.log.push({sec:sec, picked:picked, got:got, max:max});
    s.i++; go('sim', s);
  }
}
function entryNode(sec, picked, showFb){
  var e = el('<div class="entry"></div>');
  e.innerHTML = '<div class="entry-h"><span class="badge '+(sec.type==='IG'?'ig':'dm')+'">'+(sec.type==='IG'?'Information gathering':'Decision making')+'</span></div>';
  var b = el('<div class="entry-b"></div>');
  b.innerHTML = '<p class="stem" style="font-size:16px;margin-bottom:6px">'+esc(sec.prompt)+'</p>';
  var fb = el('<div class="fb"></div>');
  // chosen first, then the best options that were missed
  picked.forEach(function(i){
    var o = sec.opts[i];
    var cls = o.v>0?'p':(o.v<0?'n':'z');
    fb.appendChild(el('<div class="fbrow"><span class="pts '+cls+'">'+(o.v>0?'+':'')+o.v+'</span><span class="txt"><em>'+esc(o.t)+'</em>'+esc(o.fb)+'</span></div>'));
  });
  var missed = sec.opts.map(function(o,i){return {o:o,i:i};}).filter(function(x){ return x.o.v>=3 && picked.indexOf(x.i)<0; });
  missed.forEach(function(x){
    fb.appendChild(el('<div class="fbrow"><span class="pts z">miss</span><span class="txt"><em>'+esc(x.o.t)+'</em>'+esc(x.o.fb)+'</span></div>'));
  });
  b.appendChild(fb);
  var got = picked.reduce(function(a,i){ return a+sec.opts[i].v; },0);
  var max = sec.pick==='one' ? 3 : sec.opts.reduce(function(a,o){ return a+(o.v>0?o.v:0); },0);
  b.appendChild(el('<div class="scoreline"><span>Section score</span><b>'+got+'</b><span>of '+max+'</span></div>'));
  if(sec.reveal) b.appendChild(el('<div class="reveal"><b>New information</b>'+esc(sec.reveal)+'</div>'));
  e.appendChild(b);
  return e;
}
function simDone(s){
  var pct = s.max ? Math.round(Math.max(0,s.score)/s.max*100) : 0;
  var done = load('simsDone',{});
  if(!done[s.sim.id] || done[s.sim.id].pct < pct){ done[s.sim.id] = {pct:pct}; save('simsDone',done); }
  var v = pct>=80 ? ['pass','Strong case management'] : pct>=70 ? ['near','Adequate — review the negative choices'] : ['fail','Review this disease category'];
  var e = el('<div class="entry"></div>');
  e.innerHTML = '<div class="entry-h"><span class="badge dm">Case complete</span></div>';
  var b = el('<div class="entry-b"></div>');
  b.innerHTML = '<div class="score-hero"><b>'+pct+'%</b><span class="verdict '+v[0]+'">'+v[1]+'</span>'+
    '<span class="note">'+s.score+' of '+s.max+' possible points. On the real CSE, information gathering and decision making are scored separately — selecting harmful or wasteful options costs you points even when you also pick the right ones.</span></div>'+
    '<div class="src" style="margin-top:12px">Source · Heuer &amp; Rodriguez 4th ed., extracted lines '+esc(srcTxt(s.sim.src))+'</div>';
  var act = el('<div class="actions"></div>');
  var again = el('<button class="btn">Run this case again</button>');
  again.addEventListener('click', function(){ go('sim',{sim:s.sim,i:0,log:[],score:0,max:0}); });
  var back = el('<button class="btn ghost">All simulations</button>');
  back.addEventListener('click', function(){ go('sims'); });
  act.appendChild(again); act.appendChild(back); b.appendChild(act);
  e.appendChild(b);
  return e;
}

render();
})();

</script>
