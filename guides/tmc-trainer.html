<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTE Trainer 2027</title>
<style>
:root{--bg:#f6f4ee;--card:#fffdf8;--ink:#1f2a2e;--mute:#5d6b70;--line:#d9d4c7;--acc:#1f6f6a;--accink:#fff;--good:#1d7a46;--bad:#b3372f;--warn:#9a6a00;--chip:#ece8dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14191b;--card:#1c2326;--ink:#e8ecec;--mute:#9aa7ab;--line:#2f3a3e;--acc:#4fb3ab;--accink:#06201e;--good:#5fd08d;--bad:#ff8a80;--warn:#e7b34d;--chip:#263034}}
:root[data-theme=dark]{--bg:#14191b;--card:#1c2326;--ink:#e8ecec;--mute:#9aa7ab;--line:#2f3a3e;--acc:#4fb3ab;--accink:#06201e;--good:#5fd08d;--bad:#ff8a80;--warn:#e7b34d;--chip:#263034}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:1.2em 0 .4em}h3{font-size:1rem;margin:1em 0 .3em}
p{margin:.5em 0}.mute{color:var(--mute)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.scen{border-left:4px solid var(--acc);padding:8px 12px;background:var(--chip);border-radius:6px;margin:8px 0}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.78rem;margin:2px 4px 2px 0;color:var(--mute)}
.chip.warn{color:var(--warn)}.why{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.src{font-size:.8rem;color:var(--mute);margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left}td.n,th.n{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px}.bar>i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{padding:6px 0;min-height:36px;font-size:.85rem}.grid .done{background:var(--chip)}.grid .flag{border-color:var(--warn);color:var(--warn)}.grid .cur{box-shadow:inset 0 0 0 2px var(--acc)}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
.tabnum{font-variant-numeric:tabular-nums}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.good{color:var(--good)}.bad{color:var(--bad)}
</style></head><body><main id="app"></main>
<script id="bank" type="application/json">{"blueprint":{"source":"NBRC Respiratory Therapy Examination Detailed Content Outline, effective January 2027 (source/nbrc/RT-DCO-2027.pdf)","scored":160,"pretest":25,"minutes":240,"breadth":{"I-A":{"title":"Evaluate Data in the Patient Record","recall":1,"integ":2},"I-B":{"title":"Perform Clinical Assessment","recall":2,"integ":4},"I-C":{"title":"Perform Procedures to Gather Clinical Information","recall":1,"integ":4},"I-D":{"title":"Evaluate Procedure Results","recall":2,"integ":5},"I-E":{"title":"Recommend Diagnostic Procedures","recall":0,"integ":4},"II-A":{"title":"Troubleshoot Devices During and After Assembling","recall":4,"integ":15},"II-B":{"title":"Ensure Infection Prevention or Control, Safety, and Performance of Quality Assurance Procedures","recall":4,"integ":2},"III-A":{"title":"Maintain a Patent Airway Including the Care of Artificial Airways","recall":1,"integ":5},"III-B":{"title":"Perform Airway Clearance and Lung Expansion Techniques","recall":1,"integ":3},"III-C":{"title":"Support Oxygenation and Ventilation","recall":0,"integ":10},"III-D":{"title":"Administer Medications and Specialty Gases","recall":2,"integ":1},"III-E":{"title":"Make or Recommend Changes to the Respiratory Care Plan","recall":0,"integ":10},"III-F":{"title":"Use Evidence-Based Practice","recall":1,"integ":2},"III-G":{"title":"Provide Respiratory Care in High-Risk Situations","recall":2,"integ":3},"III-H":{"title":"Assist a Physician or Provider in Performing Procedures","recall":1,"integ":3},"III-I":{"title":"Interact with Team Members, Patients, and Families","recall":1,"integ":4}},"domains":{"I":"Patient Data","II":"Management of Devices and Patient Safety Procedures","III":"Initiation and Modification of Interventions"},"depth":{"cells":{"CLD-IMV":{"title":"Adult chronic lung disease: intubation and invasive mechanical ventilation","n":5,"age":"adult"},"CLD-NIV":{"title":"Adult chronic lung disease: noninvasive management","n":6,"age":"adult"},"CLD-OUT":{"title":"Adult chronic lung disease: outpatient management","n":3,"age":"adult"},"CLD-NEW":{"title":"Adult chronic lung disease: evaluation for a new diagnosis","n":3,"age":"adult"},"TRAUMA":{"title":"Adult trauma","n":4,"age":"adult"},"CV":{"title":"Adult cardiovascular","n":5,"age":"adult"},"NEURO":{"title":"Adult neurological or neuromuscular","n":4,"age":"adult"},"MED-INF":{"title":"Adult medical: infectious disease","n":5,"age":"adult"},"MED-ARDS":{"title":"Adult medical: acute respiratory distress syndrome","n":5,"age":"adult"},"MED-OTHER":{"title":"Adult medical: other (immunocompromised, obesity, drug toxicity)","n":5,"age":"adult"},"PERIOP":{"title":"Adult pre- and post-operative care","n":5,"age":"adult"},"PED":{"title":"Pediatric","n":4,"age":"child"},"NEO-RESUS":{"title":"Neonatal: resuscitation","n":3,"age":"child"},"NEO-RDS":{"title":"Neonatal: respiratory distress syndrome","n":3,"age":"child"}},"type":{"IG":20,"DM":40},"setting":{"in":46,"out":14}},"age_whole_exam":{"neonatal_or_pediatric_min":15,"neonatal_or_pediatric_max":18}},"cites":{"CDC-VAE":"CDC NHSN, Ventilator-Associated Event (VAE) protocol, January 2026","AHRQ-TS":"AHRQ TeamSTEPPS Pocket Guide, Pub. No. 23-0043, revised May 2023","AHA2025":"2025 AHA/AAP Guidelines, Part 5: Neonatal Resuscitation. Circulation 2025;152(suppl 2):S385-S423","ARDS2024":"Matthay MA et al. A New Global Definition of ARDS. Am J Respir Crit Care Med 2024;209(1):37-47","CDC-CO":"CDC, Clinical Guidance for Carbon Monoxide Poisoning (page dated Aug 21, 2026)","CDC-RSV":"CDC, RSV Vaccine Guidance for Adults (page dated Feb 24, 2026)","HP2030":"ODPHP, Healthy People 2030: Social Determinants of Health","DUPI":"Dupixent (dupilumab) US prescribing information, revised 04/2026","TRIK":"Trikafta (elexacaftor/tezacaftor/ivacaftor) US label, DailyMed, Highlights revised 3/2026","TXA":"Wand O et al. Inhaled Tranexamic Acid for Hemoptysis Treatment. Chest 2018;154(6):1379-1384"},"breadth":[{"id":"C01-Q01","sec":"I-A","lvl27":"recall","topic":"Laboratory results","stem":"What is the normal adult reference range for platelet count?","opts":["150,000–400,000/mm³","4,500–11,500/mm³","12–14 seconds","0.8–1.2"],"key":0,"why":"Platelets 150,000–400,000/mm³. A low count means slow clotting and should be checked before an arterial puncture. 4,500–11,500/mm³ is the WBC range, 12–14 s is PT, and 0.8–1.2 is INR.","src":[[1206,1208],[1203,1204],[1210,1215]],"origin":"heuer","age":"adult"},{"id":"C01-Q02","sec":"I-A","lvl27":"recall","topic":"Cardiac biomarkers","stem":"A troponin I level is reported as 2.1 μg/L. Relative to the reference range, this value is:","opts":["Elevated; the normal value is < 0.4 μg/L","Normal; the reference range is 0.4–4.0 μg/L","Low; the normal value is > 5 μg/L","Normal for a patient older than 65"],"key":0,"why":"Troponin I is normally < 0.4 μg/L. It rises 3–6 hours after the insult, peaks at 12 hours, and can persist for 7 days, making it useful for AMI/acute coronary syndrome.","src":[[1255,1256]],"origin":"heuer","age":"adult"},{"id":"C01-Q03","sec":"I-A","lvl27":"recall","topic":"Cardiac biomarkers","stem":"Which B-type natriuretic peptide (BNP) result best helps RULE IN a diagnosis of congestive heart failure?","opts":["> 500 pg/mL","< 20 pg/mL","< 100 pg/L","4–6% of total CK"],"key":0,"why":"A BNP > 500 pg/mL helps rule in CHF, whereas < 100 pg/L helps rule it out. The normal value is < 20 pg/mL. The 4–6% figure refers to CK-MB as a percentage of total CK.","src":[[1258,1261]],"origin":"heuer","age":"adult"},{"id":"C01-Q04","sec":"I-A","lvl27":"recall","topic":"Blood gas analysis","stem":"Which set represents the normal adult arterial blood gas reference ranges?","opts":["pH 7.35–7.45, PaCO₂ 35–45 torr, PaO₂ 80–100 torr, HCO₃ 22–26 mEq/L, BE 0 ± 2","pH 7.30–7.50, PaCO₂ 30–50 torr, PaO₂ 60–100 torr, HCO₃ 18–28 mEq/L, BE 0 ± 5","pH 7.35–7.45, PaCO₂ 20–30 torr, PaO₂ 100–120 torr, HCO₃ 30–35 mEq/L, BE 0 ± 2","pH 7.40–7.50, PaCO₂ 35–45 torr, PaO₂ 80–100 torr, HCO₃ 22–26 mEq/L, BE +2 to +7"],"key":0,"why":"Table 1-4 gives pH 7.35–7.45, PaCO₂ 35–45 torr, PaO₂ 80–100 torr (room air), HCO₃ 22–26 mEq/L, BE 0 ± 2, and SaO₂ 95–98% on room air.","src":[[1318,1333]],"origin":"heuer","age":"adult"},{"id":"C01-Q05","sec":"I-A","lvl27":"recall","topic":"Hemoximetry","stem":"What is the normal carboxyhemoglobin (COHb) level in a healthy nonsmoker?","opts":["< 1.5%","3–6%","< 10%","15–20%"],"key":0,"why":"Normal CO levels are < 1.5%. Levels of 3–6% can be normal for smokers, inner-city dwellers, and people living near industrial areas.","src":[[1355,1357]],"origin":"heuer","age":"adult"},{"id":"C01-Q06","sec":"I-A","lvl27":"recall","topic":"Hemoximetry","stem":"During inhaled nitric oxide (INO) therapy, what is the normal methemoglobin (metHb) level in a healthy subject?","opts":["< 1.5% of total Hb","< 5% of total Hb","5–10% of total Hb","> 10% of total Hb"],"key":0,"why":"Normal metHb is usually < 1.5% of total Hb. INO combines with hemoglobin to form nitrosylhemoglobin, which is rapidly oxidized to methemoglobin; excess metHb causes tissue hypoxia because it increases Hb affinity for oxygen.","src":[[1367,1371]],"origin":"heuer","age":"adult"},{"id":"C01-Q07","sec":"I-A","lvl27":"recall","topic":"Pulmonary function testing","stem":"In a patient with healthy lungs, the normal reference range for the diffusing capacity for carbon monoxide (DLCO) is:","opts":["25–30 mL/min/mm Hg","5–10 mL/min/mm Hg","40–60 mL/min/mm Hg","80–120 mL/min/mm Hg"],"key":0,"why":"Normal DLCO is 25–30 mL/min/mm Hg. It is low in pulmonary fibrosis and emphysema from thickening and destruction of the alveolar surface, and may be higher than normal in polycythemia.","src":[[1467,1471]],"origin":"heuer","age":"adult"},{"id":"C01-Q08","sec":"I-A","lvl27":"recall","topic":"Blood gas analysis","stem":"Using the basic classification of hypoxemia severity, a PaO₂ of 45 torr is categorized as:","opts":["Moderate hypoxemia","Mild hypoxemia","Severe hypoxemia","Normal"],"key":0,"why":"Mild hypoxemia is a PaO₂ of 60–79 torr, moderate is 40–59 torr, and severe is < 40 torr. A PaO₂ of 45 torr falls in the moderate range.","src":[[1309,1311]],"origin":"heuer","age":"adult"},{"id":"C01-Q09","sec":"I-A","lvl27":"recall","topic":"6-minute walk test","stem":"On a 6-minute walk test, what screening result indicates abnormal functional capacity?","opts":["6MWD < 500–600 meters","6MWD < 200 meters","6MWD > 600 meters","A pre-/post-treatment gain of ≥ 10–20%"],"key":0,"why":"A 6-minute walking distance below 500–600 meters indicates abnormal functional capacity and may require further evaluation. A pre-/post-treatment gain of ≥ 10–20% describes a treatment effect, not a screening threshold.","src":[[1489,1492]],"origin":"heuer","age":"adult"},{"id":"C01-Q10","sec":"I-A","lvl27":"recall","topic":"Pulmonary function testing","stem":"A PFT result reported at 58% of predicted represents what degree of impairment?","opts":["Moderate","Mild","Severe","Normal"],"key":0,"why":"The percent-predicted classification is: normal 80–120%, mild 70–79%, moderate 50–69%, and severe < 49%. 58% falls in the moderate range.","src":[[1458,1461]],"origin":"heuer","age":"adult"},{"id":"C01-Q11","sec":"I-A","lvl27":"recall","topic":"Pulmonary function testing","stem":"Post-bronchodilator testing shows an increase in flows of 14%. This result indicates:","opts":["Significant reversibility of airway obstruction","No significant response to the bronchodilator","A restrictive process rather than obstruction","An invalid test that requires repetition"],"key":0,"why":"An increase in flows of 12–15% or more after bronchodilator therapy suggests significant reversibility.","src":[[1463,1465]],"origin":"heuer","age":"adult"},{"id":"C01-Q12","sec":"I-A","lvl27":"recall","topic":"Laboratory results","stem":"An elevated serum lactate level (normal 0.4–2.3 mEq/L) is most consistent with:","opts":["Tissue hypoxia and shock","Renal failure","Liver disease or malnutrition","Metabolic alkalosis"],"key":0,"why":"Lactic acid is normally 0.4–2.3 mEq/L, and a high value signals tissue hypoxia and shock. Renal failure elevates BUN, and low total protein/albumin suggests liver disease or malnutrition.","src":[[1245,1245]],"origin":"heuer","age":"adult"},{"id":"C01-Q13","sec":"I-A","lvl27":"integ","topic":"Blood gas analysis","stem":"A patient breathing room air has pH 7.36, PaCO₂ 58 torr, PaO₂ 62 torr, HCO₃ 34 mEq/L, BE +7. This pattern is most consistent with:","opts":["Fully compensated respiratory acidosis with mild hypoxemia","Uncompensated respiratory alkalosis with moderate hypoxemia","Partially compensated metabolic acidosis with normal oxygenation","Combined respiratory and metabolic acidosis with severe hypoxemia"],"key":0,"why":"The pH is within 7.35–7.45 while the PaCO₂ and HCO₃ are both markedly elevated — full compensation. A PaO₂ of 62 torr on room air is mild hypoxemia. Table 1-5 lists this exact pattern for moderate to severe COPD with CO₂ retention.","src":[[1385,1396],[1287,1288]],"origin":"heuer","age":"adult"},{"id":"C01-Q14","sec":"I-A","lvl27":"integ","topic":"Blood gas analysis","stem":"A patient with uncontrolled diabetes has pH 7.32, PaCO₂ 28 torr, PaO₂ 108 torr on room air, HCO₃ 14 mEq/L, BE −10. The correct interpretation is:","opts":["Partially compensated metabolic acidosis with normal oxygenation","Fully compensated respiratory acidosis with normal oxygenation","Uncompensated metabolic acidosis with mild hypoxemia","Partially compensated respiratory alkalosis with normal oxygenation"],"key":0,"why":"The pH is low (acidemia) with a PaCO₂ of 28 torr, which is ≤ 45 torr, so the primary disturbance is metabolic acidosis. The low PaCO₂ and BE of −10 show respiratory compensation that has not returned the pH to normal, hence partial. The PaO₂ of 108 torr is not hypoxemic.","src":[[1292,1298],[1300,1302]],"origin":"heuer","age":"adult"},{"id":"C01-Q15","sec":"I-A","lvl27":"integ","topic":"Blood gas analysis","stem":"A patient on 2 L/min by cannula has pH 7.53, PaCO₂ 27 torr, PaO₂ 53 torr, HCO₃ 22 mEq/L. What is the most likely explanation?","opts":["Uncompensated respiratory alkalosis from hypoxemia-driven hyperventilation","Primary metabolic alkalosis from loop-diuretic use, with moderate hypoxemia","Fully compensated respiratory alkalosis from chronic hyperventilation","Laboratory error, because the pH and PaCO₂ are inconsistent"],"key":0,"why":"A high pH with a PaCO₂ below 35 torr is a respiratory alkalosis, and the normal HCO₃ of 22 mEq/L shows it is uncompensated. Table 1-5 attributes this pattern to hyperventilation driven by the moderate hypoxemia, as occurs in pneumonia, asthma, or pulmonary embolism.","src":[[1398,1410],[1296,1298],[1327,1327]],"origin":"heuer","age":"adult"},{"id":"C01-Q16","sec":"I-A","lvl27":"integ","topic":"Blood gas analysis","stem":"Using only pH and PaCO₂, a patient with pH 7.28 and PaCO₂ 33 torr has which primary acid-base disturbance?","opts":["Metabolic acidosis","Respiratory acidosis","Respiratory alkalosis","Metabolic alkalosis"],"key":0,"why":"With acidemia (pH < 7.35), a PaCO₂ of 45 torr or less points to metabolic acidosis; a PaCO₂ above 45 torr would indicate respiratory acidosis. Metabolic involvement is confirmed by a base excess below −2.","src":[[1292,1302]],"origin":"heuer","age":"adult"},{"id":"C01-Q17","sec":"I-A","lvl27":"integ","topic":"Prescribing provider's orders","stem":"A registered nurse tells you the physician has ordered a bronchodilator treatment for a patient. You should:","opts":["Verify that the order has been entered in the patient's record before proceeding","Administer the treatment at once, because the RN is a licensed professional","Ask the RN to sign the order on the physician's behalf, then proceed with it","Refuse all care for the patient until the physician arrives on the unit"],"key":0,"why":"Orders may not be accepted from unauthorized third parties such as registered nurses. If an order reaches you through a third party, you must verify it has been entered into the record before proceeding.","src":[[1029,1032]],"origin":"heuer","age":"adult"},{"id":"C01-Q18","sec":"I-A","lvl27":"integ","topic":"Prescribing provider's orders","stem":"Which order should you question as unacceptable?","opts":["\"Resume preoperative respiratory orders\"","\"Albuterol 2.5 mg in 3 mL normal saline via SVN q4h\"","\"O₂ at 2 L/min by nasal cannula, continuous\"","\"Volume control ventilation, VT 450 mL, rate 12, PEEP 5, FiO₂ 0.40\""],"key":0,"why":"Blanket orders such as \"continue previous medications\" or \"resume preoperative orders\" must not be accepted. The other three orders each specify the therapy and the requisite details.","src":[[1032,1033]],"origin":"heuer","age":"adult"},{"id":"C01-Q19","sec":"I-A","lvl27":"integ","topic":"Prescribing provider's orders","stem":"A properly dated, timed, and signed order reads: \"Bronchodilator therapy q6h.\" What is missing that makes this order incomplete?","opts":["The drug name, administration route, and dose/concentration","The frequency and total duration of the therapy ordered","The date and time when the order was written and signed","Nothing — the order is complete as it is written"],"key":0,"why":"An order for a drug — including oxygen — must contain the drug name, administration route, and dose or concentration. Frequency is present here. When an element is missing, contact the originator for clarification.","src":[[1095,1104]],"origin":"heuer","age":"adult"},{"id":"C01-Q20","sec":"I-A","lvl27":"integ","topic":"Prescribing provider's orders","stem":"You are authorized to accept a verbal order during an urgent situation. To complete the order correctly, you must document that:","opts":["You read the order back to the originator and the originator confirmed its accuracy","A second therapist witnessed you receive the order and then co-signed the chart","The order was entered into CPOE by the unit clerk within the next 24 hours","The charge nurse approved the order and countersigned it before treatment"],"key":0,"why":"For verbal or telephone orders, you must document that you read the order back to the originator and that the originator confirmed the accuracy of the order as read back. When the provider is in the house and the situation is not an emergency, obtain a written order or CPOE instead.","src":[[1034,1038]],"origin":"heuer","age":"adult"},{"id":"C01-Q21","sec":"I-A","lvl27":"integ","topic":"Advance directives","stem":"The daughter of a patient with a written DNR order tells you her mother now wants the order revoked. You should:","opts":["Immediately notify the attending physician, who must document the new request in the record","Honor the request at once and change the patient to full resuscitation status now","Explain to the daughter that a DNR order cannot be revoked once it has been written","Require the request to be submitted in writing by the daughter before acting"],"key":0,"why":"A patient or surrogate can change or revoke a DNR order at any time, in writing or orally. When asked to do so, you must immediately notify the attending physician, who is obliged to document the new request in the patient record.","src":[[1138,1145]],"origin":"heuer","age":"adult"},{"id":"C01-Q22","sec":"I-A","lvl27":"integ","topic":"Laboratory results","stem":"Before performing an arterial puncture, which set of laboratory values would most concern you?","opts":["INR 3.4, platelets 88,000/mm³","INR 1.0, platelets 250,000/mm³","WBC 13,000/mm³, hematocrit 46%","Sodium 138 mEq/L, potassium 4.2 mEq/L"],"key":0,"why":"A low platelet count or abnormally prolonged PT, INR, or PTT indicates potential for excessive bleeding during invasive procedures such as ABG sampling, thoracentesis, suctioning, or bronchoscopy. Normal INR is 0.8–1.2 and normal platelets are 150,000–400,000/mm³.","src":[[1167,1171],[1206,1208],[1213,1215]],"origin":"heuer","age":"adult"},{"id":"C01-Q23","sec":"I-A","lvl27":"integ","topic":"Laboratory results","stem":"A patient receiving frequent albuterol treatments develops premature ventricular contractions. Which laboratory value should you check first?","opts":["Serum potassium","Serum sodium","Blood urea nitrogen","Total protein"],"key":0,"why":"Low serum potassium may lead to dysrhythmias such as PVCs and may be associated with respiratory muscle weakness. Certain respiratory medications, albuterol among them, may lower serum potassium. Normal potassium is 3.5–5 mEq/L.","src":[[1163,1166],[1225,1229]],"origin":"heuer","age":"child"},{"id":"C01-Q24","sec":"I-A","lvl27":"integ","topic":"Laboratory results","stem":"A patient with long-standing COPD has an elevated red blood cell count. This finding most likely reflects:","opts":["Polycythemia secondary to chronic hypoxemia","Acute bacterial infection with a left shift","Recent hemorrhage with volume replacement","Hemodilution from intravenous fluid overload"],"key":0,"why":"Increased RBCs (polycythemia) may be associated with chronic hypoxemia; decreased levels are related to bleeding or anemia. An elevated WBC count with a left shift, not an elevated RBC count, suggests acute bacterial infection.","src":[[1160,1163]],"origin":"heuer","age":"adult"},{"id":"C01-Q25","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"An anteroposterior neck radiograph on a child shows a \"steeple sign.\" This finding is associated with:","opts":["Croup","Epiglottitis","Foreign-body aspiration","Right mainstem intubation"],"key":0,"why":"Tracheal edema and inflammation produce the steeple sign of croup on an AP film. Epiglottitis produces the thumb sign on a lateral neck x-ray.","src":[[1553,1555]],"origin":"heuer","age":"child"},{"id":"C01-Q26","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"A chest radiograph shows increased vascular markings, a cardiothoracic ratio greater than 50%, pleural effusions, and Kerley B lines. These findings are most consistent with:","opts":["Congestive heart failure","Emphysema","Pneumothorax","Acute respiratory distress syndrome"],"key":0,"why":"CHF produces increased vascular markings, cardiomegaly with a cardiothoracic ratio > 50%, and pleural effusions with Kerley B lines. ARDS shows nonhomogeneous bilateral opacities with a NORMAL heart size.","src":[[1571,1577]],"origin":"heuer","age":"adult"},{"id":"C01-Q27","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"A supine chest film shows loss of peripheral lung markings, a radiolucent space between the lung margin and chest wall, and deepening of the costophrenic angle. This is:","opts":["Pneumothorax (deep sulcus sign)","Pleural effusion layering posteriorly","Atelectasis of the lower lobe","Consolidation from pneumonia"],"key":0,"why":"Pneumothorax shows loss of peripheral lung markings, air between the lung margin and chest wall, possible mediastinal shift to the opposite side, and the deep sulcus sign on supine films. Atelectasis instead shifts the trachea and mediastinum TOWARD the affected side.","src":[[1594,1602]],"origin":"heuer","age":"adult"},{"id":"C01-Q28","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"During bedside thoracic ultrasound, absence of the gliding sign indicates:","opts":["Pneumothorax","Pleural effusion","Pulmonary edema","Normal pleural motion"],"key":0,"why":"The gliding sign is a normal shimmering of the parietal/visceral pleural line during breathing; its absence indicates pneumothorax. Proliferation of B lines (\"lung rockets\") indicates interstitial/alveolar syndrome such as pulmonary edema or pneumonia, and an echo-free dark zone in a dependent region indicates pleural effusion.","src":[[1521,1531]],"origin":"heuer","age":"adult"},{"id":"C01-Q29","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"A ventilation-perfusion scan shows multiple segmental perfusion defects without corresponding ventilation defects. This indicates:","opts":["High probability of pulmonary embolism","Lobar pneumonia of the lower lobes","Diffuse bullous emphysema","A normal, low-probability study"],"key":0,"why":"A high probability of pulmonary embolism is indicated when multiple segmental perfusion defects appear without matching ventilation defects. V/Q scans are being replaced by high-resolution CT angiography, now the gold standard for diagnosing PE.","src":[[1661,1665]],"origin":"heuer","age":"adult"},{"id":"C01-Q30","sec":"I-A","lvl27":"integ","topic":"Imaging studies","stem":"A mechanically ventilated patient must be transported for an MRI. The ventilator is labeled \"MR Conditional.\" You should:","opts":["Follow the maker's protocol, usually locking the device a safe distance from the magnet","Use the ventilator anywhere in the scanner room, because MR Conditional means fully safe","Refuse transport, because only devices labeled MR Safe may enter the MRI suite","Disconnect the patient and ventilate manually with a standard bag throughout the scan"],"key":0,"why":"Ventilator support during MRI requires an FDA-approved ventilator labeled either \"MR Safe\" or \"MR Conditional.\" If MR Conditional, you must follow the manufacturer's operational protocol, which usually includes at least locking the device a safe distance from the MRI magnet.","src":[[1513,1519]],"origin":"heuer","age":"adult"},{"id":"C02-Q01","sec":"I-B","lvl27":"recall","topic":"Level of consciousness","stem":"A Glasgow Coma Scale total score of 8 or less indicates:","opts":["Severe impairment (coma)","Mild impairment","Moderate impairment","A normal level of consciousness"],"key":0,"why":"GCS ranges from a low of 3 (deep coma) upward. Mild impairment is 13–15, moderate is 9–12, and severe impairment (coma) is a score of 8 or less.","src":[[2794,2796],[2788,2792]],"origin":"heuer","age":"adult"},{"id":"C02-Q02","sec":"I-B","lvl27":"recall","topic":"Level of consciousness","stem":"In the AVPU scale, the letter P signifies that the patient:","opts":["Responds to Pain","Is Pale on inspection","Has a Patent airway","Is in Position of comfort"],"key":0,"why":"AVPU stands for Alert; response to Verbal stimulus; response to Pain; Unresponsive. If the patient does not respond to verbal stimuli, firmly pinch the skin and note any response such as moaning or withdrawal.","src":[[2785,2786],[2817,2819]],"origin":"heuer","age":"adult"},{"id":"C02-Q03","sec":"I-B","lvl27":"recall","topic":"Sputum assessment","stem":"Sputum production above what daily volume indicates the need for airway clearance?","opts":["30 mL/day","5 mL/day","15 mL/day","100 mL/day"],"key":0,"why":"As a rule of thumb, sputum production greater than 30 mL/day indicates the need for airway clearance. Familiar measures are helpful when interviewing: a teaspoon is 5 mL, a tablespoon 15 mL, and a shot glass 1 oz or 30 mL.","src":[[2952,2955],[4287,4287]],"origin":"heuer","age":"adult"},{"id":"C02-Q04","sec":"I-B","lvl27":"recall","topic":"Neonatal assessment","stem":"An Apgar score is assigned at which intervals after birth?","opts":["1 and 5 minutes","Immediately and at 10 minutes","5 and 10 minutes","30 seconds and 3 minutes"],"key":0,"why":"The Apgar score is used to assess neonates at 1 and 5 minutes after birth. Its five dimensions — Appearance, Pulse, Grimace, Activity, Respirations — are each rated 0 to 2 for a maximum of 10.","src":[[2514,2519],[3514,3519]],"origin":"heuer","age":"child"},{"id":"C02-Q05","sec":"I-B","lvl27":"recall","topic":"Neonatal assessment","stem":"Normal gestation lasts how many weeks?","opts":["38–42 weeks","34–38 weeks","40–44 weeks","36–40 weeks"],"key":0,"why":"Normal gestation lasts 38–42 weeks. An infant born at full term typically scores in the 35–45 range on the Ballard assessment, while a composite score of 10 or less indicates significant prematurity at 28 weeks or less.","src":[[3523,3524],[3590,3594]],"origin":"heuer","age":"child"},{"id":"C02-Q06","sec":"I-B","lvl27":"recall","topic":"Airway assessment","stem":"A neck circumference above which value in men is associated with obstructive sleep apnea and difficult intubation?","opts":["43 cm (17 in.)","37 cm (15 in.)","35 cm (14 in.)","50 cm (20 in.)"],"key":0,"why":"A neck circumference greater than 43 cm (17 in.) in men, or greater than 37 cm (15 in.) in women, is associated with obstructive sleep apnea, difficult endotracheal intubation, and difficult tracheostomy tube fit.","src":[[3304,3306],[3438,3440]],"origin":"heuer","age":"adult"},{"id":"C02-Q07","sec":"I-B","lvl27":"recall","topic":"Percussion","stem":"The normal range of diaphragm motion measured by percussion in adults is:","opts":["5–7 cm","1–2 cm","8–10 cm","10–12 cm"],"key":0,"why":"The difference between maximum inspiratory and expiratory levels represents the full range of diaphragm motion, which in adults ranges from 5 to 7 cm. Motion is decreased in neuromuscular disorders and severe hyperinflation.","src":[[3849,3855]],"origin":"heuer","dropped":"Diagnostic chest percussion (2020 I-B.4) is not on the 2027 outline","age":"adult"},{"id":"C02-Q08","sec":"I-B","lvl27":"recall","topic":"Chest radiograph","stem":"On a chest radiograph, the tip of an endotracheal tube should ideally be positioned:","opts":["4–6 cm above the carina, between T2 and T4","At the level of the carina","1–2 cm above the carina, at T6","Below the carina in the right mainstem bronchus"],"key":0,"why":"An AP chest x-ray is the most common method used to confirm ET or tracheostomy tube placement. The tip should sit 4–6 cm above the carina, corresponding to a location between thoracic vertebrae T2 and T4, about the level of the superior border of the aortic arch.","src":[[4149,4154],[4221,4221]],"origin":"heuer","age":"adult"},{"id":"C02-Q09","sec":"I-B","lvl27":"recall","topic":"Breath sounds","stem":"Which breath sound is normally heard only over the trachea?","opts":["Bronchial","Vesicular","Bronchovesicular","Stridor"],"key":0,"why":"Bronchial sounds are high-pitched, loud, and tubular with an expiratory phase equal to or longer than the inspiratory phase, and are normal only over the trachea. Vesicular sounds are normal at the lung periphery; bronchovesicular sounds are normal around the upper sternum and between the scapulae.","src":[[3876,3887]],"origin":"heuer","age":"adult"},{"id":"C02-Q10","sec":"I-B","lvl27":"integ","topic":"Level of consciousness","stem":"A patient's Glasgow Coma Scale is recorded as \"E3, V2, M2.\" This patient's total score and degree of impairment are:","opts":["7 — severe impairment","5 — severe impairment","7 — moderate impairment","9 — moderate impairment"],"key":0,"why":"The three component scores are summed: 3 + 2 + 2 = 7. Because a total of 8 or less indicates coma, this represents severe impairment.","src":[[2798,2801],[2794,2796]],"origin":"heuer","age":"adult"},{"id":"C02-Q11","sec":"I-B","lvl27":"integ","topic":"Pain assessment","stem":"A patient rates the degree to which pain interferes with daily activities as 6 out of 10. You should:","opts":["Report this finding to the patient's physician","Document it and reassess in 24 hours","Take no action, because a rating below 8 is acceptable","Repeat the assessment using the Borg Scale"],"key":0,"why":"After determining severity, assess how much the pain interferes with daily activities on a 10-point scale. Whenever the interference rating is greater than 4, report the finding to the patient's physician.","src":[[2847,2851],[4281,4281]],"origin":"heuer","age":"adult"},{"id":"C02-Q12","sec":"I-B","lvl27":"integ","topic":"Dyspnea assessment","stem":"Which scale should you use to quantify a patient's shortness of breath at the end of a 6-minute walk?","opts":["The Borg Scale","The Glasgow Coma Scale","The AVPU scale","The Apgar score"],"key":0,"why":"The Borg Scale is the most common method used to quantify shortness of breath or dyspnea. It runs 0 to 10 and is always applied in association with a predefined level of activity, such as an exercise test level or the end of a 6-minute walk.","src":[[2862,2870],[4282,4284]],"origin":"heuer","age":"adult"},{"id":"C02-Q13","sec":"I-B","lvl27":"integ","topic":"Work of breathing","stem":"Which combination of findings always indicates an increased work of breathing?","opts":["Tachypnea, thoracic–abdominal dyssynchrony, and accessory muscle use","Bradycardia, digital clubbing, and pursed-lip breathing at rest","Diaphoresis, fever, and a cough productive of purulent sputum","Pedal edema, jugular venous distention, and an S3 heart sound"],"key":0,"why":"In combination with shortness of breath, tachypnea, thoracic–abdominal dyssynchrony or paradox (\"seesaw\" motion), and use of accessory muscles of respiration indicate an abnormally high work of breathing.","src":[[2871,2877],[4285,4286]],"origin":"heuer","age":"adult"},{"id":"C02-Q14","sec":"I-B","lvl27":"integ","topic":"Inspection","stem":"A patient with diabetic ketoacidosis would most likely demonstrate which breathing pattern?","opts":["Kussmaul breathing — deep and fast","Biot breathing — irregular with periods of apnea","Cheyne-Stokes breathing — waxing and waning","Prolonged inspiration"],"key":0,"why":"Kussmaul breathing, which is deep and fast, is associated with diabetic ketoacidosis. Biot breathing points to increased intracranial pressure, and Cheyne-Stokes breathing to CNS disease or severe CHF.","src":[[3248,3254]],"origin":"heuer","age":"adult"},{"id":"C02-Q15","sec":"I-B","lvl27":"integ","topic":"Inspection","stem":"A patient's chest radiograph and exam show a barrel chest with prolonged exhalation. These findings suggest:","opts":["COPD with expiratory airway obstruction","Upper airway obstruction such as croup","Loss of lung volume from atelectasis","Restrictive disease from kyphoscoliosis"],"key":0,"why":"Prolonged exhalation indicates expiratory obstruction as in asthma or COPD, and a barrel chest configuration is associated with COPD. Prolonged INSPIRATION instead suggests upper airway obstruction such as croup or epiglottitis.","src":[[3239,3243],[3310,3312]],"origin":"heuer","age":"adult"},{"id":"C02-Q16","sec":"I-B","lvl27":"integ","topic":"Cyanosis","stem":"Central cyanosis with a normal hemoglobin content generally first appears when the SaO₂ drops below:","opts":["80% (PaO₂ 45–50 torr)","90% (PaO₂ about 60 torr)","70% (PaO₂ about 35 torr)","95% (PaO₂ about 80 torr)"],"key":0,"why":"With normal Hb content, central cyanosis generally first appears when SaO₂ drops below 80%, corresponding to a PaO₂ of 45–50 torr. It appears as a bluish tint of the mucous membranes of the lips and mouth.","src":[[3343,3348]],"origin":"heuer","age":"adult"},{"id":"C02-Q17","sec":"I-B","lvl27":"integ","topic":"Cyanosis","stem":"Why can a patient with anemia be severely hypoxic before any cyanosis appears?","opts":["The intensity of cyanosis increases with the amount of hemoglobin","Anemia raises the SaO₂ above the threshold at which cyanosis appears","Anemic patients have increased peripheral perfusion, which hides cyanosis","Cyanosis depends only on cardiac output, not on the hemoglobin level"],"key":0,"why":"Regardless of type, the intensity of cyanosis increases with the amount of Hb in the blood. Patients with polycythemia can therefore look cyanotic yet still have adequate O₂ content, while anemic patients can be severely hypoxic before cyanosis ever appears.","src":[[3355,3358]],"origin":"heuer","age":"adult"},{"id":"C02-Q18","sec":"I-B","lvl27":"integ","topic":"Airway assessment","stem":"A Mallampati Class IV airway means that on examination:","opts":["Only the hard palate is visible","The tonsils, uvula, and soft palate are fully visible","The hard and soft palate and upper tonsils are visible","The soft and hard palate and base of the uvula are visible"],"key":0,"why":"Mallampati Class IV means only the hard palate is visible, and it is associated with difficult intubation as well as a high incidence of sleep apnea. Class I is full visibility of tonsils, uvula, and soft palate.","src":[[3425,3436]],"origin":"heuer","age":"adult"},{"id":"C02-Q19","sec":"I-B","lvl27":"integ","topic":"Sputum assessment","stem":"A patient expectorates pink, watery, frothy secretions. This finding suggests:","opts":["Pulmonary edema","Aspiration pneumonia","Tuberculosis","Asthma"],"key":0,"why":"Bloody sputum that is pink, watery, and frothy suggests pulmonary edema. Red bloody sputum points to tuberculosis, lung cancer, or pulmonary infarction; yellow-to-green purulent sputum suggests aspiration pneumonia, bronchiectasis, or lung abscess.","src":[[3547,3550],[4300,4300]],"origin":"heuer","age":"adult"},{"id":"C02-Q20","sec":"I-B","lvl27":"integ","topic":"Neonatal assessment","stem":"A newborn has an Apgar score of 3 at 1 minute. The appropriate action is to:","opts":["Begin resuscitation","Provide routine newborn care","Observe and repeat the score at 5 minutes","Administer supplemental O₂ only"],"key":0,"why":"An Apgar of 7–10 is normal, 4–6 typically needs more intensive support, and 0–3 usually undergoes resuscitation. Needed interventions should never be delayed in order to obtain the Apgar score.","src":[[3517,3519],[4301,4302]],"origin":"heuer","age":"child"},{"id":"C02-Q21","sec":"I-B","lvl27":"integ","topic":"Fetal maturity","stem":"Amniotic fluid analysis shows a lecithin/sphingomyelin (L/S) ratio of 2.4 and the presence of phosphatidylglycerol. This indicates:","opts":["Fetal lung maturity","Fetal lung immaturity with high risk of IRDS","An unreliable result requiring repeat testing","Post-term gestation"],"key":0,"why":"Fetal maturity is indicated by an L/S ratio greater than 2, the presence of phosphatidylglycerol (PG), or an L/A ratio greater than 40.0 mg/g. These measurements are used primarily to indicate fetal lung maturity and predict infant respiratory distress syndrome.","src":[[3575,3586],[4303,4304]],"origin":"heuer","age":"adult"},{"id":"C02-Q22","sec":"I-B","lvl27":"integ","topic":"Transillumination","stem":"During transillumination of an infant's chest, the underlying chest broadly \"lights up\" in an irregular fashion. This indicates:","opts":["A likely pneumothorax","A normal finding","Pulmonary edema","Consolidated lung tissue"],"key":0,"why":"Normally a halo of only about 1 cm forms under the light. If the underlying chest broadly lights up in an irregular fashion, a pneumothorax is likely. If the test is negative but signs persist, recommend an immediate chest x-ray.","src":[[3603,3607]],"origin":"heuer","age":"child"},{"id":"C02-Q23","sec":"I-B","lvl27":"integ","topic":"Palpation","stem":"A second clinician measures the apical rate as 96/min while you palpate a radial rate of 78/min. This pulse deficit most likely indicates:","opts":["A cardiac arrhythmia such as atrial fibrillation, PVCs, or heart block","Severe hypovolemia with a weak, thready peripheral pulse in the arm","An error that requires remeasurement of the pulse in the other arm","Normal sinus arrhythmia that varies with the breathing cycle"],"key":0,"why":"If the apical rate exceeds the peripheral rate, a pulse deficit exists. A pulse deficit usually indicates a cardiac arrhythmia such as atrial fibrillation or flutter, premature ventricular contractions, or heart block.","src":[[3627,3633],[4305,4306]],"origin":"heuer","age":"adult"},{"id":"C02-Q24","sec":"I-B","lvl27":"integ","topic":"Palpation","stem":"A pulse that weakens during inspiration (pulsus paradoxus) is associated with:","opts":["Severe airway obstruction such as status asthmaticus, or tamponade","Left-sided heart failure with alternating strong and weak beats","Aortic insufficiency or a patent ductus arteriosus","Septic shock with loss of vascular tone and low diastolic pressure"],"key":0,"why":"Pulsus paradoxus is a variation in pulsations with the breathing cycle, with weaker pulses during inspiration, caused by severe airway obstruction such as status asthmaticus or by cardiac tamponade. Pulsus alternans, where the pulse alternates in strength beat to beat, points to left-sided heart failure.","src":[[3727,3730],[4307,4308]],"origin":"heuer","age":"adult"},{"id":"C02-Q25","sec":"I-B","lvl27":"integ","topic":"Palpation","stem":"You detect crepitus over the neck and chest of a mechanically ventilated patient. You should:","opts":["Assess for pneumothorax, notify the physician, and recommend a chest x-ray","Document the finding as a harmless, expected change after intubation","Increase the PEEP to compress the tissue and re-expand the lung","Apply firm pressure over the area to disperse the subcutaneous gas"],"key":0,"why":"Gas leaking into tissues forms subcutaneous emphysema, which produces crepitus on palpation. Although subcutaneous emphysema itself is harmless, it often occurs with a pneumothorax, so assess for pneumothorax, communicate the finding immediately, and recommend a chest x-ray in ventilated patients.","src":[[3802,3809]],"origin":"heuer","age":"adult"},{"id":"C02-Q26","sec":"I-B","lvl27":"integ","topic":"Percussion","stem":"Percussion over a patient's right chest produces a hollow, loud, low-pitched note. This increased resonance indicates:","opts":["Hyperinflation such as acute asthma or COPD, or a pneumothorax","Pneumonia, atelectasis, or a tumor in the right middle lobe","Fluid in the pleural space, such as a large pleural effusion","Normal air-filled lung tissue over the right chest"],"key":0,"why":"A hollow, loud, low-pitched note is increased resonance (tympanic or hyperresonant), typically indicating hyperinflation from acute asthma or COPD, or a pneumothorax. A dull or flat note occurs over increased tissue density as in pneumonia, atelectasis, or tumor.","src":[[3839,3847]],"origin":"heuer","dropped":"Diagnostic chest percussion (2020 I-B.4) is not on the 2027 outline","age":"adult"},{"id":"C02-Q27","sec":"I-B","lvl27":"integ","topic":"Chest radiograph","stem":"Using the R-I-P-E mnemonic, adequate inspiration on a PA chest film is confirmed when the diaphragm is at the level of:","opts":["The 10th posterior rib, or the 6th anterior rib on the right","The 6th posterior rib, or the 4th anterior rib on the right","The 3rd rib, where the clavicle normally lies","The 8th anterior rib, or the 12th posterior rib"],"key":0,"why":"Inspiration is adequate if the diaphragm is at the level of the 10th posterior rib — 8th to 9th posterior ribs on AP films — or the 6th anterior rib on the right. In the AP view, the clavicle should be at about the level of the third rib, which checks angulation, not inspiration.","src":[[4053,4075]],"origin":"heuer","age":"adult"},{"id":"C02-Q28","sec":"I-B","lvl27":"integ","topic":"Integrating findings","stem":"A patient has a tracheal shift to the LEFT, absent breath sounds on the right, and hyperresonance to percussion on the right. The most likely problem is:","opts":["Right-sided pneumothorax","Right lower lobe atelectasis","Right-sided pleural effusion with fluid","Right lower lobe pneumonia"],"key":0,"why":"The trachea shifts TOWARD areas of collapse such as atelectasis and AWAY from space-occupying lesions such as pneumothoraces and large pleural effusions. A shift away from the right, with absent breath sounds and increased resonance on the right, identifies a right pneumothorax. A pleural effusion would produce decreased, not increased, resonance.","src":[[3764,3772],[3839,3847],[4309,4310]],"origin":"heuer","age":"adult"},{"id":"C02-Q29","sec":"I-B","lvl27":"integ","topic":"Integrating findings","stem":"A bedridden older patient has an S3 gallop, pedal edema pitting to mid-calf, jugular venous distention, and bilateral basilar crackles. These findings together point to:","opts":["Congestive heart failure","Acute asthma exacerbation","Tension pneumothorax","Pulmonary fibrosis"],"key":0,"why":"An S3 heard in an older patient usually indicates CHF. Distended jugular veins reflect right heart failure, and gravity-dependent pitting edema is typical of chronic heart failure — the farther up the legs the edema extends, the more severe the failure.","src":[[3921,3924],[3301,3302],[3810,3814]],"origin":"heuer","age":"adult"},{"id":"C02-Q30","sec":"I-B","lvl27":"integ","topic":"Integrating findings","stem":"A child presents with a barking cough and stridor. The AP chest film shows a steeple sign, and the lateral neck film appears normal. This is most consistent with:","opts":["Croup","Epiglottitis","Foreign-body aspiration","Bronchiolitis"],"key":0,"why":"In croup, the AP chest film shows the steeple sign from subglottic edema while the lateral neck film may appear normal because there is little supraglottic involvement. In epiglottitis the pattern reverses: the chest film usually appears normal and the lateral neck film shows the thumb sign from a swollen epiglottis. A barking cough is associated with croup and epiglottitis.","src":[[4253,4268],[3464,3464]],"origin":"heuer","age":"child"},{"id":"C03-Q01","sec":"I-C","lvl27":"recall","topic":"12-lead ECG","stem":"How many electrodes are actually placed on the patient to obtain a 12-lead ECG?","opts":["10","12","6","4"],"key":0,"why":"There are only 10 actual leads to place, not 12. The right leg does not count as a recording lead because it is a ground. The difference is made up by the three augmented limb leads (aVR, aVL, aVF), which derive their data from the RA, LA, and LL electrodes.","src":[[4417,4421]],"origin":"heuer","age":"adult"},{"id":"C03-Q02","sec":"I-C","lvl27":"recall","topic":"12-lead ECG","stem":"Chest lead V4 is placed at which location?","opts":["Fifth intercostal space, midclavicular line","Fourth intercostal space, right sternal border","Fifth intercostal space, midaxillary line","Fourth intercostal space, left sternal border"],"key":0,"why":"V4 goes at the fifth intercostal space, midclavicular line. V1 is the fourth intercostal space at the right sternal border, V2 the fourth intercostal space at the left sternal border, V5 the fifth intercostal space at the anterior axillary line, and V6 the fifth intercostal space at the midaxillary line.","src":[[4429,4435]],"origin":"heuer","age":"adult"},{"id":"C03-Q03","sec":"I-C","lvl27":"recall","topic":"Pulse oximetry","stem":"Low SpO₂ alarm limits are typically set at what range for adults?","opts":["90–94%","85–88%","95–98%","80–85%"],"key":0,"why":"For continuous monitoring, set the low alarm according to institutional protocol, typically 90–94% for adults and 85–88% for infants.","src":[[4496,4497]],"origin":"heuer","age":"adult"},{"id":"C03-Q04","sec":"I-C","lvl27":"recall","topic":"Capnography","stem":"PetCO₂ typically runs how much lower than the PaCO₂ in a patient without significant deadspace?","opts":["1–5 torr","10–15 torr","20 torr","They are normally identical"],"key":0,"why":"Compare the monitored PetCO₂ with the patient's current arterial PCO₂. PetCO₂ typically runs 1–5 torr less than the PaCO₂, and the gap widens with high deadspace ventilation.","src":[[4526,4528]],"origin":"heuer","age":"adult"},{"id":"C03-Q05","sec":"I-C","lvl27":"recall","topic":"Transcutaneous monitoring","stem":"The transcutaneous sensor temperature is usually set to what value when monitoring both PtcO₂ and PtcCO₂?","opts":["44°C","37°C","40°C","42°C"],"key":0,"why":"Ensure proper temperature setting — usually 44°C when monitoring PtcO₂ and PtcCO₂, with temperatures as low as 37°C adequate if monitoring only PtcCO₂.","src":[[4558,4559]],"origin":"heuer","age":"adult"},{"id":"C03-Q06","sec":"I-C","lvl27":"recall","topic":"Blood gas sampling","stem":"The preferred site for arterial puncture is the radial artery in part because:","opts":["The ulnar artery provides collateral circulation","It is the largest accessible artery","It requires no assessment of collateral flow","It lies directly adjacent to a large vein"],"key":0,"why":"The radial artery is preferred because it is located near the skin surface and not close to any large veins, and because the ulnar artery provides collateral circulation. Brachial, femoral, and dorsalis pedis sites carry greater risk.","src":[[4752,4756]],"origin":"heuer","age":"adult"},{"id":"C03-Q07","sec":"I-C","lvl27":"recall","topic":"Plateau pressure","stem":"To reduce the likelihood of ventilator-induced lung injury, plateau pressure should generally be kept below:","opts":["30 cm H₂O","40 cm H₂O","20 cm H₂O","50 cm H₂O"],"key":0,"why":"In general, plateau pressures should be kept below 30 cm H₂O during mechanical ventilation to reduce the likelihood of ventilator-induced lung injury. Pplat is measured with an inspiratory pause using a square flow pattern during volume-targeted ventilation.","src":[[5270,5278]],"origin":"heuer","age":"adult"},{"id":"C03-Q08","sec":"I-C","lvl27":"recall","topic":"Cuff management","stem":"Tracheal cuff pressures above what range can obstruct tissue blood flow and cause ulceration and necrosis?","opts":["25–30 cm H₂O","15–20 cm H₂O","35–40 cm H₂O","10–15 cm H₂O"],"key":0,"why":"Cuff pressures over 25–30 cm H₂O can obstruct tissue blood flow (ischemia), causing ulceration and necrosis. If pressures are too low, leakage-type aspiration can occur, which may lead to ventilator-associated pneumonia.","src":[[5593,5599]],"origin":"heuer","age":"adult"},{"id":"C03-Q09","sec":"I-C","lvl27":"recall","topic":"Apnea monitoring","stem":"On a neonatal apnea monitor, the apnea time alarm limit is typically set at:","opts":["15–20 seconds","5–10 seconds","30–45 seconds","60 seconds"],"key":0,"why":"Set the apnea time alarm limit at typically 15–20 seconds. Low/high heart rate alarm limits are typically 80–210 for neonates, with lower limits for older babies.","src":[[5422,5424]],"origin":"heuer","age":"child"},{"id":"C03-Q10","sec":"I-C","lvl27":"recall","topic":"Apnea test","stem":"The apnea test for brain death assesses whether breathing is stimulated by a PaCO₂ of at least:","opts":["60 torr","45 torr","50 torr","70 torr"],"key":0,"why":"The apnea test is one of three major components of the neurologic evaluation for brain death. It assesses whether high levels of blood/brain CO₂ — a PaCO₂ of 60 torr or more — stimulate breathing.","src":[[5447,5450]],"origin":"heuer","age":"adult"},{"id":"C03-Q11","sec":"I-C","lvl27":"recall","topic":"Exercise testing","stem":"One metabolic equivalent of task (MET) equals:","opts":["3.5 mL O₂ consumption/kg of body weight","1.0 mL O₂ consumption/kg of body weight","10 mL O₂ consumption/kg of body weight","3.5 L O₂ consumption/min"],"key":0,"why":"The standard work unit for exercise testing is the MET: 1 MET equals 3.5 mL O₂ consumption per kg of body weight, about equal to normal resting O₂ consumption per minute. Most protocols increase intensity by 1–2 METs at each step-up.","src":[[5743,5747]],"origin":"heuer","dropped":"Cardiopulmonary stress testing is not on the 2027 outline","age":"adult"},{"id":"C03-Q12","sec":"I-C","lvl27":"recall","topic":"6-minute walk test","stem":"The ATS standardized 6-minute walk test requires a walking course of what length?","opts":["30 meters, marked in 3-meter increments","100 meters, marked in 10-meter increments","50 meters, marked in 5-meter increments","6 meters, marked in 1-meter increments"],"key":0,"why":"The ATS protocol specifies a walking course 30 meters in length with a clear starting line and turnaround point, and the distance marked in 3-meter increments. Equipment needed is a stopwatch, a movable chair, and a recording worksheet.","src":[[5844,5849]],"origin":"heuer","age":"adult"},{"id":"C03-Q13","sec":"I-C","lvl27":"integ","topic":"12-lead ECG","stem":"You cannot obtain an ECG signal. The most likely cause is:","opts":["A loose, missing, or defective lead, or hair blocking skin contact","An improperly set paper speed or gain on the bedside monitor","A hypotensive patient with very poor peripheral perfusion","An expired calibration certificate on the ECG machine"],"key":0,"why":"Failure to obtain a signal usually is due to a loose, missing, or defective lead or the patient's hair preventing the lead from making proper skin contact. A noisy signal instead comes from a poor electrical connection, motion artifact, or improper filtering.","src":[[4422,4427]],"origin":"heuer","age":"adult"},{"id":"C03-Q14","sec":"I-C","lvl27":"integ","topic":"Pulse oximetry","stem":"An SpO₂ probe placed on a finger reads erratically. Which action addresses a common source of error?","opts":["Remove nail polish and clean the site with an alcohol prep pad","Tighten the probe firmly to improve contact","Warm the site to 44°C before reading","Switch to the largest available probe regardless of patient size"],"key":0,"why":"When selecting a site, check for adequate perfusion, remove any nail polish if applied on a finger, and clean the site with an alcohol prep pad. Note that overly tight probes may cause venous pooling with inaccurate readings or skin damage, so tightening is wrong.","src":[[4469,4484]],"origin":"heuer","age":"adult"},{"id":"C03-Q15","sec":"I-C","lvl27":"integ","topic":"Transcutaneous monitoring","stem":"Transcutaneous blood gas monitoring is a poor choice in which situation?","opts":["An emergency, since setup and stabilization take 5–20 minutes","Noninvasive ventilation, where capnography is difficult to use","Continuous assessment of ventilation in a child in the ICU","A neonate requiring trend monitoring of the PtcCO₂"],"key":0,"why":"Lengthy setup and stabilization time of 5–20 minutes makes transcutaneous monitoring a poor choice in emergencies. It should also be avoided with poor skin integrity, adhesive allergy, shock, or poor peripheral circulation. It is useful during noninvasive or high-frequency ventilation when capnography is not available.","src":[[4543,4552]],"origin":"heuer","age":"adult"},{"id":"C03-Q16","sec":"I-C","lvl27":"integ","topic":"Transcutaneous monitoring","stem":"To avoid burns and skin damage during transcutaneous monitoring, the sensor site should be changed:","opts":["Every 2–6 hours","Every 12 hours","Every 24 hours","Only if erythema appears"],"key":0,"why":"Change the sensor site frequently — every 2–6 hours — depending on the sensor temperature, infant size, and manufacturer's recommendation.","src":[[4571,4573]],"origin":"heuer","age":"adult"},{"id":"C03-Q17","sec":"I-C","lvl27":"integ","topic":"Peak flow","stem":"During peak flow measurement, how many acceptable efforts are required and which value is recorded?","opts":["Repeat until three values vary by less than 10%; record the highest","Obtain three values and record the average of the three efforts","Obtain two values and record the lower of the two efforts","Obtain one maximal effort only and record it"],"key":0,"why":"The measurement should be repeated until three values are obtained that vary by less than 10%, and the highest of the three is recorded. The patient inhales fully to TLC and exhales in a sharp burst with maximum force; complete exhalation is not needed.","src":[[4605,4612]],"origin":"heuer","age":"adult"},{"id":"C03-Q18","sec":"I-C","lvl27":"integ","topic":"Peak flow","stem":"A peak flow is reported as 6 L/sec. Expressed in L/min this is:","opts":["360 L/min","60 L/min","600 L/min","100 L/min"],"key":0,"why":"To convert L/sec to L/min, multiply by 60; to convert L/min to L/sec, divide by 60. Thus 6 L/sec × 60 = 360 L/min.","src":[[4592,4595]],"origin":"heuer","age":"adult"},{"id":"C03-Q19","sec":"I-C","lvl27":"integ","topic":"Spontaneous ventilation mechanics","stem":"A patient breathes at 38/min with a minute ventilation of 11.4 L/min. What is the rapid shallow breathing index?","opts":["127","38","300","11.4"],"key":0,"why":"First compute tidal volume: VT = minute ventilation ÷ frequency = 11.4 L ÷ 38 = 0.3 L. RSBI = f ÷ VT in liters = 38 ÷ 0.3 = approximately 127.","src":[[4636,4657]],"origin":"heuer","age":"adult"},{"id":"C03-Q20","sec":"I-C","lvl27":"integ","topic":"Spontaneous ventilation mechanics","stem":"Unless otherwise indicated, deadspace should be assumed to be approximately:","opts":["1 mL per pound of predicted body weight","1 mL per kilogram of predicted body weight","2 mL per pound of actual body weight","150 mL regardless of size"],"key":0,"why":"Unless otherwise indicated, assume a deadspace of approximately 1 mL per pound of predicted body weight. Roughly 30% deadspace ventilation is considered normal.","src":[[4687,4689],[4697,4702]],"origin":"heuer","age":"adult"},{"id":"C03-Q21","sec":"I-C","lvl27":"integ","topic":"Spontaneous ventilation mechanics","stem":"Maximum inspiratory pressure (MIP/NIF) is measured with a manometer and a one-way valve that allows:","opts":["Exhalation but not inspiration, so the patient \"bucks down\" toward residual volume","Inspiration but not exhalation, so the patient inflates toward total lung capacity","Both inspiration and exhalation for a full minute","Neither, because the airway is fully occluded"],"key":0,"why":"MIP is measured using a manometer attached to a one-way valve configured to allow exhalation but not inspiration. The patient bucks down toward residual volume on each successive breath, at which point a maximum effort is ensured — so the patient need not be conscious.","src":[[4715,4721]],"origin":"heuer","age":"adult"},{"id":"C03-Q22","sec":"I-C","lvl27":"integ","topic":"Blood gas sampling","stem":"A modified Allen's test on the right wrist shows no flushing after 15 seconds. You should:","opts":["Assess the other wrist; if both lack collateral circulation, use the brachial artery","Proceed with the right radial puncture, using a smaller-gauge needle instead","Proceed immediately to a femoral puncture on the same side of the body","Cancel the ABG and request a venous blood sample instead"],"key":0,"why":"If collateral circulation is not present on the initial side, assess the other wrist. If both sides lack collateral circulation, use the brachial artery. On a normal test the palmar surface flushes within 5–10 seconds.","src":[[4763,4767],[4739,4744]],"origin":"heuer","age":"adult"},{"id":"C03-Q23","sec":"I-C","lvl27":"integ","topic":"Blood gas sampling","stem":"When drawing an ABG from an arterial line using a three-way stopcock, how much waste blood should be aspirated?","opts":["5–6 mL, at least 6 times the \"dead\" volume","1 mL","10–12 mL","None; discard is unnecessary with a closed system"],"key":0,"why":"With three-way stopcock sampling, attach a waste syringe, turn the stopcock off to the flush solution, and aspirate 5–6 mL of blood — at least 6 times the \"dead\" volume — before collecting the sample in a heparinized syringe.","src":[[4831,4853]],"origin":"heuer","age":"adult"},{"id":"C03-Q24","sec":"I-C","lvl27":"integ","topic":"Blood gas sampling","stem":"A mixed venous sample drawn from a pulmonary artery catheter must be aspirated slowly from the distal port with the balloon deflated because:","opts":["Rapid aspiration adds arterialized blood and falsely raises O₂ levels","Rapid aspiration causes hemolysis of red cells and raises the potassium","Slow aspiration prevents migration of the catheter tip into a wedge","The balloon must stay inflated to obtain a wedge sample from the PA"],"key":0,"why":"To avoid contamination with arterialized blood and falsely high O₂ levels, the sample must be drawn slowly from the catheter's distal port with the balloon deflated. Attention must also be paid to the IV infusion rate to prevent sample dilution.","src":[[4869,4873]],"origin":"heuer","age":"adult"},{"id":"C03-Q25","sec":"I-C","lvl27":"integ","topic":"Capillary sampling","stem":"Capillary blood gas sampling is contraindicated in which situation?","opts":["When accurate oxygenation data are needed, or in neonates < 24 hours old","Whenever arterial access is unavailable in an infant or a toddler","In any infant under 1 year of age, regardless of the indication for it","When only the acid–base status and ventilation need to be assessed"],"key":0,"why":"CBG sampling is used in infants and toddlers when arterial access is not available but ventilation and acid-base status must be assessed. It is contraindicated when accurate analysis of oxygenation is needed and in neonates less than 24 hours old.","src":[[4879,4883]],"origin":"heuer","age":"adult"},{"id":"C03-Q26","sec":"I-C","lvl27":"integ","topic":"Capillary sampling","stem":"When performing a heel stick for a capillary blood gas, you should:","opts":["Warm the site 3–5 minutes to no higher than 42–45°C; puncture laterally","Warm the site to 50°C; puncture the posterior curvature of the heel","Squeeze the heel firmly and repeatedly to encourage blood flow","Collect the first drop of blood that appears for the analysis"],"key":0,"why":"Warm the site for 3–5 minutes to no higher than 42–45°C. For heel sticks, avoid the posterior curvature and puncture the lateral side only. Wipe away the FIRST drop, collect from the middle of the blood drop, and do not squeeze the site.","src":[[4886,4896]],"origin":"heuer","age":"adult"},{"id":"C03-Q27","sec":"I-C","lvl27":"integ","topic":"Blood gas analysis","stem":"An ABG sample cannot be analyzed for more than 30 minutes. It should be:","opts":["Placed in a glass syringe chilled to 0–4°C","Left at room temperature in the plastic syringe","Frozen until analysis","Discarded and redrawn only after 2 hours"],"key":0,"why":"A sample in a plastic syringe at room temperature must be analyzed in under 30 minutes. If it will be kept longer than 30 minutes, it should be in a glass syringe chilled to 0–4°C. Shunt-study samples must be run in under 5 minutes, and samples from patients with elevated leukocyte or platelet counts immediately.","src":[[4925,4930]],"origin":"heuer","age":"adult"},{"id":"C03-Q28","sec":"I-C","lvl27":"integ","topic":"Hemodynamic monitoring","stem":"For accurate CVP and pulmonary artery pressure measurement, the transducer must be leveled at the phlebostatic axis, which is the intersection of:","opts":["The fourth intercostal space and the midaxillary line","The fifth intercostal space and the midclavicular line","The second intercostal space and the sternal border","The sixth intercostal space and the anterior axillary line"],"key":0,"why":"The transducer must be at the same level as the pressure it measures. For CVP and PA pressures this is the phlebostatic axis, the intersection of the fourth intercostal space and midaxillary line.","src":[[5010,5013]],"origin":"heuer","age":"adult"},{"id":"C03-Q29","sec":"I-C","lvl27":"integ","topic":"Hemodynamic monitoring","stem":"A patient is receiving PEEP of 8 cm H₂O. To measure the PAWP you should:","opts":["Leave the patient on PEEP and obtain the end-expiratory reading","Remove the patient from PEEP briefly to obtain a true reading","Apply a correction factor because PEEP exceeds 5 cm H₂O","Measure at end-inspiration to avoid PEEP effects"],"key":0,"why":"Do not remove patients from PEEP or CPAP to measure CVP or PAWP. If PEEP is 10 cm H₂O or less, simply obtain the end-expiratory reading; a correction is applied only when PEEP exceeds 10 cm H₂O. Measurements are made at end-expiration to minimize the effect of intrathoracic pressure changes.","src":[[5014,5020]],"origin":"heuer","age":"adult"},{"id":"C03-Q30","sec":"I-C","lvl27":"integ","topic":"Hemodynamic monitoring","stem":"A damped arterial pressure waveform with reduced amplitude is most likely caused by:","opts":["Air bubbles or a small clot partially obstructing the measurement system","The stopcock being turned off to the patient side of the system","An incorrect pressure scale selected on the bedside monitor display","Electrical interference from nearby equipment in the room"],"key":0,"why":"Any partial obstruction in the measurement system, such as air bubbles or small clots, can dampen the pressure signal by reducing its amplitude. A stopcock off to the patient or a disconnected transducer produces an ABSENT waveform, not a damped one.","src":[[5087,5089]],"origin":"heuer","age":"adult"},{"id":"C03-Q31","sec":"I-C","lvl27":"integ","topic":"Spontaneous breathing trials","stem":"Which set of findings indicates a patient is ready for a spontaneous breathing trial?","opts":["P/F ≥ 150–200, PEEP ≤ 5–8 cm H₂O, FiO₂ ≤ 0.4–0.5, pH ≥ 7.25, hemodynamically stable","P/F ≥ 100, PEEP ≤ 12 cm H₂O, FiO₂ ≤ 0.7, pH ≥ 7.20, on vasopressors","P/F ≥ 300, PEEP = 0, FiO₂ = 0.21, pH ≥ 7.35, with active myocardial ischemia","Any patient able to initiate an inspiratory effort, regardless of gas exchange"],"key":0,"why":"Readiness criteria include evidence of some reversal of the underlying cause of respiratory failure, adequate oxygenation (P/F ≥ 150–200, PEEP ≤ 5–8 cm H₂O, FiO₂ ≤ 0.4–0.5), pH ≥ 7.25, hemodynamic stability, and the capability to initiate an inspiratory effort.","src":[[5373,5378]],"origin":"heuer","age":"adult"},{"id":"C03-Q32","sec":"I-C","lvl27":"integ","topic":"Spontaneous breathing trials","stem":"After a patient tolerates the brief screening phase, the SBT should continue for:","opts":["At least 30 minutes but no more than 120 minutes","At least 5 minutes but no more than 10 minutes","At least 4 hours but no more than 8 hours","Until the next scheduled arterial blood gas"],"key":0,"why":"The screening phase is a brief supervised period of 2–5 minutes of monitored spontaneous breathing. If the patient tolerates it, continue the SBT for at least 30 minutes but no more than 120 minutes; if ABGs are acceptable and the patient remains stable, ventilation can be discontinued.","src":[[5391,5399]],"origin":"heuer","age":"adult"},{"id":"C03-Q33","sec":"I-C","lvl27":"integ","topic":"Cuff management","stem":"Why must you always adjust — never merely measure — cuff pressure when using a manometer and syringe?","opts":["Attaching them to the pilot line causes volume loss that lowers the pressure","The manometer adds volume to the cuff, raising the pressure above 25 cm","Measuring alone violates the infection-control policy for the pilot line","The manometer cannot display pressures below 20 cm H₂O"],"key":0,"why":"Attaching a manometer and syringe to a pilot tube line causes volume loss and lowers cuff pressure; for this reason you must always adjust the pressure, never just measure it. Most hospitals, including the NBRC hospital, set 25 cm H₂O as the high-pressure limit.","src":[[5637,5641]],"origin":"heuer","age":"adult"},{"id":"C03-Q34","sec":"I-C","lvl27":"integ","topic":"Pulmonary mechanics","stem":"A patient on volume control has VT 500 mL, PIP 40, Pplat 25, PEEP 5 cm H₂O, flow 60 L/min. What are the static compliance and airway resistance?","opts":["Crs 25 mL/cm H₂O; Raw 15 cm H₂O/L/sec","Crs 14 mL/cm H₂O; Raw 15 cm H₂O/L/sec","Crs 25 mL/cm H₂O; Raw 0.25 cm H₂O/L/sec","Crs 20 mL/cm H₂O; Raw 10 cm H₂O/L/sec"],"key":0,"why":"Crs = VT ÷ (Pplat − PEEP) = 500 ÷ (25 − 5) = 25 mL/cm H₂O. Raw = (PIP − Pplat) ÷ inspiratory flow in L/sec. Convert flow: 60 L/min ÷ 60 = 1 L/sec, so Raw = (40 − 25) ÷ 1 = 15 cm H₂O/L/sec. Note the flow must be converted from L/min to L/sec.","src":[[5231,5233],[5226,5231],[5343,5346]],"origin":"heuer","age":"adult"},{"id":"C03-Q35","sec":"I-C","lvl27":"integ","topic":"Auto-PEEP","stem":"You suspect auto-PEEP in a ventilated COPD patient. Which statement correctly describes its detection?","opts":["Detect it on the flow–time waveform or loop; measure it with an end-expiratory pause","It appears as an elevated plateau pressure during an end-inspiratory hold","It is read directly from the peak inspiratory pressure on each breath","It is visible only as a shift of the pressure–volume loop to the right side"],"key":0,"why":"Auto-PEEP is residual pressure above set PEEP in the alveoli due to air-trapping, and it is not visible on a normal pressure-versus-time graphic — hence the name occult PEEP. Detection requires inspecting the flow-versus-time waveform or the flow–volume loop, and measurement requires an end-expiratory pause. Patients at greatest risk have high airway resistance and high compliance on modes that limit expiratory time.","src":[[5156,5170],[5235,5241]],"origin":"heuer","age":"adult"},{"id":"C03-Q36","sec":"I-C","lvl27":"integ","topic":"Sputum induction","stem":"During sputum induction in an asthmatic patient, the FEV₁ falls 22% below the post-bronchodilator baseline. You should:","opts":["Terminate the procedure","Continue and increase the saline concentration","Continue but reduce the nebulizer output","Administer a second bronchodilator and continue to 20 minutes"],"key":0,"why":"Because hypertonic saline can cause bronchospasm, patients with reactive airway disease are pretreated with a fast-acting beta agonist and the FEV₁ is measured at the end of each induction attempt. Terminate the procedure if the FEV₁ falls by 20% or more from the initial post-bronchodilator value, or if signs of respiratory distress occur.","src":[[5711,5716]],"origin":"heuer","age":"adult"},{"id":"C04-Q01","sec":"I-D","lvl27":"recall","topic":"ECG interpretation","stem":"At a standard recording speed of 25 mm/sec, each small 1-mm box on ECG paper represents:","opts":["0.04 sec","0.20 sec","0.10 sec","0.02 sec"],"key":0,"why":"At 25 mm/sec each small 1-mm box represents 0.04 sec, and each large box represents 5 × 0.04 or 0.20 sec.","src":[[6379,6382]],"origin":"heuer","age":"adult"},{"id":"C04-Q02","sec":"I-D","lvl27":"recall","topic":"ECG interpretation","stem":"A PR interval is considered prolonged when it exceeds:","opts":["0.20 sec","0.12 sec","0.45 sec","0.60 sec"],"key":0,"why":"A PR interval greater than 0.20 sec indicates first-degree or Mobitz type I AV block. A QRS complex is widened when greater than 0.12 sec, and a QT interval is prolonged when greater than 0.45 sec.","src":[[6415,6423]],"origin":"heuer","age":"adult"},{"id":"C04-Q03","sec":"I-D","lvl27":"recall","topic":"Oxygenation","stem":"The normal range for arterial oxygen content (CaO₂) is:","opts":["16–22 mL/dL","14–16 mL/dL","8–12 mL/dL","22–28 mL/dL"],"key":0,"why":"Normal CaO₂ is 16–22 mL/dL, computed as (total Hb × 1.36 × SaO₂) + (0.003 × PaO₂). Normal mixed venous O₂ content is lower at 14–16 mL/dL.","src":[[6861,6863],[7019,7019]],"origin":"heuer","age":"adult"},{"id":"C04-Q04","sec":"I-D","lvl27":"recall","topic":"Oxygenation","stem":"A normal P/F ratio is:","opts":["Greater than 350–380","200–300","100–200","Below 100"],"key":0,"why":"A normal P/F ratio is greater than 350–380. A P/F of 200–300 indicates V/Q mismatch or mild ARDS, 100–200 indicates some shunting or moderate ARDS, and below 100 indicates refractory hypoxemia with severe shunting.","src":[[6923,6931]],"origin":"heuer","age":"adult"},{"id":"C04-Q05","sec":"I-D","lvl27":"recall","topic":"Mixed venous oxygenation","stem":"Normal mixed venous oxygen saturation obtained from a PA catheter is:","opts":["68–77%","95–98%","50–60%","80–90%"],"key":0,"why":"Normal mixed venous values from a PA catheter are a PvO₂ of 38–42 torr, saturation of 68–77%, and content of 14–16 mL/dL. Values from a CVP catheter are typically slightly lower.","src":[[7011,7021]],"origin":"heuer","age":"adult"},{"id":"C04-Q06","sec":"I-D","lvl27":"recall","topic":"Acid-base","stem":"Compensation for a primary acid-base disturbance is described as \"full\" when:","opts":["The pH has returned to the normal range of 7.35–7.45","The PaCO₂ has returned to the normal range of 35–45","The base excess has returned to the range of 0 ± 2","The HCO₃ has returned to the normal value of 24 mEq/L"],"key":0,"why":"Compensation is full if the pH is in the normal range of 7.35–7.45; otherwise it is termed partial. Renal compensation for primary respiratory disorders is slow, taking hours to days, whereas respiratory compensation for metabolic disorders is fast, within minutes.","src":[[6728,6734]],"origin":"heuer","age":"adult"},{"id":"C04-Q07","sec":"I-D","lvl27":"integ","topic":"ECG interpretation","stem":"Using the rule of 300, an R-R interval spanning four large boxes corresponds to a heart rate of about:","opts":["75/min","100/min","60/min","150/min"],"key":0,"why":"As long as the rhythm is regular, divide 300 by the number of large boxes spanned by the R-R interval. 300 ÷ 4 = 75/min.","src":[[6383,6386]],"origin":"heuer","age":"adult"},{"id":"C04-Q08","sec":"I-D","lvl27":"integ","topic":"ECG interpretation","stem":"Which 12-lead ECG pattern is most common in patients with chronic lung disease?","opts":["Right axis deviation with right ventricular hypertrophy","Left axis deviation with left ventricular hypertrophy","Extreme right axis deviation with pathologic Q waves","Normal axis with prolonged QT interval"],"key":0,"why":"The most common pattern in patients with chronic lung disease is right axis deviation with right ventricular hypertrophy. Right axis deviation shows a QRS that is negative in lead I but positive in aVF.","src":[[6393,6394],[6468,6468],[6480,6485]],"origin":"heuer","age":"adult"},{"id":"C04-Q09","sec":"I-D","lvl27":"integ","topic":"ECG interpretation","stem":"Why can a 12-lead ECG alone not diagnose a myocardial infarction?","opts":["Other data, including the presentation and cardiac biomarkers, are required","The ECG cannot detect ST-segment elevation or depression in any lead","Axis deviation on the 12-lead ECG masks the typical pattern of an infarct","A 12-lead ECG records atrial activity but not ventricular activity"],"key":0,"why":"The 12-lead ECG alone cannot diagnose an MI; other clinical data including patient presentation and cardiac biomarkers are needed. Distinguishing STEMI from NSTEMI matters because STEMI typically gets thrombolytic therapy and angioplasty while NSTEMI usually receives antiplatelet drugs and anticoagulants.","src":[[6395,6401]],"origin":"heuer","age":"adult"},{"id":"C04-Q10","sec":"I-D","lvl27":"integ","topic":"Pulse oximetry","stem":"A firefighter rescued from a structure fire has an SpO₂ of 99% but appears confused. The SpO₂ is unreliable because:","opts":["COHb makes two-wavelength oximeters overestimate the saturation","COHb makes two-wavelength oximeters underestimate the saturation","Soot on the skin blocks the light signal and gives a false reading","Oximeters cannot read accurately when the saturation is above 95%"],"key":0,"why":"As measured by standard two-wavelength pulse oximeters, SpO₂ overestimates oxyhemoglobin saturation when abnormal hemoglobins such as carboxyhemoglobin are present, as in smoke inhalation. Multiple-wavelength oximeters can detect HbCO.","src":[[6520,6522],[6564,6566],[6586,6586]],"origin":"heuer","age":"adult"},{"id":"C04-Q11","sec":"I-D","lvl27":"integ","topic":"Pulse oximetry","stem":"Using the \"40–50–60/70–80–90\" rule, an SpO₂ of 80% corresponds to an approximate PaO₂ of:","opts":["50 torr","40 torr","60 torr","70 torr"],"key":0,"why":"The rule of thumb pairs PaO₂ values of 40, 50, and 60 torr with SpO₂ values of 70%, 80%, and 90% respectively. An SpO₂ of 80% therefore corresponds to a PaO₂ of about 50 torr.","src":[[6526,6528]],"origin":"heuer","age":"adult"},{"id":"C04-Q12","sec":"I-D","lvl27":"integ","topic":"Pulse oximetry","stem":"Dual pre-/postductal pulse oximetry screening for critical congenital heart defects is positive when:","opts":["Right hand and foot SpO₂ both < 95%, or a difference of ≥ 3%","Both readings ≥ 95%, with a difference of < 3%","Right hand 97% and foot 96%","Right hand 96% and foot 98%"],"key":0,"why":"Dual pulse oximetry is used to screen for critical congenital heart defects in neonates. A CCHD may be present if both right hand (preductal) and foot (postductal) SpO₂ are less than 95%, or the difference between them is 3% or more.","src":[[6532,6534]],"origin":"heuer","age":"adult"},{"id":"C04-Q13","sec":"I-D","lvl27":"integ","topic":"Capnography","stem":"A ventilated patient's PetCO₂ suddenly drops to 0 torr. Which causes are consistent with this finding?","opts":["Circuit disconnection, esophageal intubation, or tube obstruction","Gradual hypoventilation from oversedation over several hours","Malignant hyperthermia with a rapidly rising metabolic rate","Injection of sodium bicarbonate during a code"],"key":0,"why":"A sudden fall in PetCO₂ can result from a sudden drop in cardiac output or cardiac arrest, circuit leak or disconnection, esophageal intubation, or ET/tracheostomy tube obstruction or dislodgement — and these starred causes can drive the PetCO₂ to 0 torr. Hypoventilation and bicarbonate injection raise PetCO₂.","src":[[6637,6665]],"origin":"heuer","age":"adult"},{"id":"C04-Q14","sec":"I-D","lvl27":"integ","topic":"Transcutaneous monitoring","stem":"A neonate's PtcO₂ reads much lower than a simultaneously drawn PaO₂. The most likely explanation is:","opts":["Poor peripheral circulation","An overheated sensor","A recent increase in FiO₂","Sensor placement on the abdomen"],"key":0,"why":"If more precision is needed the PtcO₂ must be calibrated against a simultaneous PaO₂. If the PaO₂ value is substantially higher than the PtcO₂, poor peripheral circulation is the likely cause. PtcO₂ also underestimates PaO₂ when the sensor is underheated, placed on a bony surface, or when too much pressure or gel is applied.","src":[[6593,6598]],"origin":"heuer","age":"child"},{"id":"C04-Q15","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"Using the simplified bedside rule, a patient with normal lungs receiving 50% O₂ should have a PaO₂ of at least about:","opts":["250 torr","100 torr","150 torr","500 torr"],"key":0,"why":"For rapid bedside assessment, the expected minimum PaO₂ is about five times the FiO₂ percentage. At 50% O₂ this is 5 × 50 = about 250 torr. A PaO₂ significantly lower than this estimate indicates abnormal oxygenation.","src":[[6877,6880]],"origin":"heuer","age":"adult"},{"id":"C04-Q16","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"Working in Denver at an altitude of 5000 ft, the expected normal room-air PaO₂ is about:","opts":["75 torr","100 torr","50 torr","90 torr"],"key":0,"why":"Barometric pressure drops about 5 torr per 1000 ft up to 10,000 ft. At 5000 ft the estimate is 100 − (5 × 5) = 100 − 25 = 75 torr. At 10,000 ft the PaO₂ would be about 50 torr lower than at sea level.","src":[[6882,6895]],"origin":"heuer","age":"adult"},{"id":"C04-Q17","sec":"I-D","lvl27":"integ","topic":"6-minut
