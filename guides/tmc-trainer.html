e walk test","stem":"You repeat a 6-minute walk test after pulmonary rehabilitation. What improvement in 6MWD indicates the treatment was effective?","opts":["At least 10–20%","At least 5%","At least 50%","Any measurable increase"],"key":0,"why":"If you are using the 6MWT to assess treatment, expect at least a 10–20% improvement in the 6MWD to consider it effective. A 6MWD less than 500–600 meters screens for abnormal functional capacity but is not diagnostic of any specific condition.","src":[[7079,7086]],"origin":"heuer","age":"adult"},{"id":"C04-Q18","sec":"I-D","lvl27":"integ","topic":"Exercise testing","stem":"During exercise testing to detect exercise-induced bronchospasm, a positive result is:","opts":["At least a 20% drop in FEV₁ post-exercise","Any drop in FEV₁ post-exercise","A 10% drop in FVC post-exercise","A rise in breathing reserve above 30%"],"key":0,"why":"If the test is being done to detect exercise-induced bronchospasm, look for at least a 20% drop in FEV₁ post-exercise. To justify pulmonary rehabilitation, VO₂max should be less than 75% of predicted with a breathing reserve of less than 30%.","src":[[7144,7147]],"origin":"heuer","dropped":"Cardiopulmonary stress / exercise testing is not on the 2027 outline","age":"adult"},{"id":"C04-Q19","sec":"I-D","lvl27":"integ","topic":"Acid-base","stem":"pH 7.22, PCO₂ 65 torr, HCO₃ 26 mEq/L, BE −1 mEq/L. The interpretation is:","opts":["Acute (uncompensated) respiratory acidosis","Fully compensated respiratory acidosis","Partially compensated metabolic acidosis","Combined respiratory and metabolic acidosis"],"key":0,"why":"The pH is below 7.35 (acidemia) and the PCO₂ is above 45 torr, so the primary problem is respiratory acidosis. HCO₃ and BE are within normal limits, so no compensation has occurred — the disturbance is acute.","src":[[6766,6775]],"origin":"heuer","age":"adult"},{"id":"C04-Q20","sec":"I-D","lvl27":"integ","topic":"Acid-base","stem":"pH 7.35, PCO₂ 62 torr, HCO₃ 33 mEq/L, BE +7 mEq/L. The interpretation is:","opts":["Fully compensated respiratory acidosis","Acute respiratory acidosis","Partially compensated respiratory acidosis","Combined respiratory acidosis and metabolic alkalosis"],"key":0,"why":"PCO₂ is above 45 torr and BE is above +2, and because both have risen together compensation is occurring. The pH of 7.35 sits on the acid side but within normal limits, so the primary problem is respiratory acidosis and the compensation is complete.","src":[[6777,6789]],"origin":"heuer","age":"adult"},{"id":"C04-Q21","sec":"I-D","lvl27":"integ","topic":"Acid-base","stem":"pH 7.32, PCO₂ 24 torr, HCO₃ 12 mEq/L, BE −13 mEq/L. The interpretation is:","opts":["Partially compensated metabolic acidosis","Acute metabolic acidosis","Fully compensated metabolic acidosis","Combined metabolic and respiratory acidosis"],"key":0,"why":"The pH is below 7.35 with a PCO₂ under 45 torr, so the primary problem is metabolic acidosis. Because PCO₂ and BE have both fallen together, compensation is occurring — but the pH remains below the normal limit, so compensation is only partial.","src":[[6800,6810]],"origin":"heuer","age":"adult"},{"id":"C04-Q22","sec":"I-D","lvl27":"integ","topic":"Acid-base","stem":"pH 6.90, PCO₂ 100 torr, HCO₃ 19 mEq/L, BE −12 mEq/L. The interpretation is:","opts":["Combined respiratory and metabolic acidosis","Fully compensated respiratory acidosis","Partially compensated respiratory acidosis","Acute metabolic acidosis with respiratory compensation"],"key":0,"why":"The PCO₂ and BE are diverging in opposite directions. The PCO₂ is abnormally high, which alone would cause respiratory acidosis, and the BE is abnormally low, which alone would cause metabolic acidosis. Together they drive the pH to a lethally low level. When PaCO₂ and BE diverge, a combined disturbance exists.","src":[[6812,6823],[6735,6738]],"origin":"heuer","age":"adult"},{"id":"C04-Q23","sec":"I-D","lvl27":"integ","topic":"Acid-base","stem":"A blood gas shows PaCO₂ and BE both abnormally LOW, with a pH of 7.48. The primary disturbance is:","opts":["Respiratory alkalosis with metabolic compensation","Metabolic acidosis with respiratory compensation","Combined respiratory and metabolic alkalosis","Combined respiratory and metabolic acidosis"],"key":0,"why":"Compensation is occurring when both the PaCO₂ and BE are abnormally high or low in the same direction. Once that is established, look at the pH: above 7.40 the primary problem is the one causing alkalosis — here the low PaCO₂, a respiratory alkalosis. Because the pH is outside 7.35–7.45, compensation is partial.","src":[[6722,6734]],"origin":"heuer","age":"adult"},{"id":"C04-Q24","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"A patient breathing 100% O₂ has a P(A-a)O₂ of 300 torr. The approximate percent shunt is:","opts":["15%","30%","3%","50%"],"key":0,"why":"Rule of thumb: when breathing 100% oxygen, every 100 torr of P(A-a)O₂ difference equals about a 5% shunt. Here 300 ÷ 100 = 3, and 3 × 5 = approximately 15%.","src":[[6975,6986]],"origin":"heuer","age":"adult"},{"id":"C04-Q25","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"A ventilated patient has a PaO₂ of 76 torr on an FiO₂ of 0.60. The P/F ratio and its meaning are:","opts":["127 — some shunting, consistent with moderate ARDS","127 — normal oxygenation","46 — refractory hypoxemia with severe shunting","211 — V/Q mismatch or mild ARDS"],"key":0,"why":"P/F = PaO₂ ÷ FiO₂ = 76 ÷ 0.60 = about 127. A P/F of 100–200 indicates some shunting and moderate ARDS. Normal is greater than 350–380; below 100 is refractory hypoxemia with severe shunting.","src":[[6923,6931]],"origin":"heuer","age":"adult"},{"id":"C04-Q26","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"An a/A ratio is calculated as 0.28. This indicates:","opts":["Hypoxemia due to shunting","Normal oxygenation","Hypoxemia likely due to V/Q mismatch","An invalid calculation"],"key":0,"why":"A normal a/A ratio is greater than 0.75. A ratio of 0.35–0.75 indicates hypoxemia likely due to V/Q mismatch, and a ratio below 0.35 indicates hypoxemia due to shunting.","src":[[6941,6947]],"origin":"heuer","age":"adult"},{"id":"C04-Q27","sec":"I-D","lvl27":"integ","topic":"Oxygenation","stem":"A neonate on mechanical ventilation has an oxygenation index of 45. This indicates:","opts":["High mortality; an indication for ECMO","Normal oxygenation","Moderate RDS with a P/F below 200","Severe hypoxemia that may justify HFOV"],"key":0,"why":"A normal OI is less than 5–8. An OI of about 20 indicates severe hypoxemia and may justify HFOV in neonates, while an OI greater than 40 carries high mortality and is an indication for ECMO.","src":[[6949,6959]],"origin":"heuer","age":"child"},{"id":"C04-Q28","sec":"I-D","lvl27":"integ","topic":"Mixed venous oxygenation","stem":"A patient's mixed venous saturation falls from 70% to 45% with a stable hemoglobin. This indicates:","opts":["Impaired tissue oxygenation from lower O₂ delivery or higher O₂ use","Improved cardiac output with more oxygen delivered to the tissues","Decreased oxygen demand from hypothermia or deep sedation","A normal physiologic variation that needs no further assessment"],"key":0,"why":"With a normal Hb level, a mixed venous saturation below 50% or a PvO₂ below 27 torr indicates impaired tissue oxygenation. Mixed venous O₂ falls if O₂ delivery decreases or O₂ consumption increases — for example from anemia, hypoxemia, low cardiac output, hyperthermia, trauma, shivering, or seizures.","src":[[6996,7008],[7032,7037]],"origin":"heuer","age":"adult"},{"id":"C04-Q29","sec":"I-D","lvl27":"integ","topic":"Mixed venous oxygenation","stem":"A septic patient has a HIGH mixed venous oxygen saturation despite clinical signs of tissue hypoxia. The best explanation is:","opts":["In sepsis, mixed venous O₂ can be high despite tissue hypoxia; lactate is better","Sepsis always raises the cardiac output enough to correct any tissue hypoxia","The sample was contaminated with arterialized blood during the aspiration","A high mixed venous saturation rules out tissue hypoxia in sepsis"],"key":0,"why":"In both cyanide poisoning and sepsis, mixed venous oxygen can be higher than normal even if tissue hypoxia is present. For this reason, in patients with pathologic conditions that decrease O₂ demand, mixed venous lactate may be a better indicator of tissue oxygenation.","src":[[7048,7056]],"origin":"heuer","age":"adult"},{"id":"C04-Q30","sec":"I-D","lvl27":"integ","topic":"Exercise testing","stem":"A comprehensive exercise capacity test shows a breathing reserve of 22% with desaturation during exercise, a normal anaerobic threshold, and a normal O₂ pulse. This points to:","opts":["A pulmonary disorder limiting exercise capacity","A cardiovascular disorder limiting exercise capacity","Poor physical conditioning","A normal study"],"key":0,"why":"A pulmonary limitation is characterized by a breathing reserve below 30% with desaturation common. A cardiovascular disorder instead shows a decreased anaerobic threshold, decreased O₂ pulse, and decreased HRmax, while poor conditioning shows a normal anaerobic threshold.","src":[[7138,7142],[7107,7113]],"origin":"heuer","dropped":"Cardiopulmonary stress testing is not on the 2027 outline","age":"adult"},{"id":"C05-Q01","sec":"I-E","lvl27":"recall","topic":"Tuberculosis testing","stem":"Which test should be recommended to detect an ACTIVE tuberculosis infection?","opts":["Serial sputum specimens for acid-fast bacilli stain","A Mantoux tuberculin skin test read at 48–72 hours","A single posteroanterior chest x-ray alone","Allergy skin testing with a purified protein panel"],"key":0,"why":"A tuberculin skin test is recommended for diagnosis of a LATENT TB infection, whereas serial sputum specimen collection for AFB stain is recommended to detect an ACTIVE infection. Chest x-ray and interferon-gamma release assays can be recommended concurrently to help confirm the diagnosis.","src":[[8081,8086]],"origin":"heuer","age":"adult"},{"id":"C05-Q02","sec":"I-E","lvl27":"recall","topic":"Bronchoalveolar lavage","stem":"What is the only major contraindication to bronchoalveolar lavage?","opts":["A predisposition for bleeding","Nonresolving pneumonia","Interstitial lung disease","Suspected ventilator-associated pneumonia"],"key":0,"why":"The only major contraindication to BAL is a predisposition for bleeding. BAL is indicated in nonresolving pneumonia, unexplained lung infiltrates, suspected alveolar hemorrhage, and interstitial lung disease, and is a key tool for diagnosing bacterial VAP.","src":[[8446,8454]],"origin":"heuer","age":"adult"},{"id":"C05-Q03","sec":"I-E","lvl27":"recall","topic":"Exhaled gas analysis","stem":"According to the book, below what exhaled CO level is a person usually classified as a nonsmoker?","opts":["6–8 ppm","20–25 ppm","1–2 ppm","15 ppm"],"key":0,"why":"Readings below 6–8 ppm signify nonsmoking status, with values below 3–4 ppm typically confirming true smoking abstinence. Readings above 6–8 ppm indicate smoking has likely occurred within the past 12–24 hours.","src":[[8727,8734]],"origin":"heuer","age":"adult"},{"id":"C05-Q04","sec":"I-E","lvl27":"recall","topic":"Capnography","stem":"During CPR, PetCO₂ remains low at what level when blood flow to the lungs is poor or absent?","opts":["Less than 10 torr","Less than 25 torr","Less than 35 torr","Less than 45 torr"],"key":0,"why":"The utility of capnography during CPR rests on PetCO₂ correlating well with cardiac output. With poor or absent blood flow to the lungs, PetCO₂ levels remain low — under 10 torr. With effective compressions or restored cardiac function, PetCO₂ rises.","src":[[8686,8689]],"origin":"heuer","age":"adult"},{"id":"C05-Q05","sec":"I-E","lvl27":"recall","topic":"Pulmonary function testing","stem":"A post-bronchodilator improvement in peak expiratory flow rate of what magnitude is considered significant?","opts":["12% or more","5% or more","25% or more","50% or more"],"key":0,"why":"A post-bronchodilator improvement of 12% or more is considered significant. PEFR is used to monitor airway tone over time via diary and to assess changes in response to bronchodilator therapy, though FEV spirometry is preferred.","src":[[8465,8473]],"origin":"heuer","age":"adult"},{"id":"C05-Q06","sec":"I-E","lvl27":"recall","topic":"Sleep studies","stem":"Limited polysomnography for in-home assessment monitors up to how many key parameters?","opts":["Seven","Three","Twelve","Twenty"],"key":0,"why":"Limited PSG has mostly replaced overnight oximetry for in-home assessment of sleep disorders. It monitors up to seven key parameters including SpO₂, airflow, and respiratory effort, though it does not assess sleep stages.","src":[[8795,8801]],"origin":"heuer","age":"adult"},{"id":"C05-Q07","sec":"I-E","lvl27":"integ","topic":"Laboratory tests","stem":"A patient shows evidence of tissue hypoxia despite a normal PaO₂ and SpO₂. Which tests should you recommend?","opts":["Hb/Hct, hemoximetry, and lactic acid","WBC count, differential, and blood cultures","d-Dimer, ischemia-modified albumin, and ABGs","Liver enzymes, bilirubin, and a drug screen"],"key":0,"why":"For tissue hypoxia with a normal PaO₂ and SpO₂, recommend Hb and Hct to determine O₂-carrying capacity, hemoximetry to assess actual SaO₂ and abnormal saturations such as HbCO and metHb, and lactic acid to assess for tissue hypoxia and anaerobic metabolism.","src":[[8161,8168]],"origin":"heuer","age":"adult"},{"id":"C05-Q08","sec":"I-E","lvl27":"integ","topic":"Laboratory tests","stem":"A postoperative patient develops sudden dyspnea, hemoptysis, chest pain, and tachycardia. Which tests should you recommend?","opts":["d-Dimer, ischemia-modified albumin, and ABGs","Liver enzymes, bilirubin, and albumin","Thyroid-stimulating hormone and glucose","Urinalysis, BUN, and glomerular filtration rate"],"key":0,"why":"These are signs of pulmonary embolism. Recommend a d-Dimer test, ischemia-modified albumin, and arterial blood gases to assess the degree of hypoxemia.","src":[[8176,8178]],"origin":"heuer","age":"adult"},{"id":"C05-Q09","sec":"I-E","lvl27":"integ","topic":"Laboratory tests","stem":"A patient's urine output falls below 25 mL/h. Which tests should you recommend?","opts":["Urinalysis, electrolytes, BUN/creatinine, and GFR","Cardiac biomarkers, electrolytes, and an ECG","Platelet count, PT/INR, and PTT","Blood cultures, sensitivities, and a WBC count"],"key":0,"why":"Decreased (under 25 mL/h) or absent urine output over time is oliguria. Recommend urinalysis for specific gravity and pH, electrolytes, BUN and creatinine to assess for possible renal disease or failure, and glomerular filtration rate.","src":[[8186,8192]],"origin":"heuer","age":"adult"},{"id":"C05-Q10","sec":"I-E","lvl27":"integ","topic":"Imaging studies","stem":"Which chest x-ray position should be recommended for an ambulatory outpatient?","opts":["Posteroanterior (PA), standing upright","Anteroposterior (AP) portable, sitting up","Lateral decubitus, affected side down","Supine AP, with a deep breath"],"key":0,"why":"PA films are recommended for ambulatory patients, who stand upright and take a deep breath. The AP projection is most commonly used for ICU portable films, and lateral views combined with AP or PA films help assess for pleural effusions.","src":[[8135,8139]],"origin":"heuer","age":"adult"},{"id":"C05-Q11","sec":"I-E","lvl27":"integ","topic":"Imaging studies","stem":"Thoracic MRI is contraindicated in patients with:","opts":["Pacemakers, metallic clips or heart valves, or infusion pumps","A suspected thoracic aortic aneurysm or aortic dissection","Posterior mediastinal masses or suspected nerve tumors","An allergy to iodinated radiographic contrast media"],"key":0,"why":"MRI is contraindicated in patients with pacemakers, metallic surgical clips or heart valves, or infusion or chemotherapy pumps. Ventilatory support must be provided by a manual all-plastic resuscitator or a ventilator certified for MRI use. MRI is actually recommended for staging lung cancer in patients allergic to contrast media.","src":[[8323,8346]],"origin":"heuer","age":"adult"},{"id":"C05-Q12","sec":"I-E","lvl27":"integ","topic":"Imaging studies","stem":"Why is transthoracic ultrasound ineffective for imaging through aerated lung tissue?","opts":["Sound does not pass usefully through aerated lung or a pneumothorax","The probe frequency is too low to resolve normal lung tissue at all","Rib shadows block the ultrasound image of the entire thorax","Lung tissue reflects no sound at all, so the screen stays black"],"key":0,"why":"Transthoracic ultrasound is generally ineffective in imaging tissues or organs through aerated lung tissue or pneumothorax. It is useful for detecting free fluid, pneumothorax, atelectasis, consolidation, and for guiding thoracentesis and needle biopsies.","src":[[8385,8413]],"origin":"heuer","age":"adult"},{"id":"C05-Q13","sec":"I-E","lvl27":"integ","topic":"Bronchoscopy","stem":"According to the AARC, bronchoscopy should be avoided in patients who:","opts":["Cannot be oxygenated, or are hemodynamically unstable","Have recurrent atelectasis of the same lobe despite therapy","Have unexplained hemoptysis of recent onset","Require selective mainstem intubation of one lung"],"key":0,"why":"The AARC advises against bronchoscopy in patients who cannot be adequately oxygenated during the procedure, have a bleeding disorder that cannot be corrected, have severe obstructive airway disease, have severe refractory hypoxemia, or are hemodynamically unstable. Recurrent atelectasis, hemoptysis, and selective intubation are indications, not contraindications.","src":[[8432,8439],[8146,8148],[8424,8426]],"origin":"heuer","age":"adult"},{"id":"C05-Q14","sec":"I-E","lvl27":"integ","topic":"Pulmonary function testing","stem":"Which pulmonary function test should be recommended to differentiate among chronic bronchitis, emphysema, and asthma in a patient with an obstructive pattern?","opts":["Diffusing capacity for carbon monoxide (DLCO)","Maximum voluntary ventilation (MVV) testing","Peak expiratory flow rate (PEFR) monitoring","Bronchial provocation (methacholine) testing"],"key":0,"why":"DLCO is recommended to differentiate among chronic bronchitis, emphysema, and asthma in patients with obstructive patterns. It is also used to follow interstitial lung diseases, evaluate drugs known to cause pulmonary damage such as amiodarone and bleomycin, and help predict arterial desaturation during exercise.","src":[[8521,8544]],"origin":"heuer","age":"adult"},{"id":"C05-Q15","sec":"I-E","lvl27":"integ","topic":"Pulmonary function testing","stem":"A methacholine challenge test should be recommended to:","opts":["Assess the presence and severity of airway hyperreactivity","Measure the degree of hyperinflation and air trapping","Quantify the total lung capacity and the residual volume","Assess the strength of the inspiratory and expiratory muscles"],"key":0,"why":"Bronchial provocation such as the methacholine challenge test is recommended to assess the presence and severity of airway hyperreactivity, evaluate occupational asthma, determine the relative risk of developing asthma, and assess response to therapeutic interventions.","src":[[8546,8551]],"origin":"heuer","age":"adult"},{"id":"C05-Q16","sec":"I-E","lvl27":"integ","topic":"Blood gas assessment","stem":"A patient requires accurate measurement of carboxyhemoglobin after smoke inhalation. You should recommend:","opts":["Hemoximetry (CO-oximetry)","Standard ABG analysis alone","Pulse oximetry","Transcutaneous PO₂ monitoring"],"key":0,"why":"Standard ABG analysis does not measure actual Hb content, Hb saturation, or abnormal hemoglobins such as HbCO or metHb. The most common scenario for recommending hemoximetry is smoke inhalation or CO poisoning; it is also used during inhaled nitric oxide therapy to monitor metHb.","src":[[8575,8591]],"origin":"heuer","age":"adult"},{"id":"C05-Q17","sec":"I-E","lvl27":"integ","topic":"Noninvasive monitoring","stem":"Which monitoring method is the best way to assess for hyperoxemia in an infant and help prevent retinopathy of prematurity?","opts":["Transcutaneous PtcO₂ monitoring","Pulse oximetry","Capnography","Standard ABG sampling every 4 hours"],"key":0,"why":"PtcO₂ monitoring is most accurate in infants, less so in children and adults. Infant PtcO₂ monitoring is the best way to assess for hyperoxemia and help prevent retinopathy of prematurity. Pulse oximetry should be recommended AGAINST when there is a need to monitor for hyperoxemia.","src":[[8660,8662],[8653,8655]],"origin":"heuer","age":"child"},{"id":"C05-Q18","sec":"I-E","lvl27":"integ","topic":"Capnography","stem":"To assess V/Q relationships, deadspace, and CO₂ production, you should recommend:","opts":["Volumetric capnography","Standard capnometry","Transcutaneous PCO₂ monitoring","Overnight oximetry"],"key":0,"why":"Volumetric capnography simultaneously measures expired CO₂ levels and tidal volumes, allowing computation of deadspace and CO₂ production. There is some evidence these measurements can also be used to titrate PEEP levels in ventilated patients.","src":[[8690,8696]],"origin":"heuer","age":"adult"},{"id":"C05-Q19","sec":"I-E","lvl27":"integ","topic":"Exhaled gas analysis","stem":"An exhaled CO reading of 48 ppm corresponds to an approximate HbCO saturation of:","opts":["8%","48%","24%","4%"],"key":0,"why":"To estimate HbCO% from exhaled CO, divide the CO concentration in ppm by 6. Here 48 ÷ 6 = about 8%.","src":[[8735,8738]],"origin":"heuer","age":"adult"},{"id":"C05-Q20","sec":"I-E","lvl27":"integ","topic":"Exhaled gas analysis","stem":"Why should a higher exhaled CO cutoff of 10–11 ppm be applied to patients with asthma or COPD?","opts":["Airway inflammation boosts endogenous CO production","These patients exhale less total volume","Bronchodilators artificially raise CO readings","Their CO analyzers require different calibration"],"key":0,"why":"A higher cutoff of 10–11 ppm should be applied to patients with inflammatory lung diseases such as asthma or COPD because inflammation boosts endogenous CO production.","src":[[8731,8734]],"origin":"heuer","age":"adult"},{"id":"C05-Q21","sec":"I-E","lvl27":"integ","topic":"Allergy testing","stem":"Allergy skin testing should NOT be performed routinely on which patient?","opts":["A patient with poorly controlled asthma (high anaphylaxis risk)","A patient with a suspected penicillin allergy before surgery","A patient with a suspected latex allergy at work","A patient with allergic rhinitis and conjunctivitis"],"key":0,"why":"Skin testing should not be performed routinely on patients at high risk for an anaphylactic reaction, such as those with poorly controlled asthma, or on those taking medications that interfere with the IgE immune response such as antihistamines, steroids, and anti-IgE antibodies like omalizumab. Penicillin and latex allergy are supported indications.","src":[[8115,8121]],"origin":"heuer","age":"adult"},{"id":"C05-Q22","sec":"I-E","lvl27":"integ","topic":"Imaging studies","stem":"A patient has had a thoracentesis in which fluid was aspirated without difficulty. Regarding a post-procedure chest x-ray, the American College of Radiology recommends:","opts":["A chest x-ray only if a pneumothorax is suspected","A routine chest x-ray after every thoracentesis","A chest x-ray only after 24 hours have passed","No chest x-ray under any circumstances"],"key":0,"why":"Although performing a chest x-ray after thoracentesis is common practice, the American College of Radiology recommends it only if a pneumothorax is suspected — for example if air rather than fluid is aspirated. Similarly, routine daily chest x-ray is no longer recommended to monitor mechanically ventilated patients.","src":[[8250,8262]],"origin":"heuer","age":"adult"},{"id":"C05-Q23","sec":"I-E","lvl27":"integ","topic":"Exhaled nitric oxide","stem":"In a patient with confirmed asthma, fractional exhaled nitric oxide (FeNO) analysis can be recommended to:","opts":["Predict steroid response and monitor control and adherence","Measure the total lung capacity and the residual volume","Quantify the airway resistance and the airway conductance","Screen newborns for critical congenital heart defects"],"key":0,"why":"NO concentration increases in the presence of airway inflammation, particularly in asthma. In patients with confirmed asthma, exhaled NO analysis can predict the response to corticosteroids, titrate anti-inflammatory medication, monitor the level of asthma control, predict impending exacerbation, and monitor medication adherence.","src":[[8744,8754]],"origin":"heuer","dropped":"FeNO is not on the 2027 outline","age":"adult"},{"id":"C05-Q24","sec":"I-E","lvl27":"integ","topic":"Capnography","stem":"A ventilated patient is being transported. Regarding capnography during transport:","opts":["It is required to monitor ventilation during transport","It is optional if pulse oximetry is being used","It should be replaced by transcutaneous monitoring","It is contraindicated during movement due to artifact"],"key":0,"why":"Monitoring the adequacy of ventilation in patients receiving mechanical ventilation is an indication for capnography, and it is required during transport of mechanically ventilated patients. Transcutaneous monitoring is a poor substitute here because of lengthy setup times.","src":[[8673,8674],[8666,8667]],"origin":"heuer","age":"adult"},{"id":"C06-Q01","sec":"II-A","lvl27":"recall","topic":"Oxygen therapy indications","stem":"Documented hypoxemia warranting O₂ therapy is defined as:","opts":["PaO₂ < 60 torr or SaO₂ < 90% on room air","PaO₂ < 80 torr or SaO₂ < 95% on room air","PaO₂ < 50 torr or SaO₂ < 85% on room air","PaO₂ < 70 torr on any FiO₂"],"key":0,"why":"Select or recommend O₂ therapy for patients with documented hypoxemia — a PaO₂ below 60 torr or SaO₂ below 90% on room air — or signs of hypoxemia such as dyspnea, tachypnea, tachycardia, cyanosis, or confusion.","src":[[9069,9074]],"origin":"heuer","age":"adult"},{"id":"C06-Q02","sec":"II-A","lvl27":"recall","topic":"High-flow systems","stem":"What total flow should generally be provided to ensure a stable FiO₂ from an air-entrainment device?","opts":["At least 40 L/min","At least 15 L/min","At least 60 L/min","At least 10 L/min"],"key":0,"why":"In general, the best way to ensure a stable FiO₂ is to provide a total flow of at least 40 L/min. For an input flow of 10 L/min this occurs only at or below the 40% setting.","src":[[9154,9157]],"origin":"heuer","age":"adult"},{"id":"C06-Q03","sec":"II-A","lvl27":"recall","topic":"Blending systems","stem":"All air/oxygen blenders require what gas source pressure?","opts":["50 psi air and oxygen","35 psi air and oxygen","2200 psi air and oxygen","15 psi air and oxygen"],"key":0,"why":"All blenders require a 50-psi air and oxygen source. Most blenders output 50 psi at the set O₂%, which can power respiratory equipment directly or control flow to the patient via a flowmeter.","src":[[9231,9233]],"origin":"heuer","age":"adult"},{"id":"C06-Q04","sec":"II-A","lvl27":"recall","topic":"Oxygen concentrators","stem":"Most oxygen concentrators produce what concentration of oxygen and at what maximum flow?","opts":["About 90–95% O₂ at flows up to 10 L/min","About 100% O₂ at flows up to 15 L/min","About 80% O₂ at flows up to 6 L/min","About 70% O₂ at flows up to 4 L/min"],"key":0,"why":"An O₂ concentrator physically separates the O₂ in room air from nitrogen. Most use sodium-aluminum silicate pellets to absorb nitrogen, CO₂, and water vapor, producing about 90–95% O₂ at flows up to 10 L/min.","src":[[9564,9568]],"origin":"heuer","dropped":"\"Long-term oxygen therapy\" device heading (2020 II-A.2) is not on the 2027 outline","age":"adult"},{"id":"C06-Q05","sec":"II-A","lvl27":"recall","topic":"Liquid oxygen","stem":"One liter of liquid oxygen vaporizes into approximately how much gaseous oxygen?","opts":["860 L","344 L","100 L","2200 L"],"key":0,"why":"Since 1 L of liquid O₂ vaporizes into 860 L of gaseous O₂, LOX systems are an efficient way to store supplemental O₂. Separately, 1 pound of LOX equals approximately 344 L of gaseous O₂ at normal operating pressures.","src":[[9594,9606]],"origin":"heuer","dropped":"\"Long-term oxygen therapy\" device heading (2020 II-A.2) is not on the 2027 outline","age":"adult"},{"id":"C06-Q06","sec":"II-A","lvl27":"recall","topic":"Oxygen-conserving devices","stem":"Oxygen-conserving devices reduce O₂ usage by approximately:","opts":["50–75%","10–20%","90%","25–30%"],"key":0,"why":"All O₂-conserving devices minimize the O₂ waste that occurs during exhalation with standard nasal cannulas. They can reduce O₂ usage by 50–75%, doubling or tripling the duration of flow from bulk sources.","src":[[9646,9649]],"origin":"heuer","age":"adult"},{"id":"C06-Q07","sec":"II-A","lvl27":"recall","topic":"Small-volume nebulizers","stem":"What input gas flow produces optimal particle size from a small-volume nebulizer?","opts":["6–8 L/min","2–4 L/min","10–12 L/min","15 L/min"],"key":0,"why":"An SVN delivers small volumes (2.5–4 mL) of respirable aerosol in the 1–5 micron range, and the input gas flow should be 6–8 L/min for optimal particle size.","src":[[10019,10028]],"origin":"heuer","age":"adult"},{"id":"C06-Q08","sec":"II-A","lvl27":"recall","topic":"Metered-dose inhalers","stem":"Using the open-mouth pMDI technique, the inhaler is positioned how far from the mouth?","opts":["4 cm, about two finger widths","1 cm, about half a finger width","10 cm, about a hand's width","Directly against the lips"],"key":0,"why":"With the open-mouth technique the MDI is positioned 4 cm — about two finger widths — away from the open mouth, with the tongue kept down. With the closed-mouth technique the MDI is placed between the lips with the tongue down.","src":[[10183,10190]],"origin":"heuer","age":"adult"},{"id":"C06-Q09","sec":"II-A","lvl27":"recall","topic":"Metered-dose inhalers","stem":"After actuating a pMDI, the patient should hold their breath for:","opts":["10 seconds","3 seconds","30 seconds","1 minute"],"key":0,"why":"Have the patient hold the breath for 10 seconds to allow maximum drug deposition, and wait about 1 minute between puffs.","src":[[10176,10181]],"origin":"heuer","age":"adult"},{"id":"C06-Q10","sec":"II-A","lvl27":"recall","topic":"Dry-powder inhalers","stem":"Dry-powder inhalers require what inspiratory flow compared to an MDI?","opts":["Higher flows, greater than 60 L/min","Lower flows, less than 30 L/min","The same flow as an MDI","Flow is irrelevant for a DPI"],"key":0,"why":"Higher inspiratory flows greater than 60 L/min are needed for a DPI compared to an MDI. Timing and coordination are not needed because the drug only moves with inspiratory flow — there is no propellant — and a breath-hold is encouraged but not required.","src":[[10170,10176]],"origin":"heuer","age":"adult"},{"id":"C06-Q11","sec":"II-A","lvl27":"recall","topic":"High-flow nasal cannula","stem":"Typical HFNC flow settings for an infant are:","opts":["1–8 L/min","1–20 L/min","1–40 L/min","10–30 L/min"],"key":0,"why":"HFNC flow settings depend on patient age and size: adults 1–40 L/min or higher, children 1–20 L/min, and infants 1–8 L/min.","src":[[9278,9280]],"origin":"heuer","age":"child"},{"id":"C06-Q12","sec":"II-A","lvl27":"recall","topic":"Cylinders","stem":"A full oxygen cylinder is assumed to be at what pressure when computing duration of flow?","opts":["2200 psi","50 psi","1000 psi","3000 psi"],"key":0,"why":"Duration-of-flow calculations assume a full cylinder is at 2200 psi. Cylinder filling pressures may vary, so always check before computing.","src":[[9515,9516]],"origin":"heuer","age":"adult"},{"id":"C06-Q13","sec":"II-A","lvl27":"integ","topic":"Low-flow systems","stem":"Which change will INCREASE the FiO₂ delivered by a low-flow oxygen system?","opts":["A lower patient inspiratory flow","A higher patient tidal volume","A faster rate of breathing","A leak in the mask"],"key":0,"why":"Less air dilution and a higher FiO₂ result from higher O₂ flow input, a reservoir present, no leak, and valves present on the device side; and from a lower inspiratory flow, lower tidal volume, slower breathing rate, and lower minute ventilation on the patient side.","src":[[9095,9114]],"origin":"heuer","age":"adult"},{"id":"C06-Q14","sec":"II-A","lvl27":"integ","topic":"High-flow systems","stem":"Obstructing the entrainment port of an air-entrainment device results in:","opts":["A higher delivered O₂ concentration but a lower total flow","A lower delivered O₂ concentration and a higher total flow","No change in either the O₂ concentration or the total flow","A higher delivered O₂ concentration and a higher total flow"],"key":0,"why":"Obstructing an entrainment device's entrainment port decreases air entrainment, producing a higher delivered O₂ concentration but a lower overall flow, with an unpredictable effect on the actual inspired O₂ concentration reaching the patient.","src":[[9139,9142]],"origin":"heuer","age":"adult"},{"id":"C06-Q15","sec":"II-A","lvl27":"integ","topic":"High-flow systems","stem":"A high-flow oxygen device must be titrated by changing:","opts":["The FiO₂, not the flow","The flow, not the FiO₂","Either the flow or the FiO₂ interchangeably","The patient's minute ventilation"],"key":0,"why":"High-flow devices must be titrated by changing FiO₂, not flow. Reducing the flow leaves the FiO₂ unchanged but may make it insufficient to meet inspiratory demand, so delivered O₂ becomes variable. With a reservoir system, flow reductions can also cause CO₂ rebreathing and suffocation.","src":[[9143,9147]],"origin":"heuer","age":"adult"},{"id":"C06-Q16","sec":"II-A","lvl27":"integ","topic":"High-flow systems","stem":"At an FiO₂ of 0.24, each 1 L/min set on the flowmeter produces approximately how much total output?","opts":["26 L/min","1.3 L/min","10 L/min","4 L/min"],"key":0,"why":"The lower the FiO₂, the higher the total output of an air-entrainment device. At 0.24 FiO₂, for every 1 L/min set on the flowmeter there is 26 L/min of output; at 0.8 FiO₂ the output is only 1.3 L/min per L/min set.","src":[[9148,9153]],"origin":"heuer","age":"adult"},{"id":"C06-Q17","sec":"II-A","lvl27":"integ","topic":"High-flow systems","stem":"An air-entrainment nebulizer set at 60% cannot meet an ICU patient's high inspiratory demand. The best correction is:","opts":["Connect two air-entrainment nebulizers in parallel","Reduce the O₂ input flow to increase air entrainment","Obstruct the entrainment port to raise the delivered FiO₂","Switch to a simple mask at 10 L/min with humidity"],"key":0,"why":"Total output flow can be increased somewhat by raising O₂ input flow, but backpressure at the jet limits this to typically 12–15 L/min. An alternative is to combine two air-entrainment nebulizers, which doubles the flow so the mist does not disappear on inspiration.","src":[[9156,9160]],"origin":"heuer","age":"adult"},{"id":"C06-Q18","sec":"II-A","lvl27":"integ","topic":"Blending systems","stem":"A blender sounds a loud, high-pitched alarm after both gas hoses are connected. Your first steps should be:","opts":["Verify both gases are at the required inlet pressure (≥ 35 psig) and check for leaks","Replace the blender immediately, without checking either of the gas sources","Disconnect the air hose to silence the alarm and run on the oxygen alone","Increase the flowmeter setting until the alarm stops sounding"],"key":0,"why":"If a blender pressure alarm sounds after both gas sources are attached, verify that both gas sources are at the required inlet pressures — usually at least 35 psig — then check for leaks between the gas source and the blender. If these check out, replace the blender.","src":[[9252,9258]],"origin":"heuer","age":"adult"},{"id":"C06-Q19","sec":"II-A","lvl27":"integ","topic":"High-flow nasal cannula","stem":"How does a high-flow nasal cannula benefit a patient with hypercapnia?","opts":["It washes CO₂ out of upper-airway deadspace","It chemically absorbs CO₂ in the humidifier","It increases the anatomic deadspace","It raises the PaCO₂ set point of the brainstem"],"key":0,"why":"For patients with hypercapnia, a high-flow nasal cannula can decrease ventilatory demand by washing out CO₂ from upper airway deadspace. High flows can also produce CPAP, which may benefit neonates and infants with hypoxemic respiratory failure.","src":[[9282,9285]],"origin":"heuer","age":"adult"},{"id":"C06-Q20","sec":"II-A","lvl27":"integ","topic":"O₂ device selection","stem":"An unstable COPD patient requires a precise low FiO₂. The best device is:","opts":["An air-entrainment mask at 24 or 28%","A nasal cannula at 2 L/min","A nonrebreathing mask at 10 L/min","A simple mask at 6 L/min"],"key":0,"why":"For an unstable COPD patient requiring a precise low FiO₂, the recommended system is an air-entrainment mask at 24 or 28%. A nasal cannula and simple mask are variable-performance low-flow devices.","src":[[9407,9408]],"origin":"heuer","age":"adult"},{"id":"C06-Q21","sec":"II-A","lvl27":"integ","topic":"O₂ device selection","stem":"A patient arrives in the emergency department with chest pain and suspected MI. The recommended O₂ system is:","opts":["A nonrebreathing mask at > 10 L/min or HFNC at ≥ 20 L/min at 100%","A nasal cannula at 2 L/min, titrated to an SpO₂ of 88–92%","An air-entrainment mask at 28% with a total flow of 40 L/min","A tracheostomy collar at 35% with a heated aerosol"],"key":0,"why":"For a patient admitted to the ED with chest pain and suspected MI, recommend a nonrebreathing mask at greater than 10 L/min, or a high-flow nasal cannula at 20 L/min or more at 100%.","src":[[9400,9401]],"origin":"heuer","age":"adult"},{"id":"C06-Q22","sec":"II-A","lvl27":"integ","topic":"O₂ device selection","stem":"An infant requires a high FiO₂ with temperature control. The recommended system is:","opts":["An oxyhood with servo-controlled heated humidity, or HFNC","A simple O₂ mask at 5–8 L/min with a bubble humidifier","A nasal cannula at ¼–2 L/min with a heated humidifier","A partial rebreathing mask at 10 L/min in an incubator"],"key":0,"why":"For an infant requiring high FiO₂ and temperature control, recommend an oxyhood at 6–8 L/min with a servo-controlled heated humidification system, or a high-flow nasal cannula at 1–8 L/min. A simple O₂ mask suits an infant needing short-term moderate O₂.","src":[[9426,9427],[9423,9424]],"origin":"heuer","age":"child"},{"id":"C06-Q23","sec":"II-A","lvl27":"integ","topic":"Oxyhood","stem":"An infant oxyhood meets the definition of a high-flow device when used at:","opts":["The recommended flow of 6–8 L/min","Any flow above 2 L/min","Flows above 15 L/min","Only when combined with a blender"],"key":0,"why":"Although technically a reservoir system, the infant oxyhood meets the definition of a high-flow device when used at the recommended flow of 6–8 L/min.","src":[[9129,9132]],"origin":"heuer","age":"child"},{"id":"C06-Q24","sec":"II-A","lvl27":"integ","topic":"Cylinders","stem":"When opening a cylinder valve you should:","opts":["Open it fully, then turn it back half a turn","Open it only a quarter turn, then stop","Open it rapidly to seat the valve seal","Leave it half open for the whole time in use"],"key":0,"why":"Slowly open the cylinder valve all the way and then turn back half a turn to prevent valve freezing when fully open. Then record the pressure and compute flow duration.","src":[[9509,9511]],"origin":"heuer","age":"adult"},{"id":"C06-Q25","sec":"II-A","lvl27":"integ","topic":"Cylinders","stem":"You hear a hissing sound from a cylinder regulator. The most likely cause is:","opts":["A loose connection or a missing or damaged PISS washer","Normal pressure equalization inside the regulator","An overfilled cylinder venting through its relief valve","Condensation freezing in the cylinder valve stem"],"key":0,"why":"If you hear the tank leaking with a hissing sound, check for a loose connection or missing or damaged washers on PISS regulators.","src":[[9507,9508]],"origin":"heuer","age":"adult"},{"id":"C06-Q26","sec":"II-A","lvl27":"integ","topic":"Transport equipment","stem":"Which flowmeter should be used on a cylinder during patient transport?","opts":["A Bourdon gauge or other flow device unaffected by gravity","A back-pressure-compensated Thorpe tube flowmeter","An uncompensated Thorpe tube flowmeter","No flowmeter, since the regulator alone sets the flow"],"key":0,"why":"When using cylinders for transport, use a flowmeter unaffected by gravity — either a Bourdon gauge or an integrated regulator/variable orifice flow controller such as the Praxair Grab 'n Go or Western Medica Oxytote.","src":[[9493,9495]],"origin":"heuer","age":"adult"},{"id":"C06-Q27","sec":"II-A","lvl27":"integ","topic":"Transport equipment","stem":"A ventilated patient must be transported for an MRI. Regarding the gas equipment, you must:","opts":["Use iron-free equipment, such as aluminum cylinders and brass regulators","Use standard steel cylinders, secured to the wall of the scanner room","Remove all regulators and bag the patient with room air during the scan","Use any cylinder, provided it is chained securely to a transport cart"],"key":0,"why":"If the patient is being transported for an MRI study, you must use iron-free equipment — for example aluminum cylinders and carts, and brass and aluminum regulators. A ventilator certified for MRI use is also required.","src":[[9495,9497],[10362,10362]],"origin":"heuer","age":"adult"},{"id":"C06-Q28","sec":"II-A","lvl27":"integ","topic":"Portable concentrators","stem":"Why can most pulse-dose-only portable oxygen concentrators be inadequate in an airliner cabin?","opts":["Only continuous-flow units can deliver more than 30% O₂","Pulse-dose units cannot run on battery power in flight","Cabin pressure disables the inspiratory sensing circuit","Pulse-dose units deliver more than the prescribed dose"],"key":0,"why":"Most POCs deliver O₂ only in pulse-dose mode, which suffices for those with low O₂ needs of 30% or less. In general, only continuous-flow units can provide more than 30% O₂, which is needed to provide adequate FiO₂ at high altitudes such as in airliner cabins.","src":[[9573,9576]],"origin":"heuer","dropped":"\"Long-term oxygen therapy\" device heading (2020 II-A.2) is not on the 2027 outline","age":"adult"},{"id":"C06-Q29","sec":"II-A","lvl27":"integ","topic":"Portable concentrators","stem":"When connecting a portable oxygen concentrator, the preferred order of power sources is:","opts":["AC first, auto-DC next, battery last","Battery first, AC next, DC last","DC first, battery next, AC last","Any order; all provide equal output"],"key":0,"why":"Connect the unit to the best available power source — AC first, auto-DC next, battery last. After start-up the unit should reach maximum O₂ output in approximately 1–2 minutes.","src":[[9585,9591]],"origin":"heuer","dropped":"\"Long-term oxygen therapy\" device heading (2020 II-A.2) is not on the 2027 outline","age":"adult"},{"id":"C06-Q30","sec":"II-A","lvl27":"integ","topic":"Conserving devices","stem":"If an oxygen-conserving (demand-flow) device fails, the patient must switch to:","opts":["A continuous O₂ source at 2–3 times the conserving device flow","The same flow, delivered from a continuous source","Half the conserving device's flow, delivered continuously","Room air until a replacement device can be delivered"],"key":0,"why":"Pulse-dose and demand-flow systems use sensors to trigger a valve delivering O₂ only during inspiration, and flow must be individually adjusted to achieve the desired SpO₂. If the device fails, the patient must switch to a continuous O₂ source at 2–3 times the conserving device flow.","src":[[9655,9661]],"origin":"heuer","age":"adult"},{"id":"C06-Q31","sec":"II-A","lvl27":"integ","topic":"Demand-flow troubleshooting","stem":"A demand-flow device is delivering oxygen continuously rather than in pulses. The likely cause is:","opts":["It is in bypass mode from failure to sense inspiration, or set to continuous","The oxygen source is empty, so the unit has switched to its reserve tank","The pulse-dose setting is too low, reducing the O₂ in each pulse","The cylinder pressure is low, reducing the available O₂ supply"],"key":0,"why":"Oxygen delivered continuously means the unit is in bypass mode due to failure to sense inspiration, and/or the selector knob is set to continuous flow mode. Reset by turning the unit off then on, check the cannula and tubing connections, adjust the cannula fit, and confirm the selector is set to pulse.","src":[[9706,9720]],"origin":"heuer","age":"adult"},{"id":"C06-Q32","sec":"II-A","lvl27":"integ","topic":"CPAP","stem":"Infant CPAP prongs that are too LARGE can cause:","opts":["Tissue erosion","Difficulty maintaining the prescribed pressure","Excessive deadspace","Auto-triggering"],"key":0,"why":"A proper fit is essential for pressure maintenance and patient tolerance. Prongs that are too small can cause difficulty maintaining the prescribed pressure, whereas prongs that are too large can cause tissue erosion.","src":[[9735,9737]],"origin":"heuer","age":"child"},{"id":"C06-Q33","sec":"II-A","lvl27":"integ","topic":"Nebulizer selection","stem":"Which nebulizer is preferred for delivering medication to a mechanically ventilated patient?","opts":["A vibrating-mesh nebulizer, since it adds no flow to the circuit","A large-volume air-entrainment nebulizer in the inspiratory limb","A standard jet small-volume nebulizer powered at 8 L/min","A continuous nebulizer driven by an external flowmeter"],"key":0,"why":"A vibrating-mesh nebulizer creates aerosol droplets by vibration and needs inspiratory or circuit flow to deliver. It is preferred with mechanically ventilated patients because no additional flow or volume is introduced into the circuit.","src":[[10046,10050]],"origin":"heuer","age":"adult"},{"id":"C06-Q34","sec":"II-A","lvl27":"integ","topic":"Aerosol troubleshooting","stem":"Aerosol mist from a large-volume nebulizer disappears during the patient's inspiration. Appropriate corrections include:","opts":["Maximize input flow, add a reservoir to the T-tube, or run nebulizers in parallel","Reduce the input flow to conserve gas and lengthen each of the treatments","Obstruct the entrainment port to raise the output of mist from the jet orifice","Switch the patient to a dry-powder inhaler for the medication"],"key":0,"why":"Mist disappearing during inspiration reflects inadequate flow relative to the patient's inspiratory demand. Corrections are to maximize input flow, add an open reservoir to the expiratory side of the T-tube, connect multiple nebulizers in parallel, or use a gas injection nebulizer.","src":[[10068,10077]],"origin":"heuer","age":"adult"},{"id":"C06-Q35","sec":"II-A","lvl27":"integ","topic":"Spacers","stem":"Why should plastic spacers and valved holding chambers be air dried rather than towel dried?","opts":["Towel drying can build a static charge that draws drug to the walls","Towels leave lint behind that can block the one-way valve leaflets","Towel drying warps the plastic and loosens the mouthpiece fitting","Air drying sterilizes the device between the treatments"],"key":0,"why":"Manually drying plastic spacers and chambers may generate an electrostatic charge on their surface that draws medication to the insides of the chamber or spacer. Most manufacturers recommend periodic cleaning with soap and water and letting them air dry.","src":[[10205,10209]],"origin":"heuer","age":"adult"},{"id":"C06-Q36","sec":"II-A","lvl27":"integ","topic":"Ventilator circuits","stem":"During a ventilator pre-use check, why must you never use a \"cheater hose\" in place of the actual circuit?","opts":["The real circuit must be leak-tested and its compressible volume measured","Cheater hoses cannot be sterilized and must be discarded after each use","The ventilator cannot detect a cheater hose, so the check always fails","Cheater hoses add excessive deadspace to the circuit during the check"],"key":0,"why":"Never use a cheater hose for the pre-use check. Use the actual circuit so it can be checked for leaks, measured and compensated for compressible volume, and so you can ensure the circuit withstands the flow and pressure applied during the check.","src":[[10458,10463]],"origin":"heuer","age":"adult"},{"id":"C06-Q37","sec":"II-A","lvl27":"integ","topic":"Ventilator troubleshooting","stem":"A ventilated patient triggers multiple alarms and you cannot immediately identify the cause. Your FIRST action is to:","opts":["Remove the patient and ventilate with a manual resuscitator and PEEP valve on O₂","Run a circuit leak test with the patient still connected to the ventilator","Silence the alarms and reassess the patient and the ventilator in 2 minutes","Increase the high-pressure limit and continue to ventilate as before"],"key":0,"why":"Because you must always attend to patient needs first, when any major problem is suspected immediately remove the patient from the ventilator and provide support using a manual resuscitator with a PEEP valve connected to an O₂ source. If that resolves the problem, the ventilator or circuit was the cause and others can troubleshoot while you support the patient.","src":[[10474,10479]],"origin":"heuer","age":"adult"},{"id":"C06-Q38","sec":"II-A","lvl27":"integ","topic":"Ventilator troubleshooting","stem":"A ventilator alarms LOW volume together with LOW pressure. This combination indicates:","opts":["A leak","An inspiratory obstruction","An expiratory obstruction","A jammed expiratory valve"],"key":0,"why":"Leaks produce low-volume plus low-pressure alarms. Both inspiratory and expiratory obstructions instead produce low-volume plus HIGH-pressure alarms.","src":[[10525,10540]],"origin":"heuer","age":"adult"},{"id":"C06-Q39","sec":"II-A","lvl27":"integ","topic":"Ventilator troubleshooting","stem":"Why is expiratory obstruction more dangerous than inspiratory obstruction, and what is its most dangerous form?","opts":["It can cause rebreathing, asphyxia, or barotrauma; worst is a blocked single-limb exhalation port","It causes only a nuisance low-pressure alarm; worst is a kinked inspiratory limb near the vent","It lowers the delivered FiO₂; worst is a clogged HEPA filter at the ventilator's gas outlet","It causes auto-PEEP alone; worst is condensate pooled in the circuit wye"],"key":0,"why":"Circuit obstructions are always associated with low-volume and high-pressure alarms. Expiratory obstruction is the more serious of the two because it can result in rebreathing, asphyxia, or barotrauma. The most dangerous type occurs when the exhalation port on a single-limb circuit becomes obstructed, so prevent patients from grasping the circuit and keep bedding clear of the port.","src":[[10491,10497]],"origin":"heuer","age":"adult"},{"id":"C06-Q40","sec":"II-A","lvl27":"integ","topic":"Ventilator circuits","stem":"A patient is on NPPV. Which circuit type is appropriate and why does it minimize deadspace?","opts":["Single-limb with a leak port; continuous flow and mask leak flush out expired gas","Dual-limb wye circuit; the separate expiratory limb removes all of the expired gas","Single-limb with a mushroom valve; the valve vents all of the expired gas","Any circuit, because noninvasive ventilation has no mechanical deadspace"],"key":0,"why":"NPPV ventilators use a single-limb circuit with a leakage-type exhaust port. The continuous flow these ventilators provide forces expired gas out the exhaust port during exhalation and, combined with the leakage common to all NPPV interfaces, prevents rebreathing of most expired gas — minimizing mechanical deadspace.","src":[[10402,10412],[10418,10424]],"origin":"heuer","age":"adult"},{"id":"C06-Q41","sec":"II-A","lvl27":"integ","topic":"NPPV interfaces","stem":"A patient with hypercapnic respiratory failure needs an NPPV interface. Which is preferred and why?","opts":["Nasal appliances, because of their lesser deadspace","A full face mask, because of its lower leakage","Nasal pillows, because they never cause pressure sores","An oral device, because it prevents all leakage"],"key":0,"why":"For patients with hypercapnic respiratory failure, nasal appliances are preferred due to their lesser deadspace. Full face masks have lower leakage and may be best for short-term treatment of hypoxemic and hypercapnic failure in acute care, but should be avoided when there is a high risk of vomiting or aspiration.","src":[[10428,10436]],"origin":"heuer","age":"adult"},{"id":"C06-Q42","sec":"II-A","lvl27":"integ","topic":"Deadspace","stem":"Which action will INCREASE mechanical deadspace in a dual-limb ventilator circuit?","opts":["Adding an HME or CO₂ adaptor between the wye and the airway","Adding a water trap to the expiratory limb of the circuit","Lengthening the inspiratory limb with a section of tubing","Adding a HEPA filter at the ventilator's gas outlet"],"key":0,"why":"The mechanical deadspace or rebreathed volume in dual-limb circuits lies between the circuit wye and the patient's airway. Any tubing or device added between these connections — such as an HME, MDI, or end-tidal CO₂ adaptor — will increase mechanical deadspace. An HME always adds some deadspace.","src":[[10385,10388],[10453,10454]],"origin":"heuer","age":"adult"},{"id":"C06-Q43","sec":"II-A","lvl27":"integ","topic":"Humidification","stem":"A ventilated patient on an HME develops copious, thick secretions and now requires aerosolized medication. You should:","opts":["Switch to heated (active) humidification","Add a second HME in series","Increase the ventilator flow rate","Instill saline before each suction pass"],"key":0,"why":"Copious, thick secretions indicate inadequate humidification; assure good systemic hydration and switch to heated active humidification. The need to administer aerosolized medications is a separate indication to switch, because the HME filters the medication and can itself become obstructed by it.","src":[[9962,9973]],"origin":"heuer","age":"adult"},{"id":"C06-Q44","sec":"II-A","lvl27":"integ","topic":"AED use","stem":"An AED indicates \"no shock advised\" in a pulseless patient. You should:","opts":["Resume CPR — the rhythm is likely asystole or PEA","Repeat the rhythm analysis immediately","Increase the energy setting and shock anyway","Check for a pulse every 30 seconds without CPR"],"key":0,"why":"If the unit says no shock is needed, resume CPR — remember the patient is pulseless. Pulseless nonshockable situations include asystole and pulseless electrical activity. Repeat analysis and the steps that follow every 2 minutes, about five CPR cycles, switching rescuer positions at that time.","src":[[10265,10272]],"origin":"heuer","age":"adult"},{"id":"C06-Q45","sec":"II-A","lvl27":"integ","topic":"AED use","stem":"You are about to apply AED pads to a patient with an implanted defibrillator and a transdermal medication patch on the chest. You should:","opts":["Avoid the device, remove the patch, and wipe the skin","Place a pad directly over the device for best conduction","Leave the patch in place and apply a pad over it","Withhold defibrillation until a cardiologist is present"],"key":0,"why":"Do not place pads directly over implanted defibrillators or pacemakers, or on top of transdermal medication patches; remove the medication patch and wipe the area. Similarly, a wet chest must be dried and a hairy chest shaved or stripped with a spare set of pads.","src":[[10282,10288]],"origin":"heuer","age":"adult"},{"id":"C07-Q01","sec":"II-B","lvl27":"recall","topic":"Transmission routes","stem":"Droplet transmission involves particles of what size, and requires what proximity?","opts":["Larger than 5 μm; close contact, generally 3 feet or less","5 μm or smaller; any distance including between rooms","Larger than 10 μm; contact with the patient's skin","Any size; only direct contact matters"],"key":0,"why":"Droplet transmission is the spread of microorganisms in the air via large droplets larger than 5 μm. Because large droplets fall out of suspension quickly they travel only short distances, so droplet transmission requires close contact, generally 3 feet or less. Airborne transmission involves droplet nuclei 5 μm or smaller that can travel long distances, even between rooms.","src":[[12344,12357]],"origin":"heuer","age":"adult"},{"id":"C07-Q02","sec":"II-B","lvl27":"recall","topic":"Airborne precautions","stem":"Which set of conditions requires airborne precautions?","opts":["Tuberculosis, measles, chickenpox, Aspergillus, SARS, smallpox","Bacterial meningitis, pertussis, influenza, mumps, rubella","C. difficile, norovirus, MRSA, wound and skin infections","Epiglottitis and group A streptococcal infections"],"key":0,"why":"Airborne precautions apply to tuberculosis, measles (rubeola), chickenpox (varicella-zoster), Aspergillus infections, SARS, and smallpox (variola). Bacterial meningitis, whooping cough, influenza, mumps, rubella, diphtheria, group A Streptococcus, and epiglottitis require DROPLET precautions, while C. difficile, norovirus, MRSA, and wound/skin infections require CONTACT precautions.","src":[[12463,12489],[12517,12518]],"origin":"heuer","age":"adult"},{"id":"C07-Q03","sec":"II-B","lvl27":"recall","topic":"Airborne precautions","stem":"A patient on airborne precautions must be placed in:","opts":["A private negative-pressure isolation room, door closed","A private room with the door open and normal air handling","A semiprivate room with a curtain between the beds","A positive-pressure room with the door closed"],"key":0,"why":"Airborne precautions require placing the patient in a private negative-pressure airborne infection isolation room (AIIR) with the door closed, and wearing a fit-tested N95 respirator certified by NIOSH when entering. Droplet precautions require only a private room; special air handling and ventilation are not needed and the door can stay open.","src":[[12518,12537],[12488,12492]],"origin":"heuer","age":"adult"},{"id":"C07-Q04","sec":"II-B","lvl27":"recall","topic":"Personal protective equipment","stem":"What is the correct sequence for APPLYING personal protective equipment?","opts":["Hair and foot coverings, gown, mask, goggles, gloves","Gloves, gown, mask, goggles, hair and foot coverings","Gown, gloves, mask, goggles, hair and foot coverings","Mask, goggles, gown, gloves, hair and foot coverings"],"key":0,"why":"PPE is applied in the order: hair and foot coverings, gown, mask, goggles or face shield, then gloves. It is REMOVED in the order: hair and foot coverings, goggles or face shield, mask, gloves (pulled down from the wrist and turned inside out), then gown (removed from the inside out).","src":[[12441,12452]],"origin":"heuer","age":"adult"},{"id":"C07-Q05","sec":"II-B","lvl27":"recall","topic":"Disinfection levels","stem":"Which term describes the destruction of ALL forms of microbial life, including bacteria, viruses, spores, and fungi?","opts":["Sterilization","High-level disinfection","Decontamination","Sanitation"],"key":0,"why":"Sterilization is the destruction of all forms of microbial life, including bacteria, viruses, spores, and fungi. High-level disinfection destroys vegetative bacteria, mycobacteria, fungi, and viruses but not necessarily bacterial spores, although some high-level disinfectants can sterilize given adequate contact time.","src":[[12309,12331]],"origin":"heuer","age":"adult"},{"id":"C07-Q06","sec":"II-B","lvl27":"recall","topic":"Hand hygiene","stem":"What is the best way to help prevent transmission of hospital-acquired infections?","opts":["Good hand hygiene","Wearing gloves at all times","Routine environmental sanitation","Annual respirator fit testing"],"key":0,"why":"Because most hospital-acquired infections occur due to direct contact between patients and healthcare workers, good hand hygiene is the best way to help prevent transmission of infections. It is also part of the CDC respiratory hygiene/cough etiquette guideline applying to patients, visitors, and healthcare workers.","src":[[12275,12279]],"origin":"heuer","age":"adult"},{"id":"C08-Q01","sec":"II-B","lvl27":"recall","topic":"QC terminology","stem":"Which term describes the reproducibility or repeatability of an analyzer's results for the same analyte over multiple measurements?","opts":["Precision","Accuracy","Bias","Linearity"],"key":0,"why":"Precision is the reproducibility or repeatability of an analyzer's results for the same analyte over multiple measurements. Accuracy is the degree to which a reading coincides with its true value, and bias is systematic inaccuracy — consistently high or low variation from the true value.","src":[[13057,13096]],"origin":"heuer","age":"adult"},{"id":"C08-Q02","sec":"II-B","lvl27":"recall","topic":"QC terminology","stem":"Errors caused by mistakes in the collection, handling, or storage of samples BEFORE analysis are called:","opts":["Preanalytical errors","Analytical errors","Postanalytical errors","Bias errors"],"key":0,"why":"Preanalytical errors are result errors due to mistakes in the collection, handling, or storage of samples before analysis. Analytical errors occur during measurement and analysis, and postanalytical errors occur in data handling, results reporting, or interpretation.","src":[[13061,13092]],"origin":"heuer","age":"adult"},{"id":"C08-Q03","sec":"II-B","lvl27":"recall","topic":"Preanalytical errors","stem":"The most common preanalytical errors affecting blood gas and hemoximetry measurements are:","opts":["Air contamination, venous admixture, and ongoing metabolism","Incorrect calibration gases and contaminated buffer solutions","Transcription mistakes and mislabeled reports in the chart","Electrode drift and poor linearity across the measured range"],"key":0,"why":"The most common preanalytical errors affecting blood gas and hemoximetry measurements are air contamination, venous admixture, and continued blood metabolism. These errors can yield invalid measurements leading to incorrect decisions and potential patient harm.","src":[[13111,13116]],"origin":"heuer","age":"adult"},{"id":"C08-Q04","sec":"II-B","lvl27":"recall","topic":"Calibration verification","stem":"Calibration verification typically involves analysis of how many levels of control media, and how often?","opts":["At least three levels spanning the range, at least daily","One level near the normal value, once per week","Two levels at the high and low ends, once per month","Five levels across the full range, once per week"],"key":0,"why":"Calibration verification involves analysis of prepared control media — analytes independently certified to provide a known measurement value. It typically involves at least three different levels of control media spanning the full range of expected results and is conducted at least daily, plus after any instrument maintenance and whenever instrument performance is questioned.","src":[[13158,13164]],"origin":"heuer","age":"adult"},{"id":"C08-Q05","sec":"II-B","lvl27":"recall","topic":"Calibration verification","stem":"What is the gold standard procedure for calibration verification of PO₂ and PCO₂ measurements?","opts":["Tonometry","Levy-Jennings charting","Proficiency testing","Inter-instrumental comparison"],"key":0,"why":"The gold standard for calibration verification of PO₂ and PCO₂ measurements is tonometry, which involves exposing and equilibrating liquid media — blood or control solution — to a reference gas with known partial pressures.","src":[[13165,13167]],"origin":"heuer","age":"adult"},{"id":"C08-Q06","sec":"II-B","lvl27":"recall","topic":"Statistical QC","stem":"On a Levy-Jennings chart, bounding limits are typically set at:","opts":["±2 standard deviations from the mean","±1 standard deviation from the mean","±3 standard deviations from the mean","±10% of the mean"],"key":0,"why":"A Levy-Jennings chart plots individual control values over multiple measurements against the mean and standard deviation. Bounding limits are typically set to within ±2 SD. Control measurements consistently within these limits indicate the analyzer is in control and ready for sample measurement.","src":[[13183,13190]],"origin":"heuer","age":"adult"},{"id":"C08-Q07","sec":"II-B","lvl27":"integ","topic":"Statistical QC","stem":"A single control value on day 16 falls outside the ±2 SD limit, but all subsequent measurements are within limits. You should:","opts":["Take no remedial action — this is a random error","Remove the analyzer from service immediately","Recalibrate and re-report all prior patient results","Switch permanently to point-of-care testing"],"key":0,"why":"Single irregular values are relatively common and are due to random errors of measurement that occur with any instrument. If subsequent measures are within the control limits, no remedial action is needed. Frequent random errors would instead indicate a lack of precision, and an instrument with poor repeatability over time is out of control.","src":[[13191,13201]],"origin":"heuer","age":"adult"},{"id":"C08-Q08","sec":"II-B","lvl27":"integ","topic":"Statistical QC","stem":"A Levy-Jennings chart shows a sustained upward trend in the 40-torr PCO₂ control beginning at observation 20. This represents:","opts":["Systematic error (bias); stop patient testing until it is corrected","Random error; it requires no action if the next value is in range","Normal analyzer drift that remains within the specification","Expired control media; the analyzer itself needs no attention"],"key":0,"why":"An upward trend over time shifts the mean above the control value, producing a positive measurement bias. Bias errors are generally more serious than random errors, indicating either an incorrect procedure or instrument failure. Whenever instrument bias is identified, no patient samples should be analyzed until the problem is corrected.","src":[[13213,13219]],"origin":"heuer","age":"adult"},{"id":"C08-Q09","sec":"II-B","lvl27":"integ","topic":"Point-of-care testing","stem":"A point-of-care analyzer fails to calibrate. The correct sequence of actions is:","opts":["Rerun with a new cartridge; if it fails again, remove the device from service","Report the result at once, with a disclaimer about the quality control","Recalibrate the device manually, using room air as the reference gas","Continue testing and compare against the bench-top analyzer later"],"key":0,"why":"Most POCT cartridges include solutions for automated calibration. If a POCT device fails to calibrate, rerun the test with a new cartridge. If a second attempt fails, remove the device from service and either obtain a replacement analyzer or send the sample to the central lab.","src":[[13280,13283]],"origin":"heuer","age":"adult"},{"id":"C09-Q01","sec":"III-A","lvl27":"recall","topic":"Mallampati classification","stem":"A Mallampati Class IV airway means the examiner can visualize:","opts":["Only the hard palate","The soft palate, uvula, and pillars/tonsils","The soft palate and a portion of the uvula","The soft palate and only the base of the uvula"],"key":0,"why":"Mallampati Class IV means only the hard palate is visible, predicting very difficult intubation. Class I is the soft palate, uvula, and pillars/tonsils (easiest); Class II the soft palate and part of the uvula; Class III the soft palate and only the base of the uvula (difficult).","src":[[14018,14026]],"origin":"heuer","age":"adult"},{"id":"C09-Q02","sec":"III-A","lvl27":"recall","topic":"Difficult BVM ventilation","stem":"The M-O-A-N-S mnemonic for predicting difficult bag-valve-mask ventilation stands for:","opts":["Mask seal, Obesity/Obstruction, Aged, No teeth, Stiff lungs","Mouth opening, Oxygenation, Airway, Neck mobility, Suction","Mandible, Occlusion, Age, Nares, Sedation level","Mask, Oral airway, Anesthesia, Nasal airway, Stridor"],"key":0,"why":"M-O-A-N-S stands for Mask seal, Obesity/Obstruction, Aged, No teeth (edentulous), and Stiff lungs. It helps the clinician predict difficult BVM ventilation.","src":[[14012,14014]],"origin":"heuer","age":"adult"},{"id":"C09-Q03","sec":"III-A","lvl27":"recall","topic":"Difficult intubation","stem":"The L-E-M-O-N mnemonic for predicting difficult intubation stands for:","opts":["Look externally, Evaluate anatomy, Mallampati, Obesity/Obstruction, Neck mobility","Laryngoscope, Endotracheal tube, Mask, Oxygen supply, Nasal airway size","Level of consciousness, Edema, Mandible size, Oropharynx, Nares","Lubricate the tube, Elevate the head, Measure, Observe, Note the depth"],"key":0,"why":"L-E-M-O-N stands for Look externally, Evaluate external anatomy, Mallampati classification, Obesity/Obstruction, and Neck mobility.","src":[[14072,14074]],"origin":"heuer","age":"adult"},{"id":"C09-Q04","sec":"III-A","lvl27":"recall","topic":"Endotracheal tube sizing","stem":"The recommended endotracheal tube for an adult male is:","opts":["8.0–9.0 mm ID, inserted 21–23 cm","7.0–8.0 mm ID, inserted 19–21 cm","6.5 mm ID, inserted 17–19 cm","8.5+ mm ID, inserted 23+ cm"],"key":0,"why":"For an adult male, select an 8.0–9.0 mm ID tube with an insertion length of 21–23 cm measured from the incisors to the tube tip. Adult females use 7.0–8.0 mm ID at 19–21 cm. For the nasotracheal route in adults, add 2 cm to the insertion length.","src":[[14514,14544]],"origin":"heuer","age":"adult"},{"id":"C09-Q05","sec":"III-A","lvl27":"recall","topic":"Endotracheal tube cuff","stem":"After intubation, the ETT cuff should be inflated to:","opts":["20–30 cm H₂O","40–50 cm H₂O","60 cm H₂O","10–15 cm H₂O"],"key":0,"why":"Inflate the cuff to 20–30 cm H₂O. This limit applies to infants and children as well when cuffed tubes are used, per manufacturer's specifications.","src":[[14560,14560],[14507,14509]],"origin":"heuer","age":"adult"},{"id":"C09-Q06","sec":"III-A","lvl27":"recall","topic":"Laryngeal mask airway","stem":"The LMA cuff should be inflated to a maximum pressure of:","opts":["60 cm H₂O","30 cm H₂O","20 cm H₂O","100 cm H₂O"],"key":0,"why":"Inflate the LMA cuff to 60 cm H₂O. Avoid pressures greater than 60 cm H₂O, which can cause malpositioning or tissue damage. Table 9-7 maximum volumes should never be exceeded, though lesser volumes are often sufficient to achieve a seal at 60 cm H₂O.","src":[[14430,14449]],"origin":"heuer","age":"adult"},{"id":"C09-Q07","sec":"III-A","lvl27":"recall","topic":"Laryngeal mask airway","stem":"For an adult weighing 50–70 kg, the recommended LMA size and maximum cuff volume are:","opts":["Size 4, 30 mL","Size 5, 40 mL","Size 3, 20 mL","Size 6, 50 mL"],"key":0,"why":"Adults 50–70 kg use LMA size 4 with a maximum cuff volume of 30 mL. Adults 70–100 kg use size 5 at 40 mL, and adults over 100 kg use size 6 at 50 mL.","src":[[14412,14428]],"origin":"heuer","age":"adult"},{"id":"C09-Q08","sec":"III-A","lvl27":"recall","topic":"Subglottic ETT","stem":"A subglottic (Hi-Lo) endotracheal tube connects its extra lumen to continuous suction at approximately:","opts":["−25 cm H₂O","−80 cm H₂O","−120 cm H₂O","−5 cm H₂O"],"key":0,"why":"Subglottic ETTs have an extra-small lumen opening just above the ETT cuff, with the proximal end connected to continuous low-level suction at approximately −25 cm H₂O. They continuously remove secretions that would otherwise pool above the cuff, reducing aspiration risk and ventilator-associated infection.","src":[[14614,14621]],"origin":"heuer","age":"adult"},{"id":"C09-Q09","sec":"III-A","lvl27":"recall","topic":"Tracheostomy tubes","stem":"According to the textbook, what is the usual upper limit for a tracheostomy tube's outside diameter, as a fraction of the tracheal internal diameter?","opts":["Two-thirds to three-fourths","Four-fifths to nine-tenths","Nine-tenths to all of it","One-fourth to one-third"],"key":0,"why":"When a doctor selects a trach tube, primary consideration is given to the outside diameter, especially for cuffed tubes. The OD should generally be no more than two-thirds to three-fourths of the ID of the trachea. Bigger tubes impede airflow around a deflated cuff; smaller tubes may need unacceptably high cuff pressures to seal.","src":[[14631,14635]],"origin":"heuer","age":"adult"},{"id":"C09-Q10","sec":"III-A","lvl27":"integ","topic":"Patient positioning","stem":"A patient with a suspected cervical spine injury requires airway opening. You should use:","opts":["Jaw thrust without head extension","Head-tilt/chin-lift maneuver","Sniffing position with a pillow","Full Trendelenburg positioning"],"key":0,"why":"The jaw-thrust maneuver without head extension minimizes neck movement in patients with a suspected cervical spine injury. The sniffing position is used for intubation but is not to be used with a suspected cervical spine injury.","src":[[13910,13932]],"origin":"heuer","age":"adult"},{"id":"C09-Q11","sec":"III-A","lvl27":"integ","topic":"Patient positioning","stem":"To help prevent ventilator-associated pneumonia, the head of the bed should be elevated:","opts":["30 degrees or more, unless contraindicated","10 to 15 degrees, unless contraindicated","Flat, to promote postural drainage","20 degrees for 1 hour after each feeding"],"key":0,"why":"Elevating the head of the bed by 30 degrees or more, unless contraindicated, helps prevent gastric reflux aspiration and improves the distribution of ventilation and efficiency of diaphragmatic action.","src":[[13934,13938]],"origin":"heuer","age":"adult"},{"id":"C09-Q12","sec":"III-A","lvl27":"integ","topic":"Patient positioning","stem":"Prone positioning is indicated for ARDS when:","opts":["P/F < 150 with FiO₂ > 0.60 and PEEP ≥ 5 cm H₂O","P/F < 300 on any FiO₂, with or without PEEP","The patient has unilateral lung disease or an abscess","The patient requires postural drainage of the upper lobes"],"key":0,"why":"Prone position is used if severe ARDS is present — a P/F ratio below 150 with FiO₂ above 0.60 and PEEP of at least 5 cm H₂O. Proning recruits collapsed lung units and shifts blood flow away from shunt regions, improving V/Q balance and oxygenation.","src":[[13941,13946]],"origin":"heuer","age":"adult"},{"id":"C09-Q13","sec":"III-A","lvl27":"integ","topic":"Patient positioning","stem":"A patient has unilateral left lower lobe pneumonia. To improve oxygenation you should position them:","opts":["Right lateral decubitus, with the good lung down","Left lateral decubitus, with the affected lung down","Supine with the head of the bed flat","Prone"],"key":0,"why":"The lateral decubitus position with the good lung down improves oxygenation by diverting blood flow and ventilation to the dependent (good) lung. With left-sided disease, the good right lung goes down. Exceptions to the keep-the-good-lung-down rule include lung abscess or bleeding, where the good lung is kept up to prevent blood or pus from entering it, and infants with unilateral PIE.","src":[[13949,13952],[13967,13970]],"origin":"heuer","age":"adult"},{"id":"C09-Q14","sec":"III-A","lvl27":"integ","topic":"Oropharyngeal airways","stem":"How do you tailor the size of an oropharyngeal airway to an individual patient?","opts":["Corner of the mouth to the angle of the jaw (or earlobe)","Tip of the nose to the earlobe on the same side","Neck circumference measured at the level of the cricoid","Largest size that will fit past the front teeth"],"key":0,"why":"Size is based primarily on patient age, but tailor it by measuring from the corner of the mouth to the angle of the jaw or from the corner of the mouth to the earlobe. Too large or too small an airway can worsen obstruction. The nares-to-earlobe measurement is used for NASOPHARYNGEAL airways.","src":[[14084,14088],[14169,14171]],"origin":"heuer","age":"adult"},{"id":"C09-Q15","sec":"III-A","lvl27":"integ","topic":"Oropharyngeal airways","stem":"An awake, conscious patient gags on an oropharyngeal airway. You should:","opts":["Remove it at once; consider a nasopharyngeal airway","Tape it in place until the gag reflex subsides","Insert a larger airway to seat it past the tongue","Sedate the patient and leave the airway in place"],"key":0,"why":"To avoid vomiting and aspiration, if the patient gags or otherwise does not tolerate the airway, remove it immediately. Oropharyngeal airways are not recommended for awake, conscious patients — consider a nasopharyngeal airway or reposition the patient using the head-tilt/chin-lift or jaw-thrust maneuver.","src":[[14165,14168]],"origin":"heuer","age":"adult"},{"id":"C09-Q16","sec":"III-A","lvl27":"integ","topic":"Nasopharyngeal airways","stem":"A lubricated nasopharyngeal airway will not pass through the selected naris. You should:","opts":["Try the other naris; if unsuccessful, insert a smaller airway","Apply firm, steady force until the airway passes","Remove the lubricant and try the same naris again","Switch at once to an oropharyngeal airway"],"key":0,"why":"If a lubricated nasopharyngeal airway does not pass, the patient may have a deviated septum or nasal polyps. Insert the airway through the opposite naris; if that is unsuccessful, select and insert a smaller airway. The airway should always be advanced without force along the floor of the nasal passage.","src":[[14186,14189],[14179,14181]],"origin":"heuer","age":"adult"},{"id":"C09-Q17","sec":"III-A","lvl27":"integ","topic":"Intubation procedure","stem":"How far past the vocal cords should an endotracheal tube be advanced?","opts":["Until the cuff disappears, about 2–3 cm past the cords","About 6–7 cm past the cords, to the level of T5","Until resistance is felt at the carina, then back 1 cm","Just until the tip passes the cords, with the cuff above"],"key":0,"why":"Insert the ETT between the vocal cords until the cuff disappears, about 2–3 cm beyond the cords. Placement is then verified by breath sounds, chest wall movement, and CO₂ detection or capnography, and confirmed by x-ray.","src":[[14558,14565]],"origin":"heuer","age":"adult"},{"id":"C09-Q18","sec":"III-A","lvl27":"integ","topic":"Intubation procedure","stem":"How long should a single intubation attempt last, and what is done between attempts?","opts":["≤ 20 seconds per attempt, with 1–2 minutes of oxygenation between","≤ 60 seconds per attempt, with 30 seconds of oxygenation between","As long as needed per attempt, while the SpO₂ stays above 85%","≤ 10 seconds per attempt, with no pause for oxygenation between"],"key":0,"why":"Always provide 1–2 minutes of oxygenation and, if necessary, ventilation between intubation attempts. Intubation attempts should last no more than 20 seconds per attempt.","src":[[14596,14598]],"origin":"heuer","age":"adult"},{"id":"C09-Q19","sec":"III-A","lvl27":"integ","topic":"Tube confirmation","stem":"Using a colorimetric CO₂ detector, correct ETT placement in the lungs is confirmed by:","opts":["A purple to yellow color change over six or more breaths","A yellow to purple color change on the first breath","No color change over three breaths","A blue to green color change over two breaths"],"key":0,"why":"If using a colorimetric CO₂ detector, ETT placement in the lungs is confirmed by observing a purple to yellow color change over six or more breaths, indicating 2.0–5.0% exhaled CO₂ or about 15–38 torr. During resuscitation the AHA recommends continuous quantitative waveform capnography, with a CO₂ detector acceptable if capnography is unavailable.","src":[[14601,14603],[14570,14573]],"origin":"heuer","age":"adult"},{"id":"C09-Q20","sec":"III-A","lvl27":"integ","topic":"Tracheostomy tubes","stem":"What is the purpose of the blunt obturator used during tracheostomy tube insertion?","opts":["It prevents tissue trauma during insertion and is then removed","It holds the cuff deflated during insertion of the tube","It serves as the inner cannula for the first 24 hours","It anchors the tube to the flange while the ties are placed"],"key":0,"why":"The blunt obturator prevents tissue trauma — snowplowing — during insertion. Remove it immediately after insertion but keep it at the bedside
