<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TMC &amp; CSE Trainer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#F6F8F7; --surface:#FFFFFF; --sunk:#EDF1EF;
  --ink:#141D1B; --ink-2:#485854; --ink-3:#778783;
  --rule:#D6DEDB; --rule-2:#E7EDEB;
  --accent:#0E6B59; --accent-ink:#FFFFFF; --accent-soft:#DCEBE6;
  --good:#1F7A56; --good-soft:#DDEFE4;
  --warn:#9A6410; --warn-soft:#F6EBD6;
  --bad:#A63627;  --bad-soft:#F6E2DE;
  --shadow:0 1px 2px rgba(20,29,27,.06), 0 8px 24px -12px rgba(20,29,27,.18);
  --display:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1412; --surface:#151E1C; --sunk:#111917;
    --ink:#E8EFEC; --ink-2:#9FB0AC; --ink-3:#72837F;
    --rule:#2A3634; --rule-2:#1F2A28;
    --accent:#3FB79C; --accent-ink:#06211B; --accent-soft:#16332C;
    --good:#4FBE8C; --good-soft:#143024;
    --warn:#D7A34E; --warn-soft:#332715;
    --bad:#E0796A;  --bad-soft:#331B17;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#0D1412; --surface:#151E1C; --sunk:#111917;
  --ink:#E8EFEC; --ink-2:#9FB0AC; --ink-3:#72837F;
  --rule:#2A3634; --rule-2:#1F2A28;
  --accent:#3FB79C; --accent-ink:#06211B; --accent-soft:#16332C;
  --good:#4FBE8C; --good-soft:#143024;
  --warn:#D7A34E; --warn-soft:#332715;
  --bad:#E0796A;  --bad-soft:#331B17;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--display); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.01em}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono); font-size:11px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--rule);
}
.bar-in{
  max-width:1080px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:8px; margin-right:auto; min-width:0}
.brand b{font-size:15px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.brand span{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.06em}
.bar button.nav{
  font-size:13px; font-weight:500; color:var(--ink-2);
  padding:5px 9px; border-radius:6px;
}
.bar button.nav:hover{background:var(--sunk); color:var(--ink)}
.bar button.nav[aria-current="page"]{background:var(--accent); color:var(--accent-ink)}
.icon-btn{width:32px; height:32px; border-radius:6px; display:grid; place-items:center; color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk); color:var(--ink)}

/* ---------- shell ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:0 16px; padding-block:28px 72px}
.read{max-width:720px}
.lede{font-family:var(--read); font-size:17px; line-height:1.6; color:var(--ink-2); max-width:62ch}

/* ---------- home ---------- */
.hero{display:grid; gap:14px; margin-bottom:32px}
.hero h1{font-size:clamp(26px,5.5vw,38px); line-height:1.1}
.stats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:1px; background:var(--rule); border:1px solid var(--rule);
  border-radius:8px; overflow:hidden; margin:4px 0 8px;
}
.stat{background:var(--surface); padding:12px 14px}
.stat b{display:block; font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--ink-3); margin-top:1px}

.modes{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); margin-top:8px}
.mode{
  text-align:left; background:var(--surface); border:1px solid var(--rule);
  border-radius:10px; padding:16px; display:grid; gap:6px; align-content:start;
  transition:border-color .15s, transform .15s;
}
.mode:hover{border-color:var(--accent); transform:translateY(-1px)}
.mode h3{font-size:16px}
.mode p{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.45}
.mode .tag{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--accent); font-weight:600;
}

/* ---------- blueprint table ---------- */
.blue{margin-top:36px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--rule); border-radius:8px; background:var(--surface); margin-top:12px}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:13px}
th,td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--rule-2)}
thead th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; background:var(--sunk); border-bottom:1px solid var(--rule);
}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.secref{font-family:var(--mono); font-size:11.5px; color:var(--accent); font-weight:600}
.area-row td{background:var(--sunk); font-weight:600; font-size:11px; letter-spacing:.07em;
  text-transform:uppercase; font-family:var(--mono); color:var(--ink-2)}

/* ---------- builder ---------- */
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:18px; display:grid; gap:16px}
.field{display:grid; gap:7px}
.field>label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font-size:12.5px; padding:5px 11px; border:1px solid var(--rule); border-radius:999px;
  background:var(--surface); color:var(--ink-2); transition:.12s;
}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
input[type=range]{width:100%; accent-color:var(--accent)}
.count-row{display:flex; align-items:baseline; gap:10px}
.count-row b{font-family:var(--mono); font-size:26px; font-weight:600}
.count-row span{font-size:12.5px; color:var(--ink-3)}
.btn{
  background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:14px;
  padding:11px 18px; border-radius:8px; justify-self:start;
}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.ghost{background:none; color:var(--accent); border:1px solid var(--rule); font-weight:500}
.btn.ghost:hover{border-color:var(--accent); background:var(--accent-soft)}
.btn.sm{font-size:13px; padding:8px 14px}

/* ---------- progress ---------- */
.prog{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.track{flex:1; min-width:120px; height:4px; background:var(--sunk); border-radius:2px; overflow:hidden}
.track i{display:block; height:100%; background:var(--accent); transition:width .25s}
.prog .mono{font-size:12px; color:var(--ink-3); white-space:nowrap}

/* ---------- question ---------- */
.qmeta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.pill{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; background:var(--sunk); color:var(--ink-2); font-weight:500;
}
.pill.lvl{background:var(--accent-soft); color:var(--accent)}
.stem{font-family:var(--read); font-size:18px; line-height:1.52; margin:0 0 18px; max-width:62ch}
.opts{display:grid; gap:8px; max-width:720px}
.opt{
  display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:start;
  text-align:left; padding:12px 14px; border:1px solid var(--rule); border-radius:8px;
  background:var(--surface); font-family:var(--read); font-size:15.5px; line-height:1.45;
  transition:border-color .12s, background .12s;
}
.opt:hover:not([disabled]){border-color:var(--accent); background:var(--accent-soft)}
.opt .k{
  font-family:var(--mono); font-size:12px; font-weight:600; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:4px; width:26px; height:26px;
  display:grid; place-items:center; margin-top:-1px;
}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.opt.correct{border-color:var(--good); background:var(--good-soft)}
.opt.correct .k{background:var(--good); color:var(--surface); border-color:var(--good)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); color:var(--surface); border-color:var(--bad)}
.opt[disabled]{cursor:default}

.why{
  margin-top:16px; max-width:720px; border-left:3px solid var(--accent);
  background:var(--sunk); border-radius:0 8px 8px 0; padding:13px 16px;
}
.why .eyebrow{margin-bottom:5px}
.why p{margin:0; font-family:var(--read); font-size:15px; line-height:1.55; color:var(--ink)}
.src{margin-top:9px; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap}

/* ---------- results ---------- */
.score-hero{display:grid; gap:6px; margin-bottom:8px}
.score-hero b{font-family:var(--mono); font-size:52px; font-weight:600; line-height:1; letter-spacing:-.03em}
.verdict{font-size:14px; font-weight:600}
.verdict.pass{color:var(--good)} .verdict.near{color:var(--warn)} .verdict.fail{color:var(--bad)}
.breakdown{display:grid; gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:8px; overflow:hidden; margin:20px 0}
.brow{background:var(--surface); padding:10px 14px; display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; font-size:13px}
.brow .bar-mini{grid-column:1/-1; height:3px; background:var(--sunk); border-radius:2px; overflow:hidden}
.brow .bar-mini i{display:block; height:100%; background:var(--accent)}
.rev{display:grid; gap:10px; margin-top:8px}
.rev-item{border:1px solid var(--rule); border-radius:8px; background:var(--surface); overflow:hidden}
.rev-head{width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:11px 14px; text-align:left}
.rev-head:hover{background:var(--sunk)}
.dot{width:8px; height:8px; border-radius:50%}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)}
.rev-head .t{font-family:var(--read); font-size:14.5px; line-height:1.4}
.rev-body{padding:0 14px 14px; display:grid; gap:9px; border-top:1px solid var(--rule-2)}
.rev-body .line{font-family:var(--read); font-size:14.5px; line-height:1.45}
.rev-body .line b{font-family:var(--display); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:2px; font-weight:600}

/* ---------- sims ---------- */
.simgrid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.simcard{
  text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:10px;
  padding:14px 15px; display:grid; gap:5px; align-content:start; transition:.15s;
}
.simcard:hover{border-color:var(--accent); transform:translateY(-1px)}
.simcard h3{font-size:15px; line-height:1.3}
.simcard p{margin:0; font-size:12.5px; color:var(--ink-3)}
.catgroup{margin-top:26px}
.catgroup>h2{font-size:15px; margin-bottom:3px}
.catgroup>p{margin:0 0 12px; font-size:12.5px; color:var(--ink-3); font-family:var(--mono)}

.log{display:grid; gap:14px; max-width:760px}
.entry{border:1px solid var(--rule); border-radius:10px; background:var(--surface); overflow:hidden}
.entry-h{padding:11px 15px; border-bottom:1px solid var(--rule-2); display:flex; gap:9px; align-items:center; flex-wrap:wrap; background:var(--sunk)}
.entry-b{padding:15px}
.badge{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em;
  padding:3px 7px; border-radius:4px; text-transform:uppercase;
}
.badge.ig{background:var(--accent-soft); color:var(--accent)}
.badge.dm{background:var(--warn-soft); color:var(--warn)}
.scenario{
  font-family:var(--read); font-size:16.5px; line-height:1.55; margin:0 0 20px;
  max-width:62ch; padding-left:14px; border-left:3px solid var(--accent);
}
.reveal{
  margin-top:14px; font-family:var(--mono); font-size:13px; line-height:1.55;
  background:var(--sunk); border-radius:8px; padding:12px 14px; color:var(--ink);
  border:1px dashed var(--rule);
}
.reveal b{display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px; font-weight:600}
.fb{display:grid; gap:7px; margin-top:13px}
.fbrow{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; font-size:13.5px; line-height:1.45}
.pts{
  font-family:var(--mono); font-size:11.5px; font-weight:600; padding:2px 7px; border-radius:4px;
  min-width:34px; text-align:center;
}
.pts.p{background:var(--good-soft); color:var(--good)}
.pts.n{background:var(--bad-soft); color:var(--bad)}
.pts.z{background:var(--sunk); color:var(--ink-3)}
.fbrow .txt{color:var(--ink-2)}
.fbrow .txt em{font-style:normal; color:var(--ink); font-family:var(--read); font-size:14.5px; display:block; margin-bottom:2px}
.scoreline{
  display:flex; gap:10px; align-items:baseline; font-family:var(--mono); font-size:12.5px;
  color:var(--ink-3); margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-2);
}
.scoreline b{font-size:15px; color:var(--ink)}
.simbar{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 52px); z-index:20;
  background:color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter:blur(10px);
  padding:9px 0; margin-bottom:16px; border-bottom:1px solid var(--rule);
  display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px;
}
.empty{color:var(--ink-3); font-size:13.5px; font-family:var(--read)}
.note{font-size:12.5px; color:var(--ink-3); line-height:1.5; max-width:62ch}
.note code{font-family:var(--mono); font-size:11.5px; background:var(--sunk); padding:1px 5px; border-radius:3px}
footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3); line-height:1.6; max-width:62ch}
@media (max-width:560px){
  .stem{font-size:17px}
  .opt{font-size:15px; padding:11px 12px}
  .score-hero b{font-size:42px}
  .bar-in{padding:8px 16px; gap:8px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>TMC &amp; CSE Trainer</b><span>NBRC BLUEPRINT</span></div>
    <button class="nav" data-go="home">Home</button>
    <button class="nav" data-go="build">Exam</button>
    <button class="nav" data-go="drill">Chapters</button>
    <button class="nav" data-go="sims">Simulations</button>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle light and dark theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<main class="wrap" id="view"></main>

<script>window.__BANK__ = {"questions":[{"ch":1,"sec":"I-A","lvl":"recall","topic":"Laboratory results","stem":"What is the normal adult reference range for platelet count?","opts":["150,000–400,000/mm³","4,500–11,500/mm³","12–14 seconds","0.8–1.2"],"key":0,"why":"Platelets 150,000–400,000/mm³. A low count means slow clotting and should be checked before an arterial puncture. 4,500–11,500/mm³ is the WBC range, 12–14 s is PT, and 0.8–1.2 is INR.","src":[[1206,1208],[1203,1204],[1210,1215]],"id":"C01-Q01"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Cardiac biomarkers","stem":"A troponin I level is reported as 2.1 μg/L. Relative to the reference range, this value is:","opts":["Elevated; the normal value is \u003c 0.4 μg/L","Normal; the reference range is 0.4–4.0 μg/L","Low; the normal value is > 5 μg/L","Normal for a patient older than 65"],"key":0,"why":"Troponin I is normally \u003c 0.4 μg/L. It rises 3–6 hours after the insult, peaks at 12 hours, and can persist for 7 days, making it useful for AMI/acute coronary syndrome.","src":[1255,1256],"id":"C01-Q02"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Cardiac biomarkers","stem":"Which B-type natriuretic peptide (BNP) result best helps RULE IN a diagnosis of congestive heart failure?","opts":["> 500 pg/mL","\u003c 20 pg/mL","\u003c 100 pg/L","4–6% of total CK"],"key":0,"why":"A BNP > 500 pg/mL helps rule in CHF, whereas \u003c 100 pg/L helps rule it out. The normal value is \u003c 20 pg/mL. The 4–6% figure refers to CK-MB as a percentage of total CK.","src":[1258,1261],"id":"C01-Q03"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Blood gas analysis","stem":"Which set represents the normal adult arterial blood gas reference ranges?","opts":["pH 7.35–7.45, PaCO₂ 35–45 torr, PaO₂ 80–100 torr, HCO₃ 22–26 mEq/L, BE 0 ± 2","pH 7.30–7.50, PaCO₂ 30–50 torr, PaO₂ 60–100 torr, HCO₃ 18–28 mEq/L, BE 0 ± 5","pH 7.35–7.45, PaCO₂ 20–30 torr, PaO₂ 100–120 torr, HCO₃ 30–35 mEq/L, BE 0 ± 2","pH 7.40–7.50, PaCO₂ 35–45 torr, PaO₂ 80–100 torr, HCO₃ 22–26 mEq/L, BE +2 to +7"],"key":0,"why":"Table 1-4 gives pH 7.35–7.45, PaCO₂ 35–45 torr, PaO₂ 80–100 torr (room air), HCO₃ 22–26 mEq/L, BE 0 ± 2, and SaO₂ 95–98% on room air.","src":[1318,1333],"id":"C01-Q04"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Hemoximetry","stem":"What is the normal carboxyhemoglobin (COHb) level in a healthy nonsmoker?","opts":["\u003c 1.5%","3–6%","\u003c 10%","15–20%"],"key":0,"why":"Normal CO levels are \u003c 1.5%. Levels of 3–6% can be normal for smokers, inner-city dwellers, and people living near industrial areas.","src":[1355,1357],"id":"C01-Q05"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Hemoximetry","stem":"During inhaled nitric oxide (INO) therapy, what is the normal methemoglobin (metHb) level in a healthy subject?","opts":["\u003c 1.5% of total Hb","\u003c 5% of total Hb","5–10% of total Hb","> 10% of total Hb"],"key":0,"why":"Normal metHb is usually \u003c 1.5% of total Hb. INO combines with hemoglobin to form nitrosylhemoglobin, which is rapidly oxidized to methemoglobin; excess metHb causes tissue hypoxia because it increases Hb affinity for oxygen.","src":[1367,1371],"id":"C01-Q06"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Pulmonary function testing","stem":"In a patient with healthy lungs, the normal reference range for the diffusing capacity for carbon monoxide (DLCO) is:","opts":["25–30 mL/min/mm Hg","5–10 mL/min/mm Hg","40–60 mL/min/mm Hg","80–120 mL/min/mm Hg"],"key":0,"why":"Normal DLCO is 25–30 mL/min/mm Hg. It is low in pulmonary fibrosis and emphysema from thickening and destruction of the alveolar surface, and may be higher than normal in polycythemia.","src":[1467,1471],"id":"C01-Q07"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Blood gas analysis","stem":"Using the basic classification of hypoxemia severity, a PaO₂ of 45 torr is categorized as:","opts":["Moderate hypoxemia","Mild hypoxemia","Severe hypoxemia","Normal"],"key":0,"why":"Mild hypoxemia is a PaO₂ of 60–79 torr, moderate is 40–59 torr, and severe is \u003c 40 torr. A PaO₂ of 45 torr falls in the moderate range.","src":[1309,1311],"id":"C01-Q08"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"6-minute walk test","stem":"On a 6-minute walk test, what screening result indicates abnormal functional capacity?","opts":["6MWD \u003c 500–600 meters","6MWD \u003c 200 meters","6MWD > 600 meters","A pre-/post-treatment gain of ≥ 10–20%"],"key":0,"why":"A 6-minute walking distance below 500–600 meters indicates abnormal functional capacity and may require further evaluation. A pre-/post-treatment gain of ≥ 10–20% describes a treatment effect, not a screening threshold.","src":[1489,1492],"id":"C01-Q09"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Pulmonary function testing","stem":"A PFT result reported at 58% of predicted represents what degree of impairment?","opts":["Moderate","Mild","Severe","Normal"],"key":0,"why":"The percent-predicted classification is: normal 80–120%, mild 70–79%, moderate 50–69%, and severe \u003c 49%. 58% falls in the moderate range.","src":[1458,1461],"id":"C01-Q10"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Pulmonary function testing","stem":"Post-bronchodilator testing shows an increase in flows of 14%. This result indicates:","opts":["Significant reversibility of airway obstruction","No significant response","A restrictive process","An invalid test requiring repetition"],"key":0,"why":"An increase in flows of 12–15% or more after bronchodilator therapy suggests significant reversibility.","src":[1463,1465],"id":"C01-Q11"},{"ch":1,"sec":"I-A","lvl":"recall","topic":"Laboratory results","stem":"An elevated serum lactate level (normal 0.4–2.3 mEq/L) is most consistent with:","opts":["Tissue hypoxia and shock","Renal failure","Liver disease or malnutrition","Metabolic alkalosis"],"key":0,"why":"Lactic acid is normally 0.4–2.3 mEq/L, and a high value signals tissue hypoxia and shock. Renal failure elevates BUN, and low total protein/albumin suggests liver disease or malnutrition.","src":[1245,1245],"id":"C01-Q12"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Blood gas analysis","stem":"A patient breathing room air has pH 7.36, PaCO₂ 58 torr, PaO₂ 62 torr, HCO₃ 34 mEq/L, BE +7. This pattern is most consistent with:","opts":["Fully compensated respiratory acidosis with mild hypoxemia, as seen in COPD with CO₂ retention","Uncompensated respiratory alkalosis with moderate hypoxemia","Partially compensated metabolic acidosis with normal oxygenation","Combined respiratory and metabolic acidosis with severe hypoxemia"],"key":0,"why":"The pH is within 7.35–7.45 while the PaCO₂ and HCO₃ are both markedly elevated — full compensation. A PaO₂ of 62 torr on room air is mild hypoxemia. Table 1-5 lists this exact pattern for moderate to severe COPD with CO₂ retention.","src":[[1385,1396],[1287,1288]],"id":"C01-Q13"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Blood gas analysis","stem":"A patient with uncontrolled diabetes has pH 7.32, PaCO₂ 28 torr, PaO₂ 108 torr on room air, HCO₃ 14 mEq/L, BE −10. The correct interpretation is:","opts":["Partially compensated metabolic acidosis with normal oxygenation","Fully compensated respiratory acidosis","Uncompensated metabolic acidosis with mild hypoxemia","Partially compensated respiratory alkalosis"],"key":0,"why":"The pH is low (acidemia) with a PaCO₂ of 28 torr, which is ≤ 45 torr, so the primary disturbance is metabolic acidosis. The low PaCO₂ and BE of −10 show respiratory compensation that has not returned the pH to normal, hence partial. The PaO₂ of 108 torr is not hypoxemic.","src":[[1292,1298],[1300,1302]],"id":"C01-Q14"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Blood gas analysis","stem":"A patient on 2 L/min by cannula has pH 7.53, PaCO₂ 27 torr, PaO₂ 53 torr, HCO₃ 22 mEq/L. What is the most likely explanation?","opts":["Uncompensated respiratory alkalosis caused by hyperventilation secondary to hypoxemia","Primary metabolic alkalosis from diuretic use","Fully compensated respiratory alkalosis","Laboratory error, because the pH and PaCO₂ are inconsistent"],"key":0,"why":"A high pH with a PaCO₂ below 35 torr is a respiratory alkalosis, and the normal HCO₃ of 22 mEq/L shows it is uncompensated. Table 1-5 attributes this pattern to hyperventilation driven by the moderate hypoxemia, as occurs in pneumonia, asthma, or pulmonary embolism.","src":[[1398,1410],[1296,1298],[1327,1327]],"id":"C01-Q15"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Blood gas analysis","stem":"Using only pH and PaCO₂, a patient with pH 7.28 and PaCO₂ 33 torr has which primary acid-base disturbance?","opts":["Metabolic acidosis","Respiratory acidosis","Respiratory alkalosis","Metabolic alkalosis"],"key":0,"why":"With acidemia (pH \u003c 7.35), a PaCO₂ of 45 torr or less points to metabolic acidosis; a PaCO₂ above 45 torr would indicate respiratory acidosis. Metabolic involvement is confirmed by a base excess below −2.","src":[1292,1302],"id":"C01-Q16"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Prescribing provider's orders","stem":"A registered nurse tells you the physician has ordered a bronchodilator treatment for a patient. You should:","opts":["Verify that the order has been entered in the patient's record before proceeding","Administer the treatment because the RN is a licensed professional","Ask the RN to sign the order on the physician's behalf","Refuse all care until the physician arrives on the unit"],"key":0,"why":"Orders may not be accepted from unauthorized third parties such as registered nurses. If an order reaches you through a third party, you must verify it has been entered into the record before proceeding.","src":[1029,1032],"id":"C01-Q17"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Prescribing provider's orders","stem":"Which order should you question as unacceptable?","opts":["\"Resume preoperative respiratory orders\"","\"Albuterol 2.5 mg in 3 mL normal saline via SVN q4h\"","\"O₂ at 2 L/min by nasal cannula, continuous\"","\"Volume control ventilation, VT 450 mL, rate 12, PEEP 5, FiO₂ 0.40\""],"key":0,"why":"Blanket orders such as \"continue previous medications\" or \"resume preoperative orders\" must not be accepted. The other three orders each specify the therapy and the requisite details.","src":[1032,1033],"id":"C01-Q18"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Prescribing provider's orders","stem":"An order reads: \"Bronchodilator therapy q6h.\" What is missing that makes this order incomplete?","opts":["The drug name, administration route, and dose/concentration","The frequency of therapy","The date and time of the order","Nothing; the order is complete as written"],"key":0,"why":"An order for a drug — including oxygen — must contain the drug name, administration route, and dose or concentration. Frequency is present here. When an element is missing, contact the originator for clarification.","src":[1095,1104],"id":"C01-Q19"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Prescribing provider's orders","stem":"You are authorized to accept a verbal order during an urgent situation. To complete the order correctly, you must document that:","opts":["You read the order back to the originator and the originator confirmed its accuracy","A second therapist witnessed you receiving the order","The order was entered into CPOE within 24 hours","The charge nurse approved the order"],"key":0,"why":"For verbal or telephone orders, you must document that you read the order back to the originator and that the originator confirmed the accuracy of the order as read back. When the provider is in the house and the situation is not an emergency, obtain a written order or CPOE instead.","src":[1034,1038],"id":"C01-Q20"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Advance directives","stem":"The daughter of a patient with a written DNR order tells you her mother now wants the order revoked. You should:","opts":["Immediately notify the attending physician, who must document the new request in the record","Honor the request at once and begin full resuscitation status","Explain that a DNR order cannot be revoked once written","Require the request to be submitted in writing before any action"],"key":0,"why":"A patient or surrogate can change or revoke a DNR order at any time, in writing or orally. When asked to do so, you must immediately notify the attending physician, who is obliged to document the new request in the patient record.","src":[1138,1145],"id":"C01-Q21"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Laboratory results","stem":"Before performing an arterial puncture, which set of laboratory values would most concern you?","opts":["INR 3.4, platelets 88,000/mm³","INR 1.0, platelets 250,000/mm³","WBC 13,000/mm³, hematocrit 46%","Sodium 138 mEq/L, potassium 4.2 mEq/L"],"key":0,"why":"A low platelet count or abnormally prolonged PT, INR, or PTT indicates potential for excessive bleeding during invasive procedures such as ABG sampling, thoracentesis, suctioning, or bronchoscopy. Normal INR is 0.8–1.2 and normal platelets are 150,000–400,000/mm³.","src":[[1167,1171],[1206,1208],[1213,1215]],"id":"C01-Q22","given":["3.4","88,000","1.0","250,000","13,000","46","138","4.2"]},{"ch":1,"sec":"I-A","lvl":"application","topic":"Laboratory results","stem":"A patient receiving frequent albuterol treatments develops premature ventricular contractions. Which laboratory value should you check first?","opts":["Serum potassium","Serum sodium","Blood urea nitrogen","Total protein"],"key":0,"why":"Low serum potassium may lead to dysrhythmias such as PVCs and may be associated with respiratory muscle weakness. Certain respiratory medications, albuterol among them, may lower serum potassium. Normal potassium is 3.5–5 mEq/L.","src":[[1163,1166],[1225,1229]],"id":"C01-Q23"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Laboratory results","stem":"A patient with long-standing COPD has an elevated red blood cell count. This finding most likely reflects:","opts":["Polycythemia secondary to chronic hypoxemia","Acute bacterial infection","Recent hemorrhage","Hemodilution from fluid overload"],"key":0,"why":"Increased RBCs (polycythemia) may be associated with chronic hypoxemia; decreased levels are related to bleeding or anemia. An elevated WBC count with a left shift, not an elevated RBC count, suggests acute bacterial infection.","src":[1160,1163],"id":"C01-Q24"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"An anteroposterior neck radiograph on a child shows a \"steeple sign.\" This finding is associated with:","opts":["Croup","Epiglottitis","Foreign-body aspiration","Right mainstem intubation"],"key":0,"why":"Tracheal edema and inflammation produce the steeple sign of croup on an AP film. Epiglottitis produces the thumb sign on a lateral neck x-ray.","src":[1553,1555],"id":"C01-Q25"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"A chest radiograph shows increased vascular markings, a cardiothoracic ratio greater than 50%, pleural effusions, and Kerley B lines. These findings are most consistent with:","opts":["Congestive heart failure","Emphysema","Pneumothorax","Acute respiratory distress syndrome"],"key":0,"why":"CHF produces increased vascular markings, cardiomegaly with a cardiothoracic ratio > 50%, and pleural effusions with Kerley B lines. ARDS shows nonhomogeneous bilateral opacities with a NORMAL heart size.","src":[1571,1577],"id":"C01-Q26"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"A supine chest film shows loss of peripheral lung markings, a radiolucent space between the lung margin and chest wall, and deepening of the costophrenic angle. This is:","opts":["Pneumothorax, with the deep sulcus sign","Pleural effusion","Atelectasis","Consolidation"],"key":0,"why":"Pneumothorax shows loss of peripheral lung markings, air between the lung margin and chest wall, possible mediastinal shift to the opposite side, and the deep sulcus sign on supine films. Atelectasis instead shifts the trachea and mediastinum TOWARD the affected side.","src":[1594,1602],"id":"C01-Q27"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"During bedside thoracic ultrasound, absence of the gliding sign indicates:","opts":["Pneumothorax","Pleural effusion","Pulmonary edema","Normal pleural motion"],"key":0,"why":"The gliding sign is a normal shimmering of the parietal/visceral pleural line during breathing; its absence indicates pneumothorax. Proliferation of B lines (\"lung rockets\") indicates interstitial/alveolar syndrome such as pulmonary edema or pneumonia, and an echo-free dark zone in a dependent region indicates pleural effusion.","src":[1521,1531],"id":"C01-Q28"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"A ventilation-perfusion scan shows multiple segmental perfusion defects without corresponding ventilation defects. This indicates:","opts":["High probability of pulmonary embolism","Lobar pneumonia","Diffuse emphysema","A normal study"],"key":0,"why":"A high probability of pulmonary embolism is indicated when multiple segmental perfusion defects appear without matching ventilation defects. V/Q scans are being replaced by high-resolution CT angiography, now the gold standard for diagnosing PE.","src":[1661,1665],"id":"C01-Q29"},{"ch":1,"sec":"I-A","lvl":"application","topic":"Imaging studies","stem":"A mechanically ventilated patient must be transported for an MRI. The ventilator is labeled \"MR Conditional.\" You should:","opts":["Follow the manufacturer's operational protocol, which usually requires locking the device a safe distance from the magnet","Use the ventilator anywhere in the scanner room, because MR Conditional means fully compatible","Refuse transport, because only MR Safe devices may enter the facility","Disconnect the patient and manually ventilate throughout the scan"],"key":0,"why":"Ventilator support during MRI requires an FDA-approved ventilator labeled either \"MR Safe\" or \"MR Conditional.\" If MR Conditional, you must follow the manufacturer's operational protocol, which usually includes at least locking the device a safe distance from the MRI magnet.","src":[1513,1519],"id":"C01-Q30"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Level of consciousness","stem":"A Glasgow Coma Scale total score of 8 or less indicates:","opts":["Severe impairment (coma)","Mild impairment","Moderate impairment","A normal level of consciousness"],"key":0,"why":"GCS ranges from a low of 3 (deep coma) upward. Mild impairment is 13–15, moderate is 9–12, and severe impairment (coma) is a score of 8 or less.","src":[[2794,2796],[2788,2792]],"id":"C02-Q01"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Level of consciousness","stem":"In the AVPU scale, the letter P signifies that the patient:","opts":["Responds to Pain","Is Pale on inspection","Has a Patent airway","Is in Position of comfort"],"key":0,"why":"AVPU stands for Alert; response to Verbal stimulus; response to Pain; Unresponsive. If the patient does not respond to verbal stimuli, firmly pinch the skin and note any response such as moaning or withdrawal.","src":[[2785,2786],[2817,2819]],"id":"C02-Q02"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Sputum assessment","stem":"Sputum production above what daily volume indicates the need for airway clearance?","opts":["30 mL/day","5 mL/day","15 mL/day","100 mL/day"],"key":0,"why":"As a rule of thumb, sputum production greater than 30 mL/day indicates the need for airway clearance. Familiar measures are helpful when interviewing: a teaspoon is 5 mL, a tablespoon 15 mL, and a shot glass 1 oz or 30 mL.","src":[[2952,2955],[4287,4287]],"id":"C02-Q03"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Neonatal assessment","stem":"An Apgar score is assigned at which intervals after birth?","opts":["1 and 5 minutes","Immediately and at 10 minutes","5 and 10 minutes","30 seconds and 3 minutes"],"key":0,"why":"The Apgar score is used to assess neonates at 1 and 5 minutes after birth. Its five dimensions — Appearance, Pulse, Grimace, Activity, Respirations — are each rated 0 to 2 for a maximum of 10.","src":[[2514,2519],[3514,3519]],"id":"C02-Q04"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Neonatal assessment","stem":"Normal gestation lasts how many weeks?","opts":["38–42 weeks","34–38 weeks","40–44 weeks","36–40 weeks"],"key":0,"why":"Normal gestation lasts 38–42 weeks. An infant born at full term typically scores in the 35–45 range on the Ballard assessment, while a composite score of 10 or less indicates significant prematurity at 28 weeks or less.","src":[[3523,3524],[3590,3594]],"id":"C02-Q05"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Airway assessment","stem":"A neck circumference above which value in men is associated with obstructive sleep apnea and difficult intubation?","opts":["43 cm (17 in.)","37 cm (15 in.)","35 cm (14 in.)","50 cm (20 in.)"],"key":0,"why":"A neck circumference greater than 43 cm (17 in.) in men, or greater than 37 cm (15 in.) in women, is associated with obstructive sleep apnea, difficult endotracheal intubation, and difficult tracheostomy tube fit.","src":[[3304,3306],[3438,3440]],"id":"C02-Q06"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Percussion","stem":"The normal range of diaphragm motion measured by percussion in adults is:","opts":["5–7 cm","1–2 cm","8–10 cm","10–12 cm"],"key":0,"why":"The difference between maximum inspiratory and expiratory levels represents the full range of diaphragm motion, which in adults ranges from 5 to 7 cm. Motion is decreased in neuromuscular disorders and severe hyperinflation.","src":[3849,3855],"id":"C02-Q07"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Chest radiograph","stem":"On a chest radiograph, the tip of an endotracheal tube should ideally be positioned:","opts":["4–6 cm above the carina, between T2 and T4","At the level of the carina","1–2 cm above the carina, at T6","Below the carina in the right mainstem bronchus"],"key":0,"why":"An AP chest x-ray is the most common method used to confirm ET or tracheostomy tube placement. The tip should sit 4–6 cm above the carina, corresponding to a location between thoracic vertebrae T2 and T4, about the level of the superior border of the aortic arch.","src":[[4149,4154],[4221,4221]],"id":"C02-Q08"},{"ch":2,"sec":"I-B","lvl":"recall","topic":"Breath sounds","stem":"Which breath sound is normally heard only over the trachea?","opts":["Bronchial","Vesicular","Bronchovesicular","Stridor"],"key":0,"why":"Bronchial sounds are high-pitched, loud, and tubular with an expiratory phase equal to or longer than the inspiratory phase, and are normal only over the trachea. Vesicular sounds are normal at the lung periphery; bronchovesicular sounds are normal around the upper sternum and between the scapulae.","src":[3876,3887],"id":"C02-Q09"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Level of consciousness","stem":"A patient's Glasgow Coma Scale is recorded as \"E3, V2, M2.\" This patient's total score and degree of impairment are:","opts":["7 — severe impairment","5 — severe impairment","7 — moderate impairment","9 — moderate impairment"],"key":0,"why":"The three component scores are summed: 3 + 2 + 2 = 7. Because a total of 8 or less indicates coma, this represents severe impairment.","src":[[2798,2801],[2794,2796]],"given":["3","2","2","7","5","9"],"id":"C02-Q10"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Pain assessment","stem":"A patient rates the degree to which pain interferes with daily activities as 6 out of 10. You should:","opts":["Report this finding to the patient's physician","Document it and reassess in 24 hours","Take no action, because a rating below 8 is acceptable","Repeat the assessment using the Borg Scale"],"key":0,"why":"After determining severity, assess how much the pain interferes with daily activities on a 10-point scale. Whenever the interference rating is greater than 4, report the finding to the patient's physician.","src":[[2847,2851],[4281,4281]],"given":["6","10","8","24"],"id":"C02-Q11"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Dyspnea assessment","stem":"Which scale should you use to quantify a patient's shortness of breath at the end of a 6-minute walk?","opts":["The Borg Scale","The Glasgow Coma Scale","The AVPU scale","The Apgar score"],"key":0,"why":"The Borg Scale is the most common method used to quantify shortness of breath or dyspnea. It runs 0 to 10 and is always applied in association with a predefined level of activity, such as an exercise test level or the end of a 6-minute walk.","src":[[2862,2870],[4282,4284]],"id":"C02-Q12"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Work of breathing","stem":"Which combination of findings always indicates an increased work of breathing?","opts":["Tachypnea, thoracic–abdominal dyssynchrony, and accessory muscle use","Bradycardia, clubbing, and pursed-lip breathing","Diaphoresis, fever, and a productive cough","Pedal edema, jugular venous distention, and an S3 heart sound"],"key":0,"why":"In combination with shortness of breath, tachypnea, thoracic–abdominal dyssynchrony or paradox (\"seesaw\" motion), and use of accessory muscles of respiration indicate an abnormally high work of breathing.","src":[[2871,2877],[4285,4286]],"id":"C02-Q13"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Inspection","stem":"A patient with diabetic ketoacidosis would most likely demonstrate which breathing pattern?","opts":["Kussmaul breathing — deep and fast","Biot breathing — irregular with periods of apnea","Cheyne-Stokes breathing — waxing and waning","Prolonged inspiration"],"key":0,"why":"Kussmaul breathing, which is deep and fast, is associated with diabetic ketoacidosis. Biot breathing points to increased intracranial pressure, and Cheyne-Stokes breathing to CNS disease or severe CHF.","src":[3248,3254],"id":"C02-Q14"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Inspection","stem":"A patient's chest radiograph and exam show a barrel chest with prolonged exhalation. These findings suggest:","opts":["COPD with expiratory airway obstruction","Upper airway obstruction such as croup","Loss of lung volume from atelectasis","Restrictive disease from kyphoscoliosis"],"key":0,"why":"Prolonged exhalation indicates expiratory obstruction as in asthma or COPD, and a barrel chest configuration is associated with COPD. Prolonged INSPIRATION instead suggests upper airway obstruction such as croup or epiglottitis.","src":[[3239,3243],[3310,3312]],"id":"C02-Q15"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Cyanosis","stem":"Central cyanosis with a normal hemoglobin content generally first appears when the SaO₂ drops below:","opts":["80% (PaO₂ 45–50 torr)","90% (PaO₂ 60 torr)","70% (PaO₂ 35 torr)","95% (PaO₂ 80 torr)"],"key":0,"why":"With normal Hb content, central cyanosis generally first appears when SaO₂ drops below 80%, corresponding to a PaO₂ of 45–50 torr. It appears as a bluish tint of the mucous membranes of the lips and mouth.","src":[3343,3348],"id":"C02-Q16"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Cyanosis","stem":"Why can a patient with anemia be severely hypoxic before any cyanosis appears?","opts":["The intensity of cyanosis increases with the amount of hemoglobin in the blood","Anemia raises the SaO₂ above the threshold for cyanosis","Anemic patients have increased peripheral perfusion","Cyanosis depends only on cardiac output, not hemoglobin"],"key":0,"why":"Regardless of type, the intensity of cyanosis increases with the amount of Hb in the blood. Patients with polycythemia can therefore look cyanotic yet still have adequate O₂ content, while anemic patients can be severely hypoxic before cyanosis ever appears.","src":[3355,3358],"id":"C02-Q17"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Airway assessment","stem":"A Mallampati Class IV airway means that on examination:","opts":["Only the hard palate is visible","The tonsils, uvula, and soft palate are fully visible","The hard and soft palate and upper tonsils are visible","The soft and hard palate and base of the uvula are visible"],"key":0,"why":"Mallampati Class IV means only the hard palate is visible, and it is associated with difficult intubation as well as a high incidence of sleep apnea. Class I is full visibility of tonsils, uvula, and soft palate.","src":[3425,3436],"id":"C02-Q18"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Sputum assessment","stem":"A patient expectorates pink, watery, frothy secretions. This finding suggests:","opts":["Pulmonary edema","Aspiration pneumonia","Tuberculosis","Asthma"],"key":0,"why":"Bloody sputum that is pink, watery, and frothy suggests pulmonary edema. Red bloody sputum points to tuberculosis, lung cancer, or pulmonary infarction; yellow-to-green purulent sputum suggests aspiration pneumonia, bronchiectasis, or lung abscess.","src":[[3547,3550],[4300,4300]],"id":"C02-Q19"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Neonatal assessment","stem":"A newborn has an Apgar score of 3 at 1 minute. The appropriate action is to:","opts":["Begin resuscitation","Provide routine newborn care","Observe and repeat the score at 5 minutes","Administer supplemental O₂ only"],"key":0,"why":"An Apgar of 7–10 is normal, 4–6 typically needs more intensive support, and 0–3 usually undergoes resuscitation. Needed interventions should never be delayed in order to obtain the Apgar score.","src":[[3517,3519],[4301,4302]],"given":["3","1","5"],"id":"C02-Q20"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Fetal maturity","stem":"Amniotic fluid analysis shows a lecithin/sphingomyelin (L/S) ratio of 2.4 and the presence of phosphatidylglycerol. This indicates:","opts":["Fetal lung maturity","Fetal lung immaturity with high risk of IRDS","An unreliable result requiring repeat testing","Post-term gestation"],"key":0,"why":"Fetal maturity is indicated by an L/S ratio greater than 2, the presence of phosphatidylglycerol (PG), or an L/A ratio greater than 40.0 mg/g. These measurements are used primarily to indicate fetal lung maturity and predict infant respiratory distress syndrome.","src":[[3575,3586],[4303,4304]],"given":["2.4"],"id":"C02-Q21"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Transillumination","stem":"During transillumination of an infant's chest, the underlying chest broadly \"lights up\" in an irregular fashion. This indicates:","opts":["A likely pneumothorax","A normal finding","Pulmonary edema","Consolidated lung tissue"],"key":0,"why":"Normally a halo of only about 1 cm forms under the light. If the underlying chest broadly lights up in an irregular fashion, a pneumothorax is likely. If the test is negative but signs persist, recommend an immediate chest x-ray.","src":[3603,3607],"id":"C02-Q22"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Palpation","stem":"A second clinician measures the apical rate as 96/min while you palpate a radial rate of 78/min. This pulse deficit most likely indicates:","opts":["A cardiac arrhythmia such as atrial fibrillation, PVCs, or heart block","Severe hypovolemia","An error requiring remeasurement in the other arm","Normal sinus arrhythmia in an adult"],"key":0,"why":"If the apical rate exceeds the peripheral rate, a pulse deficit exists. A pulse deficit usually indicates a cardiac arrhythmia such as atrial fibrillation or flutter, premature ventricular contractions, or heart block.","src":[[3627,3633],[4305,4306]],"given":["96","78"],"id":"C02-Q23"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Palpation","stem":"A pulse that weakens during inspiration (pulsus paradoxus) is associated with:","opts":["Severe airway obstruction such as status asthmaticus, or cardiac tamponade","Left-sided heart failure","Aortic insufficiency or patent ductus arteriosus","Septic shock with loss of vascular tone"],"key":0,"why":"Pulsus paradoxus is a variation in pulsations with the breathing cycle, with weaker pulses during inspiration, caused by severe airway obstruction such as status asthmaticus or by cardiac tamponade. Pulsus alternans, where the pulse alternates in strength beat to beat, points to left-sided heart failure.","src":[[3727,3730],[4307,4308]],"id":"C02-Q24"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Palpation","stem":"You detect crepitus over the neck and chest of a mechanically ventilated patient. You should:","opts":["Assess for pneumothorax, notify the physician, and recommend a chest x-ray","Document the finding as a harmless expected change","Increase PEEP to re-expand the tissue","Apply firm pressure to disperse the subcutaneous gas"],"key":0,"why":"Gas leaking into tissues forms subcutaneous emphysema, which produces crepitus on palpation. Although subcutaneous emphysema itself is harmless, it often occurs with a pneumothorax, so assess for pneumothorax, communicate the finding immediately, and recommend a chest x-ray in ventilated patients.","src":[3802,3809],"id":"C02-Q25"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Percussion","stem":"Percussion over a patient's right chest produces a hollow, loud, low-pitched note. This increased resonance indicates:","opts":["Hyperinflation such as acute asthma or COPD, or a pneumothorax","Pneumonia or atelectasis","Fluid in the pleural space","Normal air-filled lung tissue"],"key":0,"why":"A hollow, loud, low-pitched note is increased resonance (tympanic or hyperresonant), typically indicating hyperinflation from acute asthma or COPD, or a pneumothorax. A dull or flat note occurs over increased tissue density as in pneumonia, atelectasis, or tumor.","src":[3839,3847],"id":"C02-Q26"},{"ch":2,"sec":"I-B","lvl":"application","topic":"Chest radiograph","stem":"Using the R-I-P-E mnemonic, adequate inspiration on a PA chest film is confirmed when the diaphragm is at the level of:","opts":["The 10th posterior rib, or the 6th anterior rib on the right","The 6th posterior rib","The 3rd rib, where the clavicle lies","The 8th anterior rib"],"key":0,"why":"Inspiration is adequate if the diaphragm is at the level of the 10th posterior rib — 8th to 9th posterior ribs on AP films — or the 6th anterior rib on the right. In the AP view, the clavicle should be at about the level of the third rib, which checks angulation, not inspiration.","src":[4053,4075],"id":"C02-Q27"},{"ch":2,"sec":"I-B","lvl":"analysis","topic":"Integrating findings","stem":"A patient has a tracheal shift to the LEFT, absent breath sounds on the right, and hyperresonance to percussion on the right. The most likely problem is:","opts":["Right-sided pneumothorax","Right lower lobe atelectasis","Right-sided pleural effusion with fluid","Right lower lobe pneumonia"],"key":0,"why":"The trachea shifts TOWARD areas of collapse such as atelectasis and AWAY from space-occupying lesions such as pneumothoraces and large pleural effusions. A shift away from the right, with absent breath sounds and increased resonance on the right, identifies a right pneumothorax. A pleural effusion would produce decreased, not increased, resonance.","src":[[3764,3772],[3839,3847],[4309,4310]],"id":"C02-Q28"},{"ch":2,"sec":"I-B","lvl":"analysis","topic":"Integrating findings","stem":"A bedridden older patient has an S3 gallop, pedal edema pitting to mid-calf, jugular venous distention, and bilateral basilar crackles. These findings together point to:","opts":["Congestive heart failure","Acute asthma exacerbation","Tension pneumothorax","Pulmonary fibrosis"],"key":0,"why":"An S3 heard in an older patient usually indicates CHF. Distended jugular veins reflect right heart failure, and gravity-dependent pitting edema is typical of chronic heart failure — the farther up the legs the edema extends, the more severe the failure.","src":[[3921,3924],[3301,3302],[3810,3814]],"id":"C02-Q29"},{"ch":2,"sec":"I-B","lvl":"analysis","topic":"Integrating findings","stem":"A child presents with a barking cough and stridor. The AP chest film shows a steeple sign, and the lateral neck film appears normal. This is most consistent with:","opts":["Croup","Epiglottitis","Foreign-body aspiration","Bronchiolitis"],"key":0,"why":"In croup, the AP chest film shows the steeple sign from subglottic edema while the lateral neck film may appear normal because there is little supraglottic involvement. In epiglottitis the pattern reverses: the chest film usually appears normal and the lateral neck film shows the thumb sign from a swollen epiglottis. A barking cough is associated with croup and epiglottitis.","src":[[4253,4268],[3464,3464]],"id":"C02-Q30"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"12-lead ECG","stem":"How many electrodes are actually placed on the patient to obtain a 12-lead ECG?","opts":["10","12","6","4"],"key":0,"why":"There are only 10 actual leads to place, not 12. The right leg does not count as a recording lead because it is a ground. The difference is made up by the three augmented limb leads (aVR, aVL, aVF), which derive their data from the RA, LA, and LL electrodes.","src":[4417,4421],"id":"C03-Q01"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"12-lead ECG","stem":"Chest lead V4 is placed at which location?","opts":["Fifth intercostal space, midclavicular line","Fourth intercostal space, right sternal border","Fifth intercostal space, midaxillary line","Fourth intercostal space, left sternal border"],"key":0,"why":"V4 goes at the fifth intercostal space, midclavicular line. V1 is the fourth intercostal space at the right sternal border, V2 the fourth intercostal space at the left sternal border, V5 the fifth intercostal space at the anterior axillary line, and V6 the fifth intercostal space at the midaxillary line.","src":[4429,4435],"id":"C03-Q02"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Pulse oximetry","stem":"Low SpO₂ alarm limits are typically set at what range for adults?","opts":["90–94%","85–88%","95–98%","80–85%"],"key":0,"why":"For continuous monitoring, set the low alarm according to institutional protocol, typically 90–94% for adults and 85–88% for infants.","src":[4496,4497],"id":"C03-Q03"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Capnography","stem":"PetCO₂ typically runs how much lower than the PaCO₂ in a patient without significant deadspace?","opts":["1–5 torr","10–15 torr","20 torr","They are normally identical"],"key":0,"why":"Compare the monitored PetCO₂ with the patient's current arterial PCO₂. PetCO₂ typically runs 1–5 torr less than the PaCO₂, and the gap widens with high deadspace ventilation.","src":[4526,4528],"id":"C03-Q04"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Transcutaneous monitoring","stem":"The transcutaneous sensor temperature is usually set to what value when monitoring both PtcO₂ and PtcCO₂?","opts":["44°C","37°C","40°C","42°C"],"key":0,"why":"Ensure proper temperature setting — usually 44°C when monitoring PtcO₂ and PtcCO₂, with temperatures as low as 37°C adequate if monitoring only PtcCO₂.","src":[4558,4559],"id":"C03-Q05"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Blood gas sampling","stem":"The preferred site for arterial puncture is the radial artery in part because:","opts":["The ulnar artery provides collateral circulation","It is the largest accessible artery","It requires no assessment of collateral flow","It lies directly adjacent to a large vein"],"key":0,"why":"The radial artery is preferred because it is located near the skin surface and not close to any large veins, and because the ulnar artery provides collateral circulation. Brachial, femoral, and dorsalis pedis sites carry greater risk.","src":[4752,4756],"id":"C03-Q06"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Plateau pressure","stem":"To reduce the likelihood of ventilator-induced lung injury, plateau pressure should generally be kept below:","opts":["30 cm H₂O","40 cm H₂O","20 cm H₂O","50 cm H₂O"],"key":0,"why":"In general, plateau pressures should be kept below 30 cm H₂O during mechanical ventilation to reduce the likelihood of ventilator-induced lung injury. Pplat is measured with an inspiratory pause using a square flow pattern during volume-targeted ventilation.","src":[5270,5278],"id":"C03-Q07"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Cuff management","stem":"Tracheal cuff pressures above what range can obstruct tissue blood flow and cause ulceration and necrosis?","opts":["25–30 cm H₂O","15–20 cm H₂O","35–40 cm H₂O","10–15 cm H₂O"],"key":0,"why":"Cuff pressures over 25–30 cm H₂O can obstruct tissue blood flow (ischemia), causing ulceration and necrosis. If pressures are too low, leakage-type aspiration can occur, which may lead to ventilator-associated pneumonia.","src":[5593,5599],"id":"C03-Q08"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Apnea monitoring","stem":"On a neonatal apnea monitor, the apnea time alarm limit is typically set at:","opts":["15–20 seconds","5–10 seconds","30–45 seconds","60 seconds"],"key":0,"why":"Set the apnea time alarm limit at typically 15–20 seconds. Low/high heart rate alarm limits are typically 80–210 for neonates, with lower limits for older babies.","src":[5422,5424],"id":"C03-Q09"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Apnea test","stem":"The apnea test for brain death assesses whether breathing is stimulated by a PaCO₂ of at least:","opts":["60 torr","45 torr","50 torr","70 torr"],"key":0,"why":"The apnea test is one of three major components of the neurologic evaluation for brain death. It assesses whether high levels of blood/brain CO₂ — a PaCO₂ of 60 torr or more — stimulate breathing.","src":[5447,5450],"id":"C03-Q10"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"Exercise testing","stem":"One metabolic equivalent of task (MET) equals:","opts":["3.5 mL O₂ consumption/kg of body weight","1.0 mL O₂ consumption/kg of body weight","10 mL O₂ consumption/kg of body weight","3.5 L O₂ consumption/min"],"key":0,"why":"The standard work unit for exercise testing is the MET: 1 MET equals 3.5 mL O₂ consumption per kg of body weight, about equal to normal resting O₂ consumption per minute. Most protocols increase intensity by 1–2 METs at each step-up.","src":[5743,5747],"id":"C03-Q11"},{"ch":3,"sec":"I-C","lvl":"recall","topic":"6-minute walk test","stem":"The ATS standardized 6-minute walk test requires a walking course of what length?","opts":["30 meters, marked in 3-meter increments","100 meters, marked in 10-meter increments","50 meters, marked in 5-meter increments","6 meters, marked in 1-meter increments"],"key":0,"why":"The ATS protocol specifies a walking course 30 meters in length with a clear starting line and turnaround point, and the distance marked in 3-meter increments. Equipment needed is a stopwatch, a movable chair, and a recording worksheet.","src":[5844,5849],"id":"C03-Q12"},{"ch":3,"sec":"I-C","lvl":"application","topic":"12-lead ECG","stem":"You cannot obtain an ECG signal. The most likely cause is:","opts":["A loose, missing, or defective lead, or hair preventing skin contact","An improperly set paper speed","A patient who is hypotensive","An expired calibration certificate"],"key":0,"why":"Failure to obtain a signal usually is due to a loose, missing, or defective lead or the patient's hair preventing the lead from making proper skin contact. A noisy signal instead comes from a poor electrical connection, motion artifact, or improper filtering.","src":[4422,4427],"id":"C03-Q13"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Pulse oximetry","stem":"An SpO₂ probe placed on a finger reads erratically. Which action addresses a common source of error?","opts":["Remove nail polish and clean the site with an alcohol prep pad","Tighten the probe firmly to improve contact","Warm the site to 44°C before reading","Switch to the largest available probe regardless of patient size"],"key":0,"why":"When selecting a site, check for adequate perfusion, remove any nail polish if applied on a finger, and clean the site with an alcohol prep pad. Note that overly tight probes may cause venous pooling with inaccurate readings or skin damage, so tightening is wrong.","src":[4469,4484],"id":"C03-Q14"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Transcutaneous monitoring","stem":"Transcutaneous blood gas monitoring is a poor choice in which situation?","opts":["An emergency, because setup and stabilization take 5–20 minutes","Noninvasive ventilation, where capnography is difficult","Continuous assessment of ventilation in a child","A neonate requiring trend monitoring of PtcCO₂"],"key":0,"why":"Lengthy setup and stabilization time of 5–20 minutes makes transcutaneous monitoring a poor choice in emergencies. It should also be avoided with poor skin integrity, adhesive allergy, shock, or poor peripheral circulation. It is useful during noninvasive or high-frequency ventilation when capnography is not available.","src":[4543,4552],"id":"C03-Q15"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Transcutaneous monitoring","stem":"To avoid burns and skin damage during transcutaneous monitoring, the sensor site should be changed:","opts":["Every 2–6 hours","Every 12 hours","Every 24 hours","Only if erythema appears"],"key":0,"why":"Change the sensor site frequently — every 2–6 hours — depending on the sensor temperature, infant size, and manufacturer's recommendation.","src":[[4571,4573]],"id":"C03-Q16"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Peak flow","stem":"During peak flow measurement, how many acceptable efforts are required and which value is recorded?","opts":["Repeat until three values vary by less than 10%; record the highest","Obtain three values and record the average","Obtain two values and record the lower","Obtain one maximal effort only"],"key":0,"why":"The measurement should be repeated until three values are obtained that vary by less than 10%, and the highest of the three is recorded. The patient inhales fully to TLC and exhales in a sharp burst with maximum force; complete exhalation is not needed.","src":[4605,4612],"id":"C03-Q17"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Peak flow","stem":"A peak flow is reported as 6 L/sec. Expressed in L/min this is:","opts":["360 L/min","60 L/min","600 L/min","100 L/min"],"key":0,"why":"To convert L/sec to L/min, multiply by 60; to convert L/min to L/sec, divide by 60. Thus 6 L/sec × 60 = 360 L/min.","src":[4592,4595],"given":["6","360","60","600","100"],"id":"C03-Q18"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Spontaneous ventilation mechanics","stem":"A patient breathes at 38/min with a minute ventilation of 11.4 L/min. What is the rapid shallow breathing index?","opts":["127","38","300","11.4"],"key":0,"why":"First compute tidal volume: VT = minute ventilation ÷ frequency = 11.4 L ÷ 38 = 0.3 L. RSBI = f ÷ VT in liters = 38 ÷ 0.3 = approximately 127.","src":[[4636,4657]],"given":["38","11.4","127","300","0.3"],"id":"C03-Q19"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Spontaneous ventilation mechanics","stem":"Unless otherwise indicated, deadspace should be assumed to be approximately:","opts":["1 mL per pound of predicted body weight","1 mL per kilogram of predicted body weight","2 mL per pound of actual body weight","150 mL regardless of size"],"key":0,"why":"Unless otherwise indicated, assume a deadspace of approximately 1 mL per pound of predicted body weight. Roughly 30% deadspace ventilation is considered normal.","src":[[4687,4689],[4697,4702]],"id":"C03-Q20"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Spontaneous ventilation mechanics","stem":"Maximum inspiratory pressure (MIP/NIF) is measured with a manometer and a one-way valve that allows:","opts":["Exhalation but not inspiration, so the patient \"bucks down\" toward residual volume","Inspiration but not exhalation, so the patient inflates toward total lung capacity","Both inspiration and exhalation for a full minute","Neither, because the airway is fully occluded"],"key":0,"why":"MIP is measured using a manometer attached to a one-way valve configured to allow exhalation but not inspiration. The patient bucks down toward residual volume on each successive breath, at which point a maximum effort is ensured — so the patient need not be conscious.","src":[4715,4721],"id":"C03-Q21"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Blood gas sampling","stem":"A modified Allen's test on the right wrist shows no flushing after 15 seconds. You should:","opts":["Assess the other wrist; if both lack collateral circulation, use the brachial artery","Proceed with the right radial puncture using a smaller needle","Proceed immediately to a femoral puncture","Cancel the ABG and request a venous sample"],"key":0,"why":"If collateral circulation is not present on the initial side, assess the other wrist. If both sides lack collateral circulation, use the brachial artery. On a normal test the palmar surface flushes within 5–10 seconds.","src":[[4763,4767],[4739,4744]],"given":["15"],"id":"C03-Q22"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Blood gas sampling","stem":"When drawing an ABG from an arterial line using a three-way stopcock, how much waste blood should be aspirated?","opts":["5–6 mL, at least 6 times the \"dead\" volume","1 mL","10–12 mL","None; discard is unnecessary with a closed system"],"key":0,"why":"With three-way stopcock sampling, attach a waste syringe, turn the stopcock off to the flush solution, and aspirate 5–6 mL of blood — at least 6 times the \"dead\" volume — before collecting the sample in a heparinized syringe.","src":[4831,4853],"id":"C03-Q23"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Blood gas sampling","stem":"A mixed venous sample drawn from a pulmonary artery catheter must be aspirated slowly from the distal port with the balloon deflated because:","opts":["Rapid aspiration contaminates the sample with arterialized blood and falsely raises O₂ levels","Rapid aspiration causes hemolysis of red cells","Slow aspiration prevents catheter migration","The balloon must stay inflated to obtain a wedge sample"],"key":0,"why":"To avoid contamination with arterialized blood and falsely high O₂ levels, the sample must be drawn slowly from the catheter's distal port with the balloon deflated. Attention must also be paid to the IV infusion rate to prevent sample dilution.","src":[4869,4873],"id":"C03-Q24"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Capillary sampling","stem":"Capillary blood gas sampling is contraindicated in which situation?","opts":["When accurate analysis of oxygenation is needed, and in neonates less than 24 hours old","Whenever arterial access is unavailable","In any infant under 1 year of age","When only acid-base status is required"],"key":0,"why":"CBG sampling is used in infants and toddlers when arterial access is not available but ventilation and acid-base status must be assessed. It is contraindicated when accurate analysis of oxygenation is needed and in neonates less than 24 hours old.","src":[4879,4883],"id":"C03-Q25"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Capillary sampling","stem":"When performing a heel stick for a capillary blood gas, you should:","opts":["Warm the site for 3–5 minutes to no higher than 42–45°C and puncture the lateral side only","Warm the site to 50°C and puncture the posterior curvature","Squeeze the heel firmly to encourage blood flow","Collect the first drop of blood for analysis"],"key":0,"why":"Warm the site for 3–5 minutes to no higher than 42–45°C. For heel sticks, avoid the posterior curvature and puncture the lateral side only. Wipe away the FIRST drop, collect from the middle of the blood drop, and do not squeeze the site.","src":[4886,4896],"id":"C03-Q26"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Blood gas analysis","stem":"An ABG sample cannot be analyzed for more than 30 minutes. It should be:","opts":["Placed in a glass syringe chilled to 0–4°C","Left at room temperature in the plastic syringe","Frozen until analysis","Discarded and redrawn only after 2 hours"],"key":0,"why":"A sample in a plastic syringe at room temperature must be analyzed in under 30 minutes. If it will be kept longer than 30 minutes, it should be in a glass syringe chilled to 0–4°C. Shunt-study samples must be run in under 5 minutes, and samples from patients with elevated leukocyte or platelet counts immediately.","src":[4925,4930],"given":["30","2"],"id":"C03-Q27"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Hemodynamic monitoring","stem":"For accurate CVP and pulmonary artery pressure measurement, the transducer must be leveled at the phlebostatic axis, which is the intersection of:","opts":["The fourth intercostal space and the midaxillary line","The fifth intercostal space and the midclavicular line","The second intercostal space and the sternal border","The sixth intercostal space and the anterior axillary line"],"key":0,"why":"The transducer must be at the same level as the pressure it measures. For CVP and PA pressures this is the phlebostatic axis, the intersection of the fourth intercostal space and midaxillary line.","src":[5010,5013],"id":"C03-Q28"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Hemodynamic monitoring","stem":"A patient is receiving PEEP of 8 cm H₂O. To measure the PAWP you should:","opts":["Leave the patient on PEEP and obtain the end-expiratory reading","Remove the patient from PEEP briefly to obtain a true reading","Apply a correction factor because PEEP exceeds 5 cm H₂O","Measure at end-inspiration to avoid PEEP effects"],"key":0,"why":"Do not remove patients from PEEP or CPAP to measure CVP or PAWP. If PEEP is 10 cm H₂O or less, simply obtain the end-expiratory reading; a correction is applied only when PEEP exceeds 10 cm H₂O. Measurements are made at end-expiration to minimize the effect of intrathoracic pressure changes.","src":[5014,5020],"given":["8","5"],"id":"C03-Q29"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Hemodynamic monitoring","stem":"A damped arterial pressure waveform with reduced amplitude is most likely caused by:","opts":["Air bubbles or a small clot partially obstructing the measurement system","The stopcock being turned off to the patient","An incorrect scale selection on the monitor","Electrical interference from nearby equipment"],"key":0,"why":"Any partial obstruction in the measurement system, such as air bubbles or small clots, can dampen the pressure signal by reducing its amplitude. A stopcock off to the patient or a disconnected transducer produces an ABSENT waveform, not a damped one.","src":[5087,5089],"id":"C03-Q30"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Spontaneous breathing trials","stem":"Which set of findings indicates a patient is ready for a spontaneous breathing trial?","opts":["P/F ≥ 150–200, PEEP ≤ 5–8 cm H₂O, FiO₂ ≤ 0.4–0.5, pH ≥ 7.25, hemodynamically stable","P/F ≥ 100, PEEP ≤ 12 cm H₂O, FiO₂ ≤ 0.7, pH ≥ 7.20","P/F ≥ 300, PEEP = 0, FiO₂ ≤ 0.21, pH ≥ 7.35","Any patient able to initiate an inspiratory effort, regardless of gas exchange"],"key":0,"why":"Readiness criteria include evidence of some reversal of the underlying cause of respiratory failure, adequate oxygenation (P/F ≥ 150–200, PEEP ≤ 5–8 cm H₂O, FiO₂ ≤ 0.4–0.5), pH ≥ 7.25, hemodynamic stability, and the capability to initiate an inspiratory effort.","src":[5373,5378],"id":"C03-Q31"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Spontaneous breathing trials","stem":"After a patient tolerates the brief screening phase, the SBT should continue for:","opts":["At least 30 minutes but no more than 120 minutes","5 to 10 minutes","At least 4 hours","Until the next scheduled ABG"],"key":0,"why":"The screening phase is a brief supervised period of 2–5 minutes of monitored spontaneous breathing. If the patient tolerates it, continue the SBT for at least 30 minutes but no more than 120 minutes; if ABGs are acceptable and the patient remains stable, ventilation can be discontinued.","src":[5391,5399],"id":"C03-Q32"},{"ch":3,"sec":"I-C","lvl":"application","topic":"Cuff management","stem":"Why must you always adjust — never merely measure — cuff pressure when using a manometer and syringe?","opts":["Attaching the manometer and syringe to the pilot line causes volume loss that lowers cuff pressure","The manometer adds volume to the cuff, raising the pressure","Measurement alone violates infection control policy","The manometer cannot display pressures below 20 cm H₂O"],"key":0,"why":"Attaching a manometer and syringe to a pilot tube line causes volume loss and lowers cuff pressure; for this reason you must always adjust the pressure, never just measure it. Most hospitals, including the NBRC hospital, set 25 cm H₂O as the high-pressure limit.","src":[5637,5641],"id":"C03-Q33"},{"ch":3,"sec":"I-C","lvl":"analysis","topic":"Pulmonary mechanics","stem":"A patient on volume control has VT 500 mL, PIP 40, Pplat 25, PEEP 5 cm H₂O, flow 60 L/min. What are the static compliance and airway resistance?","opts":["Crs 25 mL/cm H₂O; Raw 15 cm H₂O/L/sec","Crs 14 mL/cm H₂O; Raw 15 cm H₂O/L/sec","Crs 25 mL/cm H₂O; Raw 0.25 cm H₂O/L/sec","Crs 20 mL/cm H₂O; Raw 10 cm H₂O/L/sec"],"key":0,"why":"Crs = VT ÷ (Pplat − PEEP) = 500 ÷ (25 − 5) = 25 mL/cm H₂O. Raw = (PIP − Pplat) ÷ inspiratory flow in L/sec. Convert flow: 60 L/min ÷ 60 = 1 L/sec, so Raw = (40 − 25) ÷ 1 = 15 cm H₂O/L/sec. Note the flow must be converted from L/min to L/sec.","src":[[5231,5233],[5226,5231],[5343,5346]],"given":["500","40","25","5","60","15","14","0.25","20","10"],"id":"C03-Q34"},{"ch":3,"sec":"I-C","lvl":"analysis","topic":"Auto-PEEP","stem":"You suspect auto-PEEP in a ventilated COPD patient. Which statement correctly describes its detection?","opts":["It is not visible on the normal pressure-versus-time graphic and requires an end-expiratory pause to measure","It appears as an elevated plateau pressure during an end-inspiratory hold","It is read directly from the peak inspiratory pressure","It is visible only on the pressure-volume loop"],"key":0,"why":"Auto-PEEP is residual pressure above set PEEP in the alveoli due to air-trapping, and it is not visible on a normal pressure-versus-time graphic — hence the name occult PEEP. Detection requires inspecting the flow-versus-time waveform or the flow–volume loop, and measurement requires an end-expiratory pause. Patients at greatest risk have high airway resistance and high compliance on modes that limit expiratory time.","src":[[5156,5170],[5235,5241]],"id":"C03-Q35"},{"ch":3,"sec":"I-C","lvl":"analysis","topic":"Sputum induction","stem":"During sputum induction in an asthmatic patient, the FEV₁ falls 22% below the post-bronchodilator baseline. You should:","opts":["Terminate the procedure","Continue and increase the saline concentration","Continue but reduce the nebulizer output","Administer a second bronchodilator and continue to 20 minutes"],"key":0,"why":"Because hypertonic saline can cause bronchospasm, patients with reactive airway disease are pretreated with a fast-acting beta agonist and the FEV₁ is measured at the end of each induction attempt. Terminate the procedure if the FEV₁ falls by 20% or more from the initial post-bronchodilator value, or if signs of respiratory distress occur.","src":[5711,5716],"given":["22","20"],"id":"C03-Q36"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"ECG interpretation","stem":"At a standard recording speed of 25 mm/sec, each small 1-mm box on ECG paper represents:","opts":["0.04 sec","0.20 sec","0.10 sec","0.02 sec"],"key":0,"why":"At 25 mm/sec each small 1-mm box represents 0.04 sec, and each large box represents 5 × 0.04 or 0.20 sec.","src":[6379,6382],"id":"C04-Q01"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"ECG interpretation","stem":"A PR interval is considered prolonged when it exceeds:","opts":["0.20 sec","0.12 sec","0.45 sec","0.60 sec"],"key":0,"why":"A PR interval greater than 0.20 sec indicates first-degree or Mobitz type I AV block. A QRS complex is widened when greater than 0.12 sec, and a QT interval is prolonged when greater than 0.45 sec.","src":[6415,6423],"id":"C04-Q02"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"Oxygenation","stem":"The normal range for arterial oxygen content (CaO₂) is:","opts":["16–22 mL/dL","14–16 mL/dL","8–12 mL/dL","22–28 mL/dL"],"key":0,"why":"Normal CaO₂ is 16–22 mL/dL, computed as (total Hb × 1.36 × SaO₂) + (0.003 × PaO₂). Normal mixed venous O₂ content is lower at 14–16 mL/dL.","src":[[6861,6863],[7019,7019]],"id":"C04-Q03"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"Oxygenation","stem":"A normal P/F ratio is:","opts":["Greater than 350–380","Greater than 200","Greater than 100","Greater than 500"],"key":0,"why":"A normal P/F ratio is greater than 350–380. A P/F of 200–300 indicates V/Q mismatch or mild ARDS, 100–200 indicates some shunting or moderate ARDS, and below 100 indicates refractory hypoxemia with severe shunting.","src":[6923,6931],"id":"C04-Q04"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"Mixed venous oxygenation","stem":"Normal mixed venous oxygen saturation obtained from a PA catheter is:","opts":["68–77%","95–98%","50–60%","80–90%"],"key":0,"why":"Normal mixed venous values from a PA catheter are a PvO₂ of 38–42 torr, saturation of 68–77%, and content of 14–16 mL/dL. Values from a CVP catheter are typically slightly lower.","src":[7011,7021],"id":"C04-Q05"},{"ch":4,"sec":"I-D","lvl":"recall","topic":"Acid-base","stem":"Compensation for a primary acid-base disturbance is described as \"full\" when:","opts":["The pH has returned into the normal range of 7.35–7.45","The PaCO₂ has normalized","The base excess has returned to 0","The HCO₃ has returned to 24 mEq/L"],"key":0,"why":"Compensation is full if the pH is in the normal range of 7.35–7.45; otherwise it is termed partial. Renal compensation for primary respiratory disorders is slow, taking hours to days, whereas respiratory compensation for metabolic disorders is fast, within minutes.","src":[6728,6734],"id":"C04-Q06"},{"ch":4,"sec":"I-D","lvl":"application","topic":"ECG interpretation","stem":"Using the rule of 300, an R-R interval spanning four large boxes correspon
