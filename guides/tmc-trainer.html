s the protocol direct?","opts":["Give sodium bicarbonate now, before changing the rate","Raise the rate until pH > 7.30 or PaCO2 < 25 (max 35/min)","Increase the VT back to 8 mL/kg to lower the PaCO2","Accept the pH of 7.26 and make no change for now"],"key":1,"why":"For pH above 7.15 but below 7.30, increase the rate to a maximum of 35/min. • Increase the VT back to 8 mL/kg to lower the PaCO2: Only permitted if the rate is already 35/min and pH remains below 7.15. • Accept the pH of 7.26 and make no change for now: Below the 7.30 protocol floor. • Give sodium bicarbonate now, before changing the rate: Considered only when the rate is maxed at 35 and pH is still below 7.15.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-126","cell":"MED-ARDS","type":"DM","setting":"in","topic":"Acute Respiratory Distress Syndrome","scenario":"A 5'10\" male (height 70 in.) is intubated 18 hours after a witnessed aspiration event. Chest film shows new bilateral opacities. He is on VC A/C, VT 700 mL, rate 14, PEEP 5, FiO2 1.0. ABG: pH 7.31, PaCO2 48, PaO2 78. Plateau pressure 36 cm H2O. BNP is 42 pg/mL. Echo shows normal LV function. P/F ratio = 78 / 1.0 = 78. VT reduced to 6 mL/kg (438 mL). Pplat now 29. ABG: pH 7.26, PaCO2 58, PaO2 82 on FiO2 1.0, PEEP 5.","stem":"Oxygenation remains poor: P/F 82 on FiO2 1.0 with PEEP now 12. What do you recommend next?","opts":["Increase PEEP to 25 cm H2O and hold it at that level","Begin high-frequency oscillatory ventilation now as rescue","A prone positioning trial, kept ≥ 12 hours as tolerated","Reduce PEEP to 5 cm H2O to lower the plateau pressure"],"key":2,"why":"Recommended for ARDS when oxygenation is inadequate on FiO2 ≥ 0.6 and PEEP ≥ 10 cm H2O. A PaO2 rise over 10 torr in the first 30 minutes predicts success. • Reduce PEEP to 5 cm H2O to lower the plateau pressure: Will worsen the shunt. • Increase PEEP to 25 cm H2O and hold it at that level: Sustained very high PEEP risks overdistention; recruitment maneuvers are brief. • Begin high-frequency oscillatory ventilation now as rescue: HFV should not be used as rescue therapy, and studies show increased mortality in ARDS.","src":[[29154,29221],[21227,21258],[16665,16675],[17379,17383],[20239,20243]],"origin":"heuer","age":"adult"},{"id":"CJ-131","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia","scenario":"A 62-year-old has been ventilated for six days after abdominal surgery. Over 24 hours he develops a temperature of 38.7°C, thick purulent secretions, and a new right lower lobe infiltrate. Peak pressures have risen from 28 to 38 cm H2O and exhaled VT has fallen.","stem":"All of the following findings support the suspected diagnosis EXCEPT:","opts":["Reduced tidal volume, increased inspiratory pressures, decreased compliance, increased plateau pressures","Worsening hypoxemia on ABG and leukocytosis","Start broad-spectrum antibiotics first, then culture","New or progressive pulmonary infiltrates with fever, mucopurulent secretions, and leukocytosis"],"key":2,"why":"Not appropriate: Start broad-spectrum antibiotics first, then culture — Reverses the required order and risks a non-diagnostic culture. The other three are appropriate: • New or progressive pulmonary infiltrates with fever, mucopurulent secretions, and leukocytosis: The definition of suspected VAP in a ventilated patient. • Reduced tidal volume, increased inspiratory pressures, decreased compliance, increased plateau pressures: Common ventilator findings in VAP. • Worsening hypoxemia on ABG and leukocytosis: Listed diagnostic findings.","src":[[29060,29111],[5593,5599],[5637,5641],[14614,14621],[13934,13938],[15770,15770],[8256,8262]],"origin":"heuer","age":"adult"},{"id":"CJ-132","cell":"MED-INF","type":"DM","setting":"in","topic":"Pneumonia","scenario":"A 62-year-old has been ventilated for six days after abdominal surgery. Over 24 hours he develops a temperature of 38.7°C, thick purulent secretions, and a new right lower lobe infiltrate. Peak pressures have risen from 28 to 38 cm H2O and exhaled VT has fallen. Endotracheal aspirate sent before antibiotics. WBC 18,400. ABG: pH 7.33, PaCO2 47, PaO2 62 on FiO2 0.60, PEEP 8.","stem":"Which sampling method best confirms the diagnosis?","opts":["Sputum expectorated by the patient into a sterile cup","Blood cultures alone, drawn from two separate sites","Endotracheal aspirate collected in a sterile specimen trap","Lower-airway sampling: mini-BAL, BAL, or protected specimen brush"],"key":3,"why":"VAP is confirmed when lower respiratory tract aspirates identify a pathogen; invasive methods are preferred. • Sputum expectorated by the patient into a sterile cup: He is intubated; this is not possible or valid. • Blood cultures alone, drawn from two separate sites: Useful for bacteremia but does not confirm VAP. • Endotracheal aspirate collected in a sterile specimen trap: The alternative noninvasive approach when invasive methods are not available.","src":[[29060,29111],[5593,5599],[5637,5641],[14614,14621],[13934,13938],[15770,15770],[8256,8262]],"origin":"heuer","age":"adult"},{"id":"CJ-133","cell":"MED-INF","type":"IG","setting":"in","topic":"Pneumonia","scenario":"A 62-year-old has been ventilated for six days after abdominal surgery. Over 24 hours he develops a temperature of 38.7°C, thick purulent secretions, and a new right lower lobe infiltrate. Peak pressures have risen from 28 to 38 cm H2O and exhaled VT has fallen. Endotracheal aspirate sent before antibiotics. WBC 18,400. ABG: pH 7.33, PaCO2 47, PaO2 62 on FiO2 0.60, PEEP 8.","stem":"All of the following treatment and supportive measures are appropriate EXCEPT:","opts":["Instill saline before each suction pass to loosen secretions","Antibiotic selection based on likely organisms, clinical course, and MDRO risk factors","O2 therapy to treat hypoxemia and decrease work of breathing","Aggressive bronchopulmonary toilet and hyperinflation therapy protocols"],"key":0,"why":"Not appropriate: Instill saline before each suction pass to loosen secretions — Do not routinely lavage with saline; its use is controversial. The other three are appropriate: • Antibiotic selection based on likely organisms, clinical course, and MDRO risk factors: The stated principle — accurate diagnosis avoids antibiotic overuse and multidrug-resistant organisms. • O2 therapy to treat hypoxemia and decrease work of breathing: Explicitly recommended. • Aggressive bronchopulmonary toilet and hyperinflation therapy protocols: Recommended to manage secretions and offset consolidation and atelectasis.","src":[[29060,29111],[5593,5599],[5637,5641],[14614,14621],[13934,13938],[15770,15770],[8256,8262]],"origin":"heuer","age":"adult"},{"id":"CJ-134","cell":"MED-INF","type":"DM","setting":"in","topic":"Pneumonia","scenario":"A 62-year-old has been ventilated for six days after abdominal surgery. Over 24 hours he develops a temperature of 38.7°C, thick purulent secretions, and a new right lower lobe infiltrate. Peak pressures have risen from 28 to 38 cm H2O and exhaled VT has fallen. Endotracheal aspirate sent before antibiotics. WBC 18,400. ABG: pH 7.33, PaCO2 47, PaO2 62 on FiO2 0.60, PEEP 8.","stem":"Cuff pressure measures 18 cm H2O with an audible leak. What do you do?","opts":["Measure the pressure again but do not adjust it","Adjust it to stop the leak, but no higher than 30 cm H2O","Inflate the cuff to 40 cm H2O to guarantee a seal","Leave it, since lower pressures protect the mucosa"],"key":1,"why":"Low cuff pressures permit leakage-type aspiration, which leads to VAP; adjust for a leak-free seal below the 25–30 cm H2O ceiling. • Inflate the cuff to 40 cm H2O to guarantee a seal: Above 25–30 cm H2O obstructs tracheal blood flow and causes ulceration and necrosis. • Leave it, since lower pressures protect the mucosa: Too low a pressure is exactly how VAP develops. • Measure the pressure again but do not adjust it: Attaching the manometer itself lowers cuff pressure, so you must always adjust, never merely measure.","src":[[29060,29111],[5593,5599],[5637,5641],[14614,14621],[13934,13938],[15770,15770],[8256,8262]],"origin":"heuer","age":"adult"},{"id":"CJ-141","cell":"CV","type":"IG","setting":"in","topic":"Shock","scenario":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling.","stem":"All of the following assessments and laboratory recommendations are appropriate EXCEPT:","opts":["Serum lactate","Blood cultures from at least two different sites, plus urinalysis and cultures from suspected sources","CBC with differential, chemistries, liver function tests, and coagulation studies including D-dimer","Wait for the blood cultures to result before giving antibiotics or fluids"],"key":3,"why":"Not appropriate: Wait for the blood cultures to result before giving antibiotics or fluids — Resuscitation must not be delayed. The other three are appropriate: • Serum lactate: Elevated lactate indicates severity of sepsis and is used to follow the therapeutic response. • Blood cultures from at least two different sites, plus urinalysis and cultures from suspected sources: The stated microbiologic work-up. • CBC with differential, chemistries, liver function tests, and coagulation studies including D-dimer: Explicitly recommended.","src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"origin":"heuer","age":"adult"},{"id":"CJ-142","cell":"CV","type":"DM","setting":"in","topic":"Shock","scenario":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling. Lactate 5.4 mmol/L. WBC 21,000. ABG: pH 7.28, PaCO2 28, PaO2 68 on room air, HCO3 13, BE −12. Urinalysis is positive.","stem":"Interpret the blood gas.","opts":["Partially compensated high-anion-gap metabolic acidosis, hypoxemia","Uncompensated respiratory alkalosis with mild hypoxemia","Combined respiratory and metabolic acidosis with hypoxemia","Fully compensated metabolic acidosis with mild hypoxemia"],"key":0,"why":"Low pH with a PaCO2 under 45 makes the primary problem metabolic acidosis; the low PaCO2 and BE of −12 show partial respiratory compensation. A high anion gap metabolic acidosis should always raise clinical suspicion in shock. • Uncompensated respiratory alkalosis with mild hypoxemia: The pH is acidemic, not alkalemic. • Combined respiratory and metabolic acidosis with hypoxemia: The PaCO2 is low, not high, so there is no respiratory acidosis. • Fully compensated metabolic acidosis with mild hypoxemia: Compensation is partial because the pH remains below normal.","src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"origin":"heuer","age":"adult"},{"id":"CJ-143","cell":"CV","type":"IG","setting":"in","topic":"Shock","scenario":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling. Lactate 5.4 mmol/L. WBC 21,000. ABG: pH 7.28, PaCO2 28, PaO2 68 on room air, HCO3 13, BE −12. Urinalysis is positive.","stem":"All of the following immediate management recommendations are appropriate EXCEPT:","opts":["Balanced crystalloid infusion","Delay antibiotics until a central line is placed","Administer oxygen to all patients with sepsis and monitor continuously with pulse oximetry","Establish venous access as soon as possible"],"key":1,"why":"Not appropriate: Delay antibiotics until a central line is placed — Central line insertion should not delay resuscitative fluids and antibiotics. The other three are appropriate: • Administer oxygen to all patients with sepsis and monitor continuously with pulse oximetry: Explicitly recommended. • Establish venous access as soon as possible: Most will need central access, but line insertion must not delay fluids and antibiotics. • Balanced crystalloid infusion: First-line circulatory support.","src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"origin":"heuer","age":"adult"},{"id":"CJ-144","cell":"CV","type":"DM","setting":"in","topic":"Shock","scenario":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling. Lactate 5.4 mmol/L. WBC 21,000. ABG: pH 7.28, PaCO2 28, PaO2 68 on room air, HCO3 13, BE −12. Urinalysis is positive. After 2 L of crystalloid, BP is 92/54. He becomes increasingly somnolent and difficult to rouse.","stem":"He is now somnolent. What do you recommend?","opts":["Start NPPV with IPAP 12 and EPAP 5 cm H2O","Increase to a nonrebreathing mask and continue to observe him","Intubate and ventilate for his work of breathing and airway","Give a sedative to calm him before any other intervention"],"key":2,"why":"Intubation may be needed for the increased work of breathing typical of sepsis, and is also indicated for airway protection since encephalopathy and depressed consciousness frequently complicate sepsis. • Give a sedative to calm him before any other intervention: Would deepen the obtundation and precipitate arrest. • Start NPPV with IPAP 12 and EPAP 5 cm H2O: A somnolent patient who cannot protect the airway is not a BiPAP candidate. • Increase to a nonrebreathing mask and continue to observe him: Does not address airway protection or ventilatory fatigue.","src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"origin":"heuer","age":"adult"},{"id":"CJ-145","cell":"CV","type":"DM","setting":"in","topic":"Shock","scenario":"A 70-year-old nursing home resident is admitted with fever, confusion, and hypotension. BP 84/48, HR 124, RR 30, temp 39.1°C. Skin is warm and flushed. SpO2 91% on room air. Urine is cloudy and foul-smelling. Lactate 5.4 mmol/L. WBC 21,000. ABG: pH 7.28, PaCO2 28, PaO2 68 on room air, HCO3 13, BE −12. Urinalysis is positive. After 2 L of crystalloid, BP is 92/54. He becomes increasingly somnolent and difficult to rouse.","stem":"His mixed venous oxygen saturation is reported as 82% despite the lactate of 5.4. How do you interpret this?","opts":["Tissue oxygenation is adequate, so the lactate must be a lab error","Oxygen delivery is excessive, so the FiO2 should be reduced now","The sample was drawn with the balloon inflated and should be redrawn","In sepsis, mixed venous O2 can be high despite hypoxia; lactate is better"],"key":3,"why":"Explicitly stated for both sepsis and cyanide poisoning — in conditions that decrease O2 demand, mixed venous lactate is a better indicator of tissue oxygenation. • Tissue oxygenation is adequate, so the lactate must be a lab error: The classic trap. • Oxygen delivery is excessive, so the FiO2 should be reduced now: Misreads the physiology. • The sample was drawn with the balloon inflated and should be redrawn: That would cause a falsely high reading, but the sepsis explanation is the intended one here.","src":[[29740,29774],[29907,29942],[7048,7056],[6800,6810]],"origin":"heuer","age":"adult"},{"id":"CJ-151","cell":"CLD-NIV","type":"IG","setting":"in","topic":"Cystic Fibrosis","scenario":"A 24-year-old with cystic fibrosis comes to the ED with four days of increasing productive cough, thick green sputum, fatigue, and poor appetite. She has lost 6 pounds. RR 26 with intercostal retractions and accessory muscle use. Coarse rhonchi throughout. SpO2 88% on room air.","stem":"All of the following assessments and tests are appropriate EXCEPT:","opts":["Place her in a room with another CF patient for peer support","Development of fever and change in sputum volume, color, and character","New-onset or increased hemoptysis","Chest x-ray looking for a new infiltrate"],"key":0,"why":"Not appropriate: Place her in a room with another CF patient for peer support — Minimize contact between CF patients and apply transmission-based precautions. The other three are appropriate: • Development of fever and change in sputum volume, color, and character: Core exacerbation criteria in CF. • New-onset or increased hemoptysis: A listed exacerbation feature. • Chest x-ray looking for a new infiltrate: Explicitly recommended.","src":[[28730,28790],[18323,18325],[18506,18509],[15558,15568],[15650,15652]],"origin":"heuer","age":"adult"},{"id":"CJ-152","cell":"CLD-NIV","type":"DM","setting":"in","topic":"Cystic Fibrosis","scenario":"A 24-year-old with cystic fibrosis comes to the ED with four days of increasing productive cough, thick green sputum, fatigue, and poor appetite. She has lost 6 pounds. RR 26 with intercostal retractions and accessory muscle use. Coarse rhonchi throughout. SpO2 88% on room air. Sputum grows Pseudomonas aeruginosa. WBC 16,200. FEV1 is 38% predicted. SpO2 improves to 93% on 2 L/min.","stem":"Select the correct SEQUENCE for her inhaled therapy session.","opts":["Airway clearance → bronchodilator → antibiotic → mucolytic","Bronchodilator → mucolytic → airway clearance → antibiotic","Aerosolized antibiotic → bronchodilator → mucolytic → airway clearance","Mucolytic → bronchodilator → antibiotic → airway clearance"],"key":1,"why":"The recommended order: bronchodilator first, then mucolytic, then airway clearance, then steroids, and finally the aerosolized antibiotic. • Aerosolized antibiotic → bronchodilator → mucolytic → airway clearance: Reverses the sequence; the antibiotic is deposited in obstructed airways. • Mucolytic → bronchodilator → antibiotic → airway clearance: A mucolytic before a bronchodilator risks bronchospasm. • Airway clearance → bronchodilator → antibiotic → mucolytic: Clearance before bronchodilation is far less effective.","src":[[28730,28790],[18323,18325],[18506,18509],[15558,15568],[15650,15652]],"origin":"heuer","age":"adult"},{"id":"CJ-153","cell":"CLD-NIV","type":"DM","setting":"in","topic":"Cystic Fibrosis","scenario":"A 24-year-old with cystic fibrosis comes to the ED with four days of increasing productive cough, thick green sputum, fatigue, and poor appetite. She has lost 6 pounds. RR 26 with intercostal retractions and accessory muscle use. Coarse rhonchi throughout. SpO2 88% on room air. Sputum grows Pseudomonas aeruginosa. WBC 16,200. FEV1 is 38% predicted. SpO2 improves to 93% on 2 L/min.","stem":"Which inhaled antibiotic and device pairing is correct for confirmed Pseudomonas?","opts":["Aztreonam (Cayston) by a standard small-volume jet nebulizer","Oral antibiotics only, since inhaled agents are not effective","TOBI by nebulizer or DPI, or Cayston by mesh nebulizer","Any aerosolized antibiotic by MDI with a valved spacer"],"key":2,"why":"The stated device pairings; Cayston is approved only for specific vibrating-mesh nebulizers. • Any aerosolized antibiotic by MDI with a valved spacer: These drugs are not formulated for MDI delivery. • Aztreonam (Cayston) by a standard small-volume jet nebulizer: Cayston is approved for administration only via specific electronic mesh nebulizers. • Oral antibiotics only, since inhaled agents are not effective: Inhaled antibiotics are specifically indicated for CF with Pseudomonas.","src":[[28730,28790],[18323,18325],[18506,18509],[15558,15568],[15650,15652]],"origin":"heuer","age":"adult"},{"id":"CJ-154","cell":"CLD-NIV","type":"IG","setting":"in","topic":"Cystic Fibrosis","scenario":"A 24-year-old with cystic fibrosis comes to the ED with four days of increasing productive cough, thick green sputum, fatigue, and poor appetite. She has lost 6 pounds. RR 26 with intercostal retractions and accessory muscle use. Coarse rhonchi throughout. SpO2 88% on room air. Sputum grows Pseudomonas aeruginosa. WBC 16,200. FEV1 is 38% predicted. SpO2 improves to 93% on 2 L/min.","stem":"All of the following airway clearance and long-term recommendations are appropriate EXCEPT:","opts":["PEP therapy or high-frequency chest wall oscillation","Avoid head-down positioning during postural drainage","Supplemental O2 to keep SpO2 above 90%","Restrict salt intake to reduce fluid retention"],"key":3,"why":"Not appropriate: Restrict salt intake to reduce fluid retention — CF patients lose excessive salt and need increased intake. The other three are appropriate: • PEP therapy or high-frequency chest wall oscillation: Recommended techniques for CF in adults, including those living alone. • Avoid head-down positioning during postural drainage: CF patients are at higher risk for gastroesophageal reflux, so head-down positioning is no longer recommended. • Supplemental O2 to keep SpO2 above 90%: The stated target.","src":[[28730,28790],[18323,18325],[18506,18509],[15558,15568],[15650,15652]],"origin":"heuer","age":"adult"},{"id":"CJ-161","cell":"MED-OTHER","type":"IG","setting":"in","topic":"Drug Overdose and Poisonings","scenario":"A 27-year-old is brought in unresponsive after a suspected opioid overdose. RR 6 and shallow, pinpoint pupils. SpO2 78% on room air. He does not respond to verbal stimulus, and withdraws only to a firm pinch.","stem":"All of the following immediate assessments are appropriate EXCEPT:","opts":["Obtain an arterial blood gas","Full pulmonary function testing","Apply the AVPU scale — he responds to Pain, not to Verbal stimulus","Glasgow Coma Scale to objectively grade consciousness"],"key":1,"why":"Not appropriate: Full pulmonary function testing — Impossible and irrelevant in an unresponsive patient. The other three are appropriate: • Apply the AVPU scale — he responds to Pain, not to Verbal stimulus: AVPU: Alert, responds to Verbal, responds to Pain, Unresponsive. He is a 'P'. • Glasgow Coma Scale to objectively grade consciousness: The most objective assessment of consciousness; a total of 8 or less indicates coma. • Obtain an arterial blood gas: Needed to quantify the ventilatory failure.","src":[[2785,2801],[4280,4280],[8199,8201],[8637,8639],[19433,19436],[19020,19025],[21547,21550]],"origin":"heuer","age":"adult"},{"id":"CJ-162","cell":"MED-OTHER","type":"DM","setting":"in","topic":"Drug Overdose and Poisonings","scenario":"A 27-year-old is brought in unresponsive after a suspected opioid overdose. RR 6 and shallow, pinpoint pupils. SpO2 78% on room air. He does not respond to verbal stimulus, and withdraws only to a firm pinch. GCS is E2 V2 M4 = 8. ABG on room air: pH 7.18, PaCO2 78, PaO2 44, HCO3 28, BE +1.","stem":"Interpret the blood gas.","opts":["Metabolic acidosis with partial respiratory compensation","Combined respiratory and metabolic acidosis with hypoxemia","Acute (uncompensated) respiratory acidosis with hypoxemia","Fully compensated respiratory acidosis with hypoxemia"],"key":2,"why":"pH below 7.35 with PaCO2 above 45 makes the primary problem respiratory acidosis; a normal HCO3 and BE mean no compensation, so it is acute. A PaO2 of 44 is moderate hypoxemia, and below 40 would be severe. • Fully compensated respiratory acidosis with hypoxemia: HCO3 and BE are normal — there has been no time to compensate. • Metabolic acidosis with partial respiratory compensation: The PaCO2 is high, not low. • Combined respiratory and metabolic acidosis with hypoxemia: The BE is +1, which is normal.","src":[[2785,2801],[4280,4280],[8199,8201],[8637,8639],[19433,19436],[19020,19025],[21547,21550]],"origin":"heuer","age":"adult"},{"id":"CJ-163","cell":"MED-OTHER","type":"DM","setting":"in","topic":"Drug Overdose and Poisonings","scenario":"A 27-year-old is brought in unresponsive after a suspected opioid overdose. RR 6 and shallow, pinpoint pupils. SpO2 78% on room air. He does not respond to verbal stimulus, and withdraws only to a firm pinch. GCS is E2 V2 M4 = 8. ABG on room air: pH 7.18, PaCO2 78, PaO2 44, HCO3 28, BE +1.","stem":"His GCS is 8. What does this tell you and what is the immediate priority?","opts":["A GCS of 8 is mild impairment; observe him closely","Apply a nonrebreathing mask and wait for the drug to wear off","Start NPPV with a backup rate to treat the hypoventilation","GCS ≤ 8 means coma; secure ventilation and prepare to intubate"],"key":3,"why":"Severe impairment is a GCS of 8 or less. Diminished neurologic function from drug overdose with inadequate airway protection is an explicit indication for immediate intubation. • A GCS of 8 is mild impairment; observe him closely: Mild is 13–15, moderate 9–12, severe/coma 8 or less. • Apply a nonrebreathing mask and wait for the drug to wear off: Oxygen alone does not treat ventilatory failure or protect the airway. • Start NPPV with a backup rate to treat the hypoventilation: He cannot protect his airway — a contraindication to BiPAP.","src":[[2785,2801],[4280,4280],[8199,8201],[8637,8639],[19433,19436],[19020,19025],[21547,21550]],"origin":"heuer","age":"adult"},{"id":"CJ-164","cell":"MED-OTHER","type":"IG","setting":"in","topic":"Drug Overdose and Poisonings","scenario":"A 27-year-old is brought in unresponsive after a suspected opioid overdose. RR 6 and shallow, pinpoint pupils. SpO2 78% on room air. He does not respond to verbal stimulus, and withdraws only to a firm pinch. GCS is E2 V2 M4 = 8. ABG on room air: pH 7.18, PaCO2 78, PaO2 44, HCO3 28, BE +1.","stem":"IV access cannot be obtained immediately. All of the following statements about instilling drugs down the endotracheal tube are correct EXCEPT:","opts":["Halve the dose because absorption is faster via the airway","Naloxone is among the agents that can be instilled down the ETT when IV access is unavailable — remember L-E-A-N","Double the dose when instilling via ETT","Follow with about 10 mL of normal saline"],"key":0,"why":"Not appropriate: Halve the dose because absorption is faster via the airway — The opposite — absorption is less reliable, so the dose is doubled. The other three are appropriate: • Naloxone is among the agents that can be instilled down the ETT when IV access is unavailable — remember L-E-A-N: Lidocaine, Epinephrine, Atropine, Naloxone can be instilled via ETT in emergencies without IV access. • Double the dose when instilling via ETT: The stated adjustment for endotracheal instillation. • Follow with about 10 mL of normal saline: The recommended flush volume.","src":[[2785,2801],[4280,4280],[8199,8201],[8637,8639],[19433,19436],[19020,19025],[21547,21550]],"origin":"heuer","age":"adult"},{"id":"CJ-171","cell":"PED","type":"IG","setting":"in","topic":"Croup and Epiglottitis","scenario":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air.","stem":"All of the following history items and findings help distinguish croup from epiglottitis EXCEPT:","opts":["Hoarseness, barking cough, and inspiratory stridor","Assess for agitation; in severe cases look for significant tachypnea and tachycardia","Immediately examine the pharynx with a tongue depressor","Age: infant/toddler with initial cold-like symptoms and a low-grade fever progressing at night"],"key":2,"why":"Not appropriate: Immediately examine the pharynx with a tongue depressor — In suspected epiglottitis, minimize procedures that could precipitate airway compromise, including upper airway manipulation. The other three are appropriate: • Age: infant/toddler with initial cold-like symptoms and a low-grade fever progressing at night: The classic croup presentation; epiglottitis is abrupt in a toddler-to-school-age child. • Hoarseness, barking cough, and inspiratory stridor: Croup's hallmark triad. • Assess for agitation; in severe cases look for significant tachypnea and tachycardia: Stated croup assessment; lethargy, hypotonia, and cyanosis are late signs.","src":[[30145,30235],[4253,4268],[19024,19026]],"origin":"heuer","age":"pediatric"},{"id":"CJ-172","cell":"PED","type":"DM","setting":"in","topic":"Croup and Epiglottitis","scenario":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air. AP film shows a narrowed, tapering subglottic airway — the steeple sign. Lateral neck film is unremarkable. He is agitated but not drooling and is fully immunized.","stem":"What is your diagnosis and why?","opts":["Epiglottitis — the stridor and retractions are diagnostic","Bronchiolitis — the viral prodrome and fever are typical","Foreign-body aspiration — common at this age at night","Croup — steeple sign on the AP film, normal lateral film"],"key":3,"why":"In croup the AP film shows the steeple sign while the lateral neck may appear normal; in epiglottitis the pattern reverses. • Epiglottitis — the stridor and retractions are diagnostic: Stridor occurs in both; the radiographic pattern, gradual onset, and absent drooling point to croup. • Bronchiolitis — the viral prodrome and fever are typical: Produces wheezing and lower airway signs, not inspiratory stridor with a barking cough. • Foreign-body aspiration — common at this age at night: Possible in this age group, but the 2-day viral prodrome and steeple sign point to croup.","src":[[30145,30235],[4253,4268],[19024,19026]],"origin":"heuer","age":"pediatric"},{"id":"CJ-173","cell":"PED","type":"IG","setting":"in","topic":"Croup and Epiglottitis","scenario":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air. AP film shows a narrowed, tapering subglottic airway — the steeple sign. Lateral neck film is unremarkable. He is agitated but not drooling and is fully immunized.","stem":"All of the following treatment recommendations are appropriate EXCEPT:","opts":["Broad-spectrum antibiotics and viral serology","Close respiratory and cardiac monitoring including SpO2","Supplemental O2 as needed to keep SpO2 above 90%","Aerosolized racemic epinephrine, 0.25–0.50 mL of 2.25% solution with 3.0 mL saline, repeated up to three times"],"key":0,"why":"Not appropriate: Broad-spectrum antibiotics and viral serology — Do not recommend antibiotics or viral serology for croup — those belong to epiglottitis management, after the airway is secure. The other three are appropriate: • Close respiratory and cardiac monitoring including SpO2: Recommended for both croup and epiglottitis. • Supplemental O2 as needed to keep SpO2 above 90%: The stated oxygenation target. • Aerosolized racemic epinephrine, 0.25–0.50 mL of 2.25% solution with 3.0 mL saline, repeated up to three times: The specific croup dosing and repetition limit.","src":[[30145,30235],[4253,4268],[19024,19026]],"origin":"heuer","age":"pediatric"},{"id":"CJ-174","cell":"PED","type":"DM","setting":"in","topic":"Croup and Epiglottitis","scenario":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air. AP film shows a narrowed, tapering subglottic airway — the steeple sign. Lateral neck film is unremarkable. He is agitated but not drooling and is fully immunized. After two racemic epinephrine treatments his stridor persists at rest and retractions continue.","stem":"Repeat racemic epinephrine has failed. What do you recommend next?","opts":["Begin broad-spectrum IV antibiotics","Heliox by high-flow cannula or nonrebreather","Immediate cricothyroidotomy in the ED","Discharge home with a course of oral steroids"],"key":1,"why":"If repeat racemic epinephrine treatments fail to relieve symptoms, recommend heliox — it decreases the work of breathing associated with large-airway obstruction. • Immediate cricothyroidotomy in the ED: Reserved for failed intubation with worsening obstruction in epiglottitis. • Discharge home with a course of oral steroids: Stridor at rest after failed treatment requires escalation, and symptoms persisting beyond 4 hours warrant hospital admission. • Begin broad-spectrum IV antibiotics: Croup is viral.","src":[[30145,30235],[4253,4268],[19024,19026]],"origin":"heuer","age":"pediatric"},{"id":"CJ-175","cell":"PED","type":"DM","setting":"in","topic":"Croup and Epiglottitis","scenario":"A 3-year-old is brought to the ED at 2 a.m. The parents report two days of cold symptoms and a low-grade fever, and tonight a hoarse, barking cough with noisy breathing that worsens when he cries. Temp 37.9°C. He has inspiratory stridor and mild intercostal retractions. SpO2 94% on room air. AP film shows a narrowed, tapering subglottic airway — the steeple sign. Lateral neck film is unremarkable. He is agitated but not drooling and is fully immunized. After two racemic epinephrine treatments his stridor persists at rest and retractions continue.","stem":"If this child had instead presented with abrupt high fever, drooling, and a preference for sitting upright and leaning forward, what would you recommend?","opts":["Examine the throat with a tongue blade to confirm the diagnosis","Oral antibiotics and follow-up in the clinic the next day","Avoid airway manipulation; intubate under controlled conditions","Aerosolized racemic epinephrine, then discharge after 2 hours"],"key":2,"why":"The epiglottitis pathway: minimize procedures that could precipitate compromise, secure the airway under controlled conditions, then give a broad-spectrum cephalosporin for 7–10 days. • Aerosolized racemic epinephrine, then discharge after 2 hours: Epiglottitis is a bacterial airway emergency. • Examine the throat with a tongue blade to confirm the diagnosis: Can precipitate complete obstruction. • Oral antibiotics and follow-up in the clinic the next day: Dangerously inadequate.","src":[[30145,30235],[4253,4268],[19024,19026]],"origin":"heuer","age":"pediatric"},{"id":"CJ-181","cell":"PED","type":"IG","setting":"in","topic":"Asthma","scenario":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best.","stem":"All of the following initial assessments are appropriate EXCEPT:","opts":["Assess breathlessness by how she talks — phrases versus words versus limited effort","Measure PEF or FEV1 as a percentage of predicted or personal best","Obtain SpO2 and, if severe, an arterial blood gas","Perform full pulmonary function testing with lung volumes and DLCO"],"key":3,"why":"Not appropriate: Perform full pulmonary function testing with lung volumes and DLCO — Inappropriate during an acute exacerbation. The other three are appropriate: • Assess breathlessness by how she talks — phrases versus words versus limited effort: The severity table grades moderate as dyspnea at rest talking in phrases, severe as talking in words. • Measure PEF or FEV1 as a percentage of predicted or personal best: Objective severity measure in children 5 years and older. • Obtain SpO2 and, if severe, an arterial blood gas: Monitor response with repeat lung function, physical exam, signs and symptoms, and pulse oximetry in the ED.","src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"origin":"heuer","age":"pediatric"},{"id":"CJ-182","cell":"PED","type":"DM","setting":"in","topic":"Asthma","scenario":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best. ABG: pH 7.46, PaCO2 31, PaO2 66 on room air.","stem":"How do you interpret that blood gas in the context of asthma severity?","opts":["Early respiratory alkalosis with hypoxemia; watch for cross-over","A normal blood gas for asthma, requiring no follow-up","Metabolic alkalosis from albuterol-induced hypokalemia","Respiratory acidosis indicating imminent respiratory failure"],"key":0,"why":"Early on the ABG typically shows respiratory alkalosis with mild to moderate hypoxemia; normalization of the pH — the cross-over point — usually indicates a rising PaCO2 and progression toward respiratory acidosis and failure. • A normal blood gas for asthma, requiring no follow-up: It is abnormal and, more importantly, it is the baseline against which deterioration is judged. • Metabolic alkalosis from albuterol-induced hypokalemia: Albuterol lowers potassium but does not produce this pattern. • Respiratory acidosis indicating imminent respiratory failure: Not yet — but that is exactly what you are watching for.","src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"origin":"heuer","age":"pediatric"},{"id":"CJ-183","cell":"PED","type":"IG","setting":"in","topic":"Asthma","scenario":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best. ABG: pH 7.46, PaCO2 31, PaO2 66 on room air.","stem":"All of the following are appropriate initial treatments EXCEPT:","opts":["Oral systemic corticosteroids","A long-acting β-agonist for rapid relief","Repetitive or continuous short-acting β-agonist","Add inhaled ipratropium bromide given the severity"],"key":1,"why":"Not appropriate: A long-acting β-agonist for rapid relief — LABAs should never be used to treat acute exacerbations. The other three are appropriate: • Repetitive or continuous short-acting β-agonist: Standard emergency care; repeat every 20 minutes up to three times or nebulize continuously. • Add inhaled ipratropium bromide given the severity: Recommended in severe exacerbations. • Oral systemic corticosteroids: Given in moderate or severe exacerbations or when the response to SABA is incomplete.","src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"origin":"heuer","age":"pediatric"},{"id":"CJ-184","cell":"PED","type":"DM","setting":"in","topic":"Asthma","scenario":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best. ABG: pH 7.46, PaCO2 31, PaO2 66 on room air. After one hour of treatment her symptoms are relieved, PEF is 74% of personal best, and the improvement holds for a full hour with no further treatment.","stem":"How do you classify her response, and what do you recommend?","opts":["The response cannot be judged without a repeat arterial blood gas","Incomplete response — continue treatment in the ED","Good response: symptoms relieved, PEF ≥ 70%, sustained ≥ 1 hour; plan discharge","Poor response — admit her to the pediatric ICU for close monitoring"],"key":2,"why":"All three criteria for a good response are met. • Poor response — admit her to the pediatric ICU for close monitoring: Not supported by any finding. • The response cannot be judged without a repeat arterial blood gas: Lung function, exam, and symptoms are the stated measures. • Incomplete response — continue treatment in the ED: Incomplete response is mild-to-moderate symptoms persisting with PEF 40–69%; she exceeds that.","src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"origin":"heuer","age":"pediatric"},{"id":"CJ-185","cell":"PED","type":"IG","setting":"in","topic":"Asthma","scenario":"An 8-year-old with known asthma is brought to the ED after two days of worsening cough and wheeze. She speaks in short phrases, is using accessory muscles, and has diffuse expiratory wheezing. RR 34, HR 132. SpO2 90% on room air. Initial PEF is 45% of her personal best. ABG: pH 7.46, PaCO2 31, PaO2 66 on room air. After one hour of treatment her symptoms are improved, PEF is 74% of personal best, and the improvement holds for a full hour with no further treatment.","stem":"All of the following must be included in her discharge plan EXCEPT:","opts":["SABA and oral systemic corticosteroids, with consideration of starting an inhaled corticosteroid","A written asthma action plan","Review of inhaler technique and, whenever possible, environmental control measures","Instruction to use the LABA whenever symptoms flare"],"key":3,"why":"Not appropriate: Instruction to use the LABA whenever symptoms flare — LABAs must never be used for acute symptoms and should only be used with an inhaled steroid. The other three are appropriate: • SABA and oral systemic corticosteroids, with consideration of starting an inhaled corticosteroid: The stated discharge medication plan. • A written asthma action plan: Developed in partnership with the patient and family. • Review of inhaler technique and, whenever possible, environmental control measures: Explicitly required at discharge.","src":[[30518,30546],[21162,21192],[21062,21067],[18346,18355],[18561,18570]],"origin":"heuer","age":"pediatric"},{"id":"CJ-193","cell":"NEO-RESUS","type":"IG","setting":"in","topic":"Meconium Aspiration","scenario":"You are called to a delivery at 41 weeks' gestation for thick meconium-stained amniotic fluid. The mother had preeclampsia and there were abnormal fetal heart rate patterns. The infant is delivered limp, with poor respiratory effort and a heart rate of 88/min. Meconium is retrieved on suctioning. The heart rate is now 84/min.","stem":"Positive-pressure ventilation is begun. All of the following statements about technique and targets are correct EXCEPT:","opts":["PPV may be delivered with a flow-inflating bag, self-inflating bag, or T-piece resuscitator","Use a PEEP of 5 cm H2O or less","Use a PEEP of 10 cm H2O to recruit the lungs","PPV is the most effective intervention in the delivery room for improving outcomes"],"key":2,"why":"Not appropriate: Use a PEEP of 10 cm H2O to recruit the lungs — Above the recommended neonatal ceiling. The other three are appropriate: • PPV is the most effective intervention in the delivery room for improving outcomes: Explicitly stated in the neonatal resuscitation guidance. • PPV may be delivered with a flow-inflating bag, self-inflating bag, or T-piece resuscitator: All three are acceptable devices. • Use a PEEP of 5 cm H2O or less: Always recommended during neonatal PPV.","src":[[31056,31120],[21632,21690],[6532,6534]],"origin":"heuer","age":"neonatal"},{"id":"CJ-194","cell":"NEO-OTHER","type":"IG","setting":"in","topic":"Meconium Aspiration","scenario":"You are called to a delivery at 41 weeks' gestation for thick meconium-stained amniotic fluid. The mother had preeclampsia and there were abnormal fetal heart rate patterns. The infant is delivered limp, with poor respiratory effort and a heart rate of 88/min. Meconium is retrieved on suctioning. The heart rate is now 84/min. Heart rate rises to 140. The infant is transferred to the NICU with tachypnea, grunting, intercostal retractions, nasal flaring, and a barrel-shaped chest.","stem":"All of the following assessments and tests should be recommended in the NICU EXCEPT:","opts":["Chest x-ray looking for patchy overexpansion and infiltration/atelectasis, and for air leaks","Auscultate for coarse bilateral rhonchi and crackles, and for a systolic murmur suggesting PPHN","Echocardiography to rule out congenital heart disease and assess right-to-left shunting","Discharge to the newborn nursery since the heart rate normalized"],"key":3,"why":"Not appropriate: Discharge to the newborn nursery since the heart rate normalized — He has clear signs of respiratory distress after MSAF. The other three are appropriate: • Chest x-ray looking for patchy overexpansion and infiltration/atelectasis, and for air leaks: MAS shows diffuse or localized hyperinflation with infiltration/atelectasis; pneumothorax and PIE may be evident, and cardiomegaly suggests coexisting PPHN. • Auscultate for coarse bilateral rhonchi and crackles, and for a systolic murmur suggesting PPHN: The stated auscultatory findings; a tricuspid regurgitation murmur points to PPHN. • Echocardiography to rule out congenital heart disease and assess right-to-left shunting: Explicitly recommended for MAS.","src":[[31056,31120],[21632,21690],[6532,6534]],"origin":"heuer","age":"neonatal"},{"id":"CJ-195","cell":"NEO-OTHER","type":"DM","setting":"in","topic":"Meconium Aspiration","scenario":"You are called to a delivery at 41 weeks' gestation for thick meconium-stained amniotic fluid. The mother had preeclampsia and there were abnormal fetal heart rate patterns. The infant is delivered limp, with poor respiratory effort and a heart rate of 88/min. Meconium is retrieved on suctioning. The heart rate is now 84/min. Heart rate rises to 140. The infant is transferred to the NICU with tachypnea, grunting, intercostal retractions, nasal flaring, and a barrel-shaped chest.","stem":"He requires 55% oxygen to maintain adequate oxygenation. How is his MAS classified, and what do you recommend?","opts":["Moderate (> 40% O2); surfactant by INSURE, then nasal CPAP","Classification does not change his management at all","Mild — under 40% O2 is needed; observe him only","Severe — recommend immediate referral for ECMO"],"key":0,"why":"MAS is mild if under 40% O2, moderate if over 40%, and severe if positive-pressure ventilation is needed to support life. Surfactant is inactivated by meconium, so replacement using intubation-surfactant-extubation is recommended. • Classification does not change his management at all: It directly drives the treatment plan. • Mild — under 40% O2 is needed; observe him only: He needs 55%. • Severe — recommend immediate referral for ECMO: Severe means PPV is necessary to support life; ECMO has its own separate criteria.","src":[[31056,31120],[21632,21690],[6532,6534]],"origin":"heuer","age":"neonatal"},{"id":"CJ-201","cell":"NEO-OTHER","type":"IG","setting":"in","topic":"Apnea of Prematurity","scenario":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation.","stem":"All of the following assessments are needed to define and explain these events EXCEPT:","opts":["Rule out hypoxemia, anemia, and sepsis","Assume it is simply prematurity and order no work-up","Confirm the episodes are recurrent and either last more than 20 seconds or are accompanied by cyanosis, a 4% or greater fall in SpO2, or bradycardia","Note that he was born at less than 37 weeks' gestation and the events are in the first 2 to 3 days"],"key":1,"why":"Not appropriate: Assume it is simply prematurity and order no work-up — Apnea of prematurity is a diagnosis of exclusion. The other three are appropriate: • Confirm the episodes are recurrent and either last more than 20 seconds or are accompanied by cyanosis, a 4% or greater fall in SpO2, or bradycardia: That is the definition of apnea of prematurity. • Note that he was born at less than 37 weeks' gestation and the events are in the first 2 to 3 days: The stated clinical window for apnea of prematurity. • Rule out hypoxemia, anemia, and sepsis: Named alternative causes that must be excluded.","src":[[31215,31252],[5406,5433],[13934,13938]],"origin":"heuer","age":"neonatal"},{"id":"CJ-202","cell":"NEO-OTHER","type":"DM","setting":"in","topic":"Apnea of Prematurity","scenario":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation. Work-up is negative: normal glucose and electrolytes, no anemia, cultures pending and infant is afebrile, head ultrasound normal.","stem":"How should this infant be positioned?","opts":["Left lateral decubitus","Semi-Fowler's at 30 degrees","Prone","Supine with the head of the bed flat"],"key":2,"why":"Recommend that the infant be cared for in the prone position for apnea of prematurity. • Supine with the head of the bed flat: Not the stated recommendation for apnea of prematurity. • Left lateral decubitus: Not the stated recommendation. • Semi-Fowler's at 30 degrees: That is the VAP-prevention position for ventilated patients, not this.","src":[[31215,31252],[5406,5433],[13934,13938]],"origin":"heuer","age":"neonatal"},{"id":"CJ-203","cell":"NEO-OTHER","type":"IG","setting":"in","topic":"Apnea of Prematurity","scenario":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation. Work-up is negative: normal glucose and electrolytes, no anemia, cultures pending and infant is afebrile, head ultrasound normal.","stem":"All of the following belong in the monitoring and alarm setup EXCEPT:","opts":["Continuous apnea monitoring for respiration and heart rate","Continuous pulse oximetry, since episodes of desaturation are occurring","Set the apnea time alarm limit at 15–20 seconds","Rely on the monitor alone without visual confirmation of the infant"],"key":3,"why":"Not appropriate: Rely on the monitor alone without visual confirmation of the infant — You should always confirm a patient's status by visual inspection. The other three are appropriate: • Continuous apnea monitoring for respiration and heart rate: Explicitly recommended. • Continuous pulse oximetry, since episodes of desaturation are occurring: Explicitly recommended when desaturation accompanies the apnea. • Set the apnea time alarm limit at 15–20 seconds: The typical setting.","src":[[31215,31252],[5406,5433],[13934,13938]],"origin":"heuer","age":"neonatal"},{"id":"CJ-204","cell":"NEO-OTHER","type":"DM","setting":"in","topic":"Apnea of Prematurity","scenario":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation. Work-up is negative: normal glucose and electrolytes, no anemia, cultures pending and infant is afebrile, head ultrasound normal.","stem":"An alarm sounds. The infant is apneic but pink with normal color. What do you do?","opts":["Wait 10 seconds for self-correction, then stimulate","Intubate now for recurrent apnea of prematurity","Silence the alarm and keep observing without touching","Intervene immediately with bag-mask ventilation"],"key":0,"why":"Intervene immediately only if the infant exhibits cyanosis or severe pallor; otherwise wait 10 seconds for self-correction before tactile stimulation. • Intubate now for recurrent apnea of prematurity: Far out of proportion to a self-limited event. • Silence the alarm and keep observing without touching: Tactile stimulation is the next step if the apnea does not self-correct. • Intervene immediately with bag-mask ventilation: Immediate intervention is reserved for cyanosis or severe pallor.","src":[[31215,31252],[5406,5433],[13934,13938]],"origin":"heuer","age":"neonatal"},{"id":"CJ-205","cell":"NEO-OTHER","type":"DM","setting":"in","topic":"Apnea of Prematurity","scenario":"A 30-week, 1,250-gram infant is 2 days old and spontaneously breathing on nasal CPAP. The cardiorespiratory monitor has recorded four episodes of apnea in the past 6 hours, two accompanied by bradycardia and desaturation. Work-up is negative: normal glucose and electrolytes, no anemia, cultures pending and infant is afebrile, head ultrasound normal.","stem":"The parents ask when this will stop. Your best answer is:","opts":["It should resolve completely within the next 24 hours","It usually lessens and resolves by 34–36 weeks' postconceptual age","It never resolves, and requires lifelong home apnea monitoring","It usually persists until at least one year of corrected age"],"key":1,"why":"The stated natural history. • It never resolves, and requires lifelong home apnea monitoring: False. • It usually persists until at least one year of corrected age: Inaccurate and needlessly alarming. • It should resolve completely within the next 24 hours: Inaccurate; it varies inversely with gestational age and birth weight.","src":[[31215,31252],[5406,5433],[13934,13938]],"origin":"heuer","age":"neonatal"},{"id":"CJ-P01","cell":"PERIOP","type":"IG","setting":"out","topic":"Cardiac surgery: preoperative assessment","scenario":"A 77-year-old woman with a 40 pack-year smoking history is seen in the preadmission clinic one week before elective coronary artery bypass surgery.","stem":"Which test should the respiratory therapist recommend as part of her preoperative assessment?","opts":["Bedside spirometry: FVC, slow vital capacity, and IC","A pulmonary artery catheter for baseline pressures","A ventilation/perfusion scan of both lungs","An overnight polysomnography (sleep study)"],"key":0,"why":"Bedside spirometry (FVC, SVC, and IC) is recommended before cardiac surgery for any patient with a history of lung disease or smoking. Routine pulmonary artery catheter use is not recommended, and nothing in this history calls for a V/Q scan or sleep study.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P02","cell":"PERIOP","type":"IG","setting":"out","topic":"Cardiac surgery: preoperative risk","scenario":"During a preoperative chart review for cardiac surgery you note: a 62-year-old man, ejection fraction 35%, scheduled for an elective single-vessel off-pump procedure, no lung disease.","stem":"Which finding identifies an increased risk of postoperative complications?","opts":["His age","His gender","The low ejection fraction","The off-pump technique"],"key":2,"why":"A low ejection fraction (EF < 40%) is a listed risk factor. The demographic risks are advanced age (75 years or older) and female gender, and the operative risks are emergency surgery and cardiopulmonary bypass rather than off-pump technique.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P03","cell":"PERIOP","type":"DM","setting":"out","topic":"Cardiac surgery: preoperative education","scenario":"A patient scheduled for valve replacement next week attends a preoperative teaching visit. He asks what he can do to lower his chance of lung problems after surgery.","stem":"Which preoperative education plan is most appropriate?","opts":["Explain airway and ventilator care; train lung expansion and clearance","Wait to teach until after he is extubated, so he is not made anxious","Give a written list of ventilator modes and alarm limits to memorize","Advise him to avoid deep breathing after surgery to protect the incision"],"key":0,"why":"Preoperative education that covers airway and ventilator management, plus training in the selected lung expansion and airway clearance methods, helps reduce postoperative complications.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P04","cell":"PERIOP","type":"IG","setting":"in","topic":"Cardiac surgery: postoperative monitoring","scenario":"A patient has just arrived in the cardiac surgical ICU after bypass surgery and has been placed on the ventilator. Continuous pulse oximetry and capnography are in place.","stem":"When should the first blood gas be obtained, and what should be computed from it?","opts":["Immediately on arrival; the anion gap","After 20 minutes on the ventilator; the P(A-a)O2 and P/F ratio","After 2 hours on the ventilator; the dead space to tidal volume ratio","Only if the SpO2 falls below 90%; the oxygen content"],"key":1,"why":"After the patient has been on the ventilator for 20 minutes, obtain a blood gas and compute the P(A-a)O2 and the P/F ratio.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P05","cell":"PERIOP","type":"DM","setting":"in","topic":"Cardiac surgery: initial ventilator settings","scenario":"An adult is transferred from the operating room after coronary artery bypass surgery, still anesthetized, with no spontaneous breathing.","stem":"Which initial ventilator settings are most appropriate?","opts":["CPAP 5 cm H2O with pressure support 5 cm H2O","SIMV rate 4/min, VT 4 mL/kg, PEEP 15 cm H2O","A/C, VT 8–10 mL/kg, Pplat ≤ 30, PEEP 5–10 cm H2O","Pressure control, inverse ratio, with no PEEP"],"key":2,"why":"Initial settings are full ventilatory support (pressure or volume control A/C), a tidal volume of 8-10 mL/kg with plateau pressure of 30 cm H2O or less, a rate giving a PetCO2 of 30-40 torr, and PEEP of 5-10 cm H2O.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P06","cell":"PERIOP","type":"IG","setting":"in","topic":"Cardiac surgery: hemodynamic monitoring","scenario":"You are asked which monitoring should be recommended for a patient returning from coronary artery bypass surgery.","stem":"Which monitoring plan is most appropriate?","opts":["Routine pulmonary artery catheter, with hourly wedge pressures","Radial arterial line and CVP, with 5-lead ECG (leads II and V5)","Noninvasive cuff pressures every 4 hours, with a 3-lead ECG","Central venous pressure alone, without any ECG monitoring"],"key":1,"why":"Recommended monitoring is 5-lead ECG telemetry (including leads II and V5 for detecting ischemia) and hemodynamic monitoring with direct radial arterial pressure and CVP. Routine use of a PA catheter is not recommended.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P07","cell":"PERIOP","type":"DM","setting":"in","topic":"Cardiac surgery: fast-track weaning","scenario":"Three hours after bypass surgery a patient is awake, nods appropriately, lifts his head and legs on command, and has an intact cough. FiO2 0.40, PEEP 5 cm H2O, SpO2 96%, pH 7.38, HCO3 24 mmol/L. MAP is 82 mm Hg without vasoactive drugs, heart rate 92/min, and chest tube drainage is 40 mL/h. Sedation has been stopped.","stem":"What should the respiratory therapist recommend?","opts":["Continue full ventilatory support until the next morning","Begin an SBT using CPAP or CPAP with pressure support","Extubate immediately, without any breathing trial","Increase the PEEP to 10 cm H2O and repeat the blood gas"],"key":1,"why":"He meets example fast-track criteria (FiO2 of 0.50 or less and PEEP of 8 cm H2O or less with SpO2 of 90% or more, acceptable pH, neurologic and hemodynamic criteria, chest tube drainage under 50-100 mL/h). The goal is weaning and extubation within 2 to 6 hours, using a standard spontaneous breathing trial with CPAP or CPAP plus pressure support.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P08","cell":"PERIOP","type":"DM","setting":"in","topic":"Cardiac surgery: not ready to fast-track","scenario":"Two hours after valve surgery a patient is awake and breathing spontaneously. Chest tube drainage is 250 mL/h and the MAP is 62 mm Hg on a norepinephrine infusion.","stem":"What should the respiratory therapist recommend regarding weaning?","opts":["Proceed with a spontaneous breathing trial, since he is awake","Extubate to noninvasive ventilation and observe in the ICU","Continue support; he does not meet the hemodynamic criteria","Switch to CPAP 5 cm H2O and discontinue invasive monitoring"],"key":2,"why":"Fast-track criteria require an acceptable blood pressure (for example MAP above 75 mm Hg) without vasoactive drug support and no evidence of major bleeding (chest tube drainage below 50-100 mL/h). This patient meets neither.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P09","cell":"PERIOP","type":"DM","setting":"in","topic":"Cardiac surgery: failed breathing trial","scenario":"A cardiac surgery patient on a spontaneous breathing trial develops a rapid shallow breathing index of 130 with visible distress and is returned to the previous settings.","stem":"What is the most appropriate next step?","opts":["Try again every 30–60 minutes until it is tolerated","Wait 24 hours before any further weaning attempt","Recommend an elective tracheotomy within 48 hours","Sedate the patient and begin inverse ratio ventilation"],"key":0,"why":"A successful trial shows hemodynamic stability and an acceptable breathing pattern (for example RSBI below 100). If the attempt is unsuccessful, try again every 30-60 minutes until the patient maintains adequate oxygenation and ventilation for at least 30 minutes with pressure support of 5 cm H2O or less.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P10","cell":"PERIOP","type":"DM","setting":"in","topic":"Cardiac surgery: after extubation","scenario":"A patient was extubated four hours after bypass surgery through a median sternotomy. He takes shallow breaths and will not cough because of incisional pain.","stem":"Which recommendation is most appropriate?","opts":["Keep him supine and limit his movement for 24 hours","Sit him in a chair; teach deep breathing and splinted coughing","Reintubate him to allow deep tracheal suctioning","Withhold airway clearance until the chest tubes are out"],"key":1,"why":"As soon as possible after extubation the patient should sit up in a chair and begin to ambulate, and start airway clearance with at least deep breathing and directed coughing. Splinting a median sternotomy with a cough pillow helps the patient cough effectively.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P11","cell":"PERIOP","type":"IG","setting":"in","topic":"Cardiac surgery: late complications","scenario":"Two days after extubation on the step-down unit, a cardiac surgery patient has progressive hypoxemia, fever, decreased breath sounds and a dull percussion note over the right base, and the trachea is deviated toward the right.","stem":"What do these findings most likely indicate?","opts":["A right tension pneumothorax","A large right pleural effusion pushing the mediastinum","Atelectasis or pneumonia on the right","Pulmonary embolism"],"key":2,"why":"Progressive hypoxemia, dyspnea, decreased breath sounds, a dull percussion note, fever, and tracheal deviation toward the affected side are the signs of atelectasis or pneumonia to keep monitoring for after transfer to a step-down unit.","src":[[27699,27827]],"origin":"heuer","age":"adult"},{"id":"CJ-P12","cell":"PERIOP","type":"IG","setting":"out","topic":"Bariatric surgery: candidacy","scenario":"A 44-year-old with a BMI of 37 kg/m2 and obstructive sleep apnea treated with CPAP is being evaluated at a bariatric surgery center.","stem":"Based on the listed indications, is this patient a candidate for bariatric surgery?","opts":["No; surgery requires a BMI of at least 40 kg/m2 in every case","Yes; a BMI of 35.0–39.9 with a serious comorbidity such as OSA","No; obstructive sleep apnea is a contraindication to surgery","Yes; any adult with a BMI above 25 kg/m2 qualifies for surgery"],"key":1,"why":"Indications include a BMI of 40 kg/m2 or more without comorbidities, or a BMI of 35.0 to 39.9 kg/m2 with at least one serious comorbidity such as type 2 diabetes, obstructive sleep apnea, hypertension, or obesity-hypoventilation syndrome.","src":[[29555,29644]],"origin":"heuer","age":"adult"},{"id":"CJ-P13","cell":"PERIOP","type":"IG","setting":"out","topic":"Bariatric surgery: contraindications","scenario":"A preoperative assessment is being completed for a patient who requests bariatric surgery.","stem":"Which finding would preclude the procedure?","opts":["Obstructive sleep apnea","Type 2 diabetes","Hypertension","Untreated major depression"],"key":3,"why":"Conditions that preclude bariatric surgery include untreated major depression or psychosis, uncontrolled eating disorders, current drug or alcohol abuse, severe cardiac disease with prohibitive anesthetic risk, severe coagulopathy, and inability to comply with nutritional requirements. Sleep apnea, diabetes and hypertension are comorbidities that support the indication.","src":[[29555,29644]],"origin":"heuer","age":"adult"},{"id":"CJ-P14","cell":"PERIOP","type":"DM","setting":"in","topic":"Bariatric surgery: postoperative positioning","scenario":"A patient with a BMI of 46 kg/m2 arrives on the surgical unit after a sleeve gastrectomy. SpO2 is 91% on 3 L/min and breath sounds are diminished at both bases.","stem":"How should this patient be positioned?","opts":["Supine and flat","Trendelenburg","Semi-Fowler's","Prone"],"key":2,"why":"Postoperatively the bariatric patient should be kept in a semi-Fowler's position, because obesity causes a severe restrictive defect when lying flat and can induce atelectasis.","src":[[29555,29644]],"origin":"heuer","age":"adult"},{"id":"CJ-P15","cell":"PERIOP","type":"DM","setting":"in","topic":"Bariatric surgery: sleep apnea","scenario":"The night after gastric bypass surgery, a patient with known obstructive sleep apnea has repeated desaturations while asleep. He uses CPAP at home but it was not ordered on admission.","stem":"What should the respiratory therapist recommend?","opts":["Resume CPAP during sleep","Increase the nasal cannula flow and keep him flat","Give a sedative so he sleeps more deeply","Withhold all positive pressure until the suture line has healed"],"key":0,"why":"If the bariatric patient has obstructive sleep apnea as a comorbidity, treatment such as CPAP should be employed if warranted.","src":[[29555,29644]],"origin":"heuer","age":"adult"},{"id":"CJ-N01","cell":"CLD-NEW","type":"IG","setting":"out","topic":"COPD: new diagnosis","scenario":"A 58-year-old with a 40 pack-year history is referred to the pulmonary clinic. He has had a productive cough most mornings for about 3 months in each of the last 3 years. He is obese and cyanotic with ankle edema, and has rhonchi and wheezing.","stem":"Which diagnosis do these findings best fit?","opts":["Emphysema","Chronic bronchitis","Pulmonary fibrosis","Asthma"],"key":1,"why":"Chronic bronchitis is defined by its symptoms: productive cough for at least 3 months per year for at least 2 years. Early copious sputum, normal weight or obesity, cyanosis, peripheral edema, rhonchi and wheezing distinguish it from emphysema.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-N02","cell":"CLD-NEW","type":"IG","setting":"out","topic":"COPD: confirming the diagnosis","scenario":"A 61-year-old smoker with exertional dyspnea is being evaluated in clinic for possible COPD.","stem":"Which result confirms airflow obstruction consistent with COPD?","opts":["An FEV1/FVC below 70% after bronchodilator therapy","A reduced DLCO with normal spirometry","A flattened diaphragm on the chest radiograph","A PaCO2 of 48 torr"],"key":0,"why":"For both emphysema and chronic bronchitis the spirometric criterion is an FEV1/FVC (FEV1%) below 70% after bronchodilator therapy.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-N03","cell":"CLD-NEW","type":"IG","setting":"out","topic":"COPD: young patient","scenario":"A 41-year-old who has never smoked has progressive dyspnea. Imaging shows hyperinflation and spirometry confirms obstruction consistent with emphysema.","stem":"Which additional test should be recommended?","opts":["Sweat chloride test","Alpha1-antitrypsin level","Serum IgE level","Overnight sleep study"],"key":1,"why":"Decreased alpha1-antitrypsin is evident in less than 1% of COPD patients and should be assessed if emphysema appears at a young age (45 years or younger) or without a history of smoking.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-N04","cell":"CLD-NEW","type":"IG","setting":"out","topic":"COPD: pulmonary function pattern","scenario":"A thin 64-year-old with a barrel chest has pulmonary function testing in the outpatient laboratory: post-bronchodilator FEV1/FVC 55%, increased RV and TLC, and a decreased DLCO.","stem":"This pattern is most consistent with:","opts":["Chronic bronchitis","A restrictive disorder","Emphysema","Normal lung function"],"key":2,"why":"Both disorders show an FEV1/FVC below 70% after bronchodilator. Emphysema adds increased RV and TLC, increased compliance and a decreased DLCO; in chronic bronchitis the DLCO and compliance are normal.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-N05","cell":"CLD-NEW","type":"DM","setting":"out","topic":"COPD: initial treatment by stage","scenario":"A newly diagnosed patient has a post-bronchodilator FEV1/FVC of 62% and an FEV1 of 65% of predicted, with shortness of breath on exertion.","stem":"Which treatment should be recommended?","opts":["A short-acting bronchodilator as needed, with no maintenance drug","A regular LABA, considering an added long-acting anticholinergic","An inhaled steroid plus long-term oxygen therapy at 2 L/min","Referral for lung volume reduction surgery"],"key":1,"why":"An FEV1/FVC below 70% with an FEV1 of 50-79% of predicted is Stage II (moderate). The stepped approach at this stage is regular use of a LABA, considering a combined LABA and long-acting anticholinergic.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-N06","cell":"CLD-NEW","type":"DM","setting":"out","topic":"COPD: stable disease management","scenario":"A patient just diagnosed with stable COPD asks whether she should take a daily mucolytic and keep a standing antibiotic prescription.","stem":"What is the best response?","opts":["Yes to both; together they slow the progression of the disease","Yes to the mucolytic only; antibiotics are kept for exacerbations","Neither is recommended; prioritize cessation, vaccines and rehab","Yes to the antibiotic only, taken daily to prevent exacerbations"],"key":2,"why":"Neither mucolytics nor the routine use of antibiotics is recommended to manage stable COPD, even in advanced stages. Comprehensive care includes smoking cessation, disease management education, pulmonary rehabilitation, and immunization against influenza and pneumococcal pneumonia.","src":[[26643,26758]],"origin":"heuer","age":"adult"},{"id":"CJ-O01","cell":"CLD-OUT","type":"IG","setting":"out","topic":"Asthma: level of control","scenario":"A 29-year-old with asthma is seen in clinic. She has symptoms 4 days a week, wakes at night with symptoms twice a week, uses her short-acting bronchodilator 4 days a week, and has an FEV1 of 72% of predicted.","stem":"How should her asthma control be classified?","opts":["Well controlled","Not well controlled","Very poorly controlled","Unable to classify without a blood gas"],"key":1,"why":"Not well controlled asthma means symptoms or SABA use more than 2 days per week, nighttime awakenings 1 to 3 per week, some activity limitation, or an FEV1 of 60 to 80 percent predicted.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O02","cell":"CLD-OUT","type":"IG","setting":"out","topic":"Asthma: before stepping up","scenario":"A man with asthma that has become not well controlled returns to clinic asking for a stronger inhaler.","stem":"What should be assessed before recommending a change in his drug regimen?","opts":["His adherence, inhaler technique, triggers, and coexisting conditions","His arterial blood gases on room air at rest and after a walk","His response to a methacholine challenge test","His exercise capacity and SpO2 during a treadmill walk test"],"key":0,"why":"When asthma becomes not well controlled, first assess compliance with the drug regimen, inhaler technique, and control of environmental factors and coexisting conditions.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O03","cell":"CLD-OUT","type":"DM","setting":"out","topic":"Asthma: step up","scenario":"A patient's asthma is not well controlled. You confirm that she takes her medications as prescribed with good inhaler technique, and that triggers and coexisting conditions are under control.","stem":"What should be recommended?","opts":["Continue the current regimen and return in 6 months","A step-up in the drug regimen with reevaluation in 2-6 weeks","A step-down in the drug regimen","Stop the controller and use the short-acting bronchodilator only"],"key":1,"why":"If compliance is confirmed and environmental factors and coexisting conditions are under control, recommend a step-up in the drug regimen and reevaluation by the doctor in 2-6 weeks.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O04","cell":"CLD-OUT","type":"DM","setting":"out","topic":"Asthma: step down","scenario":"A patient taking a medium-dose inhaled corticosteroid plus a long-acting beta-agonist has had well controlled asthma for the past 4 months.","stem":"What should be recommended?","opts":["A step down in the drug regimen","Adding an oral corticosteroid","A step up to a high-dose inhaled corticosteroid","Stopping all medication"],"key":0,"why":"If asthma remains well controlled for 3 months or longer, recommend a step down in the drug regimen.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O05","cell":"CLD-OUT","type":"DM","setting":"out","topic":"Asthma: very poorly controlled","scenario":"A patient has asthma symptoms throughout the day, uses a short-acting bronchodilator several times a day, and is extremely limited in activity. Compliance, technique and trigger control are confirmed.","stem":"What should be recommended?","opts":["Maintain the current step and follow up again in 1 to 6 months","A short course of oral steroids, a step-up, and recheck in 2 weeks","A step down in the drug regimen and recheck in 2 weeks","Replace the controller with a leukotriene modifier alone, then recheck"],"key":1,"why":"For very poorly controlled asthma with confirmed compliance and controlled environmental factors, recommend a short course of oral systemic corticosteroids and a step-up in the drug regimen with reevaluation in 2 weeks.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O06","cell":"CLD-OUT","type":"DM","setting":"out","topic":"Asthma: step 5 therapy","scenario":"An adult with allergic asthma remains not well controlled on a medium-dose inhaled corticosteroid plus a long-acting beta-agonist, despite confirmed adherence and good technique.","stem":"Which regimen is the next preferred step?","opts":["Step down to a low-dose inhaled corticosteroid alone","A short-acting beta-agonist as needed only","High-dose inhaled steroid plus LABA, considering omalizumab","Theophylline alone in place of the inhaled drugs"],"key":2,"why":"Medium-dose inhaled corticosteroid plus LABA is step 4. Step 5 is a high-dose inhaled corticosteroid plus LABA, with omalizumab considered for patients with allergies.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-O07","cell":"CLD-OUT","type":"IG","setting":"out","topic":"Asthma: rescue inhaler use","scenario":"During a home visit a patient with asthma reports using her short-acting bronchodilator on 5 days of most weeks.","stem":"What does this indicate?","opts":["Expected use for well-controlled asthma","Inadequate control; treatment should be stepped up","That the bronchodilator should be stopped","That she is overdosing and needs emergency care"],"key":1,"why":"A short-acting beta-agonist should always be available, but use more often than two days per week indicates inadequate control and the need for a step-up in treatment.","src":[[30387,30509]],"origin":"heuer","age":"adult"},{"id":"CJ-T01","cell":"TRAUMA","type":"DM","setting":"in","topic":"Chest trauma: tension pneumothorax","scenario":"After a motor vehicle accident a patient arrives in severe distress with cyanosis, tachycardia and hypotension. Breath sounds are absent on the left with hyperresonance, and the mediastinum is shifted to the right.","stem":"What should be recommended first?","opts":["A portable chest radiograph","A chest CT scan","Immediate needle decompression or tube thoracostomy","Intubation and positive-pressure ventilation with high PEEP"],"key":2,"why":"With clear signs of a tension pneumothorax, do not recommend an initial chest x-ray or CT scan; recommend immediate treatment by needle decompression or tube thoracostomy, and image only afterward.","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T02","cell":"TRAUMA","type":"DM","setting":"in","topic":"Chest trauma: sucking chest wound","scenario":"A patient with a stab wound to the right chest is brought to the emergency department. Air can be heard entering the wound with each inspiration.","stem":"What is the appropriate initial management of the wound?","opts":["Leave it open to air","Cover it with an occlusive dressing","Pack it tightly with dry gauze and begin bag-mask ventilation","Probe the wound to determine its depth"],"key":1,"why":"A sucking chest wound should initially be covered with an occlusive dressing (for example a Vaseline gauze pad) to permit adequate ventilation and help prevent a tension pneumothorax. Definitive treatment is surgical repair.","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T03","cell":"TRAUMA","type":"DM","setting":"in","topic":"Chest trauma: flail chest","scenario":"A patient with several ribs broken in two places has paradoxical chest wall motion and severe pain on inspiration. Blood gases on supplemental oxygen are acceptable and he is alert.","stem":"Which recommendation is most appropriate?","opts":["Intubation and mechanical ventilation to stabilize the chest wall","Epidural analgesia, early mobilization, and bronchial hygiene","High-dose corticosteroids to reduce chest wall inflammation","Strapping the chest tightly to limit the paradoxical motion"],"key":1,"why":"Epidural analgesia is recommended for rib cage fracture pain because it allows painless deep breathing and coughing without depressing respiration. Mechanical ventilation is recommended only to correct abnormal gas exchange, not to treat chest wall instability.","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T04","cell":"TRAUMA","type":"IG","setting":"in","topic":"Chest trauma: pulmonary contusion","scenario":"A patient struck by a steering wheel has a chest radiograph suggesting pulmonary contusion. He is comfortable with an SpO2 of 95% on 2 L/min.","stem":"What should the respiratory therapist anticipate?","opts":["Discharge home today, since he is stable on 2 L/min of oxygen","Worsening hypoxemia or ARDS over 24–48 hours; monitor closely","An immediate need for high-dose systemic corticosteroid therapy","Resolution of the contusion within the next hour"],"key":1,"why":"The full effects of pulmonary contusion may not be apparent for 24-48 hours, so patients should be admitted and closely monitored, mainly for worsening hypoxemia and development of ARDS. Steroids are not recommended for pulmonary contusion.","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T05","cell":"TRAUMA","type":"DM","setting":"in","topic":"Chest trauma: marginal respiratory status","scenario":"An alert, cooperative patient with a pulmonary contusion has a marginal respiratory status on a nonrebreathing mask. There is no pneumothorax.","stem":"Which recommendation is most appropriate?","opts":["A trial of mask CPAP or BiPAP","Immediate independent lung ventilation","ECMO","Removal of supplemental oxygen"],"key":0,"why":"A trial of mask CPAP or bilevel positive airway pressure is recommended for the alert, compliant patient with marginal respiratory status. Independent lung ventilation is reserved for severe unilateral contusion with persistent severe shunting or cross-over bleeding.","src":[[26944,27045]],"origin":"heuer","age":"adult"},{"id":"CJ-T06","cell":"TRAUMA","type":"IG","setting":"in","topic":"Chest tr
